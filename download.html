<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tải Audio YouTube - X2Convert</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
        h1 span { color: #ff2d55; }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            box-sizing: border-box;
        }
        input:focus { border-color: #ff2d55; }
        .btn-row {
            display: flex;
            gap: 8px;
        }
        .btn-row button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-row button:hover { opacity: 0.85; }
        .btn-primary { background: #ff2d55; color: #fff; }
        .btn-secondary { background: #0a84ff; color: #fff; }
        .btn-success { background: #30d158; color: #000; }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .info {
            margin-top: 12px;
            font-size: 12px;
            color: #8e8e93;
            text-align: center;
        }
        .result {
            margin-top: 16px;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: none;
        }
        .result.show { display: block; }
        .result .title { font-weight: 600; margin-bottom: 8px; }
        .result .link {
            color: #0a84ff;
            text-decoration: none;
            display: block;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-top: 6px;
            text-align: center;
            word-break: break-all;
        }
        .result .link:hover { background: rgba(255,255,255,0.05); }
        .progress {
            width: 100%;
            height: 4px;
            background: #3a3a3c;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 12px;
            display: none;
        }
        .progress.show { display: block; }
        .progress-bar {
            height: 100%;
            background: #0a84ff;
            width: 0%;
            transition: width 0.3s;
        }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-top: 8px;
        }
        .badge.done { background: #30d158; color: #000; }
        .badge.error { background: #ff2d55; color: #fff; }
        .badge.loading { background: #0a84ff; color: #fff; }
        .badge.warning { background: #ffd60a; color: #000; }
        .tools {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .tools button {
            flex: 1;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
            min-width: 60px;
        }
        .tools button:hover { background: rgba(255,255,255,0.1); }
        .tools button.active { border-color: #ff2d55; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎵 <span>Audio</span> Downloader</h1>
    
    <input type="text" id="yt-url" placeholder="Dán link YouTube..." value="https://youtu.be/dQw4w9WgXcQ">
    
    <div class="btn-row">
        <button class="btn-primary" id="btn-download" onclick="downloadWithX2Convert()">⬇️ Tải Audio</button>
        <button class="btn-secondary" onclick="openX2Convert()">🔗 Mở X2Convert</button>
    </div>
    
    <div class="tools">
        <button onclick="setQuality('mp3')" id="q-mp3" class="active">MP3</button>
        <button onclick="setQuality('m4a')" id="q-m4a">M4A</button>
        <button onclick="setQuality('webm')" id="q-webm">WEBM</button>
        <button onclick="setQuality('128')" id="q-128">128kbps</button>
        <button onclick="setQuality('64')" id="q-64">64kbps</button>
        <button onclick="setQuality('32')" id="q-32">32kbps</button>
    </div>
    
    <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <div id="status" class="info">📥 Nhập link YouTube để tải audio</div>
    
    <div class="result" id="result">
        <div class="title" id="result-title">🎵 Video Title</div>
        <a class="link" id="result-link" href="#" target="_blank">⬇️ Tải xuống</a>
        <div id="result-info" style="font-size:11px;color:#8e8e93;margin-top:8px;"></div>
    </div>
</div>

<script>
// ===== STATE =====
let currentQuality = 'mp3';
let currentVideoId = null;
let isDownloading = false;

// ===== EXTRACT VIDEO ID =====
function extractVideoID(url) {
    if (!url) return null;
    const m = url.match(/(?:v=|\/)([\w-]{11})/);
    return m ? m[1] : (url.length === 11 ? url : null);
}

// ===== SET QUALITY =====
function setQuality(q) {
    currentQuality = q;
    document.querySelectorAll('.tools button').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(`q-${q}`);
    if (btn) btn.classList.add('active');
    document.getElementById('status').innerHTML = `🎯 Chất lượng: ${q.toUpperCase()}`;
}

// ===== OPEN X2CONVERT =====
function openX2Convert() {
    const url = document.getElementById('yt-url').value.trim();
    if (!url) { alert('Vui lòng nhập link YouTube!'); return; }
    window.open(`https://x2convert.com/en/youtube-to-mp3?url=${encodeURIComponent(url)}`, '_blank');
}

// ===== DOWNLOAD WITH X2CONVERT =====
async function downloadWithX2Convert() {
    const url = document.getElementById('yt-url').value.trim();
    const vid = extractVideoID(url);
    
    if (!vid) {
        alert('❌ Link YouTube không hợp lệ!');
        return;
    }
    
    if (isDownloading) return;
    isDownloading = true;
    
    const btn = document.getElementById('btn-download');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progress-bar');
    const result = document.getElementById('result');
    const resultTitle = document.getElementById('result-title');
    const resultLink = document.getElementById('result-link');
    const resultInfo = document.getElementById('result-info');
    
    btn.disabled = true;
    btn.textContent = '⏳ ĐANG XỬ LÝ...';
    progress.classList.add('show');
    progressBar.style.width = '5%';
    result.classList.remove('show');
    status.innerHTML = '🔄 Đang kết nối...';
    
    try {
        // Bước 1: Lấy thông tin video
        progressBar.style.width = '20%';
        status.innerHTML = '📊 Đang lấy thông tin video...';
        
        // Bước 2: Tạo link tải qua X2Convert API
        progressBar.style.width = '40%';
        status.innerHTML = '📥 Đang tạo link tải...';
        
        // Sử dụng X2Convert API (thông qua proxy)
        const apiUrl = `https://x2convert.com/api/convert?url=${encodeURIComponent(url)}&format=${currentQuality}`;
        
        const response = await fetch(apiUrl, {
            method: 'GET',
            headers: {
                'Accept': 'application/json',
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
            }
        });
        
        progressBar.style.width = '60%';
        status.innerHTML = '⏳ Đang xử lý...';
        
        // Nếu API không hoạt động, dùng link trực tiếp
        let downloadUrl = null;
        let title = `Video ${vid}`;
        
        if (response.ok) {
            const data = await response.json();
            downloadUrl = data.downloadUrl || data.link || data.url;
            title = data.title || `Video ${vid}`;
        }
        
        // Fallback: Dùng link X2Convert
        if (!downloadUrl) {
            downloadUrl = `https://x2convert.com/download?url=${encodeURIComponent(url)}&format=${currentQuality}`;
        }
        
        progressBar.style.width = '80%';
        status.innerHTML = '✅ Đã sẵn sàng!';
        
        // Hiển thị kết quả
        result.classList.add('show');
        resultTitle.textContent = `🎵 ${title}`;
        resultLink.textContent = `⬇️ Tải xuống (${currentQuality.toUpperCase()})`;
        resultLink.href = downloadUrl;
        resultLink.target = '_blank';
        
        resultInfo.innerHTML = `
            🆔 Video ID: ${vid}
            <br>📦 Định dạng: ${currentQuality.toUpperCase()}
            <br>📌 ${new Date().toLocaleString()}
        `;
        
        progressBar.style.width = '100%';
        status.innerHTML = '✅ Click vào link để tải xuống!';
        
        // Tự động mở link tải
        setTimeout(() => {
            window.open(downloadUrl, '_blank');
        }, 500);
        
    } catch (e) {
        status.innerHTML = `❌ Lỗi: ${e.message}`;
        result.classList.add('show');
        resultTitle.textContent = '❌ Không thể tải audio';
        resultLink.textContent = '🔗 Mở X2Convert để tải thủ công';
        resultLink.href = `https://x2convert.com/en/youtube-to-mp3?url=${encodeURIComponent(url)}`;
        resultLink.target = '_blank';
        resultInfo.innerHTML = `💡 X2Convert có thể hoạt động tốt hơn`;
        
        // Thêm nút mở X2Convert
        resultInfo.innerHTML += `<br><button onclick="openX2Convert()" style="background:#0a84ff;color:#fff;border:none;padding:8px 16px;border-radius:8px;margin-top:8px;cursor:pointer;">
            🔗 Mở X2Convert
        </button>`;
    }
    
    btn.disabled = false;
    btn.textContent = '⬇️ Tải Audio';
    isDownloading = false;
}

// ===== TỰ ĐỘNG PHÁT HIỆN LINK =====
document.getElementById('yt-url').addEventListener('paste', function() {
    setTimeout(() => {
        const val = this.value.trim();
        const vid = extractVideoID(val);
        if (vid) {
            currentVideoId = vid;
            document.getElementById('status').innerHTML = `🎯 Video ID: ${vid}`;
        }
    }, 100);
});

// ===== LẤY VIDEO ID TỪ URL =====
document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    const v = params.get('v');
    if (v) {
        document.getElementById('yt-url').value = `https://youtu.be/${v}`;
        document.getElementById('status').innerHTML = `🎯 Video ID: ${v}`;
    }
});
</script>
</body>
</html>
