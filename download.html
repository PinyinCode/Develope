<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 Tải Audio YouTube</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { font-size: 20px; margin-bottom: 8px; text-align: center; }
        h1 span { color: #ff2d55; }
        .subtitle { text-align: center; font-size: 12px; color: #8e8e93; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            box-sizing: border-box;
        }
        input:focus { border-color: #ff2d55; }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-row button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-row button:hover { opacity: 0.85; }
        .btn-download { background: #ff2d55; color: #fff; }
        .btn-open { background: #0a84ff; color: #fff; }
        .btn-download:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .site-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .site-btn {
            padding: 10px 8px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .site-btn:hover { background: rgba(255,255,255,0.1); }
        .site-btn.active {
            border-color: #ff2d55;
            background: rgba(255,45,85,0.15);
        }
        .site-btn .icon { font-size: 20px; display: block; margin-bottom: 4px; }
        .site-btn .name { font-size: 11px; }
        .site-btn .badge {
            font-size: 8px;
            background: rgba(255,255,255,0.1);
            padding: 1px 6px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 2px;
        }
        
        .info {
            font-size: 12px;
            color: #8e8e93;
            text-align: center;
            margin-top: 8px;
            min-height: 20px;
        }
        .info.success { color: #30d158; }
        .info.error { color: #ff2d55; }
        
        .quick-links {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }
        .quick-links button {
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: #8e8e93;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-links button:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        .recent {
            margin-top: 12px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            display: none;
        }
        .recent.show { display: block; }
        .recent .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
        }
        .recent .item:last-child { border-bottom: none; }
        .recent .item .vid { color: #8e8e93; font-family: monospace; }
        .recent .item .action {
            color: #0a84ff;
            cursor: pointer;
            font-size: 11px;
        }
        .recent .item .action:hover { text-decoration: underline; }
        
        .footer {
            text-align: center;
            font-size: 10px;
            color: #8e8e93;
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎵 <span>Audio</span> Downloader</h1>
    <div class="subtitle">Tải audio từ YouTube qua các trang web hỗ trợ</div>
    
    <input type="text" id="yt-url" placeholder="Dán link YouTube..." value="https://youtu.be/dQw4w9WgXcQ">
    
    <!-- === CHỌN TRANG TẢI === -->
    <div class="site-grid">
        <button class="site-btn active" onclick="selectSite('yt5s')" id="site-yt5s">
            <span class="icon">🎵</span>
            <span class="name">YT5s</span>
            <span class="badge">Khuyến nghị</span>
        </button>
        <button class="site-btn" onclick="selectSite('x2convert')" id="site-x2convert">
            <span class="icon">🔄</span>
            <span class="name">X2Convert</span>
            <span class="badge">Ổn định</span>
        </button>
        <button class="site-btn" onclick="selectSite('savedeo')" id="site-savedeo">
            <span class="icon">💾</span>
            <span class="name">SaveDeo</span>
            <span class="badge">Nhanh</span>
        </button>
        <button class="site-btn" onclick="selectSite('y2mate')" id="site-y2mate">
            <span class="icon">📥</span>
            <span class="name">Y2Mate</span>
            <span class="badge">Phổ biến</span>
        </button>
        <button class="site-btn" onclick="selectSite('yt1s')" id="site-yt1s">
            <span class="icon">🎶</span>
            <span class="name">YT1s</span>
            <span class="badge">Dự phòng</span>
        </button>
        <button class="site-btn" onclick="selectSite('snapdown')" id="site-snapdown">
            <span class="icon">⚡</span>
            <span class="name">SnapDown</span>
            <span class="badge">Mới</span>
        </button>
    </div>
    
    <!-- === NÚT HÀNH ĐỘNG === -->
    <div class="btn-row">
        <button class="btn-download" id="btn-download" onclick="downloadAudio()">⬇️ Tải Audio</button>
        <button class="btn-open" onclick="openSite()">🔗 Mở Trang</button>
    </div>
    
    <div id="status" class="info">📥 Chọn trang tải và nhập link YouTube</div>
    
    <!-- === LINK NHANH === -->
    <div class="quick-links">
        <button onclick="setExample('music')">🎵 Nhạc</button>
        <button onclick="setExample('podcast')">🎙️ Podcast</button>
        <button onclick="setExample('hsk')">📚 HSK</button>
        <button onclick="setExample('story')">📖 Truyện</button>
        <button onclick="clearInput()">🗑️ Xóa</button>
    </div>
    
    <!-- === LỊCH SỬ === -->
    <div class="recent" id="recent">
        <div style="font-size:11px;color:#8e8e93;margin-bottom:6px;">📋 Gần đây</div>
        <div id="recent-list"></div>
    </div>
    
    <div class="footer">
        💡 Click "Tải Audio" để mở trang tải với link đã điền sẵn
    </div>
</div>

<script>
// ===== STATE =====
let currentSite = 'yt5s';
let currentVideoId = null;
let recentVideos = JSON.parse(localStorage.getItem('recent_audio') || '[]');

// ===== SITE CONFIG =====
const sites = {
    yt5s: {
        name: 'YT5s',
        url: (url) => `https://yt5s.com/vi/youtube-to-mp3?url=${encodeURIComponent(url)}`,
        icon: '🎵'
    },
    x2convert: {
        name: 'X2Convert',
        url: (url) => `https://x2convert.com/en/youtube-to-mp3?url=${encodeURIComponent(url)}`,
        icon: '🔄'
    },
    savedeo: {
        name: 'SaveDeo',
        url: (url) => `https://savedeo.com/vi/youtube-to-mp3?url=${encodeURIComponent(url)}`,
        icon: '💾'
    },
    y2mate: {
        name: 'Y2Mate',
        url: (url) => `https://www.y2mate.com/vi/youtube-mp3?url=${encodeURIComponent(url)}`,
        icon: '📥'
    },
    yt1s: {
        name: 'YT1s',
        url: (url) => `https://yt1s.com/vi/youtube-to-mp3?url=${encodeURIComponent(url)}`,
        icon: '🎶'
    },
    snapdown: {
        name: 'SnapDown',
        url: (url) => `https://snapdown.com/vi/youtube-to-mp3?url=${encodeURIComponent(url)}`,
        icon: '⚡'
    }
};

// ===== EXTRACT VIDEO ID =====
function extractVideoID(url) {
    if (!url) return null;
    const m = url.match(/(?:v=|\/)([\w-]{11})/);
    return m ? m[1] : (url.length === 11 ? url : null);
}

// ===== SELECT SITE =====
function selectSite(site) {
    currentSite = site;
    document.querySelectorAll('.site-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`site-${site}`).classList.add('active');
    
    const siteInfo = sites[site];
    document.getElementById('status').innerHTML = `🌐 Đã chọn: ${siteInfo.icon} ${siteInfo.name}`;
    document.getElementById('status').className = 'info';
}

// ===== OPEN SITE =====
function openSite() {
    const url = document.getElementById('yt-url').value.trim();
    if (!url) {
        alert('❌ Vui lòng nhập link YouTube!');
        return;
    }
    const vid = extractVideoID(url);
    if (!vid) {
        alert('❌ Link YouTube không hợp lệ!');
        return;
    }
    
    const siteInfo = sites[currentSite];
    const fullUrl = siteInfo.url(url);
    window.open(fullUrl, '_blank');
    
    document.getElementById('status').innerHTML = `✅ Đã mở ${siteInfo.name} với video ${vid}`;
    document.getElementById('status').className = 'info success';
}

// ===== DOWNLOAD AUDIO =====
function downloadAudio() {
    const url = document.getElementById('yt-url').value.trim();
    if (!url) {
        alert('❌ Vui lòng nhập link YouTube!');
        return;
    }
    const vid = extractVideoID(url);
    if (!vid) {
        alert('❌ Link YouTube không hợp lệ!');
        return;
    }
    
    currentVideoId = vid;
    const siteInfo = sites[currentSite];
    const fullUrl = siteInfo.url(url);
    
    // Lưu vào lịch sử
    addToRecent(vid, url);
    
    // Mở trang tải
    window.open(fullUrl, '_blank');
    
    document.getElementById('status').innerHTML = `✅ Đang mở ${siteInfo.name} để tải ${vid}`;
    document.getElementById('status').className = 'info success';
    
    // Cập nhật nút
    const btn = document.getElementById('btn-download');
    btn.textContent = '⏳ Đã mở...';
    setTimeout(() => { btn.textContent = '⬇️ Tải Audio'; }, 2000);
}

// ===== ADD TO RECENT =====
function addToRecent(vid, url) {
    // Xóa trùng
    recentVideos = recentVideos.filter(item => item.vid !== vid);
    // Thêm vào đầu
    recentVideos.unshift({ vid, url, time: new Date().toLocaleString() });
    // Giữ tối đa 5
    if (recentVideos.length > 5) recentVideos.pop();
    localStorage.setItem('recent_audio', JSON.stringify(recentVideos));
    updateRecent();
}

function updateRecent() {
    const container = document.getElementById('recent');
    const list = document.getElementById('recent-list');
    
    if (recentVideos.length === 0) {
        container.classList.remove('show');
        return;
    }
    
    container.classList.add('show');
    list.innerHTML = recentVideos.map(item => `
        <div class="item">
            <span class="vid">🎬 ${item.vid}</span>
            <span>
                <span class="action" onclick="useRecent('${item.vid}')">📋 Dùng</span>
                <span class="action" onclick="removeRecent('${item.vid}')" style="color:#ff2d55;margin-left:8px;">✕</span>
            </span>
        </div>
    `).join('');
}

function useRecent(vid) {
    document.getElementById('yt-url').value = `https://youtu.be/${vid}`;
    document.getElementById('status').innerHTML = `📋 Đã điền video: ${vid}`;
    document.getElementById('status').className = 'info success';
    // Tự động tải
    setTimeout(() => downloadAudio(), 500);
}

function removeRecent(vid) {
    recentVideos = recentVideos.filter(item => item.vid !== vid);
    localStorage.setItem('recent_audio', JSON.stringify(recentVideos));
    updateRecent();
}

// ===== EXAMPLE LINKS =====
function setExample(type) {
    const examples = {
        music: 'https://youtu.be/dQw4w9WgXcQ',
        podcast: 'https://youtu.be/MeiiVrKWSAc',
        hsk: 'https://youtu.be/vmsC3SgWTPs',
        story: 'https://youtu.be/Hbj4kbW8ml4'
    };
    document.getElementById('yt-url').value = examples[type] || '';
    document.getElementById('status').innerHTML = `📝 Đã điền link mẫu: ${type}`;
    document.getElementById('status').className = 'info';
}

function clearInput() {
    document.getElementById('yt-url').value = '';
    document.getElementById('status').innerHTML = '🗑️ Đã xóa link';
    document.getElementById('status').className = 'info';
}

// ===== TỰ ĐỘNG PHÁT HIỆN LINK =====
document.getElementById('yt-url').addEventListener('input', function() {
    const val = this.value.trim();
    const vid = extractVideoID(val);
    if (vid) {
        currentVideoId = vid;
        document.getElementById('status').innerHTML = `🎯 Video ID: ${vid}`;
        document.getElementById('status').className = 'info success';
    }
});

// ===== KEYBOARD SHORTCUT =====
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        const active = document.activeElement;
        if (active && active.id === 'yt-url') {
            downloadAudio();
        }
    }
});

// ===== INIT =====
document.addEventListener('DOMContentLoaded', function() {
    // Lấy video ID từ URL
    const params = new URLSearchParams(window.location.search);
    const v = params.get('v');
    if (v) {
        document.getElementById('yt-url').value = `https://youtu.be/${v}`;
        document.getElementById('status').innerHTML = `🎯 Video ID: ${v}`;
        document.getElementById('status').className = 'info success';
    }
    
    updateRecent();
    
    // Mặc định chọn YT5s
    selectSite('yt5s');
});
</script>
</body>
</html>
