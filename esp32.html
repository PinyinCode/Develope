<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Auto Flasher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status-icon {
            font-size: 80px;
            margin: 20px 0;
        }
        .status-text {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin: 10px 0;
        }
        .status-detail {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .progress-container {
            margin: 20px 0;
            display: none;
        }
        .progress-container.show {
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 15px;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .log-container {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #dee2e6;
        }
        .log-container.show {
            display: block;
        }
        .log-line {
            padding: 3px 0;
            color: #495057;
        }
        .log-line.success {
            color: #28a745;
        }
        .log-line.error {
            color: #dc3545;
        }
        .log-line.info {
            color: #007bff;
        }
        .hidden {
            display: none;
        }
        .chip-info {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .chip-info .label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }
        .chip-info .value {
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }
        .firmware-info {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border: 1px solid #ffeeba;
        }
        .firmware-info .name {
            font-weight: 600;
            color: #856404;
        }
        .firmware-info .size {
            color: #856404;
            font-size: 13px;
            margin-top: 5px;
        }
        .warning {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
            border: 1px solid #f5c6cb;
            display: none;
        }
        .warning.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ ESP32 Auto Flasher</h1>
        <p class="subtitle">Tự động phát hiện và nạp firmware</p>

        <div class="status-icon" id="statusIcon">🔌</div>
        <div class="status-text" id="statusText">Đang chờ kết nối</div>
        <div class="status-detail" id="statusDetail">Cắm ESP32 vào USB và nhấn nút bên dưới</div>

        <div class="warning" id="warningMessage">
            ⚠️ <span id="warningText"></span>
        </div>

        <div class="firmware-info" id="firmwareInfo">
            <div>📦 Firmware: <span class="name" id="firmwareName">xiaozhi.bin</span></div>
            <div class="size">Kích thước: <span id="firmwareSize">Đang kiểm tra...</span></div>
        </div>

        <div class="chip-info">
            <div class="label">Chip ESP32</div>
            <div class="value" id="chipInfo">Chưa kết nối</div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
        </div>

        <div>
            <button class="btn btn-primary" id="flashBtn" disabled>
                🚀 Nạp Firmware
            </button>
            <button class="btn btn-success" id="autoBtn">
                🔄 Tự động
            </button>
        </div>

        <div class="log-container" id="logContainer">
            <div id="logContent"></div>
        </div>

        <button class="btn" id="toggleLogBtn" style="background:#e9ecef;color:#333;font-size:14px;padding:8px 20px;margin-top:10px;">
            📋 Xem log
        </button>
    </div>

    <script>
        // =============================================
        // CẤU HÌNH - THAY ĐỔI TÊN FIRMWARE CỦA BẠN
        // =============================================
        const FIRMWARE_NAME = 'xiaozhi.bin';  // Tên file firmware của bạn
        const FIRMWARE_URL = FIRMWARE_NAME;    // Hoặc link URL nếu upload online
        
        // Nếu dùng link online, thay dòng trên bằng:
        // const FIRMWARE_URL = 'https://raw.githubusercontent.com/username/repo/branch/xiaozhi.bin';
        // =============================================

        let port = null;
        let reader = null;
        let writer = null;
        let isFlashing = false;
        let firmwareSize = 0;

        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const statusDetail = document.getElementById('statusDetail');
        const flashBtn = document.getElementById('flashBtn');
        const autoBtn = document.getElementById('autoBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const chipInfo = document.getElementById('chipInfo');
        const firmwareName = document.getElementById('firmwareName');
        const firmwareSizeEl = document.getElementById('firmwareSize');
        const logContainer = document.getElementById('logContainer');
        const logContent = document.getElementById('logContent');
        const toggleLogBtn = document.getElementById('toggleLogBtn');
        const warningMessage = document.getElementById('warningMessage');
        const warningText = document.getElementById('warningText');

        // Kiểm tra file firmware khi load trang
        window.addEventListener('load', async () => {
            addLog('🔄 Đang khởi tạo...', 'info');
            await checkFirmware();
            await autoConnect();
        });

        // Kiểm tra file firmware có tồn tại không
        async function checkFirmware() {
            try {
                addLog(`🔍 Đang kiểm tra file: ${FIRMWARE_NAME}`, 'info');
                const response = await fetch(FIRMWARE_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} - File không tồn tại`);
                }
                
                const contentLength = response.headers.get('content-length');
                if (contentLength) {
                    firmwareSize = parseInt(contentLength);
                    firmwareSizeEl.textContent = (firmwareSize / 1024).toFixed(2) + ' KB';
                    addLog(`✅ Tìm thấy firmware: ${(firmwareSize / 1024).toFixed(2)} KB`, 'success');
                } else {
                    // Nếu không lấy được content-length, thử đọc file
                    const data = await response.arrayBuffer();
                    firmwareSize = data.byteLength;
                    firmwareSizeEl.textContent = (firmwareSize / 1024).toFixed(2) + ' KB';
                    addLog(`✅ Tìm thấy firmware: ${(firmwareSize / 1024).toFixed(2)} KB`, 'success');
                }
                
                if (firmwareSize === 0) {
                    throw new Error('File firmware rỗng (0 KB)');
                }
                
                firmwareName.textContent = FIRMWARE_NAME;
                hideWarning();
                
            } catch (error) {
                firmwareSizeEl.textContent = '❌ Không tìm thấy';
                showWarning(`Không tìm thấy file "${FIRMWARE_NAME}". Vui lòng kiểm tra lại!`);
                addLog(`❌ Lỗi firmware: ${error.message}`, 'error');
                flashBtn.disabled = true;
            }
        }

        // Nút tự động
        autoBtn.addEventListener('click', async () => {
            await checkFirmware();
            await autoConnect();
        });

        // Nút nạp firmware
        flashBtn.addEventListener('click', flashFirmware);

        // Toggle log
        toggleLogBtn.addEventListener('click', () => {
            logContainer.classList.toggle('show');
            toggleLogBtn.textContent = logContainer.classList.contains('show') ? '📋 Ẩn log' : '📋 Xem log';
        });

        // Tự động kết nối Serial
        async function autoConnect() {
            try {
                setStatus('🔍', 'Đang tìm ESP32...', 'Đang quét cổng Serial...');
                addLog('🔍 Đang tìm ESP32...', 'info');

                if (!('serial' in navigator)) {
                    setStatus('❌', 'Trình duyệt không hỗ trợ', 'Dùng Chrome/Edge mới nhất');
                    addLog('❌ Trình duyệt không hỗ trợ Web Serial', 'error');
                    flashBtn.disabled = true;
                    return;
                }

                try {
                    // Thử kết nối tự động với các vendor ID phổ biến
                    port = await navigator.serial.requestPort({
                        filters: [
                            { usbVendorId: 0x10c4 }, // Silicon Labs
                            { usbVendorId: 0x1a86 }, // CH340
                            { usbVendorId: 0x0403 }  // FTDI
                        ]
                    });
                    
                    await port.open({ baudRate: 115200 });
                    
                    // Đọc thông tin chip
                    await readChipInfo();
                    
                    setStatus('✅', 'ESP32 đã kết nối!', 'Sẵn sàng nạp firmware');
                    flashBtn.disabled = false;
                    addLog('✅ Kết nối ESP32 thành công!', 'success');
                    
                    // Tự động nạp firmware ngay
                    setTimeout(() => flashFirmware(), 1500);
                    
                } catch (err) {
                    if (err.name === 'NotFoundError' || err.message.includes('cancel')) {
                        setStatus('🔌', 'Chọn cổng ESP32', 'Click vào đây để chọn cổng Serial');
                        flashBtn.disabled = true;
                        addLog('⚠️ Vui lòng chọn cổng Serial', 'error');
                        
                        // Mở dialog chọn cổng
                        port = await navigator.serial.requestPort();
                        await port.open({ baudRate: 115200 });
                        await readChipInfo();
                        setStatus('✅', 'ESP32 đã kết nối!', 'Sẵn sàng nạp firmware');
                        flashBtn.disabled = false;
                        addLog('✅ Kết nối ESP32 thành công!', 'success');
                        setTimeout(() => flashFirmware(), 1500);
                    } else {
                        throw err;
                    }
                }
            } catch (error) {
                setStatus('❌', 'Lỗi kết nối', error.message);
                addLog(`❌ Lỗi: ${error.message}`, 'error');
                flashBtn.disabled = true;
            }
        }

        // Đọc thông tin chip
        async function readChipInfo() {
            try {
                const textEncoder = new TextEncoder();
                const textDecoder = new TextDecoder();
                writer = port.writable.getWriter();
                reader = port.readable.getReader();

                // Gửi lệnh đọc chip ID
                await writer.write(textEncoder.encode('\n'));
                await writer.write(textEncoder.encode('ESP32 Chip Info\n'));
                
                // Đọc phản hồi
                let response = '';
                let attempts = 0;
                while (attempts < 10) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    response += textDecoder.decode(value);
                    if (response.includes('ESP32')) break;
                    attempts++;
                }
                
                chipInfo.textContent = response.trim() || 'ESP32 Detected';
                addLog(`📡 Chip: ${response.trim() || 'ESP32'}`, 'info');
                
            } catch (error) {
                chipInfo.textContent = 'ESP32 (không đọc được chi tiết)';
                addLog(`⚠️ Không đọc được chi tiết chip: ${error.message}`, 'error');
            }
        }

        // Nạp firmware
        async function flashFirmware() {
            if (isFlashing) return;
            if (!port) {
                setStatus('❌', 'Chưa kết nối ESP32', 'Vui lòng kết nối trước');
                return;
            }
            
            if (firmwareSize === 0) {
                showWarning('File firmware không hợp lệ! Vui lòng kiểm tra lại.');
                return;
            }

            isFlashing = true;
            flashBtn.disabled = true;
            progressContainer.classList.add('show');
            setStatus('⏳', 'Đang nạp firmware...', 'Vui lòng đợi');

            try {
                // Tải firmware
                addLog(`📥 Đang tải firmware: ${FIRMWARE_NAME}...`, 'info');
                const response = await fetch(FIRMWARE_URL);
                if (!response.ok) {
                    throw new Error(`Không thể tải firmware (HTTP ${response.status})`);
                }
                
                const firmwareData = await response.arrayBuffer();
                const totalSize = firmwareData.byteLength;
                
                if (totalSize === 0) {
                    throw new Error('File firmware rỗng!');
                }
                
                const chunkSize = 1024;
                let uploaded = 0;

                firmwareName.textContent = FIRMWARE_NAME;
                firmwareSizeEl.textContent = (totalSize / 1024).toFixed(2) + ' KB';
                
                addLog(`📦 Firmware: ${FIRMWARE_NAME} (${(totalSize / 1024).toFixed(2)} KB)`, 'info');

                // Gửi firmware qua Serial
                const data = new Uint8Array(firmwareData);

                setStatus('📤', 'Đang gửi dữ liệu...', '0%');
                
                // Gửi từng chunk
                for (let i = 0; i < data.length; i += chunkSize) {
                    const chunk = data.slice(i, Math.min(i + chunkSize, data.length));
                    await writer.write(chunk);
                    
                    uploaded += chunk.length;
                    const percent = Math.round((uploaded / totalSize) * 100);
                    updateProgress(percent);
                    
                    if (percent % 10 === 0 && percent > 0) {
                        addLog(`⏳ Đã gửi ${percent}%...`, 'info');
                    }
                }

                // Gửi lệnh reset ESP32
                const textEncoder = new TextEncoder();
                await writer.write(textEncoder.encode('\n'));
                await writer.write(textEncoder.encode('ESP.restart();\n'));

                setStatus('✅', 'Nạp firmware thành công!', 'ESP32 đang khởi động lại');
                addLog('✅ Nạp firmware thành công! ESP32 đang reset...', 'success');
                updateProgress(100);

                // Đóng kết nối
                try {
                    await reader.cancel();
                    await writer.close();
                    await port.close();
                } catch (e) {
                    // Bỏ qua lỗi đóng kết nối
                }

                setTimeout(() => {
                    setStatus('🔄', 'ESP32 đã khởi động lại', 'Sẵn sàng với firmware mới');
                    flashBtn.disabled = false;
                    isFlashing = false;
                    progressContainer.classList.remove('show');
                }, 3000);

            } catch (error) {
                setStatus('❌', 'Lỗi nạp firmware', error.message);
                addLog(`❌ Lỗi: ${error.message}`, 'error');
                flashBtn.disabled = false;
                isFlashing = false;
                updateProgress(0);
                setTimeout(() => {
                    progressContainer.classList.remove('show');
                }, 2000);
            }
        }

        // Cập nhật progress
        function updateProgress(percent) {
            progressFill.style.width = percent + '%';
            progressText.textContent = percent + '%';
        }

        // Set status
        function setStatus(icon, text, detail) {
            statusIcon.textContent = icon;
            statusText.textContent = text;
            statusDetail.textContent = detail || '';
        }

        // Hiển thị warning
        function showWarning(message) {
            warningText.textContent = message;
            warningMessage.classList.add('show');
        }

        // Ẩn warning
        function hideWarning() {
            warningMessage.classList.remove('show');
        }

        // Thêm log
        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const logLine = document.createElement('div');
            logLine.className = 'log-line ' + type;
            logLine.textContent = `[${time}] ${message}`;
            logContent.appendChild(logLine);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Hỗ trợ nếu trình duyệt không có Web Serial
        if (!('serial' in navigator)) {
            setStatus('❌', 'Trình duyệt không hỗ trợ', 'Vui lòng dùng Chrome/Edge');
            flashBtn.disabled = true;
            autoBtn.disabled = true;
        }
    </script>
</body>
</html>
