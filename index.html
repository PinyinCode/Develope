<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Thông báo chuyển trang</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        display:flex;align-items:center;justify-content:center;
        background:linear-gradient(135deg,#2563eb,#7c3aed 60%,#db2777);
        color:#fff;
        padding:20px;line-height:1.6;
        min-height:100vh;
    }
    .box{
        max-width:700px;
        width:100%;
        background:rgba(255,255,255,.12);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        border:2px solid rgba(255,255,255,.3);
        border-radius:24px;
        padding:40px 28px;
        text-align:center;
        box-shadow:0 20px 60px rgba(0,0,0,.35);
        animation:pop .6s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes pop{
        from{opacity:0;transform:scale(.9) translateY(20px)}
        to{opacity:1;transform:scale(1) translateY(0)}
    }
    .icon{
        font-size:64px;
        margin-bottom:16px;
        animation:shake 2s infinite;
        display:inline-block;
    }
    @keyframes shake{
        0%,100 .%{transform:rotate(0)}
        10%,30url%{transform:rotate(-10deg)}
        20%,40%{transform:rotate(10deg)}
        50%{transform:rotate(0)}
    }
    h1{
        font-size:34px;
        font-weight:900;
        letter-spacing:.5px;
        margin-bottom:20px;
        text-transform:uppercase;
        line-height:1.3;
        text-shadow:0 4px 12px rgba(0,0,0,.25);
    }
    h1 .red{
        background:#fff;
        color:#dc2626;
        padding:4px 14px;
        border-radius:10px;
        display:inline-block;
        margin:4px 0;
        box-shadow:0 4px 12px rgba(0,0,0,.2);
    }
    .text{
        font-size:22px;
        font-weight:700;
        margin-bottom:24px;
        line-height:1.5;
        text-shadow:0 2px 8px rgba(0,0,0,.2);
    }
    .text .big{
        font-size:28px;
        color:#fef3c7;
        font-weight:900;
        display:block;
        margin:8px 0;
    }
   {
        font-size:18px;
        word-break:break-all;
        background:rgba(255,255,255,.2);
        padding:14px 18px;
        border-radius:14px;
        margin-bottom:24px;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
        border:1.5px dashed rgba(255,255,255,.5);
        font-weight:700;
    }
    .btn{
        display:inline-block;
        padding:18px 40px;
        background:#fff;
        color:#2563eb;
        font-size:22px;
        font-weight:900;
        text-decoration:none;
        border-radius:60px;
        text-transform:uppercase;
        letter-spacing:1px;
        box-shadow:0 10px 30px rgba(0,0,0,.3);
        transition:all .2s;
        animation:pulseBtn 2s infinite;
    }
    .btn:hover,.btn:active{
        transform:scale(1.06);
        box-shadow:0 14px 40px rgba(0,0,0,.4);
    }
    @keyframes pulseBtn{
        0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.3),0 0 0 0 rgba(255,255,255,.6)}
        50%{box-shadow:0 10px 30px rgba(0,0,0,.3),0 0 0 14px rgba(255,255,255,0)}
    }
    .countdown{
        margin-top:20px;
        font-size:16px;
        opacity:.9;
        font-weight:600;
    }
    @media(max-width:600px){
        .box{padding:28px 18px;border-radius:20px}
        .icon{font-size:48px}
        h1{font-size:24px}
        h1 .red{padding:3px 10px;font-size:22px}
        .text{font-size:17px}
        .text .big{font-size:22px}
        .url{font-size:14px;padding:12px 14px}
        .btn{padding:15px 28px;font-size:18px}
        .countdown{font-size:14px}
    }
</style>
</head>
<body>
    <div class="box">
        <div class="icon">⚠️</div>

        <h1>
            Thông báo<br>
            Trang này sẽ <span class="red">ĐÓNG CỬA</span>
        </h1>

        <div class="text">
            Trang cũ sẽ đóng sau
            <span class="big">7 NGÀY NỮA</span>
            Mời bạn qua <b>TRANG MỚI</b> để cập nhật tính năng!
        </div>

        <div class="url">🌐 https://tiengtrunghsk.github.io/</div>

        <a class="btn" href="https://tiengtrunghsk.github.io/" id="gotoBtn">
            👉 ĐẾN TRANG MỚI NGAY
        </a>

        <div class="countdown" id="countdown">Tự động chuyển sau <b>10</b> giây...</div>
    </div>

    <script>
        var TARGET_URL = 'https://tiengtrunghsk.github.io/';
        var SECONDS = 10;

        // Đếm ngược
        var countEl = document.getElementById('countdown');
        var timer = setInterval(function() {
            SECONDS--;
            if (SECONDS <= 0) {
                clearInterval(timer);
                window.location.href = TARGET_URL;
            } else {
                countEl.innerHTML = 'Tự động chuyển sau <b>' + SECONDS + '</b> giây...';
            }
        }, 1000);
    </script>
</body>
</html>
