<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Học tiếng Trung · Văn phòng & Công xưởng</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f5f7fb;color:#1e2a3a;padding:1rem;line-height:1.5}
.container{max-width:1500px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1rem}
h1{font-size:1.3rem;font-weight:600;color:#0b2b4a;display:flex;align-items:center;gap:8px}
h1 i{color:#c0392b}
.stats{background:#fff;border-radius:40px;padding:.4rem 1rem;box-shadow:0 2px 8px rgba(0,0,0,.03);font-size:.85rem;border:1px solid #e9edf4}
.stats span{font-weight:700;color:#c0392b}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem;align-items:center}
.search-box{flex:2;min-width:200px;position:relative}
.search-box i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8a9aa8;font-size:.9rem}
.search-box input{width:100%;padding:11px 16px 11px 38px;border-radius:50px;border:1px solid #dbe1e9;font-size:.95rem;background:#fff;outline:none;transition:.2s}
.search-box input:focus{border-color:#3b7cbf;box-shadow:0 0 0 3px rgba(59,124,191,.1)}
.filter-select{padding:10px 14px;border-radius:30px;border:1px solid #dbe1e9;background:#fff;font-size:.85rem;outline:none;cursor:pointer;min-width:120px}
.reset-btn{background:#fff;border:1px solid #dbe1e9;padding:10px 14px;border-radius:30px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;gap:6px;color:#5b6f82;transition:.2s}
.reset-btn:hover{background:#eef3fa}
.table-wrapper{background:#fff;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.05);overflow:auto;max-height:75vh;border:1px solid #eef2f7;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:1200px}
th{background:#f0f5fc;color:#1e3b5c;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.3px;padding:12px 10px;text-align:left;border-bottom:1px solid #d8e2ee;position:sticky;top:0;z-index:10;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #ecf1f7;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f9fcff}
th:nth-child(1),td:nth-child(1){width:50px;text-align:center}
th:nth-child(2),td:nth-child(2){width:70px}
th:nth-child(3),td:nth-child(3){width:130px}
th:nth-child(4),td:nth-child(4){width:110px}
th:nth-child(5),td:nth-child(5){width:200px}
th:nth-child(6),td:nth-child(6){width:200px}
th:nth-child(7),td:nth-child(7){width:160px}
th:nth-child(8),td:nth-child(8){width:55px;text-align:center}
th:nth-child(9),td:nth-child(9){width:180px}
th:nth-child(10),td:nth-child(10){width:100px;text-align:center}
.audio-btn{display:inline-flex;align-items:center;justify-content:center;background:#e8f0fe;color:#1a5a9c;width:34px;height:34px;border-radius:50%;text-decoration:none;transition:.2s;font-size:1rem}
.audio-btn:hover{background:#1a5a9c;color:#fff}
.audio-btn:active{background:#1a5a9c;color:#fff;transform:scale(.95)}
.pinyin{color:#2c6b9e;font-style:italic;font-size:.82rem;background:#f2f8ff;padding:2px 6px;border-radius:12px;display:inline-block}
.check-cell{font-weight:600;font-size:.85rem;white-space:nowrap}
.check-correct{color:#1e7a4a}
.check-wrong{color:#b33a3a}
.practice-input{width:100%;padding:7px 10px;border-radius:30px;border:1px solid #dbe1e9;font-size:.85rem;background:#fbfdff;outline:none;transition:.15s}
.practice-input:focus{border-color:#3b7cbf;box-shadow:0 0 0 3px rgba(59,124,191,.1)}
.no-data{text-align:center;padding:2.5rem 1rem;color:#7a8b9f;font-size:1rem}
.no-data i{font-size:2.5rem;margin-bottom:.8rem;color:#b8ccdf;display:block}
.hsk-badge{background:#eef3fa;padding:3px 9px;border-radius:20px;font-size:.75rem;font-weight:600;white-space:nowrap}
.load-more{text-align:center;padding:1rem;color:#3b7cbf;cursor:pointer;background:#f9fcff;border-top:1px solid #ecf1f7;font-weight:600}
.load-more:hover{background:#eef3fa}
@media(max-width:600px){
    body{padding:.7rem}
    h1{font-size:1.15rem}
    .filter-select{min-width:100px;font-size:.8rem;padding:8px 10px}
    .search-box input{font-size:.9rem;padding:10px 14px 10px 34px}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1><i class="fas fa-language"></i> Học tiếng Trung · Văn phòng & Công xưởng</h1>

    <button class="reset-btn" id="resetBtn"><i class="fas fa-undo-alt"></i> Đặt lại</button>
</div>

<div class="table-wrapper" id="tableWrapper">

</div>
</div>

ubject":"Nhân sự","vi":"Đã đến giờ thì bắt đầu họp.","zh":"既然到时间了，就开始开会吧。","pinyin":"Jìrán dào shíjiān le, jiù kāishǐ kāihuì ba."},{"stt":1335,"hsk":"HSK5","topic":"无论……都……","subject":"Khách hàng","vi":"Dù khách hàng ở đâu, chúng tôi đều phục vụ tốt.","zh":"无论客户在哪里，我们都认真服务。","pinyin":"Wúlùn kèhù zài nǎlǐ, wǒmen dōu rènzhēn fúwù."},{"stt":1336,"hsk":"HSK5","topic":"无论……都……","subject":"Công việc","vi":"Dù gặp khó khăn gì, chúng tôi cũng sẽ cố gắng hoàn thành.","zh":"无论遇到什么困难，我们都会努力完成。","pinyin":"Wúlùn yùdào shénme kùnnán, wǒmen dōu huì nǔlì wánchéng."},{"stt":1337,"hsk":"HSK5","topic":"无论……都……","subject":"QA","vi":"Dù ai phát hiện lỗi cũng phải báo ngay.","zh":"无论谁发现问题，都要立即报告。","pinyin":"Wúlùn shéi fāxiàn wèntí, dōu yào lìjí bàogào."},{"stt":1338,"hsk":"HSK5","topic":"无论……都……","subject":"An toàn","vi":"Dù bận thế nào cũng phải tuân thủ quy định an toàn.","zh":"无论多忙，都要遵守安全规定。","pinyin":"Wúlùn duō máng, dōu yào zūnshǒu ānquán guīdìng."},{"stt":1339,"hsk":"HSK5","topic":"无论……都……","subject":"Đào tạo","vi":"Dù là nhân viên mới hay cũ đều phải tham gia đào tạo.","zh":"无论是新员工还是老员工，都要参加培训。","pinyin":"Wúlùn shì xīn yuángōng háishì lǎo yuángōng, dōu yào cānjiā péixùn."},{"stt":1340,"hsk":"HSK5","topic":"Tổng hợp","subject":"Báo cáo","vi":"Đối sách đã phát huy hiệu quả rõ rệt.","zh":"改善措施已经取得明显效果。","pinyin":"Gǎishàn cuòshī yǐjīng qǔdé míngxiǎn xiàoguǒ."},{"stt":1341,"hsk":"HSK5","topic":"Tổng hợp","subject":"Báo cáo","vi":"Hiệu suất sản xuất đã được cải thiện.","zh":"生产效率已经提高了。","pinyin":"Shēngchǎn xiàolǜ yǐjīng tígāo le."},{"stt":1342,"hsk":"HSK5","topic":"Tổng hợp","subject":"Báo cáo","vi":"Chi phí sản xuất đã giảm đáng kể.","zh":"生产成本明显下降了。","pinyin":"Shēngchǎn chéngběn míngxiǎn xiàjiàng le."},{"stt":1343,"hsk":"HSK5","topic":"Tổng hợp","subject":"Báo cáo","vi":"Khách hàng đánh giá rất cao chất lượng sản phẩm.","zh":"客户对产品质量评价很高。","pinyin":"Kèhù duì chǎnpǐn zhìliàng píngjià hěn gāo."},{"stt":1344,"hsk":"HSK5","topic":"Tổng hợp","subject":"Báo cáo","vi":"Nhóm đã hoàn thành mục tiêu tháng này.","zh":"团队完成了本月目标。","pinyin":"Tuánduì wánchéng le běnyuè mùbiāo."},{"stt":1345,"hsk":"HSK5","topic":"Tổng hợp","subject":"Báo cáo","vi":"Xin tiếp tục duy trì kết quả này.","zh":"请继续保持这个成果。","pinyin":"Qǐng jìxù bǎochí zhège chéngguǒ."},{"stt":1346,"hsk":"HSK5","topic":"Tổng hợp","subject":"Báo cáo","vi":"Chúng ta vẫn còn nhiều việc phải làm.","zh":"我们还有很多工作要做。","pinyin":"Wǒmen hái yǒu hěn duō gōngzuò yào zuò."},{"stt":1347,"hsk":"HSK5","topic":"Tổng hợp","subject":"Báo cáo","vi":"Hy vọng tháng sau sẽ đạt kết quả tốt hơn.","zh":"希望下个月取得更好的成绩。","pinyin":"Xīwàng xià ge yuè qǔdé gèng hǎo de chéngjì."},{"stt":1348,"hsk":"HSK5","topic":"Tổng hợp","subject":"Báo cáo","vi":"Cảm ơn mọi người đã nỗ lực.","zh":"感谢大家的努力。","pinyin":"Gǎnxiè dàjiā de nǔlì."},{"stt":1349,"hsk":"HSK5","topic":"Tổng hợp","subject":"Báo cáo","vi":"Chúng ta cùng cố gắng hơn nữa.","zh":"让我们继续努力。","pinyin":"Ràng wǒmen jìxù nǔlì."},{"stt":1350,"hsk":"HSK","topic":"Chủ điểm","subject":"Chủ đề","vi":"Tiếng Việt","zh":"Tiếng Trung","pinyin":"Pinyin"},{"stt":1351,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Mặc dù sản lượng hôm nay không cao, nhưng vẫn đáp ứng được kế hoạch đã đề ra.","zh":"虽然今天的产量不高，但是还是达到了原定的生产计划。","pinyin":"Suīrán jīntiān de chǎnliàng bù gāo, dànshì háishì dádào le yuándìng de shēngchǎn jìhuà。"},{"stt":1352,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Do một số thiết bị gặp sự cố nên tiến độ sản xuất bị ảnh hưởng khá nghiêm trọng.","zh":"由于部分设备出现故障，因此生产进度受到了比较严重的影响。","pinyin":"Yóuyú bùfèn shèbèi chūxiàn gùzhàng, yīncǐ shēngchǎn jìndù shòudào le bǐjiào yánzhòng de yǐngxiǎng。"},{"stt":1353,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Để đảm bảo đơn hàng được giao đúng hạn, chúng ta cần điều chỉnh kế hoạch sản xuất.","zh":"为了确保订单能够按时交付，我们需要调整生产计划。","pinyin":"Wèile quèbǎo dìngdān nénggòu ànshí jiāofù, wǒmen xūyào tiáozhěng shēngchǎn jìhuà。"},{"stt":1354,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Nếu không phát hiện vấn đề kịp thời thì rất có thể sẽ ảnh hưởng đến cả dây chuyền.","zh":"如果不能及时发现问题，很可能会影响整条生产线。","pinyin":"Rúguǒ bùnéng jíshí fāxiàn wèntí, hěn kěnéng huì yǐngxiǎng zhěng tiáo shēngchǎnxiàn。"},{"stt":1355,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Hiện tại chúng tôi đang cố gắng đẩy nhanh tiến độ để hoàn thành nhiệm vụ trước thời hạn.","zh":"目前我们正在努力加快进度，争取提前完成任务。","pinyin":"Mùqián wǒmen zhèngzài nǔlì jiākuài jìndù, zhēngqǔ tíqián wánchéng rènwu。"},{"stt":1356,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Trước khi bắt đầu sản xuất hàng loạt, tất cả thông số đều phải được xác nhận lại.","zh":"在开始批量生产之前，所有参数都必须重新确认。","pinyin":"Zài kāishǐ pīliàng shēngchǎn zhīqián, suǒyǒu cānshù dōu bìxū chóngxīn quèrèn。"},{"stt":1357,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Nếu sản lượng tiếp tục tăng thì chúng ta phải chuẩn bị thêm nhân lực và nguyên liệu.","zh":"如果产量继续增加，我们就必须准备更多的人力和原材料。","pinyin":"Rúguǒ chǎnliàng jìxù zēngjiā, wǒmen jiù bìxū zhǔnbèi gèng duō de rénlì hé yuáncáiliào。"},{"stt":1358,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Không chỉ bộ phận sản xuất mà bộ phận chất lượng cũng cần theo dõi tình hình này.","zh":"不仅生产部门需要关注这个情况，品质部门也需要跟进。","pinyin":"Bùjǐn shēngchǎn bùmén xūyào guānzhù zhège qíngkuàng, pǐnzhì bùmén yě xūyào gēnjìn。"},{"stt":1359,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Cho dù tiến độ rất gấp, chúng ta cũng không thể bỏ qua các bước kiểm tra cần thiết.","zh":"即使进度非常紧张，我们也不能省略必要的检查步骤。","pinyin":"Jíshǐ jìndù fēicháng jǐnzhāng, wǒmen yě bùnéng shěnglüè bìyào de jiǎnchá bùzhòu。"},{"stt":1360,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Sau khi xác nhận nguyên nhân, chúng tôi sẽ đưa ra phương án xử lý cụ thể.","zh":"确认原因以后，我们会提出具体的处理方案。","pinyin":"Quèrèn yuányīn yǐhòu, wǒmen huì tíchū jùtǐ de chǔlǐ fāng'àn。"},{"stt":1361,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Vấn đề này đã xảy ra nhiều lần, vì vậy chúng ta cần tìm cách ngăn chặn tái diễn.","zh":"这个问题已经发生过多次，因此我们需要想办法防止再次发生。","pinyin":"Zhège wèntí yǐjīng fāshēng guò duō cì, yīncǐ wǒmen xūyào xiǎng bànfǎ fángzhǐ zàicì fāshēng。"},{"stt":1362,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Trước khi thay đổi kế hoạch, vui lòng trao đổi với người phụ trách để tránh phát sinh vấn đề.","zh":"在更改计划之前，请先和负责人沟通，以免产生问题。","pinyin":"Zài gēnggǎi jìhuà zhīqián, qǐng xiān hé fùzérén gōutōng, yǐmiǎn chǎnshēng wèntí。"},{"stt":1363,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Chúng ta cần căn cứ vào tình hình thực tế để sắp xếp nhân lực hợp lý.","zh":"我们需要根据实际情况合理安排人员。","pinyin":"Wǒmen xūyào gēnjù shíjì qíngkuàng hélǐ ānpái rényuán。"},{"stt":1364,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Nếu kế hoạch có bất kỳ thay đổi nào, tôi sẽ thông báo cho mọi người ngay lập tức.","zh":"如果计划有任何变化，我会立即通知大家。","pinyin":"Rúguǒ jìhuà yǒu rènhé biànhuà, wǒ huì lìjí tōngzhī dàjiā。"},{"stt":1365,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Để tránh ảnh hưởng đến tiến độ, chúng ta nên chuẩn bị phương án dự phòng trước.","zh":"为了避免影响进度，我们最好提前准备备用方案。","pinyin":"Wèile bìmiǎn yǐngxiǎng jìndù, wǒmen zuìhǎo tíqián zhǔnbèi bèiyòng fāng'àn。"},{"stt":1366,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Hiện tại vấn đề lớn nhất không phải là sản lượng mà là tỷ lệ lỗi.","zh":"目前最大的问题不是产量，而是不良率。","pinyin":"Mùqián zuì dà de wèntí bú shì chǎnliàng, ér shì bùliánglǜ。"},{"stt":1367,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Nếu muốn nâng cao hiệu suất thì trước tiên phải tìm ra nguyên nhân khiến máy thường xuyên dừng.","zh":"如果想提高效率，首先要找出机器经常停机的原因。","pinyin":"Rúguǒ xiǎng tígāo xiàolǜ, shǒuxiān yào zhǎochū jīqì jīngcháng tíngjī de yuányīn。"},{"stt":1368,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Qua cuộc họp sáng nay, chúng tôi đã thống nhất phương án cải thiện tiến độ sản xuất.","zh":"通过今天上午的会议，我们已经确定了改善生产进度的方案。","pinyin":"Tōngguò jīntiān shàngwǔ de huìyì, wǒmen yǐjīng quèdìng le gǎishàn shēngchǎn jìndù de fāng'àn。"},{"stt":1369,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Mọi người cần phối hợp với nhau để đảm bảo công việc được tiến hành thuận lợi.","zh":"大家需要互相配合，以确保工作顺利进行。","pinyin":"Dàjiā xūyào hùxiāng pèihé, yǐ quèbǎo gōngzuò shùnlì jìnxíng。"},{"stt":1370,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Chỉ cần phát hiện bất thường thì phải lập tức dừng máy và báo cáo cho người phụ trách.","zh":"只要发现异常，就必须立即停机并向负责人报告。","pinyin":"Zhǐyào fāxiàn yìcháng, jiù bìxū lìjí tíngjī bìng xiàng fùzérén bàogào。"},{"stt":1371,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Dù công việc rất bận, chúng ta vẫn phải đảm bảo các hồ sơ sản xuất được ghi chép đầy đủ.","zh":"无论工作多么忙，我们都必须确保生产记录完整。","pinyin":"Wúlùn gōngzuò duōme máng, wǒmen dōu bìxū quèbǎo shēngchǎn jìlù wánzhěng。"},{"stt":1372,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Sau khi sản xuất xong lô hàng này, cần kiểm tra lại toàn bộ số lượng trước khi nhập kho.","zh":"这批货生产完成以后，需要重新确认全部数量才能入库。","pinyin":"Zhè pī huò shēngchǎn wánchéng yǐhòu, xūyào chóngxīn quèrèn quánbù shùliàng cái néng rùkù。"},{"stt":1373,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Do đơn hàng tăng đột ngột nên bộ phận sản xuất cần tăng ca trong vài ngày tới.","zh":"由于订单突然增加，生产部门这几天需要加班。","pinyin":"Yóuyú dìngdān tūrán zēngjiā, shēngchǎn bùmén zhè jǐ tiān xūyào jiābān。"},{"stt":1374,"hsk":"HSK5","topic":"生产","subject":"Sản xuất","vi":"Chúng tôi đang đánh giá xem kế hoạch hiện tại có đáp ứng được yêu cầu của khách hàng hay không.","zh":"我们正在评估目前的计划能不能满足客户的要求。","pinyin":"Wǒmen zhèngzài pínggū mùqián de jìhuà néng bu néng mǎnzú kèhù de yāoqiú。"},{"stt":1375,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Chất lượng sản phẩm không chỉ ảnh hưởng đến khách hàng mà còn ảnh hưởng đến uy tín của công ty.","zh":"产品质量不仅会影响客户，还会影响公司的信誉。","pinyin":"Chǎnpǐn zhìliàng bùjǐn huì yǐngxiǎng kèhù, hái huì yǐngxiǎng gōngsī de xìnyù。"},{"stt":1376,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Để giảm tỷ lệ lỗi, chúng ta cần phân tích nguyên nhân từ nhiều góc độ khác nhau.","zh":"为了降低不良率，我们需要从不同角度分析原因。","pinyin":"Wèile jiàngdī bùliánglǜ, wǒmen xūyào cóng bùtóng jiǎodù fēnxī yuányīn。"},{"stt":1377,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Chỉ dựa vào kết quả kiểm tra cuối cùng thì rất khó phát hiện hết vấn đề trong quá trình sản xuất.","zh":"只依靠最终的检查结果，很难发现生产过程中所有的问题。","pinyin":"Zhǐ yǐkào zuìzhōng de jiǎnchá jiéguǒ, hěn nán fāxiàn shēngchǎn guòchéng zhōng suǒyǒu de wèntí。"},{"stt":1378,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Nếu phát hiện sản phẩm không đạt tiêu chuẩn, phải lập tức tách riêng và đánh dấu rõ ràng.","zh":"如果发现产品不符合标准，必须立即隔离并做好明显的标记。","pinyin":"Rúguǒ fāxiàn chǎnpǐn bù fúhé biāozhǔn, bìxū lìjí gélí bìng zuò hǎo míngxiǎn de biāojì。"},{"stt":1379,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Sau khi xác nhận lỗi, bộ phận chất lượng cần thông báo cho bộ phận sản xuất để cùng xử lý.","zh":"确认不良以后，品质部门需要通知生产部门共同处理。","pinyin":"Quèrèn bùliáng yǐhòu, pǐnzhì bùmén xūyào tōngzhī shēngchǎn bùmén gòngtóng chǔlǐ。"},{"stt":1380,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Vấn đề này tuy không ảnh hưởng đến toàn bộ sản phẩm nhưng vẫn cần được theo dõi.","zh":"这个问题虽然不会影响全部产品，但是仍然需要跟进。","pinyin":"Zhège wèntí suīrán bú huì yǐngxiǎng quánbù chǎnpǐn, dànshì réngrán xūyào gēnjìn。"},{"stt":1381,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Chúng ta phải đảm bảo tất cả sản phẩm xuất hàng đều đáp ứng tiêu chuẩn chất lượng.","zh":"我们必须确保所有出货产品都符合质量标准。","pinyin":"Wǒmen bìxū quèbǎo suǒyǒu chūhuò chǎnpǐn dōu fúhé zhìliàng biāozhǔn。"},{"stt":1382,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Tỷ lệ lỗi tháng này cao hơn tháng trước, cần điều tra nguyên nhân cụ thể.","zh":"本月的不良率比上个月高，需要调查具体原因。","pinyin":"Běn yuè de bùliánglǜ bǐ shàng ge yuè gāo, xūyào diàochá jùtǐ yuányīn。"},{"stt":1383,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Qua dữ liệu kiểm tra có thể thấy vấn đề chủ yếu tập trung ở công đoạn này.","zh":"从检查数据可以看出，问题主要集中在这个工序。","pinyin":"Cóng jiǎnchá shùjù kěyǐ kànchū, wèntí zhǔyào jízhōng zài zhège gōngxù。"},{"stt":1384,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Trước khi đưa ra kết luận, chúng ta cần xác nhận lại dữ liệu một lần nữa.","zh":"在得出结论之前，我们需要再次确认数据。","pinyin":"Zài déchū jiélùn zhīqián, wǒmen xūyào zàicì quèrèn shùjù。"},{"stt":1385,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Nếu không tìm được nguyên nhân gốc rễ thì biện pháp cải thiện sẽ khó đạt hiệu quả lâu dài.","zh":"如果找不到根本原因，改善措施很难长期有效。","pinyin":"Rúguǒ zhǎo bú dào gēnběn yuányīn, gǎishàn cuòshī hěn nán chángqī yǒuxiào。"},{"stt":1386,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Chúng tôi sẽ theo dõi kết quả sau cải thiện để đánh giá hiệu quả của biện pháp này.","zh":"我们会跟进改善后的结果，以评估这个措施的效果。","pinyin":"Wǒmen huì gēnjìn gǎishàn hòu de jiéguǒ, yǐ pínggū zhège cuòshī de xiàoguǒ。"},{"stt":1387,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Khách hàng yêu cầu chúng ta cung cấp báo cáo phân tích nguyên nhân và biện pháp đối ứng.","zh":"客户要求我们提供原因分析报告和对策。","pinyin":"Kèhù yāoqiú wǒmen tígōng yuányīn fēnxī bàogào hé duìcè。"},{"stt":1388,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Để tránh lỗi tái diễn, cần đào tạo lại những nhân viên có liên quan.","zh":"为了避免问题再次发生，需要重新培训相关员工。","pinyin":"Wèile bìmiǎn wèntí zàicì fāshēng, xūyào chóngxīn péixùn xiāngguān yuángōng。"},{"stt":1389,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Nếu kết quả kiểm tra không ổn định thì không nên vội vàng đưa ra kết luận.","zh":"如果检查结果不稳定，就不应该急着下结论。","pinyin":"Rúguǒ jiǎnchá jiéguǒ bù wěndìng, jiù bù yīnggāi jízhe xià jiélùn。"},{"stt":1390,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Chúng ta cần xác nhận xem lỗi này xuất hiện từ công đoạn nào.","zh":"我们需要确认这个问题是从哪个工序开始出现的。","pinyin":"Wǒmen xūyào quèrèn zhège wèntí shì cóng nǎge gōngxù kāishǐ chūxiàn de。"},{"stt":1391,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Chất lượng không thể chỉ dựa vào kiểm tra mà còn phải được đảm bảo trong từng công đoạn.","zh":"质量不能只依靠检查，还必须在每个工序中得到保证。","pinyin":"Zhìliàng bùnéng zhǐ yǐkào jiǎnchá, hái bìxū zài měi ge gōngxù zhōng dédào bǎozhèng。"},{"stt":1392,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Mỗi khi phát hiện vấn đề bất thường, chúng ta đều phải ghi lại đầy đủ thông tin liên quan.","zh":"每次发现异常问题，都必须完整记录相关信息。","pinyin":"Měi cì fāxiàn yìcháng wèntí, dōu bìxū wánzhěng jìlù xiāngguān xìnxī。"},{"stt":1393,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Dữ liệu kiểm tra cho thấy tỷ lệ lỗi đã giảm đáng kể sau khi cải thiện.","zh":"检查数据显示，改善以后不良率已经明显下降。","pinyin":"Jiǎnchá shùjù xiǎnshì, gǎishàn yǐhòu bùliánglǜ yǐjīng míngxiǎn xiàjiàng。"},{"stt":1394,"hsk":"HSK5","topic":"品质","subject":"Chất lượng","vi":"Nếu biện pháp hiện tại vẫn không có hiệu quả thì chúng ta cần thay đổi phương pháp.","zh":"如果目前的措施仍然没有效果，我们就需要改变方法。","pinyin":"Rúguǒ mùqián de cuòshī réngrán méiyǒu xiàoguǒ, wǒmen jiù xūyào gǎibiàn fāngfǎ。"},{"stt":1395,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Thiết bị này thường xuyên xảy ra lỗi, vì vậy bộ phận kỹ thuật cần kiểm tra toàn diện.","zh":"这个设备经常发生故障，因此技术部门需要进行全面检查。","pinyin":"Zhège shèbèi jīngcháng fāshēng gùzhàng, yīncǐ jìshù bùmén xūyào jìnxíng quánmiàn jiǎnchá。"},{"stt":1396,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Trước khi sử dụng máy, nhân viên phải xác nhận thiết bị đang ở trạng thái bình thường.","zh":"使用机器之前，员工必须确认设备处于正常状态。","pinyin":"Shǐyòng jīqì zhīqián, yuángōng bìxū quèrèn shèbèi chǔyú zhèngcháng zhuàngtài。"},{"stt":1397,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Nếu máy có tiếng động bất thường thì phải dừng máy ngay để kiểm tra.","zh":"如果机器出现异常声音，就必须立即停机检查。","pinyin":"Rúguǒ jīqì chūxiàn yìcháng shēngyīn, jiù bìxū lìjí tíngjī jiǎnchá。"},{"stt":1398,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Máy vừa được sửa xong nhưng vẫn cần chạy thử trước khi đưa vào sản xuất.","zh":"机器刚维修完成，还需要试运行以后才能投入生产。","pinyin":"Jīqì gāng wéixiū wánchéng, hái xūyào shìyùnxíng yǐhòu cái néng tóurù shēngchǎn。"},{"stt":1399,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Để kéo dài tuổi thọ thiết bị, chúng ta cần bảo dưỡng định kỳ theo quy định.","zh":"为了延长设备的使用寿命，我们需要按照规定定期保养。","pinyin":"Wèile yáncháng shèbèi de shǐyòng shòumìng, wǒmen xūyào ànzhào guīdìng dìngqī bǎoyǎng。"},{"stt":1400,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Nếu không bảo dưỡng đúng thời gian, thiết bị có thể nhanh chóng xuống cấp.","zh":"如果不按时保养，设备可能会很快老化。","pinyin":"Rúguǒ bù ànshí bǎoyǎng, shèbèi kěnéng huì hěn kuài lǎohuà。"},{"stt":1401,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Tôi đã liên hệ với kỹ thuật viên và họ sẽ đến kiểm tra trong chiều nay.","zh":"我已经联系技术员了，他们今天下午会过来检查。","pinyin":"Wǒ yǐjīng liánxì jìshùyuán le, tāmen jīntiān xiàwǔ huì guòlái jiǎnchá。"},{"stt":1402,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Do linh kiện thay thế chưa về nên việc sửa máy phải tạm thời trì hoãn.","zh":"由于替换零件还没有到，所以机器维修只能暂时推迟。","pinyin":"Yóuyú tìhuàn língjiàn hái méiyǒu dào, suǒyǐ jīqì wéixiū zhǐ néng zànshí tuīchí。"},{"stt":1403,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Trước khi thay linh kiện, cần xác nhận đúng mã và thông số kỹ thuật.","zh":"更换零件之前，需要确认正确的型号和技术参数。","pinyin":"Gēnghuàn língjiàn zhīqián, xūyào quèrèn zhèngquè de xínghào hé jìshù cānshù。"},{"stt":1404,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Thiết bị này tuy đã sử dụng lâu nhưng nếu bảo dưỡng tốt vẫn có thể tiếp tục sử dụng.","zh":"这个设备虽然使用时间比较长，但是保养得好还是可以继续使用的。","pinyin":"Zhège shèbèi suīrán shǐyòng shíjiān bǐjiào cháng, dànshì bǎoyǎng de hǎo háishì kěyǐ jìxù shǐyòng de。"},{"stt":1405,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Chúng ta cần ghi lại thời gian bắt đầu và kết thúc mỗi lần máy dừng.","zh":"我们需要记录每次机器停机的开始和结束时间。","pinyin":"Wǒmen xūyào jìlù měi cì jīqì tíngjī de kāishǐ hé jiéshù shíjiān。"},{"stt":1406,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Nếu máy dừng quá lâu thì sẽ ảnh hưởng trực tiếp đến kế hoạch sản xuất.","zh":"如果机器停机时间太长，就会直接影响生产计划。","pinyin":"Rúguǒ jīqì tíngjī shíjiān tài cháng, jiù huì zhíjiē yǐngxiǎng shēngchǎn jìhuà。"},{"stt":1407,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Hiện tại vẫn chưa xác định được nguyên nhân khiến thiết bị liên tục báo lỗi.","zh":"目前还没有确定设备不断报警的原因。","pinyin":"Mùqián hái méiyǒu quèdìng shèbèi búduàn bàojǐng de yuányīn。"},{"stt":1408,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Sau khi kỹ thuật điều chỉnh xong, chúng ta cần kiểm tra lại kết quả một lần nữa.","zh":"技术调整完成以后，我们需要再次确认结果。","pinyin":"Jìshù tiáozhěng wánchéng yǐhòu, wǒmen xūyào zàicì quèrèn jiéguǒ。"},{"stt":1409,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Để tránh thao tác sai, nhân viên mới không được tự ý sử dụng thiết bị này.","zh":"为了避免操作错误，新员工不得擅自使用这个设备。","pinyin":"Wèile bìmiǎn cāozuò cuòwù, xīn yuángōng bùdé shànzì shǐyòng zhège shèbèi。"},{"stt":1410,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Nhân viên chỉ được vận hành máy sau khi đã được đào tạo và xác nhận đủ năng lực.","zh":"员工必须经过培训并确认具备能力以后，才能操作机器。","pinyin":"Yuángōng bìxū jīngguò péixùn bìng quèrèn jùbèi nénglì yǐhòu, cái néng cāozuò jīqì。"},{"stt":1411,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Nếu phát hiện thông số thiết bị bất thường thì không được tiếp tục sản xuất.","zh":"如果发现设备参数异常，就不能继续生产。","pinyin":"Rúguǒ fāxiàn shèbèi cānshù yìcháng, jiù bùnéng jìxù shēngchǎn。"},{"stt":1412,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Chúng ta nên kiểm tra lịch sử sửa chữa để tìm hiểu tình trạng của thiết bị.","zh":"我们应该检查维修记录，以了解设备的情况。","pinyin":"Wǒmen yīnggāi jiǎnchá wéixiū jìlù, yǐ liǎojiě shèbèi de qíngkuàng。"},{"stt":1413,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Nếu cùng một lỗi liên tục xuất hiện thì cần xem xét thay đổi thiết bị hoặc phương pháp.","zh":"如果同一个问题不断出现，就需要考虑更换设备或者改变方法。","pinyin":"Rúguǒ tóng yí ge wèntí búduàn chūxiàn, jiù xūyào kǎolǜ gēnghuàn shèbèi huòzhě gǎibiàn fāngfǎ。"},{"stt":1414,"hsk":"HSK5","topic":"设备","subject":"Thiết bị","vi":"Trước khi bàn giao thiết bị cho ca sau, phải xác nhận tình trạng máy và ghi rõ các vấn đề còn tồn tại.","zh":"在把设备交给下一班之前，必须确认机器状态，并明确记录剩下的问题。","pinyin":"Zài bǎ shèbèi jiāo gěi xià yì bān zhīqián, bìxū quèrèn jīqì zhuàngtài, bìng míngquè jìlù shèngxià de wèntí。"},{"stt":1415,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Trước khi sử dụng nguyên liệu, phải kiểm tra mã hàng, số lượng và tình trạng bao bì.","zh":"使用原材料之前，必须检查料号、数量以及包装状态。","pinyin":"Shǐyòng yuáncáiliào zhīqián, bìxū jiǎnchá liàohào, shùliàng yǐjí bāozhuāng zhuàngtài。"},{"stt":1416,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Nếu số lượng thực tế không khớp với hệ thống thì phải lập tức báo cho kho.","zh":"如果实际数量和系统不一致，必须立即通知仓库。","pinyin":"Rúguǒ shíjì shùliàng hé xìtǒng bù yízhì, bìxū lìjí tōngzhī cāngkù。"},{"stt":1417,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Nguyên liệu chưa được xác nhận chất lượng thì không được đưa vào sản xuất.","zh":"质量还没有确认的原材料不能投入生产。","pinyin":"Zhìliàng hái méiyǒu quèrèn de yuáncáiliào bùnéng tóurù shēngchǎn。"},{"stt":1418,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Do nguyên liệu đến muộn nên kế hoạch sản xuất cũng phải thay đổi theo.","zh":"由于原材料到得比较晚，所以生产计划也需要相应调整。","pinyin":"Yóuyú yuáncáiliào dào de bǐjiào wǎn, suǒyǐ shēngchǎn jìhuà yě xūyào xiāngyìng tiáozhěng。"},{"stt":1419,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Để tránh thiếu nguyên liệu, bộ phận kho cần dự báo nhu cầu trước.","zh":"为了避免原材料不足，仓库部门需要提前预测需求。","pinyin":"Wèile bìmiǎn yuáncáiliào bùzú, cāngkù bùmén xūyào tíqián yùcè xūqiú。"},{"stt":1420,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Nếu phát hiện nguyên liệu bị hư hỏng, phải lập tức tách riêng và thông báo cho bộ phận liên quan.","zh":"如果发现原材料损坏，必须立即隔离并通知相关部门。","pinyin":"Rúguǒ fāxiàn yuáncáiliào sǔnhuài, bìxū lìjí gélí bìng tōngzhī xiāngguān bùmén。"},{"stt":1421,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Tất cả nguyên liệu phải được bảo quản theo yêu cầu của tài liệu hướng dẫn.","zh":"所有原材料都必须按照指导文件的要求进行保存。","pinyin":"Suǒyǒu yuáncáiliào dōu bìxū ànzhào zhǐdǎo wénjiàn de yāoqiú jìnxíng bǎocún。"},{"stt":1422,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Trước khi nhập kho, nhân viên phải kiểm tra xem số lượng thực tế có phù hợp với phiếu giao hàng không.","zh":"入库之前，员工必须检查实际数量是否与送货单相符。","pinyin":"Rùkù zhīqián, yuángōng bìxū jiǎnchá shíjì shùliàng shìfǒu yǔ sònghuò dān xiāngfú。"},{"stt":1423,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Nếu mã nguyên liệu không đúng thì dù số lượng đủ cũng không được sử dụng.","zh":"如果原材料编号不正确，即使数量足够也不能使用。","pinyin":"Rúguǒ yuáncáiliào biānhào bù zhèngquè, jíshǐ shùliàng zúgòu yě bùnéng shǐyòng。"},{"stt":1424,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Chúng ta cần xác nhận với nhà cung cấp trước khi quyết định có sử dụng lô nguyên liệu này hay không.","zh":"我们需要先和供应商确认，再决定是否使用这批原材料。","pinyin":"Wǒmen xūyào xiān hé gōngyìngshāng quèrèn, zài juédìng shìfǒu shǐyòng zhè pī yuáncáiliào。"},{"stt":1425,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Hàng lỗi phải được đánh dấu rõ ràng để tránh bị đưa nhầm vào dây chuyền sản xuất.","zh":"不良材料必须做好明显标记，以免被误送到生产线上。","pinyin":"Bùliáng cáiliào bìxū zuò hǎo míngxiǎn biāojì, yǐmiǎn bèi wù sòng dào shēngchǎnxiàn shàng。"},{"stt":1426,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Để kiểm soát tồn kho hiệu quả, cần thường xuyên đối chiếu số lượng thực tế với dữ liệu trên hệ thống.","zh":"为了有效控制库存，需要定期核对实际数量和系统数据。","pinyin":"Wèile yǒuxiào kòngzhì kùcún, xūyào dìngqī héduì shíjì shùliàng hé xìtǒng shùjù。"},{"stt":1427,"hsk":"HSK5","topic":"原材料","subject":"Nguyên liệu","vi":"Nếu tồn kho thấp hơn mức an toàn thì phải lập tức thông báo để bổ sung.","zh":"如果库存低于安全水平，就必须立即通知相关人员进行补充。","pinyin":"Rúguǒ kùcún dī yú ānquán shuǐpíng, jiù bìxū lìjí tōngzhī xiāngguān rényuán jìnxíng bǔchōng。"},{"stt":1428,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Việc quản lý kho không chỉ liên quan đến số lượng mà còn liên quan đến vị trí và tình trạng hàng hóa.","zh":"仓库管理不仅涉及数量，还涉及货物的位置和状态。","pinyin":"Cāngkù guǎnlǐ bùjǐn shèjí shùliàng, hái shèjí huòwù de wèizhi hé zhuàngtài。"},{"stt":1429,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Để thuận tiện cho việc tìm kiếm, tất cả hàng hóa cần được sắp xếp theo quy định.","zh":"为了方便查找，所有货物都需要按照规定进行整理。","pinyin":"Wèile fāngbiàn cházhao, suǒyǒu huòwù dōu xūyào ànzhào guīdìng jìnxíng zhěnglǐ。"},{"stt":1430,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Nếu phát hiện số lượng trong kho không khớp, trước tiên phải kiểm tra lại lịch sử nhập xuất.","zh":"如果发现库存数量不一致，首先要重新检查出入库记录。","pinyin":"Rúguǒ fāxiàn kùcún shùliàng bù yízhì, shǒuxiān yào chóngxīn jiǎnchá chūrùkù jìlù。"},{"stt":1431,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Hàng hóa có thời hạn sử dụng cần được quản lý đặc biệt để tránh bị quá hạn.","zh":"有使用期限的货物需要特别管理，以免超过有效期。","pinyin":"Yǒu shǐyòng qīxiàn de huòwù xūyào tèbié guǎnlǐ, yǐmiǎn chāoguò yǒuxiào qī。"},{"stt":1432,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Trước khi xuất kho, nhân viên phải xác nhận đúng mã hàng và số lượng theo yêu cầu.","zh":"出库之前，员工必须按照要求确认正确的料号和数量。","pinyin":"Chūkù zhīqián, yuángōng bìxū ànzhào yāoqiú quèrèn zhèngquè de liàohào hé shùliàng。"},{"stt":1433,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Nếu chưa có phiếu xuất kho được phê duyệt thì không được tự ý lấy hàng.","zh":"如果没有经过批准的出库单，就不能擅自取货。","pinyin":"Rúguǒ méiyǒu jīngguò pīzhǔn de chūkù dān, jiù bùnéng shànzì qǔ huò。"},{"stt":1434,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Chúng ta cần kiểm tra nguyên nhân chênh lệch trước khi điều chỉnh dữ liệu trên hệ thống.","zh":"在调整系统数据之前，我们需要先检查产生差异的原因。","pinyin":"Zài tiáozhěng xìtǒng shùjù zhīqián, wǒmen xūyào xiān jiǎnchá chǎnshēng chāyì de yuányīn。"},{"stt":1435,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Việc kiểm kê định kỳ giúp chúng ta kịp thời phát hiện những vấn đề tồn tại trong kho.","zh":"定期盘点可以帮助我们及时发现仓库中存在的问题。","pinyin":"Dìngqī pándiǎn kěyǐ bāngzhù wǒmen jíshí fāxiàn cāngkù zhōng cúnzài de wèntí。"},{"stt":1436,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Nếu hàng hóa không được đặt đúng vị trí thì khi cần tìm sẽ mất rất nhiều thời gian.","zh":"如果货物没有放在正确的位置，需要查找时就会浪费很多时间。","pinyin":"Rúguǒ huòwù méiyǒu fàng zài zhèngquè de wèizhi, xūyào cházhao shí jiù huì làngfèi hěn duō shíjiān。"},{"stt":1437,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Để nâng cao hiệu quả quản lý, kho cần cập nhật dữ liệu kịp thời sau mỗi lần nhập xuất.","zh":"为了提高管理效率，仓库需要在每次出入库以后及时更新数据。","pinyin":"Wèile tígāo guǎnlǐ xiàolǜ, cāngkù xūyào zài měi cì chūrùkù yǐhòu jíshí gēngxīn shùjù。"},{"stt":1438,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Hàng hóa sau khi kiểm tra đạt yêu cầu mới được chuyển đến khu vực sản xuất.","zh":"货物经过检查符合要求以后，才能转移到生产区域。","pinyin":"Huòwù jīngguò jiǎnchá fúhé yāoqiú yǐhòu, cái néng zhuǎnyí dào shēngchǎn qūyù。"},{"stt":1439,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Nếu khu vực kho không đủ chỗ, cần báo trước để sắp xếp khu vực lưu trữ khác.","zh":"如果仓库没有足够的空间，需要提前通知，以便安排其他储存区域。","pinyin":"Rúguǒ cāngkù méiyǒu zúgòu de kōngjiān, xūyào tíqián tōngzhī, yǐbiàn ānpái qítā chǔcún qūyù。"},{"stt":1440,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Hàng lỗi và hàng đạt phải được phân khu rõ ràng để tránh nhầm lẫn.","zh":"不良品和合格品必须明确分区，以免发生混淆。","pinyin":"Bùliángpǐn hé hégé pǐn bìxū míngquè fēnqū, yǐmiǎn fāshēng hùnxiáo。"},{"stt":1441,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Chúng tôi phát hiện một số hàng hóa không có nhãn nhận diện rõ ràng.","zh":"我们发现有一些货物没有清楚的识别标签。","pinyin":"Wǒmen fāxiàn yǒu yìxiē huòwù méiyǒu qīngchǔ de shíbié biāoqiān。"},{"stt":1442,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Trước khi giao hàng, cần xác nhận lại tất cả thông tin trên nhãn.","zh":"发货之前，需要重新确认标签上的所有信息。","pinyin":"Fāhuò zhīqián, xūyào chóngxīn quèrèn biāoqiān shàng de suǒyǒu xìnxī。"},{"stt":1443,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Nếu thông tin trên nhãn không giống với hệ thống thì phải dừng việc xuất hàng.","zh":"如果标签上的信息和系统不一致，就必须停止出货。","pinyin":"Rúguǒ biāoqiān shàng de xìnxī hé xìtǒng bù yízhì, jiù bìxū tíngzhǐ chūhuò。"},{"stt":1444,"hsk":"HSK5","topic":"仓库","subject":"Kho","vi":"Để giảm sai sót, nhân viên kho cần kiểm tra chéo trước khi hoàn thành thao tác.","zh":"为了减少错误，仓库员工在完成操作之前需要进行交叉检查。","pinyin":"Wèile jiǎnshǎo cuòwù, cāngkù yuángōng zài wánchéng cāozuò zhīqián xūyào jìnxíng jiāochā jiǎnchá。"},{"stt":1445,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Trước khi áp dụng SOP mới, tất cả nhân viên liên quan đều phải được đào tạo.","zh":"在实施新的SOP之前，所有相关员工都必须接受培训。","pinyin":"Zài shíshī xīn de SOP zhīqián, suǒyǒu xiāngguān yuángōng dōu bìxū jiēshòu péixùn。"},{"stt":1446,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Nếu SOP có bất kỳ thay đổi nào thì cần thông báo kịp thời cho các bộ phận liên quan.","zh":"如果SOP有任何变更，需要及时通知相关部门。","pinyin":"Rúguǒ SOP yǒu rènhé biàngēng, xūyào jíshí tōngzhī xiāngguān bùmén。"},{"stt":1447,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Không được tự ý thay đổi nội dung SOP khi chưa được phê duyệt.","zh":"未经批准，不得擅自更改SOP的内容。","pinyin":"Wèijīng pīzhǔn, bùdé shànzì gēnggǎi SOP de nèiróng。"},{"stt":1448,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Mỗi phiên bản SOP đều phải có số phiên bản và ngày phát hành rõ ràng.","zh":"每个版本的SOP都必须有明确的版本号和发布日期。","pinyin":"Měi ge bǎnběn de SOP dōu bìxū yǒu míngquè de bǎnběn hào hé fābù rìqī。"},{"stt":1449,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Trước khi sử dụng tài liệu, vui lòng xác nhận đó có phải phiên bản mới nhất hay không.","zh":"使用文件之前，请确认是不是最新版本。","pinyin":"Shǐyòng wénjiàn zhīqián, qǐng quèrèn shì bú shì zuìxīn bǎnběn。"},{"stt":1450,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Nếu phát hiện nhân viên đang sử dụng SOP cũ thì phải lập tức nhắc nhở và thay thế.","zh":"如果发现员工正在使用旧版SOP，必须立即提醒并更换。","pinyin":"Rúguǒ fāxiàn yuángōng zhèngzài shǐyòng jiù bǎn SOP, bìxū lìjí tíxǐng bìng gēnghuàn。"},{"stt":1451,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Để tránh hiểu sai, những thay đổi quan trọng trong SOP cần được giải thích rõ ràng.","zh":"为了避免理解错误，SOP中的重要变更需要进行详细说明。","pinyin":"Wèile bìmiǎn lǐjiě cuòwù, SOP zhōng de zhòngyào biàngēng xūyào jìnxíng xiángxì shuōmíng。"},{"stt":1452,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Sau khi cập nhật SOP, bộ phận PE cần xác nhận lại tất cả các công đoạn liên quan.","zh":"更新SOP以后，PE部门需要重新确认所有相关工序。","pinyin":"Gēngxīn SOP yǐhòu, PE bùmén xūyào chóngxīn quèrèn suǒyǒu xiāngguān gōngxù。"},{"stt":1453,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Nếu nội dung thực tế khác với SOP thì cần lập tức xác nhận nguyên nhân.","zh":"如果实际操作和SOP内容不一致，需要立即确认原因。","pinyin":"Rúguǒ shíjì cāozuò hé SOP nèiróng bù yízhì, xūyào lìjí quèrèn yuányīn。"},{"stt":1454,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"SOP phải được xây dựng dựa trên tình hình thực tế và yêu cầu của sản phẩm.","zh":"SOP必须根据实际情况和产品要求制定。","pinyin":"SOP bìxū gēnjù shíjì qíngkuàng hé chǎnpǐn yāoqiú zhìdìng。"},{"stt":1455,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Không chỉ cần làm đúng SOP mà còn phải hiểu rõ mục đích của từng bước.","zh":"不仅要按照SOP操作，还要了解每个步骤的目的。","pinyin":"Bùjǐn yào ànzhào SOP cāozuò, hái yào liǎojiě měi ge bùzhòu de mùdì。"},{"stt":1456,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Nếu một bước trong SOP không phù hợp với thực tế, cần báo cáo để đánh giá và sửa đổi.","zh":"如果SOP中的某个步骤不符合实际情况，需要报告并进行评估和修改。","pinyin":"Rúguǒ SOP zhōng de mǒu ge bùzhòu bù fúhé shíjì qíngkuàng, xūyào bàogào bìng jìnxíng pínggū hé xiūgǎi。"},{"stt":1457,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Việc sửa đổi tài liệu phải được kiểm soát để đảm bảo mọi người đều sử dụng cùng một phiên bản.","zh":"文件修改必须受到控制，以确保所有人使用相同的版本。","pinyin":"Wénjiàn xiūgǎi bìxū shòudào kòngzhì, yǐ quèbǎo suǒyǒu rén shǐyòng xiāngtóng de bǎnběn。"},{"stt":1458,"hsk":"HSK5","topic":"PE","subject":"SOP","vi":"Sau khi phát hành phiên bản mới, bản cũ phải được thu hồi hoặc đánh dấu không còn hiệu lực.","zh":"新版本发布以后，旧版本必须回收或者标记为无效。","pinyin":"Xīn bǎnběn fābù yǐhòu, jiù bǎnběn bìxū huíshōu huòzhě biāojì wéi wúxiào。"},{"stt":1459,"hsk":"HSK5","topic":"PE","subject":"Quy trình","vi":"Quy trình này cần được điều chỉnh vì điều kiện sản xuất hiện tại đã thay đổi.","zh":"这个流程需要调整，因为目前的生产条件已经发生变化。","pinyin":"Zhège liúchéng xūyào tiáozhěng, yīnwèi mùqián de shēngchǎn tiáojiàn yǐjīng fāshēng biànhuà。"},{"stt":1460,"hsk":"HSK5","topic":"PE","subject":"Quy trình","vi":"Trước khi thay đổi quy trình, cần đánh giá xem sự thay đổi có ảnh hưởng đến chất lượng hay không.","zh":"更改流程之前，需要评估这项变化是否会影响质量。","pinyin":"Gēnggǎi liúchéng zhīqián, xūyào pínggū zhè xiàng biànhuà shìfǒu huì yǐngxiǎng zhìliàng。"},{"stt":1461,"hsk":"HSK5","topic":"PE","subject":"Quy trình","vi":"Nếu quy trình được đơn giản hóa nhưng không ảnh hưởng đến chất lượng thì có thể xem xét áp dụng.","zh":"如果流程得到简化而且不会影响质量，可以考虑实施。","pinyin":"Rúguǒ liúchéng dédào jiǎnhuà érqiě bú huì yǐngxiǎng zhìliàng, kěyǐ kǎolǜ shíshī。"},{"stt":1462,"hsk":"HSK5","topic":"PE","subject":"Quy trình","vi":"Mọi thay đổi trong quy trình đều phải có lý do và hồ sơ xác nhận rõ ràng.","zh":"流程中的任何变化都必须有明确的理由和确认记录。","pinyin":"Liúchéng zhōng de rènhé biànhuà dōu bìxū yǒu míngquè de lǐyóu hé quèrèn jìlù。"},{"stt":1463,"hsk":"HSK5","topic":"PE","subject":"Quy trình","vi":"Để giảm lỗi thao tác, chúng ta cần xem xét lại toàn bộ quy trình hiện tại.","zh":"为了减少操作错误，我们需要重新评估目前的整个流程。","pinyin":"Wèile jiǎnshǎo cāozuò cuòwù, wǒmen xūyào chóngxīn pínggū mùqián de zhěnggè liúchéng。"},{"stt":1464,"hsk":"HSK5","topic":"PE","subject":"Quy trình","vi":"Nếu các bộ phận phối hợp không tốt thì dù quy trình có hoàn thiện cũng khó đạt hiệu quả.","zh":"如果各部门配合不好，即使流程很完善，也很难取得效果。","pinyin":"Rúguǒ gè bùmén pèihé bù hǎo, jíshǐ liúchéng hěn wánshàn, yě hěn nán qǔdé xiàoguǒ。"},{"stt":1465,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Báo cáo hôm nay cần bao gồm sản lượng, tỷ lệ lỗi và các vấn đề phát sinh.","zh":"今天的报告需要包括产量、不良率以及发生的问题。","pinyin":"Jīntiān de bàogào xūyào bāokuò chǎnliàng, bùliánglǜ yǐjí fāshēng de wèntí。"},{"stt":1466,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Trước khi gửi báo cáo cho sếp, tôi muốn kiểm tra lại toàn bộ dữ liệu một lần nữa.","zh":"在把报告发给主管之前，我想再检查一遍所有数据。","pinyin":"Zài bǎ bàogào fā gěi zhǔguǎn zhīqián, wǒ xiǎng zài jiǎnchá yí biàn suǒyǒu shùjù。"},{"stt":1467,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Nếu số liệu trong báo cáo có vấn đề, người phụ trách cần giải thích nguyên nhân.","zh":"如果报告中的数据有问题，负责人需要说明原因。","pinyin":"Rúguǒ bàogào zhōng de shùjù yǒu wèntí, fùzérén xūyào shuōmíng yuányīn。"},{"stt":1468,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Để sếp dễ hiểu, chúng ta nên trình bày những vấn đề quan trọng trước.","zh":"为了让主管容易理解，我们应该先说明重要的问题。","pinyin":"Wèile ràng zhǔguǎn róngyì lǐjiě, wǒmen yīnggāi xiān shuōmíng zhòngyào de wèntí。"},{"stt":1469,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Báo cáo này tuy khá dài nhưng những thông tin quan trọng đều đã được trình bày đầy đủ.","zh":"这份报告虽然比较长，但是重要的信息都已经说明清楚了。","pinyin":"Zhè fèn bàogào suīrán bǐjiào cháng, dànshì zhòngyào de xìnxī dōu yǐjīng shuōmíng qīngchǔ le。"},{"stt":1470,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Nếu phát hiện số liệu bất thường, đừng vội sửa mà hãy xác nhận nguyên nhân trước.","zh":"如果发现数据异常，不要急着修改，应该先确认原因。","pinyin":"Rúguǒ fāxiàn shùjù yìcháng, bú yào jí zhe xiūgǎi, yīnggāi xiān quèrèn yuányīn。"},{"stt":1471,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Tôi sẽ hoàn thành báo cáo trước ba giờ chiều và gửi cho anh kiểm tra.","zh":"我会在下午三点以前完成报告，然后发给您检查。","pinyin":"Wǒ huì zài xiàwǔ sān diǎn yǐqián wánchéng bàogào, ránhòu fā gěi nín jiǎnchá。"},{"stt":1472,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Sau khi nhận được báo cáo, vui lòng xác nhận xem còn nội dung nào cần bổ sung không.","zh":"收到报告以后，请确认还有没有需要补充的内容。","pinyin":"Shōudào bàogào yǐhòu, qǐng quèrèn hái yǒu méiyǒu xūyào bǔchōng de nèiróng。"},{"stt":1473,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Chúng tôi đã cập nhật báo cáo theo những ý kiến được đưa ra trong cuộc họp.","zh":"我们已经根据会议上提出的意见更新了报告。","pinyin":"Wǒmen yǐjīng gēnjù huìyì shàng tíchū de yìjiàn gēngxīn le bàogào。"},{"stt":1474,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Nếu hôm nay chưa thể hoàn thành báo cáo, tôi sẽ báo trước để sếp nắm được tình hình.","zh":"如果今天不能完成报告，我会提前说明，让主管了解情况。","pinyin":"Rúguǒ jīntiān bùnéng wánchéng bàogào, wǒ huì tíqián shuōmíng, ràng zhǔguǎn liǎojiě qíngkuàng。"},{"stt":1475,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Dữ liệu trong báo cáo phải phù hợp với số liệu thực tế trên chuyền sản xuất.","zh":"报告中的数据必须和生产线上的实际数据一致。","pinyin":"Bàogào zhōng de shùjù bìxū hé shēngchǎnxiàn shàng de shíjì shùjù yízhì。"},{"stt":1476,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Trước khi gửi email, tôi đã kiểm tra kỹ để tránh gửi nhầm phiên bản.","zh":"发送邮件之前，我已经仔细检查过，以免发错版本。","pinyin":"Fāsòng yóujiàn zhīqián, wǒ yǐjīng zǐxì jiǎnchá guò, yǐmiǎn fā cuò bǎnběn。"},{"stt":1477,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Nếu cần sửa đổi nội dung, vui lòng đánh dấu những phần đã thay đổi để chúng tôi dễ dàng kiểm tra.","zh":"如果需要修改内容，请标出已经变更的部分，以便我们检查。","pinyin":"Rúguǒ xūyào xiūgǎi nèiróng, qǐng biāochū yǐjīng biàngēng de bùfèn, yǐbiàn wǒmen jiǎnchá。"},{"stt":1478,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Để tránh hiểu nhầm, những dữ liệu quan trọng cần ghi rõ nguồn và thời gian thống kê.","zh":"为了避免误解，重要数据需要注明来源和统计时间。","pinyin":"Wèile bìmiǎn wùjiě, zhòngyào shùjù xūyào zhùmíng láiyuán hé tǒngjì shíjiān。"},{"stt":1479,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Báo cáo cuối ngày cần được hoàn thành trước khi nhân viên rời khỏi công ty.","zh":"每日的工作报告需要在员工离开公司之前完成。","pinyin":"Měirì de gōngzuò bàogào xūyào zài yuángōng líkāi gōngsī zhīqián wánchéng。"},{"stt":1480,"hsk":"HSK5","topic":"报告","subject":"Báo cáo","vi":"Nếu số liệu chưa được xác nhận thì không nên đưa vào báo cáo chính thức.","zh":"如果数据还没有确认，就不应该放进正式报告里。","pinyin":"Rúguǒ shùjù hái méiyǒu quèrèn, jiù bù yīnggāi fàng jìn zhèngshì bàogào lǐ。"},{"stt":1481,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Nếu có vấn đề trong công việc, hãy trao đổi trực tiếp thay vì tự mình quyết định.","zh":"如果工作中有问题，请直接沟通，不要自己做决定。","pinyin":"Rúguǒ gōngzuò zhōng yǒu wèntí, qǐng zhíjiē gōutōng, bú yào zìjǐ zuò juédìng。"},{"stt":1482,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Mặc dù ý kiến của chúng ta khác nhau, nhưng vẫn có thể cùng nhau tìm ra giải pháp phù hợp.","zh":"虽然我们的意见不同，但是仍然可以一起找到合适的解决办法。","pinyin":"Suīrán wǒmen de yìjiàn bùtóng, dànshì réngrán kěyǐ yìqǐ zhǎodào héshì de jiějué bànfǎ。"},{"stt":1483,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Trước khi đưa ra quyết định, tôi muốn nghe ý kiến của những người trực tiếp thực hiện công việc.","zh":"在做决定之前，我想听听直接负责这项工作的人的意见。","pinyin":"Zài zuò juédìng zhīqián, wǒ xiǎng tīngting zhíjiē fùzé zhè xiàng gōngzuò de rén de yìjiàn。"},{"stt":1484,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Nếu có điều gì chưa hiểu, bạn có thể hỏi tôi bất cứ lúc nào.","zh":"如果有什么不明白的地方，你可以随时问我。","pinyin":"Rúguǒ yǒu shénme bù míngbai de dìfang, nǐ kěyǐ suíshí wèn wǒ。"},{"stt":1485,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Để tránh ảnh hưởng đến tiến độ, những vấn đề quan trọng cần được phản hồi kịp thời.","zh":"为了避免影响进度，重要的问题需要及时反馈。","pinyin":"Wèile bìmiǎn yǐngxiǎng jìndù, zhòngyào de wèntí xūyào jíshí fǎnkuì。"},{"stt":1486,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Nếu sếp đã đưa ra yêu cầu mới, chúng ta cần xác nhận lại nội dung để tránh hiểu sai.","zh":"如果主管提出了新的要求，我们需要重新确认内容，以免理解错误。","pinyin":"Rúguǒ zhǔguǎn tíchū le xīn de yāoqiú, wǒmen xūyào chóngxīn quèrèn nèiróng, yǐmiǎn lǐjiě cuòwù。"},{"stt":1487,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Tôi nghĩ trước tiên chúng ta nên xác nhận vấn đề nằm ở đâu rồi mới bàn cách xử lý.","zh":"我认为我们应该先确认问题在哪里，再讨论处理方法。","pinyin":"Wǒ rènwéi wǒmen yīnggāi xiān quèrèn wèntí zài nǎlǐ, zài tǎolùn chǔlǐ fāngfǎ。"},{"stt":1488,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Nếu chỉ nói rằng có vấn đề mà không giải thích cụ thể thì rất khó tìm được giải pháp.","zh":"如果只说有问题而不具体说明，很难找到解决办法。","pinyin":"Rúguǒ zhǐ shuō yǒu wèntí ér bù jùtǐ shuōmíng, hěn nán zhǎodào jiějué bànfǎ。"},{"stt":1489,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Chúng ta không nên đổ lỗi cho nhau mà nên tập trung vào cách giải quyết vấn đề.","zh":"我们不应该互相推卸责任，而应该把重点放在解决问题上。","pinyin":"Wǒmen bù yīnggāi hùxiāng tuīxiè zérèn, ér yīnggāi bǎ zhòngdiǎn fàng zài jiějué wèntí shàng。"},{"stt":1490,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Sau khi trao đổi với bộ phận sản xuất, tôi sẽ phản hồi lại cho bạn kết quả.","zh":"和生产部门沟通以后，我会把结果反馈给你。","pinyin":"Hé shēngchǎn bùmén gōutōng yǐhòu, wǒ huì bǎ jiéguǒ fǎnkuì gěi nǐ。"},{"stt":1491,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Để công việc được tiến hành thuận lợi, các bộ phận cần thống nhất cách xử lý trước.","zh":"为了让工作顺利进行，各部门需要先统一处理方法。","pinyin":"Wèile ràng gōngzuò shùnlì jìnxíng, gè bùmén xūyào xiān tǒngyī chǔlǐ fāngfǎ。"},{"stt":1492,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Nếu không chắc chắn về thông tin thì tốt nhất hãy xác nhận với người phụ trách trước khi trả lời.","zh":"如果不确定信息是否正确，最好先和负责人确认再回答。","pinyin":"Rúguǒ bù quèdìng xìnxī shìfǒu zhèngquè, zuìhǎo xiān hé fùzérén quèrèn zài huídá。"},{"stt":1493,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Trong công việc, phản hồi rõ ràng và kịp thời quan trọng không kém năng lực chuyên môn.","zh":"在工作中，清楚而及时的反馈和专业能力同样重要。","pinyin":"Zài gōngzuò zhōng, qīngchǔ ér jíshí de fǎnkuì hé zhuānyè nénglì tóngyàng zhòngyào。"},{"stt":1494,"hsk":"HSK5","topic":"沟通","subject":"Giao tiếp","vi":"Dù gặp vấn đề khó đến đâu, chúng ta cũng nên bình tĩnh tìm cách giải quyết.","zh":"无论遇到多么困难的问题，我们都应该冷静地想办法解决。","pinyin":"Wúlùn yùdào duōme kùnnan de wèntí, wǒmen dōu yīnggāi lěngjìng de xiǎng bànfǎ jiějué。"},{"stt":1495,"hsk":"HSK5","topic":"主管","subject":"Chủ quản","vi":"Sếp yêu cầu tôi hoàn thành báo cáo trước khi kết thúc ngày làm việc.","zh":"主管要求我在下班之前完成报告。","pinyin":"Zhǔguǎn yāoqiú wǒ zài xiàbān zhīqián wánchéng bàogào。"},{"stt":1496,"hsk":"HSK5","topic":"主管","subject":"Chủ quản","vi":"Tôi đã hoàn thành công việc theo yêu cầu của chủ quản và đang chờ xác nhận.","zh":"我已经按照主管的要求完成了工作，现在正在等待确认。","pinyin":"Wǒ yǐjīng ànzhào zhǔguǎn de yāoqiú wánchéng le gōngzuò, xiànzài zhèngzài děngdài quèrèn。"},{"stt":1497,"hsk":"HSK5","topic":"主管","subject":"Chủ quản","vi":"Nếu chủ quản có yêu cầu mới, vui lòng thông báo cho tôi sớm để tôi sắp xếp công việc.","zh":"如果主管有新的要求，请尽早通知我，以便我安排工作。","pinyin":"Rúguǒ zhǔguǎn yǒu xīn de yāoqiú, qǐng jǐnzǎo tōngzhī wǒ, yǐbiàn wǒ ānpái gōngzuò。"},{"stt":1498,"hsk":"HSK5","topic":"主管","subject":"Chủ quản","vi":"Mặc dù thời gian khá gấp nhưng chủ quản vẫn yêu cầu đảm bảo chất lượng trước tiên.","zh":"虽然时间比较紧，但是主管还是要求首先保证质量。","pinyin":"Suīrán shíjiān bǐjiào jǐn, dànshì zhǔguǎn háishì yāoqiú shǒuxiān bǎozhèng zhìliàng。"},{"stt":1499,"hsk":"HSK5","topic":"主管","subject":"Chủ quản","vi":"Tôi đã giải thích tình hình thực tế cho chủ quản và đề xuất một phương án khác.","zh":"我已经向主管说明了实际情况，并提出了另外一个方案。","pinyin":"Wǒ yǐjīng xiàng zhǔguǎn shuōmíng le shíjì qíngkuàng, bìng tíchū le lìngwài yí ge fāng'àn。"},{"stt":1500,"hsk":"HSK5","topic":"主管","subject":"Chủ quản","vi":"Sau khi nghe báo cáo, chủ quản yêu cầu chúng tôi tiếp tục theo dõi vấn đề này.","zh":"听完报告以后，主管要求我们继续跟进这个问题。","pinyin":"Tīng wán bàogào yǐhòu, zhǔguǎn yāoqiú wǒmen jìxù gēnjìn zhège wèntí。"},{"stt":1501,"hsk":"HSK5","topic":"主管","subject":"Chủ quản","vi":"Nếu không thể hoàn thành đúng thời hạn, bạn cần báo trước cho chủ quản thay vì đợi đến phút cuối.","zh":"如果不能按时完成，你需要提前告诉主管，而不是等到最后一分钟。","pinyin":"Rúguǒ bùnéng ànshí wánchéng, nǐ xūyào tíqián gàosu zhǔguǎn, ér bú shì děng dào zuìhòu yì fēnzhōng。"},{"stt":1502,"hsk":"HSK5","topic":"主管","subject":"Chủ quản","vi":"Chủ quản không chỉ quan tâm đến kết quả mà còn quan tâm đến quá trình thực hiện.","zh":"主管不仅关心结果，也关心执行的过程。","pinyin":"Zhǔguǎn bùjǐn guānxīn jiéguǒ, yě guānxīn zhíxíng de guòchéng。"},{"stt":1503,"hsk":"HSK5","topic":"主管","subject":"Chủ quản","vi":"Để tránh ảnh hưởng đến công việc của người khác, chủ quản yêu cầu chúng tôi hoàn thành phần việc của mình trước.","zh":"为了避免影响其他人的工作，主管要求我们先完成自己的部分。","pinyin":"Wèile bìmiǎn yǐngxiǎng qítā rén de gōngzuò, zhǔguǎn yāoqiú wǒmen xiān wánchéng zìjǐ de bùfèn。"},{"stt":1504,"hsk":"HSK5","topic":"主管","subject":"Chủ quản","vi":"Nếu có bất đồng với chủ quản, bạn nên giải thích bằng dữ liệu và tình hình thực tế.","zh":"如果和主管有不同意见，应该用数据和实际情况来说明。","pinyin":"Rúguǒ hé zhǔguǎn yǒu bùtóng yìjiàn, yīnggāi yòng shùjù hé shíjì qíngkuàng lái shuōmíng。"},{"stt":1505,"hsk":"HSK5","topic":"会议","subject":"Họp","vi":"Trong cuộc họp sáng nay, các bộ phận đã trao đổi về tiến độ của đơn hàng mới.","zh":"今天上午的会议上，各部门讨论了新订单的进度。","pinyin":"Jīntiān shàngwǔ de huìyì shàng, gè bùmén tǎolùn le xīn dìngdān de jìndù。"},{"stt":1506,"hsk":"HSK5","topic":"会议","subject":"Họp","vi":"Trước khi họp, vui lòng chuẩn bị các dữ liệu liên quan để tránh mất thời gian.","zh":"开会之前，请准备好相关数据，以免浪费时间。","pinyin":"Kāihuì zhīqián, qǐng zhǔnbèi hǎo xiāngguān shùjù, yǐmiǎn làngfèi shíjiān。"},{"stt":1507,"hsk":"HSK5","topic":"会议","subject":"Họp","vi":"Nếu mọi người đã thống nhất ý kiến thì chúng ta có thể bắt đầu thực hiện kế hoạch.","zh":"如果大家已经达成一致，我们就可以开始执行计划。","pinyin":"Rúguǒ dàjiā yǐjīng dáchéng yízhì, wǒmen jiù kěyǐ kāishǐ zhíxíng jìhuà。"},{"stt":1508,"hsk":"HSK5","topic":"会议","subject":"Họp","vi":"Trong cuộc họp, chủ quản yêu cầu từng bộ phận báo cáo tình hình của mình.","zh":"会议上，主管要求各部门分别报告自己的情况。","pinyin":"Huìyì shàng, zhǔguǎn yāoqiú gè bùmén fēnbié bàogào zìjǐ de qíngkuàng。"},{"stt":1509,"hsk":"HSK5","topic":"会议","subject":"Họp","vi":"Sau cuộc họp, tôi sẽ tổng hợp những nội dung quan trọng và gửi cho mọi người.","zh":"会议结束以后，我会整理重要内容并发给大家。","pinyin":"Huìyì jiéshù yǐhòu, wǒ huì zhěnglǐ zhòngyào nèiróng bìng fā gěi dàjiā。"},{"stt":1510,"hsk":"HSK5","topic":"会议","subject":"Họp","vi":"Nếu có ý kiến khác, bạn có thể đưa ra trong cuộc họp để mọi người cùng thảo luận.","zh":"如果有不同意见，可以在会议上提出，让大家一起讨论。","pinyin":"Rúguǒ yǒu bùtóng yìjiàn, kěyǐ zài huìyì shàng tíchū, ràng dàjiā yìqǐ tǎolùn。"},{"stt":1511,"hsk":"HSK5","topic":"会议","subject":"Họp","vi":"Để cuộc họp đạt hiệu quả, chúng ta nên tập trung vào những vấn đề thực sự cần giải quyết.","zh":"为了提高会议效率，我们应该把重点放在真正需要解决的问题上。","pinyin":"Wèile tígāo huìyì xiàolǜ, wǒmen yīnggāi bǎ zhòngdiǎn fàng zài zhēnzhèng xūyào jiějué de wèntí shàng。"},{"stt":1512,"hsk":"HSK5","topic":"会议","subject":"Họp","vi":"Chủ quản đã yêu cầu tôi ghi lại các quyết định quan trọng được đưa ra trong cuộc họp.","zh":"主管要求我记录会议上做出的重要决定。","pinyin":"Zhǔguǎn yāoqiú wǒ jìlù huìyì shàng zuòchū de zhòngyào juédìng。"},{"stt":1513,"hsk":"HSK5","topic":"会议","subject":"Họp","vi":"Nếu nội dung cuộc họp chưa rõ, tôi sẽ xác nhận lại với người phụ trách sau cuộc họp.","zh":"如果会议内容还不清楚，我会在会后和负责人再次确认。","pinyin":"Rúguǒ huìyì nèiróng hái bù qīngchǔ, wǒ huì zài huì hòu hé fùzérén zàicì quèrèn。"},{"stt":1514,"hsk":"HSK5","topic":"会议","subject":"Họp","vi":"Chúng ta cần xác định rõ người phụ trách và thời hạn hoàn thành cho từng nhiệm vụ.","zh":"我们需要明确每项任务的负责人和完成期限。","pinyin":"Wǒmen xūyào míngquè měi xiàng rènwu de fùzérén hé wánchéng qīxiàn。"},{"stt":1515,"hsk":"HSK5","topic":"邮件","subject":"Email","vi":"Tôi đã gửi email cho bộ phận liên quan nhưng đến giờ vẫn chưa nhận được phản hồi.","zh":"我已经给相关部门发了邮件，但是到现在还没有收到回复。","pinyin":"Wǒ yǐjīng gěi xiāngguān bùmén fā le yóujiàn, dànshì dào xiànzài hái méiyǒu shōudào huífù。"},{"stt":1516,"hsk":"HSK5","topic":"邮件","subject":"Email","vi":"Trước khi gửi email cho khách hàng, cần kiểm tra kỹ nội dung và file đính kèm.","zh":"给客户发邮件之前，需要仔细检查内容和附件。","pinyin":"Gěi kèhù fā yóujiàn zhīqián, xūyào zǐxì jiǎnchá nèiróng hé fùjiàn。"},{"stt":1517,"hsk":"HSK5","topic":"邮件","subject":"Email","vi":"Nếu phát hiện gửi nhầm file, phải lập tức thông báo và gửi lại phiên bản chính xác.","zh":"如果发现文件发错了，必须立即通知并重新发送正确的版本。","pinyin":"Rúguǒ fāxiàn wénjiàn fā cuò le, bìxū lìjí tōngzhī bìng chóngxīn fāsòng zhèngquè de bǎnběn。"},{"stt":1518,"hsk":"HSK5","topic":"邮件","subject":"Email","vi":"Để người nhận dễ hiểu, tiêu đề email cần ngắn gọn nhưng phải thể hiện rõ nội dung.","zh":"为了方便收件人理解，邮件主题应该简洁，但要清楚说明内容。","pinyin":"Wèile fāngbiàn shōujiànrén lǐjiě, yóujiàn zhǔtí yīnggāi jiǎnjié, dàn yào qīngchǔ shuōmíng nèiróng。"},{"stt":1519,"hsk":"HSK5","topic":"邮件","subject":"Email","vi":"Tôi sẽ gửi lại email sau khi xác nhận toàn bộ dữ liệu trong file.","zh":"确认文件中的全部数据以后，我会重新发送邮件。","pinyin":"Quèrèn wénjiàn zhōng de quánbù shùjù yǐhòu, wǒ huì chóngxīn fāsòng yóujiàn。"},{"stt":1520,"hsk":"HSK5","topic":"邮件","subject":"Email","vi":"Nếu cần sếp phê duyệt, vui lòng ghi rõ nội dung cần ký trong email.","zh":"如果需要主管批准，请在邮件中明确说明需要签字的内容。","pinyin":"Rúguǒ xūyào zhǔguǎn pīzhǔn, qǐng zài yóujiàn zhōng míngquè shuōmíng xūyào qiānzì de nèiróng。"},{"stt":1521,"hsk":"HSK5","topic":"邮件","subject":"Email","vi":"Tôi đã nhận được email của anh và sẽ xử lý theo nội dung đã trao đổi.","zh":"我已经收到您的邮件，会按照我们讨论的内容进行处理。","pinyin":"Wǒ yǐjīng shōudào nín de yóujiàn, huì ànzhào wǒmen tǎolùn de nèiróng jìnxíng chǔlǐ。"},{"stt":1522,"hsk":"HSK5","topic":"邮件","subject":"Email","vi":"Nếu có bất kỳ vấn đề nào trong tài liệu, vui lòng phản hồi để tôi kịp thời sửa đổi.","zh":"如果文件中有任何问题，请及时反馈，以便我修改。","pinyin":"Rúguǒ wénjiàn zhōng yǒu rènhé wèntí, qǐng jíshí fǎnkuì, yǐbiàn wǒ xiūgǎi。"},{"stt":1523,"hsk":"HSK5","topic":"邮件","subject":"Email","vi":"Do thông tin khá quan trọng, tôi đã gửi email cho cả người phụ trách và chủ quản.","zh":"由于信息比较重要，我已经把邮件同时发给负责人和主管。","pinyin":"Yóuyú xìnxī bǐjiào zhòngyào, wǒ yǐjīng bǎ yóujiàn tóngshí fā gěi fùzérén hé zhǔguǎn。"},{"stt":1524,"hsk":"HSK5","topic":"邮件","subject":"Email","vi":"Sau khi gửi email, tôi sẽ tiếp tục theo dõi cho đến khi nhận được xác nhận.","zh":"发送邮件以后，我会继续跟进，直到收到确认。","pinyin":"Fāsòng yóujiàn yǐhòu, wǒ huì jìxù gēnjìn, zhídào shōudào quèrèn。"},{"stt":1525,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Nhân viên mới cần một khoảng thời gian để làm quen với môi trường và quy trình làm việc.","zh":"新员工需要一段时间来熟悉工作环境和工作流程。","pinyin":"Xīn yuángōng xūyào yí duàn shíjiān lái shúxī gōngzuò huánjìng hé gōngzuò liúchéng。"},{"stt":1526,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Trước khi cho nhân viên mới làm việc độc lập, cần xác nhận họ đã nắm rõ các yêu cầu cơ bản.","zh":"在让新员工独立工作之前，需要确认他们已经掌握基本要求。","pinyin":"Zài ràng xīn yuángōng dúlì gōngzuò zhīqián, xūyào quèrèn tāmen yǐjīng zhǎngwò jīběn yāoqiú。"},{"stt":1527,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Nếu nhân viên không hiểu rõ cách làm thì không nên tự ý thao tác để tránh gây lỗi.","zh":"如果员工不清楚操作方法，就不应该擅自操作，以免造成错误。","pinyin":"Rúguǒ yuángōng bù qīngchǔ cāozuò fāngfǎ, jiù bù yīnggāi shànzì cāozuò, yǐmiǎn zàochéng cuòwù。"},{"stt":1528,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Một nhân viên có trách nhiệm không chỉ hoàn thành công việc mà còn phải chủ động phát hiện vấn đề.","zh":"一个有责任心的员工不仅要完成工作，还要主动发现问题。","pinyin":"Yí ge yǒu zérènxīn de yuángōng bùjǐn yào wánchéng gōngzuò, hái yào zhǔdòng fāxiàn wèntí。"},{"stt":1529,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Nếu gặp khó khăn trong công việc, hãy báo cáo sớm thay vì đợi đến khi vấn đề trở nên nghiêm trọng.","zh":"如果工作中遇到困难，要尽早报告，而不是等问题变得严重以后再说。","pinyin":"Rúguǒ gōngzuò zhōng yùdào kùnnan, yào jǐnzǎo bàogào, ér bú shì děng wèntí biàn de yánzhòng yǐhòu zài shuō。"},{"stt":1530,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Để nâng cao năng lực của nhân viên, công ty sẽ tổ chức đào tạo định kỳ.","zh":"为了提高员工的能力，公司会定期组织培训。","pinyin":"Wèile tígāo yuángōng de nénglì, gōngsī huì dìngqī zǔzhī péixùn。"},{"stt":1531,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Đào tạo chỉ có hiệu quả khi nhân viên thực sự áp dụng những gì đã học vào công việc.","zh":"培训只有在员工真正把所学内容应用到工作中时才有效。","pinyin":"Péixùn zhǐyǒu zài yuángōng zhēnzhèng bǎ suǒxué nèiróng yìngyòng dào gōngzuò zhōng shí cái yǒuxiào。"},{"stt":1532,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Nếu nhân viên liên tục mắc cùng một lỗi, người phụ trách cần tìm hiểu nguyên nhân thay vì chỉ nhắc nhở.","zh":"如果员工不断犯同样的错误，负责人应该了解原因，而不是只进行提醒。","pinyin":"Rúguǒ yuángōng búduàn fàn tóngyàng de cuòwù, fùzérén yīnggāi liǎojiě yuányīn, ér bú shì zhǐ jìnxíng tíxǐng。"},{"stt":1533,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Chúng tôi đang đánh giá hiệu quả công việc của nhân viên dựa trên kết quả và thái độ làm việc.","zh":"我们正在根据员工的工作结果和工作态度评估工作表现。","pinyin":"Wǒmen zhèngzài gēnjù yuángōng de gōngzuò jiéguǒ hé gōngzuò tàidù pínggū gōngzuò biǎoxiàn。"},{"stt":1534,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Không phải cứ làm việc nhiều giờ thì hiệu quả công việc sẽ cao.","zh":"并不是工作时间越长，工作效率就越高。","pinyin":"Bìng bú shì gōngzuò shíjiān yuè cháng, gōngzuò xiàolǜ jiù yuè gāo。"},{"stt":1535,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Nhân viên cần biết sắp xếp thứ tự ưu tiên để xử lý những công việc quan trọng trước.","zh":"员工需要懂得安排优先顺序，先处理重要的工作。","pinyin":"Yuángōng xūyào dǒngde ānpái yōuxiān shùnxù, xiān chǔlǐ zhòngyào de gōngzuò。"},{"stt":1536,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Nếu có nhiều nhiệm vụ cùng lúc, hãy xác nhận thời hạn của từng nhiệm vụ trước khi sắp xếp.","zh":"如果同时有很多任务，应该先确认每项任务的期限，再进行安排。","pinyin":"Rúguǒ tóngshí yǒu hěn duō rènwu, yīnggāi xiān quèrèn měi xiàng rènwu de qīxiàn, zài jìnxíng ānpái。"},{"stt":1537,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Người có kinh nghiệm có thể hỗ trợ nhân viên mới trong những tình huống khó xử lý.","zh":"有经验的人可以在遇到难以处理的情况时帮助新员工。","pinyin":"Yǒu jīngyàn de rén kěyǐ zài yùdào nányǐ chǔlǐ de qíngkuàng shí bāngzhù xīn yuángōng。"},{"stt":1538,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Để tránh hiểu nhầm, yêu cầu công việc cần được truyền đạt rõ ràng ngay từ đầu.","zh":"为了避免误解，工作要求一开始就需要说明清楚。","pinyin":"Wèile bìmiǎn wùjiě, gōngzuò yāoqiú yì kāishǐ jiù xūyào shuōmíng qīngchǔ。"},{"stt":1539,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Nếu nhân viên có đề xuất cải thiện hợp lý, quản lý nên xem xét nghiêm túc.","zh":"如果员工提出合理的改善建议，管理人员应该认真考虑。","pinyin":"Rúguǒ yuángōng tíchū hélǐ de gǎishàn jiànyì, guǎnlǐ rényuán yīnggāi rènzhēn kǎolǜ。"},{"stt":1540,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Công việc càng gấp thì càng cần kiểm tra kỹ để tránh vì vội mà mắc sai sót.","zh":"工作越紧急，就越需要仔细检查，以免因为着急而出现错误。","pinyin":"Gōngzuò yuè jǐnjí, jiù yuè xūyào zǐxì jiǎnchá, yǐmiǎn yīnwèi zháojí ér chūxiàn cuòwù。"},{"stt":1541,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Mỗi nhân viên đều cần chịu trách nhiệm với phần việc của mình và phối hợp với đồng nghiệp.","zh":"每个员工都需要对自己的工作负责，并与同事互相配合。","pinyin":"Měi ge yuángōng dōu xūyào duì zìjǐ de gōngzuò fùzé, bìng yǔ tóngshì hùxiāng pèihé。"},{"stt":1542,"hsk":"HSK5","topic":"员工","subject":"Nhân viên","vi":"Nếu phát hiện đồng nghiệp thao tác sai, bạn nên nhắc nhở một cách phù hợp thay vì bỏ qua.","zh":"如果发现同事操作错误，应该适当地提醒，而不是直接忽略。","pinyin":"Rúguǒ fāxiàn tóngshì cāozuò cuòwù, yīnggāi shìdàng de tíxǐng, ér bú shì zhíjiē hūlüè。"},{"stt":1543,"hsk":"HSK5","topic":"加班","subject":"Tăng ca","vi":"Do đơn hàng gấp nên tuần này bộ phận sản xuất có thể phải tăng ca nhiều hơn bình thường.","zh":"由于订单比较紧急，所以生产部门这周可能需要比平时加更多的班。","pinyin":"Yóuyú dìngdān bǐjiào jǐnjí, suǒyǐ shēngchǎn bùmén zhè zhōu kěnéng xūyào bǐ píngshí jiā gèng duō de bān。"},{"stt":1544,"hsk":"HSK5","topic":"加班","subject":"Tăng ca","vi":"Mặc dù hôm nay phải tăng ca nhưng tôi sẽ cố gắng hoàn thành công việc trước thời gian quy định.","zh":"虽然今天需要加班，但是我会尽量在规定时间以前完成工作。","pinyin":"Suīrán jīntiān xūyào jiābān, dànshì wǒ huì jǐnliàng zài guīdìng shíjiān yǐqián wánchéng gōngzuò。"},{"stt":1545,"hsk":"HSK5","topic":"加班","subject":"Tăng ca","vi":"Nếu có thay đổi về thời gian tăng ca, vui lòng thông báo sớm để nhân viên có thể sắp xếp.","zh":"如果加班时间有变化，请提前通知，以便员工安排。","pinyin":"Rúguǒ jiābān shíjiān yǒu biànhuà, qǐng tíqián tōngzhī, yǐbiàn yuángōng ānpái。"},{"stt":1546,"hsk":"HSK5","topic":"加班","subject":"Tăng ca","vi":"Chúng ta không nên chỉ dựa vào tăng ca để giải quyết vấn đề tiến độ sản xuất.","zh":"我们不应该只依靠加班来解决生产进度的问题。","pinyin":"Wǒmen bù yīnggāi zhǐ yǐkào jiābān lái jiějué shēngchǎn jìndù de wèntí。"},{"stt":1547,"hsk":"HSK5","topic":"加班","subject":"Tăng ca","vi":"Nếu kế hoạch được sắp xếp hợp lý ngay từ đầu thì có thể giảm tình trạng tăng ca đột xuất.","zh":"如果一开始就合理安排计划，就可以减少临时加班的情况。","pinyin":"Rúguǒ yì kāishǐ jiù hélǐ ānpái jìhuà, jiù kěyǐ jiǎnshǎo línshí jiābān de qíngkuàng。"},{"stt":1548,"hsk":"HSK5","topic":"加班","subject":"Tăng ca","vi":"Tôi đã xác nhận với chủ quản rằng hôm nay mình có thể ở lại tăng ca.","zh":"我已经和主管确认过了，今天可以留下来加班。","pinyin":"Wǒ yǐjīng hé zhǔguǎn quèrèn guò le, jīntiān kěyǐ liú xiàlái jiābān。"},{"stt":1549,"hsk":"HSK5","topic":"加班","subject":"Tăng ca","vi":"Nếu không cần thiết thì chúng ta nên tránh yêu cầu nhân viên tăng ca quá thường xuyên.","zh":"如果没有必要，我们应该避免经常要求员工加班。","pinyin":"Rúguǒ méiyǒu bìyào, wǒmen yīnggāi bìmiǎn jīngcháng yāoqiú yuángōng jiābān。"},{"stt":1550,"hsk":"HSK5","topic":"加班","subject":"Tăng ca","vi":"Dù phải tăng ca, chúng ta vẫn cần đảm bảo nhân viên có đủ thời gian nghỉ ngơi.","zh":"即使需要加班，我们也要确保员工有足够的休息时间。","pinyin":"Jíshǐ xūyào jiābān, wǒmen yě yào quèbǎo yuángōng yǒu zúgòu de xiūxi shíjiān。"},{"stt":1551,"hsk":"HSK5","topic":"Xuất nhập khẩu","subject":"Chứng từ","vi":"Nhân viên xuất nhập khẩu cần kiểm tra kỹ toàn bộ chứng từ trước khi gửi cho khách hàng để tránh ảnh hưởng đến tiến độ giao hàng。","zh":"进出口人员在把所有单据发送给客户之前，需要仔细检查，以免影响交货进度。","pinyin":"Jìnchūkǒu rényuán zài bǎ suǒyǒu dānjù fāsòng gěi kèhù zhīqián, xūyào zǐxì jiǎnchá, yǐmiǎn yǐngxiǎng jiāohuò jìndù。"},{"stt":1552,"hsk":"HSK5","topic":"Xuất nhập khẩu","subject":"Đơn hàng","vi":"Trước khi sắp xếp xuất hàng, chúng ta cần xác nhận lại số lượng, quy cách và thời gian giao hàng với khách hàng。","zh":"在安排出货之前，我们需要再次跟客户确认数量、规格以及交货时间。","pinyin":"Zài ānpái chūhuò zhīqián, wǒmen xūyào zàicì gēn kèhù quèrèn shùliàng、guīgé yǐjí jiāohuò shíjiān。"},{"stt":1553,"hsk":"HSK5","topic":"Xuất nhập khẩu","subject":"Hải quan","vi":"Nếu chứng từ hải quan có vấn đề, hàng hóa có thể bị giữ lại, từ đó ảnh hưởng trực tiếp đến thời gian giao hàng。","zh":"如果报关资料有问题，货物可能会被扣留，从而直接影响交货时间。","pinyin":"Rúguǒ bàoguān zīliào yǒu wèntí, huòwù kěnéng huì bèi kòuliú, cóng'ér zhíjiē yǐngxiǎng jiāohuò shíjiān。"},{"stt":1554,"hsk":"HSK5","topic":"Xuất nhập khẩu","subject":"Vận chuyển","vi":"Do tình hình vận chuyển gần đây không ổn định, bộ phận xuất nhập khẩu cần theo dõi lịch tàu thường xuyên và kịp thời cập nhật cho khách hàng。","zh":"由于最近运输情况不太稳定，进出口部门需要经常跟进船期，并及时向客户更新信息。","pinyin":"Yóuyú zuìjìn yùnshū qíngkuàng bú tài wěndìng, jìnchūkǒu bùmén xūyào jīngcháng gēnjìn chuánqī, bìng jíshí xiàng kèhù gēngxīn xìnxī。"},{"stt":1555,"hsk":"HSK5","topic":"Xuất nhập khẩu","subject":"Invoice","vi":"Trước khi phát hành hóa đơn, cần kiểm tra thông tin khách hàng và giá trị đơn hàng để đảm bảo không có sai sót。","zh":"在开具发票之前，需要核对客户资料和订单金额，以确保没有错误。","pinyin":"Zài kāijù fāpiào zhīqián, xūyào héduì kèhù zīliào hé dìngdān jīn'é, yǐ quèbǎo méiyǒu cuòwù。"},{"stt":1556,"hsk":"HSK5","topic":"Xuất nhập khẩu","subject":"Đóng gói","vi":"Nếu cách đóng gói không đáp ứng yêu cầu của khách hàng, dù hàng hóa không có vấn đề cũng có thể bị từ chối nhận hàng。","zh":"如果包装方式不符合客户要求，即使货物本身没有问题，也可能会被客户拒收。","pinyin":"Rúguǒ bāozhuāng fāngshì bù fúhé kèhù yāoqiú, jíshǐ huòwù běnshēn méiyǒu wèntí, yě kěnéng huì bèi kèhù jùshōu。"},{"stt":1557,"hsk":"HSK5","topic":"Xuất nhập khẩu","subject":"Ngày giao hàng","vi":"Khách hàng yêu cầu giao hàng sớm hơn dự kiến, vì vậy chúng ta cần kiểm tra lại năng lực sản xuất và lịch vận chuyển。","zh":"客户要求提前交货，因此我们需要重新确认生产能力和运输安排。","pinyin":"Kèhù yāoqiú tíqián jiāohuò, yīncǐ wǒmen xūyào chóngxīn quèrèn shēngchǎn nénglì hé yùnshū ānpái。"},{"stt":1558,"hsk":"HSK5","topic":"Xuất nhập khẩu","subject":"Theo dõi đơn hàng","vi":"Sau khi hàng được xuất kho, nhân viên cần tiếp tục theo dõi tình trạng vận chuyển và chủ động xử lý nếu phát sinh bất thường。","zh":"货物出库以后，工作人员还需要继续跟进运输情况，如果出现异常，要主动进行处理。","pinyin":"Huòwù chūkù yǐhòu, gōngzuò rényuán hái xūyào jìxù gēnjìn yùnshū qíngkuàng, rúguǒ chūxiàn yìcháng, yào zhǔdòng jìnxíng chǔlǐ。"},{"stt":1559,"hsk":"HSK5","topic":"Xuất nhập khẩu","subject":"Chứng từ","vi":"Nếu phát hiện thông tin trên chứng từ không khớp với thực tế hàng hóa, phải xác nhận nguyên nhân trước khi tiếp tục làm thủ tục。","zh":"如果发现单据上的信息与实际货物不一致，必须先确认原因，然后再继续办理手续。","pinyin":"Rúguǒ fāxiàn dānjù shàng de xìnxī yǔ shíjì huòwù bù yízhì, bìxū xiān quèrèn yuányīn, ránhòu zài jìxù bànlǐ shǒuxù。"},{"stt":1560,"hsk":"HSK5","topic":"Xuất nhập khẩu","subject":"Giao hàng","vi":"Để đảm bảo hàng được giao đúng hạn, bộ phận xuất nhập khẩu cần phối hợp chặt chẽ với kho, sản xuất và đơn vị vận chuyển。","zh":"为了确保货物按时交付，进出口部门需要与仓库、生产部门以及运输公司密切配合。","pinyin":"Wèile quèbǎo huòwù ànshí jiāofù, jìnchūkǒu bùmén xūyào yǔ cāngkù、shēngchǎn bùmén yǐjí yùnshū gōngsī mìqiè pèihé。"},{"stt":1562,"hsk":"HSK5","topic":"Nhân sự","subject":"Tuyển dụng","vi":"Trước khi tuyển dụng nhân viên mới, bộ phận nhân sự cần xác nhận rõ yêu cầu của vị trí và tiêu chuẩn tuyển dụng。","zh":"在招聘新员工之前，人事部门需要确认职位要求以及招聘标准。","pinyin":"Zài zhāopìn xīn yuángōng zhīqián, rénshì bùmén xūyào quèrèn zhíwèi yāoqiú yǐjí zhāopìn biāozhǔn。"},{"stt":1563,"hsk":"HSK5","topic":"Nhân sự","subject":"Phỏng vấn","vi":"Sau khi nhận được hồ sơ ứng viên, nhân sự cần sàng lọc trước rồi mới sắp xếp lịch phỏng vấn phù hợp。","zh":"收到应聘者的简历以后，人事需要先进行筛选，然后再安排合适的面试时间。","pinyin":"Shōudào yìngpìnzhě de jiǎnlì yǐhòu, rénshì xūyào xiān jìnxíng shāixuǎn, ránhòu zài ānpái héshì de miànshì shíjiān。"},{"stt":1564,"hsk":"HSK5","topic":"Nhân sự","subject":"Hồ sơ","vi":"Trước khi nhân viên chính thức nhận việc, nhân sự cần kiểm tra đầy đủ hồ sơ và hoàn thành các thủ tục liên quan。","zh":"员工正式入职之前，人事需要检查完整的资料，并完成相关手续。","pinyin":"Yuángōng zhèngshì rùzhí zhīqián, rénshì xūyào jiǎnchá wánzhěng de zīliào, bìng wánchéng xiāngguān shǒuxù。"},{"stt":1565,"hsk":"HSK5","topic":"Nhân sự","subject":"Chấm công","vi":"Nếu phát hiện dữ liệu chấm công có sai sót, nhân viên cần báo cho bộ phận nhân sự để kiểm tra và điều chỉnh kịp thời。","zh":"如果发现考勤记录有错误，员工需要及时通知人事部门进行检查和调整。","pinyin":"Rúguǒ fāxiàn kǎoqín jìlù yǒu cuòwù, yuángōng xūyào jíshí tōngzhī rénshì bùmén jìnxíng jiǎnchá hé tiáozhěng。"},{"stt":1566,"hsk":"HSK5","topic":"Nhân sự","subject":"Nghỉ phép","vi":"Trước khi nghỉ phép, nhân viên cần gửi đơn xin phép và được cấp quản lý phê duyệt theo quy định。","zh":"员工请假之前，需要提交请假申请，并按照规定获得主管批准。","pinyin":"Yuángōng qǐngjià zhīqián, xūyào tíjiāo qǐngjià shēnqǐng, bìng ànzhào guīdìng huòdé zhǔguǎn pīzhǔn。"},{"stt":1567,"hsk":"HSK5","topic":"Nhân sự","subject":"Tăng ca","vi":"Nếu cần tăng ca để hoàn thành công việc, nhân viên phải đăng ký trước và chỉ được tăng ca sau khi được phê duyệt。","zh":"如果需要加班完成工作，员工必须提前申请，获得批准以后才能加班。","pinyin":"Rúguǒ xūyào jiābān wánchéng gōngzuò, yuángōng bìxū tíqián shēnqǐng, huòdé pīzhǔn yǐhòu cái néng jiābān。"},{"stt":1568,"hsk":"HSK5","topic":"Nhân sự","subject":"Hợp đồng lao động","vi":"Trước khi ký hợp đồng lao động, nhân viên cần đọc kỹ nội dung và xác nhận các điều khoản liên quan。","zh":"在签订劳动合同之前，员工需要仔细阅读内容，并确认相关条款。","pinyin":"Zài qiāndìng láodòng hétóng zhīqián, yuángōng xūyào zǐxì yuèdú nèiróng, bìng quèrèn xiāngguān tiáokuǎn。"},{"stt":1569,"hsk":"HSK5","topic":"Nhân sự","subject":"Đào tạo","vi":"Bộ phận nhân sự cần sắp xếp đào tạo cho nhân viên mới để họ có thể nhanh chóng hiểu được quy định của công ty。","zh":"人事部门需要为新员工安排培训，让他们能够尽快了解公司的相关规定。","pinyin":"Rénshì bùmén xūyào wèi xīn yuángōng ānpái péixùn, ràng tāmen nénggòu jǐnkuài liǎojiě gōngsī de xiāngguān guīdìng。"},{"stt":1570,"hsk":"HSK5","topic":"Nhân sự","subject":"Đánh giá","vi":"Việc đánh giá nhân viên cần dựa trên kết quả công việc thực tế, thái độ làm việc và khả năng phối hợp。","zh":"员工的评价应该根据实际工作成果、工作态度以及配合能力来进行。","pinyin":"Yuángōng de píngjià yīnggāi gēnjù shíjì gōngzuò chéngguǒ、gōngzuò tàidù yǐjí pèihé nénglì lái jìnxíng。"},{"stt":1571,"hsk":"HSK5","topic":"Nhân sự","subject":"Quy định","vi":"Nếu nhân viên vi phạm quy định của công ty, nhân sự cần xác nhận tình hình trước khi đưa ra phương án xử lý。","zh":"如果员工违反公司的规定，人事需要先确认具体情况，然后再决定处理方式。","pinyin":"Rúguǒ yuángōng wéifǎn gōngsī de guīdìng, rénshì xūyào xiān quèrèn jùtǐ qíngkuàng, ránhòu zài juédìng chǔlǐ fāngshì。"},{"stt":1572,"hsk":"HSK5","topic":"Thu mua","subject":"Báo giá","vi":"Trước khi đặt hàng, bộ phận thu mua cần so sánh báo giá của nhiều nhà cung cấp và xác nhận điều kiện mua hàng。","zh":"下订单之前，采购部门需要比较多家供应商的报价，并确认采购条件。","pinyin":"Xià dìngdān zhīqián, cǎigòu bùmén xūyào bǐjiào duō jiā gōngyìngshāng de bàojià, bìng quèrèn cǎigòu tiáojiàn。"},{"stt":1573,"hsk":"HSK5","topic":"Thu mua","subject":"Nhà cung cấp","vi":"Nếu nhà cung cấp không thể giao hàng đúng thời gian, thu mua cần báo cho kế hoạch để kịp thời điều chỉnh。","zh":"如果供应商无法按时交货，采购需要及时通知计划部门进行调整。","pinyin":"Rúguǒ gōngyìngshāng wúfǎ ànshí jiāohuò, cǎigòu xūyào jíshí tōngzhī jìhuà bùmén jìnxíng tiáozhěng。"},{"stt":1574,"hsk":"HSK5","topic":"Thu mua","subject":"Đặt hàng","vi":"Trước khi gửi đơn đặt hàng cho nhà cung cấp, cần kiểm tra lại mã hàng, số lượng, đơn giá và ngày giao hàng。","zh":"在把采购订单发送给供应商之前，需要重新确认料号、数量、单价以及交货日期。","pinyin":"Zài bǎ cǎigòu dìngdān fāsòng gěi gōngyìngshāng zhīqián, xūyào chóngxīn quèrèn liàohào、shùliàng、dānjià yǐjí jiāohuò rìqī。"},{"stt":1575,"hsk":"HSK5","topic":"Thu mua","subject":"Nguyên vật liệu","vi":"Nếu nguyên vật liệu không đạt yêu cầu chất lượng, thu mua cần phối hợp với nhà cung cấp để xử lý và cải thiện。","zh":"如果原材料不符合质量要求，采购需要与供应商配合处理并进行改善。","pinyin":"Rúguǒ yuáncáiliào bù fúhé zhìliàng yāoqiú, cǎigòu xūyào yǔ gōngyìngshāng pèihé chǔlǐ bìng jìnxíng gǎishàn。"},{"stt":1576,"hsk":"HSK5","topic":"Thu mua","subject":"Giá cả","vi":"Mặc dù giá của nhà cung cấp này thấp hơn, nhưng chúng ta vẫn cần xem xét chất lượng và thời gian giao hàng。","zh":"虽然这家供应商的价格比较低，但是我们还需要考虑质量和交货时间。","pinyin":"Suīrán zhè jiā gōngyìngshāng de jiàgé bǐjiào dī, dànshì wǒmen hái xūyào kǎolǜ zhìliàng hé jiāohuò shíjiān。"},{"stt":1577,"hsk":"HSK5","topic":"Thu mua","subject":"Thanh toán","vi":"Sau khi xác nhận hàng hóa đã được giao đầy đủ, thu mua cần phối hợp với tài chính để xử lý thủ tục thanh toán。","zh":"确认货物已经全部交付以后，采购需要配合财务部门办理付款手续。","pinyin":"Quèrèn huòwù yǐjīng quánbù jiāofù yǐhòu, cǎigòu xūyào pèihé cáiwù bùmén bànlǐ fùkuǎn shǒuxù。"},{"stt":1578,"hsk":"HSK5","topic":"Thu mua","subject":"Đánh giá nhà cung cấp","vi":"Chúng ta cần thường xuyên đánh giá nhà cung cấp dựa trên chất lượng, giá cả và khả năng giao hàng。","zh":"我们需要定期根据质量、价格以及交货能力对供应商进行评价。","pinyin":"Wǒmen xūyào dìngqī gēnjù zhìliàng、jiàgé yǐjí jiāohuò nénglì duì gōngyìngshāng jìnxíng píngjià。"},{"stt":1579,"hsk":"HSK5","topic":"Thu mua","subject":"Hợp đồng","vi":"Nếu điều khoản trong hợp đồng có điểm chưa rõ ràng, cần trao đổi với nhà cung cấp trước khi ký chính thức。","zh":"如果合同中的条款有不明确的地方，需要在正式签订之前与供应商进行沟通。","pinyin":"Rúguǒ hétóng zhōng de tiáokuǎn yǒu bù míngquè de dìfāng, xūyào zài zhèngshì qiāndìng zhīqián yǔ gōngyìngshāng jìnxíng gōutōng。"},{"stt":1580,"hsk":"HSK5","topic":"Thu mua","subject":"Chi phí","vi":"Để kiểm soát chi phí mua hàng, bộ phận thu mua cần tìm nhà cung cấp phù hợp mà vẫn đảm bảo chất lượng。","zh":"为了控制采购成本，采购部门需要寻找合适的供应商，同时保证产品质量。","pinyin":"Wèile kòngzhì cǎigòu chéngběn, cǎigòu bùmén xūyào xúnzhǎo héshì de gōngyìngshāng, tóngshí bǎozhèng chǎnpǐn zhìliàng。"},{"stt":1581,"hsk":"HSK5","topic":"Thu mua","subject":"Thiếu hàng","vi":"Nếu phát hiện nguyên vật liệu sắp hết nhưng chưa có đơn hàng mới, thu mua cần lập tức xác nhận thời gian giao hàng với nhà cung cấp。","zh":"如果发现原材料快要用完，但是新的订单还没有下达，采购需要立即确认供应商的交货时间。","pinyin":"Rúguǒ fāxiàn yuáncáiliào kuài yào yòng wán, dànshì xīn de dìngdān hái méiyǒu xiàdá, cǎigòu xūyào lìjí quèrèn gōngyìngshāng de jiāohuò shíjiān。"},{"stt":1583,"hsk":"HSK5","topic":"Kế hoạch","subject":"Kế hoạch sản xuất","vi":"Dựa trên đơn hàng của khách hàng và năng lực sản xuất hiện tại, bộ phận kế hoạch cần lập kế hoạch sản xuất hợp lý。","zh":"根据客户订单和目前的生产能力，计划部门需要制定合理的生产计划。","pinyin":"Gēnjù kèhù dìngdān hé mùqián de shēngchǎn nénglì, jìhuà bùmén xūyào zhìdìng hélǐ de shēngchǎn jìhuà。"},{"stt":1584,"hsk":"HSK5","topic":"Kế hoạch","subject":"Tiến độ","vi":"Nếu tiến độ sản xuất chậm hơn kế hoạch, bộ phận kế hoạch cần xác nhận nguyên nhân và điều chỉnh lịch sản xuất。","zh":"如果生产进度比计划慢，计划部门需要确认原因，并调整生产安排。","pinyin":"Rúguǒ shēngchǎn jìndù bǐ jìhuà màn, jìhuà bùmén xūyào quèrèn yuányīn, bìng tiáozhěng shēngchǎn ānpái。"},{"stt":1585,"hsk":"HSK5","topic":"Kế hoạch","subject":"Đơn hàng","vi":"Khi có đơn hàng mới, kế hoạch cần kiểm tra thời gian giao hàng và năng lực sản xuất trước khi đưa ra lịch sản xuất。","zh":"收到新订单以后，计划需要先确认交期和生产能力，然后再制定生产安排。","pinyin":"Shōudào xīn dìngdān yǐhòu, jìhuà xūyào xiān quèrèn jiāoqī hé shēngchǎn nénglì, ránhòu zài zhìdìng shēngchǎn ānpái。"},{"stt":1586,"hsk":"HSK5","topic":"Kế hoạch","subject":"Thiếu nguyên liệu","vi":"Nếu nguyên liệu chưa được nhập kho đúng thời gian, kế hoạch phải điều chỉnh lịch sản xuất để tránh ảnh hưởng đến đơn hàng。","zh":"如果原材料没有按时入库，计划必须调整生产安排，以避免影响订单。","pinyin":"Rúguǒ yuáncáiliào méiyǒu ànshí rùkù, jìhuà bìxū tiáozhěng shēngchǎn ānpái, yǐ bìmiǎn yǐngxiǎng dìngdān。"},{"stt":1587,"hsk":"HSK5","topic":"Kế hoạch","subject":"Phối hợp","vi":"Bộ phận kế hoạch cần thường xuyên trao đổi với sản xuất, thu mua và kho để đảm bảo kế hoạch được thực hiện thuận lợi。","zh":"计划部门需要经常与生产、采购和仓库沟通，以确保计划能够顺利执行。","pinyin":"Jìhuà bùmén xūyào jīngcháng yǔ shēngchǎn、cǎigòu hé cāngkù gōutōng, yǐ quèbǎo jìhuà nénggòu shùnlì zhíxíng。"},{"stt":1588,"hsk":"HSK5","topic":"Kế hoạch","subject":"Điều chỉnh","vi":"Nếu khách hàng thay đổi số lượng hoặc thời gian giao hàng, kế hoạch cần đánh giá ảnh hưởng trước khi điều chỉnh。","zh":"如果客户更改数量或者交货时间，计划需要先评估影响，然后再进行调整。","pinyin":"Rúguǒ kèhù gēnggǎi shùliàng huòzhě jiāohuò shíjiān, jìhuà xūyào xiān pínggū yǐngxiǎng, ránhòu zài jìnxíng tiáozhěng。"},{"stt":1589,"hsk":"HSK5","topic":"Kế hoạch","subject":"Ưu tiên","vi":"Khi nhiều đơn hàng cùng cần giao trong một khoảng thời gian, kế hoạch phải sắp xếp thứ tự ưu tiên hợp lý。","zh":"当多个订单需要在同一时间段交货时，计划必须合理安排生产优先顺序。","pinyin":"Dāng duō gè dìngdān xūyào zài tóng yí shíjiānduàn jiāohuò shí, jìhuà bìxū hélǐ ānpái shēngchǎn yōuxiān shùnxù。"},{"stt":1590,"hsk":"HSK5","topic":"Kế hoạch","subject":"Năng lực sản xuất","vi":"Trước khi nhận thêm đơn hàng, cần xác nhận năng lực sản xuất hiện tại có thể đáp ứng thời gian giao hàng hay không。","zh":"在接受新订单之前，需要确认目前的生产能力是否能够满足交期要求。","pinyin":"Zài jiēshòu xīn dìngdān zhīqián, xūyào quèrèn mùqián de shēngchǎn nénglì shìfǒu nénggòu mǎnzú jiāoqī yāoqiú。"},{"stt":1591,"hsk":"HSK5","topic":"Kế hoạch","subject":"Thay đổi kế hoạch","vi":"Mọi thay đổi trong kế hoạch sản xuất cần được thông báo kịp thời cho các bộ phận liên quan để tránh thông tin không thống nhất。","zh":"生产计划中的任何变更都需要及时通知相关部门，以避免信息不一致。","pinyin":"Shēngchǎn jìhuà zhōng de rènhé biàngēng dōu xūyào jíshí tōngzhī xiāngguān bùmén, yǐ bìmiǎn xìnxī bù yízhì。"},{"stt":1592,"hsk":"HSK5","topic":"Kế hoạch","subject":"Hoàn thành","vi":"Để đảm bảo đơn hàng hoàn thành đúng thời hạn, kế hoạch cần theo dõi tiến độ mỗi ngày và kịp thời xử lý các vấn đề phát sinh。","zh":"为了确保订单按时完成，计划需要每天跟进进度，并及时处理出现的问题。","pinyin":"Wèile quèbǎo dìngdān ànshí wánchéng, jìhuà xūyào měitiān gēnjìn jìndù, bìng jíshí chǔlǐ chūxiàn de wèntí。"},{"stt":1593,"hsk":"HSK6","topic":"不仅……还……","subject":"Nhân sự","vi":"Công ty không chỉ cần tuyển người có năng lực chuyên môn mà còn phải xem xét kinh nghiệm và khả năng phối hợp của họ.","zh":"公司不仅需要招聘有专业能力的人才，还要考虑他们的工作经验和协调能力。","pinyin":"Gōngsī bùjǐn xūyào zhāopìn yǒu zhuānyè nénglì de réncái, hái yào kǎolǜ tāmen de gōngzuò jīngyàn hé xiétiáo nénglì."},{"stt":1594,"hsk":"HSK6","topic":"在……之前","subject":"Nhân sự","vi":"Trước khi sắp xếp phỏng vấn, bộ phận nhân sự cần kiểm tra kỹ hồ sơ để đảm bảo ứng viên đáp ứng yêu cầu của vị trí.","zh":"在安排面试之前，人事部门需要仔细审核简历，以确保应聘者符合职位要求。","pinyin":"Zài ānpái miànshì zhīqián, rénshì bùmén xūyào zǐxì shěnhé jiǎnlì, yǐ quèbǎo yìngpìnzhě fúhé zhíwèi yāoqiú."},{"stt":1595,"hsk":"HSK6","topic":"即使……也……","subject":"Nhân sự","vi":"Cho dù nhân viên đã có kinh nghiệm làm việc, công ty vẫn cần đào tạo họ để đảm bảo họ hiểu rõ quy định nội bộ.","zh":"即使员工已经有工作经验，公司也需要对他们进行培训，以确保他们充分了解内部规定。","pinyin":"Jíshǐ yuángōng yǐjīng yǒu gōngzuò jīngyàn, gōngsī yě xūyào duì tāmen jìnxíng péixùn, yǐ quèbǎo tāmen chōngfèn liǎojiě nèibù guīdìng."},{"stt":1596,"hsk":"HSK6","topic":"由于……因此……","subject":"Xuất nhập khẩu","vi":"Do lịch tàu gần đây thường xuyên thay đổi, vì vậy bộ phận xuất nhập khẩu cần theo dõi tình hình vận chuyển và cập nhật kịp thời cho khách hàng.","zh":"由于最近船期经常发生变化，因此进出口部门需要跟进运输情况，并及时向客户更新信息。","pinyin":"Yóuyú zuìjìn chuánqī jīngcháng fāshēng biànhuà, yīncǐ jìnchūkǒu bùmén xūyào gēnjìn yùnshū qíngkuàng, bìng jíshí xiàng kèhù gēngxīn xìnxī."},{"stt":1597,"hsk":"HSK6","topic":"如果……就……","subject":"Thu mua","vi":"Nếu nhà cung cấp không thể giao nguyên vật liệu đúng thời hạn, bộ phận thu mua phải lập tức thông báo cho bộ phận kế hoạch để điều chỉnh.","zh":"如果供应商无法按时交付原材料，采购部门就必须立即通知计划部门进行调整。","pinyin":"Rúguǒ gōngyìngshāng wúfǎ ànshí jiāofù yuáncáiliào, cǎigòu bùmén jiù bìxū lìjí tōngzhī jìhuà bùmén jìnxíng tiáozhěng."},{"stt":1598,"hsk":"HSK6","topic":"除了……以外……还……","subject":"Thu mua","vi":"Ngoài việc so sánh giá cả, bộ phận thu mua còn phải đánh giá chất lượng và khả năng giao hàng của nhà cung cấp.","zh":"除了比较价格以外，采购部门还需要评估供应商的质量和交货能力。","pinyin":"Chúle bǐjiào jiàgé yǐwài, cǎigòu bùmén hái xūyào pínggū gōngyìngshāng de zhìliàng hé jiāohuò nénglì."},{"stt":1599,"hsk":"HSK6","topic":"根据……","subject":"Kế hoạch","vi":"Bộ phận kế hoạch cần lập kế hoạch sản xuất dựa trên đơn hàng của khách hàng, tình trạng nguyên vật liệu và năng lực sản xuất hiện tại.","zh":"计划部门需要根据客户订单、物料情况以及目前的生产能力制定生产计划。","pinyin":"Jìhuà bùmén xūyào gēnjù kèhù dìngdān, wùliào qíngkuàng yǐjí mùqián de shēngchǎn nénglì zhìdìng shēngchǎn jìhuà."},{"stt":1600,"hsk":"HSK6","topic":"一旦……就……","subject":"Công xưởng","vi":"Một khi phát hiện thiết bị có dấu hiệu bất thường, nhân viên phải lập tức dừng máy và thông báo cho kỹ thuật viên kiểm tra.","zh":"一旦发现设备出现异常，员工就必须立即停机，并通知技术人员进行检查。","pinyin":"Yídàn fāxiàn shèbèi chūxiàn yìcháng, yuángōng jiù bìxū lìjí tíngjī, bìng tōngzhī jìshù rényuán jìnxíng jiǎnchá."},{"stt":1601,"hsk":"HSK6","topic":"即使……也不能
