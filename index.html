……","subject":"Công xưởng","vi":"Cho dù tiến độ sản xuất rất gấp, chúng ta cũng không thể vì chạy tiến độ mà bỏ qua yêu cầu về chất lượng.","zh":"即使生产进度非常紧张，我们也不能为了赶进度而忽略质量要求。","pinyin":"Jíshǐ shēngchǎn jìndù fēicháng jǐnzhāng, wǒmen yě bùnéng wèile gǎn jìndù ér hūlüè zhìliàng yāoqiú."},{"stt":1602,"hsk":"HSK6","topic":"为了……","subject":"Công xưởng","vi":"Để tránh ảnh hưởng đến tiến độ giao hàng, các bộ phận liên quan cần phối hợp chặt chẽ và xử lý vấn đề phát sinh kịp thời.","zh":"为了避免影响交货进度，相关部门需要密切配合，并及时处理出现的问题。","pinyin":"Wèile bìmiǎn yǐngxiǎng jiāohuò jìndù, xiāngguān bùmén xūyào mìqiè pèihé, bìng jíshí chǔlǐ chūxiàn de wèntí."},{"stt":1603,"hsk":"HSK6","topic":"根据……","subject":"Xuất nhập khẩu","vi":"Dựa trên thông tin mới nhất từ hãng tàu, thời gian tàu đến cảng có thể bị trì hoãn thêm hai ngày.","zh":"根据船公司提供的最新信息，船舶抵达港口的时间可能会再推迟两天。","pinyin":"Gēnjù chuángōngsī tígōng de zuìxīn xìnxī, chuánbó dǐdá gǎngkǒu de shíjiān kěnéng huì zài tuīchí liǎng tiān."},{"stt":1604,"hsk":"HSK6","topic":"之所以……是因为……","subject":"Xuất nhập khẩu","vi":"Sở dĩ lô hàng này chưa thể thông quan là vì thông tin trên chứng từ không khớp với dữ liệu khai báo hải quan.","zh":"这批货物之所以还不能完成清关，是因为单据上的信息与报关资料不一致。","pinyin":"Zhè pī huòwù zhīsuǒyǐ hái bù néng wánchéng qīngguān, shì yīnwèi dānjù shàng de xìnxī yǔ bàoguān zīliào bù yízhì."},{"stt":1605,"hsk":"HSK6","topic":"除了……以外，还……","subject":"Xuất nhập khẩu","vi":"Ngoài hóa đơn thương mại, chúng ta còn phải chuẩn bị packing list và chứng nhận xuất xứ cho lô hàng này.","zh":"除了商业发票以外，我们还需要为这批货物准备装箱单和原产地证明。","pinyin":"Chúle shāngyè fāpiào yǐwài, wǒmen hái xūyào wèi zhè pī huòwù zhǔnbèi zhuāngxiāngdān hé yuánchǎndì zhèngmíng."},{"stt":1606,"hsk":"HSK6","topic":"即使……也……","subject":"Xuất nhập khẩu","vi":"Cho dù khách hàng yêu cầu giao hàng gấp, chúng ta cũng không thể bỏ qua các bước kiểm tra chứng từ cần thiết.","zh":"即使客户要求紧急交货，我们也不能省略必要的单据审核程序。","pinyin":"Jíshǐ kèhù yāoqiú jǐnjí jiāohuò, wǒmen yě bùnéng shěnglüè bìyào de dānjù shěnhé chéngxù."},{"stt":1607,"hsk":"HSK6","topic":"只有……才……","subject":"Xuất nhập khẩu","vi":"Chỉ sau khi tất cả chứng từ được xác nhận chính xác thì lô hàng mới có thể tiến hành khai báo hải quan.","zh":"只有在所有单据确认无误之后，这批货物才能进行报关。","pinyin":"Zhǐyǒu zài suǒyǒu dānjù quèrèn wúwù zhīhòu, zhè pī huòwù cái néng jìnxíng bàoguān."},{"stt":1608,"hsk":"HSK6","topic":"一旦……就……","subject":"Xuất nhập khẩu","vi":"Một khi hải quan phát hiện thông tin khai báo có sai lệch, quá trình thông quan có thể bị ảnh hưởng.","zh":"一旦海关发现申报信息存在偏差，整个清关过程就可能受到影响。","pinyin":"Yídàn hǎiguān fāxiàn shēnbào xìnxī cúnzài piānchā, zhěnggè qīngguān guòchéng jiù kěnéng shòudào yǐngxiǎng."},{"stt":1609,"hsk":"HSK6","topic":"不仅……而且……","subject":"Xuất nhập khẩu","vi":"Việc chứng từ bị sai không chỉ làm chậm tiến độ giao hàng mà còn có thể phát sinh thêm chi phí.","zh":"单据出错不仅会延误交货进度，而且还可能产生额外费用。","pinyin":"Dānjù chūcuò bùjǐn huì yánwù jiāohuò jìndù, érqiě hái kěnéng chǎnshēng éwài fèiyòng."},{"stt":1610,"hsk":"HSK6","topic":"为了……","subject":"Xuất nhập khẩu","vi":"Để tránh hàng bị lưu tại cảng quá lâu, chúng ta cần hoàn tất thủ tục thông quan trước thời hạn.","zh":"为了避免货物在港口滞留太久，我们需要提前完成清关手续。","pinyin":"Wèile bìmiǎn huòwù zài gǎngkǒu zhìliú tài jiǔ, wǒmen xūyào tíqián wánchéng qīngguān shǒuxù."},{"stt":1611,"hsk":"HSK6","topic":"以免……","subject":"Xuất nhập khẩu","vi":"Vui lòng kiểm tra kỹ số container và số seal trước khi gửi chứng từ để tránh xảy ra sai sót.","zh":"请在发送单据之前仔细核对集装箱号和封条号，以免出现错误。","pinyin":"Qǐng zài fāsòng dānjù zhīqián zǐxì héduì jí zhuāngxiāng hào hé fēngtiáo hào, yǐmiǎn chūxiàn cuòwù."},{"stt":1612,"hsk":"HSK6","topic":"与其……不如……","subject":"Xuất nhập khẩu","vi":"Thay vì chờ đến khi hàng đến cảng mới xử lý chứng từ, tốt hơn là chúng ta chuẩn bị trước tất cả giấy tờ cần thiết.","zh":"与其等货物到港后再处理单据，不如提前准备好所有必要的文件。","pinyin":"Yǔqí děng huòwù dào gǎng hòu zài chǔlǐ dānjù, bùrú tíqián zhǔnbèi hǎo suǒyǒu bìyào de wénjiàn."},{"stt":1613,"hsk":"HSK6","topic":"无论……都……","subject":"Xuất nhập khẩu","vi":"Bất kể phương thức vận chuyển nào được lựa chọn, chúng ta đều phải đảm bảo hàng được giao đúng thời hạn.","zh":"无论选择哪种运输方式，我们都必须确保货物按时交付。","pinyin":"Wúlùn xuǎnzé nǎ zhǒng yùnshū fāngshì, wǒmen dōu bìxū quèbǎo huòwù ànshí jiāofù."},{"stt":1614,"hsk":"HSK6","topic":"随着……","subject":"Xuất nhập khẩu","vi":"Cùng với việc số lượng đơn hàng xuất khẩu tăng lên, khối lượng công việc của bộ phận xuất nhập khẩu cũng tăng đáng kể.","zh":"随着出口订单数量不断增加，进出口部门的工作量也明显增加了。","pinyin":"Suízhe chūkǒu dìngdān shùliàng bùduàn zēngjiā, jìnchūkǒu bùmén de gōngzuòliàng yě míngxiǎn zēngjiā le."},{"stt":1615,"hsk":"HSK6","topic":"由于……因此……","subject":"Xuất nhập khẩu","vi":"Do hãng tàu thay đổi lịch khởi hành nên thời gian giao hàng dự kiến phải điều chỉnh lại.","zh":"由于船公司更改了出航时间，因此预计交货日期也需要重新调整。","pinyin":"Yóuyú chuángōngsī gēnggǎi le chūháng shíjiān, yīncǐ yùjì jiāohuò rìqī yě xūyào chóngxīn tiáozhěng."},{"stt":1616,"hsk":"HSK6","topic":"除非……否则……","subject":"Xuất nhập khẩu","vi":"Trừ khi khách hàng xác nhận thay đổi điều kiện giao hàng, nếu không chúng ta vẫn phải thực hiện theo hợp đồng ban đầu.","zh":"除非客户确认修改贸易条件，否则我们仍然必须按照原合同执行。","pinyin":"Chúfēi kèhù quèrèn xiūgǎi màoyì tiáojiàn, fǒuzé wǒmen réngrán bìxū ànzhào yuán hétóng zhíxíng."},{"stt":1617,"hsk":"HSK6","topic":"既……又……","subject":"Xuất nhập khẩu","vi":"Phương án vận chuyển này vừa tiết kiệm chi phí vừa có thể đáp ứng thời hạn giao hàng của khách hàng.","zh":"这种运输方案既能够节省成本，又能够满足客户的交货期限。","pinyin":"Zhè zhǒng yùnshū fāng'àn jì nénggòu jiéshěng chéngběn, yòu nénggòu mǎnzú kèhù de jiāohuò qīxiàn."},{"stt":1618,"hsk":"HSK6","topic":"针对……","subject":"Xuất nhập khẩu","vi":"Đối với vấn đề chứng từ lần này, bộ phận xuất nhập khẩu đã đưa ra phương án xử lý cụ thể.","zh":"针对这次单据出现的问题，进出口部门已经提出了具体的处理方案。","pinyin":"Zhēnduì zhè cì dānjù chūxiàn de wèntí, jìnchūkǒu bùmén yǐjīng tíchū le jùtǐ de chǔlǐ fāng'àn."},{"stt":1619,"hsk":"HSK6","topic":"从而……","subject":"Xuất nhập khẩu","vi":"Chúng ta cần thống nhất thông tin giữa các bộ phận, từ đó giảm thiểu những sai sót trong quá trình khai báo.","zh":"我们需要统一各部门之间的信息，从而减少申报过程中出现的错误。","pinyin":"Wǒmen xūyào tǒngyī gè bùmén zhījiān de xìnxī, cóng'ér jiǎnshǎo shēnbào guòchéng zhōng chūxiàn de cuòwù."},{"stt":1620,"hsk":"HSK6","topic":"与此同时……","subject":"Xuất nhập khẩu","vi":"Chúng ta đang xử lý thủ tục thông quan, đồng thời liên hệ với khách hàng để xác nhận lại lịch giao hàng.","zh":"我们正在处理清关手续，与此同时，还要联系客户重新确认交货时间。","pinyin":"Wǒmen zhèngzài chǔlǐ qīngguān shǒuxù, yǔcǐ tóngshí, hái yào liánxì kèhù chóngxīn quèrèn jiāohuò shíjiān."},{"stt":1621,"hsk":"HSK6","topic":"即便……也……","subject":"Xuất nhập khẩu","vi":"Cho dù việc điều chỉnh lịch giao hàng là bất khả kháng, chúng ta vẫn cần thông báo cho khách hàng càng sớm càng tốt.","zh":"即便调整交货时间是不可避免的，我们也需要尽早通知客户。","pinyin":"Jíbiàn tiáozhěng jiāohuò shíjiān shì bùkě bìmiǎn de, wǒmen yě xūyào jǐnzǎo tōngzhī kèhù."},{"stt":1622,"hsk":"HSK6","topic":"就……而言","subject":"Xuất nhập khẩu","vi":"Xét về tiến độ giao hàng hiện tại, phương án vận chuyển đường biển vẫn là lựa chọn phù hợp nhất.","zh":"就目前的交货进度而言，海运方案仍然是最合适的选择。","pinyin":"Jiù mùqián de jiāohuò jìndù ér yán, hǎiyùn fāng'àn réngrán shì zuì héshì de xuǎnzé."},{"stt":1623,"hsk":"HSK6","topic":"不仅……还……","subject":"Nhân sự","vi":"Nhân viên mới không chỉ cần hiểu nội quy công ty mà còn phải nắm rõ quy trình công việc của bộ phận.","zh":"新员工不仅需要了解公司的规章制度，还必须熟悉本部门的工作流程。","pinyin":"Xīn yuángōng bùjǐn xūyào liǎojiě gōngsī de guīzhāng zhìdù, hái bìxū shúxī běn bùmén de gōngzuò liúchéng."},{"stt":1624,"hsk":"HSK6","topic":"之所以……是因为……","subject":"Nhân sự","vi":"Sở dĩ ứng viên này được nhận là vì ngoài khả năng tiếng Trung, cô ấy còn có kinh nghiệm làm việc trong nhà máy.","zh":"这名应聘者之所以被录用，是因为除了中文能力以外，她还具有工厂工作经验。","pinyin":"Zhè míng yìngpìnzhě zhīsuǒyǐ bèi lùyòng, shì yīnwèi chúle Zhōngwén nénglì yǐwài, tā hái jùyǒu gōngchǎng gōngzuò jīngyàn."},{"stt":1625,"hsk":"HSK6","topic":"只要……就……","subject":"Nhân sự","vi":"Chỉ cần nhân viên hoàn thành đầy đủ thủ tục bàn giao thì phòng nhân sự có thể tiến hành thủ tục nghỉ việc.","zh":"只要员工完成所有交接手续，人事部门就可以办理离职手续。","pinyin":"Zhǐyào yuángōng wánchéng suǒyǒu jiāojiē shǒuxù, rénshì bùmén jiù kěyǐ bànlǐ lízhí shǒuxù."},{"stt":1626,"hsk":"HSK6","topic":"尽管……但是……","subject":"Nhân sự","vi":"Mặc dù nhân viên này chưa có nhiều kinh nghiệm, nhưng khả năng học hỏi và thích nghi của cô ấy khá tốt.","zh":"尽管这名员工经验不足，但是她的学习能力和适应能力都比较强。","pinyin":"Jǐnguǎn zhè míng yuángōng jīngyàn bùzú, dànshì tā de xuéxí nénglì hé shìyìng nénglì dōu bǐjiào qiáng."},{"stt":1627,"hsk":"HSK6","topic":"对于……而言","subject":"Nhân sự","vi":"Đối với nhân viên mới, việc có thể nghe hiểu yêu cầu của chủ quản là điều rất quan trọng.","zh":"对于新员工而言，能够听懂主管的要求是非常重要的。","pinyin":"Duìyú xīn yuángōng ér yán, nénggòu tīngdǒng zhǔguǎn de yāoqiú shì fēicháng zhòngyào de."},{"stt":1628,"hsk":"HSK6","topic":"以免……","subject":"Nhân sự","vi":"Nhân sự cần xác nhận lại thông tin nghỉ phép với quản lý để tránh ảnh hưởng đến lịch làm việc của bộ phận.","zh":"人事需要再次与主管确认请假信息，以免影响部门的工作安排。","pinyin":"Rénshì xūyào zàicì yǔ zhǔguǎn quèrèn qǐngjià xìnxī, yǐmiǎn yǐngxiǎng bùmén de gōngzuò ānpái."},{"stt":1629,"hsk":"HSK6","topic":"与其……不如……","subject":"Nhân sự","vi":"Thay vì chỉ nhìn vào bằng cấp, công ty nên xem xét cả kinh nghiệm thực tế và khả năng xử lý vấn đề của ứng viên.","zh":"与其只看学历，不如同时考虑应聘者的实际经验和解决问题的能力。","pinyin":"Yǔqí zhǐ kàn xuélì, bùrú tóngshí kǎolǜ yìngpìnzhě de shíjì jīngyàn hé jiějué wèntí de nénglì."},{"stt":1630,"hsk":"HSK6","topic":"一旦……便……","subject":"Nhân sự","vi":"Một khi nhân viên vi phạm nghiêm trọng quy định của công ty thì công ty có quyền xử lý theo nội quy.","zh":"一旦员工严重违反公司规定，公司便有权按照规章制度进行处理。","pinyin":"Yídàn yuángōng yánzhòng wéifǎn gōngsī guīdìng, gōngsī biàn yǒu quán ànzhào guīzhāng zhìdù jìnxíng chǔlǐ."},{"stt":1631,"hsk":"HSK6","topic":"无论……都……","subject":"Nhân sự","vi":"Bất kể nhân viên làm việc ở bộ phận nào, đều phải tuân thủ quy định về chấm công.","zh":"无论员工在哪个部门工作，都必须遵守公司的考勤规定。","pinyin":"Wúlùn yuángōng zài nǎge bùmén gōngzuò, dōu bìxū zūnshǒu gōngsī de kǎoqín guīdìng."},{"stt":1632,"hsk":"HSK6","topic":"并非……而是……","subject":"Nhân sự","vi":"Lý do nhân viên này xin nghỉ không phải vì mức lương thấp mà là vì muốn tìm một công việc phù hợp hơn.","zh":"这名员工离职并非因为工资太低，而是希望寻找一份更适合自己的工作。","pinyin":"Zhè míng yuángōng lízhí bìngfēi yīnwèi gōngzī tài dī, ér shì xīwàng xúnzhǎo yí fèn gèng shìhé zìjǐ de gōngzuò."},{"stt":1633,"hsk":"HSK6","topic":"关于……","subject":"Văn phòng","vi":"Về báo cáo tháng này, tôi đã tổng hợp số liệu của tất cả các bộ phận và gửi cho anh kiểm tra.","zh":"关于本月的报告，我已经汇总了各部门的数据并发给您审核。","pinyin":"Guānyú běnyuè de bàogào, wǒ yǐjīng huìzǒng le gè bùmén de shùjù bìng fā gěi nín shěnhé."},{"stt":1634,"hsk":"HSK6","topic":"除了……之外","subject":"Văn phòng","vi":"Ngoài việc kiểm tra nội dung, chúng ta còn cần chú ý đến định dạng trước khi gửi tài liệu cho khách hàng.","zh":"除了检查内容之外，我们还需要注意格式，然后再把文件发给客户。","pinyin":"Chúle jiǎnchá nèiróng zhīwài, wǒmen hái xūyào zhùyì géshì, ránhòu zài bǎ wénjiàn fā gěi kèhù."},{"stt":1635,"hsk":"HSK6","topic":"既然……就……","subject":"Văn phòng","vi":"Nếu đã xác nhận số liệu chính xác rồi thì chúng ta có thể gửi báo cáo cho quản lý.","zh":"既然已经确认数据准确了，那我们就可以把报告发给经理。","pinyin":"Jìrán yǐjīng quèrèn shùjù zhǔnquè le, nà wǒmen jiù kěyǐ bǎ bàogào fā gěi jīnglǐ."},{"stt":1636,"hsk":"HSK6","topic":"为了……起见","subject":"Văn phòng","vi":"Để đảm bảo an toàn, chúng ta nên lưu lại một bản sao của tất cả tài liệu quan trọng.","zh":"为了安全起见，我们最好保留所有重要文件的备份。","pinyin":"Wèile ānquán qǐjiàn, wǒmen zuìhǎo bǎoliú suǒyǒu zhòngyào wénjiàn de bèifèn."},{"stt":1637,"hsk":"HSK6","topic":"倘若……","subject":"Văn phòng","vi":"Nếu khách hàng tiếp tục yêu cầu sửa đổi nội dung, chúng ta cần trao đổi lại với cấp trên trước khi thực hiện.","zh":"倘若客户继续要求修改内容，我们需要在执行之前重新与上级沟通。","pinyin":"Tǎngruò kèhù jìxù yāoqiú xiūgǎi nèiróng, wǒmen xūyào zài zhíxíng zhīqián chóngxīn yǔ shàngjí gōutōng."},{"stt":1638,"hsk":"HSK6","topic":"以便……","subject":"Văn phòng","vi":"Vui lòng ghi rõ thời gian hoàn thành dự kiến để chúng tôi tiện theo dõi tiến độ công việc.","zh":"请注明预计完成时间，以便我们跟进工作进度。","pinyin":"Qǐng zhùmíng yùjì wánchéng shíjiān, yǐbiàn wǒmen gēnjìn gōngzuò jìndù."},{"stt":1639,"hsk":"HSK6","topic":"至于……","subject":"Văn phòng","vi":"Còn vấn đề chi phí cụ thể thì chúng ta sẽ thảo luận sau khi nhận được báo giá chính thức.","zh":"至于具体费用，等收到正式报价以后我们再讨论。","pinyin":"Zhìyú jùtǐ fèiyòng, děng shōudào zhèngshì bàojià yǐhòu wǒmen zài tǎolùn."},{"stt":1640,"hsk":"HSK6","topic":"即使……也……","subject":"Văn phòng","vi":"Cho dù công việc hôm nay khá nhiều, tôi vẫn sẽ cố gắng hoàn thành báo cáo trước thời hạn.","zh":"即使今天的工作比较多，我也会尽量在规定时间之前完成报告。","pinyin":"Jíshǐ jīntiān de gōngzuò bǐjiào duō, wǒ yě huì jǐnliàng zài guīdìng shíjiān zhīqián wánchéng bàogào."},{"stt":1641,"hsk":"HSK6","topic":"据……了解","subject":"Văn phòng","vi":"Theo tôi được biết, cuộc họp chiều nay sẽ được chuyển sang phòng họp lớn.","zh":"据我了解，今天下午的会议将改到大会议室举行。","pinyin":"Jù wǒ liǎojiě, jīntiān xiàwǔ de huìyì jiāng gǎi dào dà huìyìshì jǔxíng."},{"stt":1642,"hsk":"HSK6","topic":"由……负责","subject":"Văn phòng","vi":"Việc tổng hợp số liệu của các bộ phận sẽ do tôi phụ trách, còn việc kiểm tra cuối cùng sẽ do quản lý thực hiện.","zh":"各部门数据的汇总由我负责，最后的审核则由经理进行。","pinyin":"Gè bùmén shùjù de huìzǒng yóu wǒ fùzé, zuìhòu de shěnhé zé yóu jīnglǐ jìnxíng."},{"stt":1643,"hsk":"HSK6","topic":"根据……来看","subject":"Thu mua","vi":"Xét theo báo giá hiện tại, nhà cung cấp này có lợi thế khá rõ về giá thành.","zh":"根据目前的报价来看，这家供应商在成本方面具有比较明显的优势。","pinyin":"Gēnjù mùqián de bàojià lái kàn, zhè jiā gōngyìngshāng zài chéngběn fāngmiàn jùyǒu bǐjiào míngxiǎn de yōushì."},{"stt":1644,"hsk":"HSK6","topic":"不但……反而……","subject":"Thu mua","vi":"Nhà cung cấp này không những không giảm giá mà ngược lại còn tăng giá sau khi chúng ta tăng số lượng đặt hàng.","zh":"这家供应商不但没有降价，反而在我们增加订单数量后提高了价格。","pinyin":"Zhè jiā gōngyìngshāng búdàn méiyǒu jiàngjià, fǎn'ér zài wǒmen zēngjiā dìngdān shùliàng hòu tígāo le jiàgé."},{"stt":1645,"hsk":"HSK6","topic":"只不过……而已","subject":"Thu mua","vi":"Phương án này chỉ là giải pháp tạm thời mà thôi, về lâu dài chúng ta vẫn cần tìm nhà cung cấp khác.","zh":"这个方案只不过是临时措施而已，从长远来看我们还是需要寻找其他供应商。","pinyin":"Zhège fāng'àn zhǐ bùguò shì línshí cuòshī éryǐ, cóng chángyuǎn lái kàn wǒmen háishi xūyào xúnzhǎo qítā gōngyìngshāng."},{"stt":1646,"hsk":"HSK6","topic":"只要……便……","subject":"Thu mua","vi":"Chỉ cần nhà cung cấp xác nhận thời gian giao hàng, chúng ta có thể lập tức sắp xếp kế hoạch sản xuất.","zh":"只要供应商确认交货时间，我们便可以立即安排生产计划。","pinyin":"Zhǐyào gōngyìngshāng quèrèn jiāohuò shíjiān, wǒmen biàn kěyǐ lìjí ānpái shēngchǎn jìhuà."},{"stt":1647,"hsk":"HSK6","topic":"鉴于……","subject":"Thu mua","vi":"Xét tình hình giao hàng không ổn định gần đây, chúng ta nên đánh giá lại nhà cung cấp này.","zh":"鉴于这家供应商近期交货不稳定，我们应该重新对其进行评估。","pinyin":"Jiànyú zhè jiā gōngyìngshāng jìnqī jiāohuò bù wěndìng, wǒmen yīnggāi chóngxīn duì qí jìnxíng pínggū."},{"stt":1648,"hsk":"HSK6","topic":"与此同时","subject":"Thu mua","vi":"Trong khi chờ nhà cung cấp xác nhận giá mới, bộ phận thu mua đang tìm kiếm phương án thay thế.","zh":"在等待供应商确认新价格的同时，采购部门正在寻找替代方案。","pinyin":"Zài děngdài gōngyìngshāng quèrèn xīn jiàgé de tóngshí, cǎigòu bùmén zhèngzài xúnzhǎo tìdài fāng'àn."},{"stt":1649,"hsk":"HSK6","topic":"宁可……也不……","subject":"Thu mua","vi":"Chúng ta thà chọn nhà cung cấp có giá cao hơn một chút cũng không nên vì giá rẻ mà ảnh hưởng đến chất lượng.","zh":"我们宁可选择价格稍高的供应商，也不能因为价格便宜而影响质量。","pinyin":"Wǒmen nìngkě xuǎnzé jiàgé shāo gāo de gōngyìngshāng, yě bùnéng yīnwèi jiàgé piányi ér yǐngxiǎng zhìliàng."},{"stt":1650,"hsk":"HSK6","topic":"归根结底","subject":"Thu mua","vi":"Nói cho cùng, vấn đề không nằm ở giá mua mà nằm ở việc nhà cung cấp không đảm bảo được thời gian giao hàng.","zh":"归根结底，问题不在于采购价格，而在于供应商无法保证交货时间。","pinyin":"Guīgēnjiédǐ, wèntí bù zàiyú cǎigòu jiàgé, ér zàiyú gōngyìngshāng wúfǎ bǎozhèng jiāohuò shíjiān."},{"stt":1651,"hsk":"HSK6","topic":"针对……而言","subject":"Thu mua","vi":"Đối với loại nguyên vật liệu quan trọng này, việc lựa chọn nhà cung cấp ổn định quan trọng hơn việc giảm giá.","zh":"针对这种重要原材料而言，选择稳定的供应商比降低采购价格更加重要。","pinyin":"Zhēnduì zhè zhǒng zhòngyào yuáncáiliào ér yán, xuǎnzé wěndìng de gōngyìngshāng bǐ jiàngdī cǎigòu jiàgé gèngjiā zhòngyào."},{"stt":1652,"hsk":"HSK6","topic":"从……角度来看","subject":"Thu mua","vi":"Xét từ góc độ chi phí tổng thể, phương án này chưa chắc đã có lợi hơn.","zh":"从整体成本的角度来看，这个方案未必更加有利。","pinyin":"Cóng zhěngtǐ chéngběn de jiǎodù lái kàn, zhège fāng'àn wèibì gèngjiā yǒulì."},{"stt":1653,"hsk":"HSK6","topic":"一旦……就……","subject":"Sản xuất","vi":"Một khi dây chuyền phải dừng quá lâu, tiến độ sản xuất của cả đơn hàng sẽ bị ảnh hưởng.","zh":"一旦生产线停机时间过长，整个订单的生产进度就会受到影响。","pinyin":"Yídàn shēngchǎnxiàn tíngjī shíjiān guò cháng, zhěnggè dìngdān de shēngchǎn jìndù jiù huì shòudào yǐngxiǎng."},{"stt":1654,"hsk":"HSK6","topic":"即便……仍然……","subject":"Sản xuất","vi":"Cho dù đã tăng ca, chúng ta vẫn cần kiểm soát chặt chẽ chất lượng để tránh phát sinh lỗi hàng loạt.","zh":"即便已经安排加班，我们仍然需要严格控制质量，以免出现批量不良。","pinyin":"Jíbiàn yǐjīng ānpái jiābān, wǒmen réngrán xūyào yángé kòngzhì zhìliàng, yǐmiǎn chūxiàn pīliàng bùliáng."},{"stt":1655,"hsk":"HSK6","topic":"越……越……","subject":"Sản xuất","vi":"Tiến độ càng gấp thì các bộ phận càng cần phối hợp chặt chẽ để tránh sai sót.","zh":"生产进度越紧，各部门就越需要密切配合，以避免出现错误。","pinyin":"Shēngchǎn jìndù yuè jǐn, gè bùmén jiù yuè xūyào mìqiè pèihé, yǐ bìmiǎn chūxiàn cuòwù."},{"stt":1656,"hsk":"HSK6","topic":"之所以……并不是……","subject":"Sản xuất","vi":"Sở dĩ sản lượng hôm nay giảm không phải do thiếu nhân công mà do một số thiết bị xảy ra sự cố.","zh":"今天产量下降并不是因为人员不足，而是因为部分设备出现了故障。","pinyin":"Jīntiān chǎnliàng xiàjiàng bìng bú shì yīnwèi rényuán bùzú, ér shì yīnwèi bùfèn shèbèi chūxiàn le gùzhàng."},{"stt":1657,"hsk":"HSK6","topic":"在……基础上","subject":"Sản xuất","vi":"Trên cơ sở kế hoạch hiện tại, chúng ta cần điều chỉnh sản lượng theo tình hình đơn hàng mới.","zh":"在现有生产计划的基础上，我们需要根据新的订单情况调整产量。","pinyin":"Zài xiànyǒu shēngchǎn jìhuà de jīchǔ shàng, wǒmen xūyào gēnjù xīn de dìngdān qíngkuàng tiáozhěng chǎnliàng."},{"stt":1658,"hsk":"HSK6","topic":"除非……否则……","subject":"Sản xuất","vi":"Trừ khi nguyên nhân lỗi được xác nhận rõ ràng, nếu không chuyền sản xuất không được phép tiếp tục chạy.","zh":"除非已经明确确认异常原因，否则生产线不得继续运行。","pinyin":"Chúfēi yǐjīng míngquè quèrèn yìcháng yuányīn, fǒuzé shēngchǎnxiàn bùdé jìxù yùnxíng."},{"stt":1659,"hsk":"HSK6","topic":"为了……起见","subject":"Sản xuất","vi":"Để đảm bảo an toàn, công nhân phải tắt nguồn trước khi tiến hành kiểm tra thiết bị.","zh":"为了安全起见，员工在检查设备之前必须先切断电源。","pinyin":"Wèile ānquán qǐjiàn, yuángōng zài jiǎnchá shèbèi zhīqián bìxū xiān qiēduàn diànyuán."},{"stt":1660,"hsk":"HSK6","topic":"既然……那么……","subject":"Sản xuất","vi":"Nếu đã xác nhận nguyên vật liệu có vấn đề thì chúng ta nên tạm dừng sử dụng và thông báo cho bộ phận thu mua.","zh":"既然已经确认原材料存在问题，那么我们就应该暂停使用，并通知采购部门。","pinyin":"Jìrán yǐjīng quèrèn yuáncáiliào cúnzài wèntí, nàme wǒmen jiù yīnggāi zàntíng shǐyòng, bìng tōngzhī cǎigòu bùmén."},{"stt":1661,"hsk":"HSK6","topic":"从而","subject":"Sản xuất","vi":"Cần chuẩn hóa thao tác của công nhân, từ đó giảm sự khác biệt giữa các ca sản xuất.","zh":"我们需要规范员工的操作，从而减少不同班次之间的差异。","pinyin":"Wǒmen xūyào guīfàn yuángōng de cāozuò, cóng'ér jiǎnshǎo bùtóng bāncì zhījiān de chāyì."},{"stt":1662,"hsk":"HSK6","topic":"倘若……","subject":"Sản xuất","vi":"Nếu kế hoạch sản xuất tiếp tục thay đổi, chúng ta sẽ phải điều chỉnh lại lịch tăng ca của công nhân.","zh":"倘若生产计划继续发生变化，我们就必须重新调整员工的加班安排。","pinyin":"Tǎngruò shēngchǎn jìhuà jìxù fāshēng biànhuà, wǒmen jiù bìxū chóngxīn tiáozhěng yuángōng de jiābān ānpái."},{"stt":1663,"hsk":"HSK6","topic":"针对……","subject":"QC/QA","vi":"Đối với lỗi này, bộ phận chất lượng cần xác định nguyên nhân gốc thay vì chỉ xử lý sản phẩm lỗi.","zh":"针对这个问题，质量部门需要找出根本原因，而不能只处理不良品。","pinyin":"Zhēnduì zhège wèntí, zhìliàng bùmén xūyào zhǎochū gēnběn yuányīn, ér bùnéng zhǐ chǔlǐ bùliángpǐn."},{"stt":1664,"hsk":"HSK6","topic":"不仅……还……","subject":"QC/QA","vi":"Biện pháp cải tiến không chỉ phải giải quyết lỗi hiện tại mà còn phải ngăn lỗi tương tự tái diễn.","zh":"改善措施不仅要解决目前的问题，还必须防止类似问题再次发生。","pinyin":"Gǎishàn cuòshī bùjǐn yào jiějué mùqián de wèntí, hái bìxū fángzhǐ lèisì wèntí zàicì fāshēng."},{"stt":1665,"hsk":"HSK6","topic":"即使……也……","subject":"QC/QA","vi":"Cho dù tỷ lệ lỗi hiện tại không cao, chúng ta cũng không nên xem nhẹ vấn đề này.","zh":"即使目前的不良率不高，我们也不能轻视这个问题。","pinyin":"Jíshǐ mùqián de bùliánglǜ bù gāo, wǒmen yě bùnéng qīngshì zhège wèntí."},{"stt":1666,"hsk":"HSK6","topic":"只要……便……","subject":"QC/QA","vi":"Chỉ cần phát hiện bất thường trong quá trình kiểm tra, nhân viên QC phải lập tức báo cáo cho cấp trên.","zh":"只要在检验过程中发现异常，QC人员便必须立即向上级汇报。","pinyin":"Zhǐyào zài jiǎnyàn guòchéng zhōng fāxiàn yìcháng, QC rényuán biàn bìxū lìjí xiàng shàngjí huìbào."},{"stt":1667,"hsk":"HSK6","topic":"与其……不如……","subject":"QC/QA","vi":"Thay vì chờ khách hàng khiếu nại, tốt hơn là chúng ta chủ động phát hiện và xử lý vấn đề trong nội bộ.","zh":"与其等客户投诉，不如我们主动在内部发现并处理问题。","pinyin":"Yǔqí děng kèhù tóusù, bùrú wǒmen zhǔdòng zài nèibù fāxiàn bìng chǔlǐ wèntí."},{"stt":1668,"hsk":"HSK6","topic":"无论……都……","subject":"QC/QA","vi":"Bất kể lỗi phát sinh ở công đoạn nào, chúng ta đều cần ghi chép đầy đủ để thuận tiện truy xuất sau này.","zh":"无论异常发生在哪个工序，我们都需要完整记录，以便日后追溯。","pinyin":"Wúlùn yìcháng fāshēng zài nǎge gōngxù, wǒmen dōu xūyào wánzhěng jìlù, yǐbiàn rìhòu zhuīsù."},{"stt":1669,"hsk":"HSK6","topic":"由于……导致……","subject":"QC/QA","vi":"Do nhân viên thao tác không đúng hướng dẫn nên đã dẫn đến một số sản phẩm không đạt tiêu chuẩn.","zh":"由于员工没有按照作业指导书操作，导致部分产品不符合标准。","pinyin":"Yóuyú yuángōng méiyǒu ànzhào zuòyè zhǐdǎoshū cāozuò, dǎozhì bùfèn chǎnpǐn bù fúhé biāozhǔn."},{"stt":1670,"hsk":"HSK6","topic":"在……情况下","subject":"QC/QA","vi":"Trong tình hình tỷ lệ lỗi liên tục tăng, chúng ta cần lập tức tiến hành điều tra toàn diện.","zh":"在不良率持续上升的情况下，我们需要立即展开全面调查。","pinyin":"Zài bùliánglǜ chíxù shàngshēng de qíngkuàng xià, wǒmen xūyào lìjí zhǎnkāi quánmiàn diàochá."},{"stt":1671,"hsk":"HSK6","topic":"由此可见","subject":"QC/QA","vi":"Từ đó có thể thấy rằng việc kiểm soát chất lượng tại công đoạn đầu tiên là vô cùng quan trọng.","zh":"由此可见，加强前段工序的质量控制是非常重要的。","pinyin":"Yóucǐ kějiàn, jiāqiáng qiánduàn gōngxù de zhìliàng kòngzhì shì fēicháng zhòngyào de."},{"stt":1672,"hsk":"HSK6","topic":"并非……而是……","subject":"QC/QA","vi":"Vấn đề lần này không phải do tiêu chuẩn kiểm tra quá nghiêm mà do công đoạn sản xuất không được kiểm soát tốt.","zh":"这次的问题并非因为检验标准过于严格，而是生产过程没有得到有效控制。","pinyin":"Zhè cì de wèntí bìngfēi yīnwèi jiǎnyàn biāozhǔn guòyú yángé, ér shì shēngchǎn guòchéng méiyǒu dédào yǒuxiào kòngzhì."},{"stt":1673,"hsk":"HSK6","topic":"之所以……是因为……","subject":"Audit","vi":"Sở dĩ audit lần trước phát hiện nhiều điểm không phù hợp là vì một số quy trình chưa được thực hiện đúng yêu cầu.","zh":"上次审核之所以发现多个不符合项，是因为部分流程没有按照要求执行。","pinyin":"Shàng cì shěnhé zhīsuǒyǐ fāxiàn duō ge bù fúhé xiàng, shì yīnwèi bùfèn liúchéng méiyǒu ànzhào yāoqiú zhíxíng."},{"stt":1674,"hsk":"HSK6","topic":"即使……仍然……","subject":"Audit","vi":"Cho dù auditor chưa yêu cầu cung cấp tài liệu này, chúng ta vẫn nên chuẩn bị trước.","zh":"即使审核员还没有要求提供这份资料，我们仍然应该提前准备。","pinyin":"Jíshǐ shěnhéyuán hái méiyǒu yāoqiú tígōng zhè fèn zīliào, wǒmen réngrán yīnggāi tíqián zhǔnbèi."},{"stt":1675,"hsk":"HSK6","topic":"一旦……便……","subject":"Audit","vi":"Một khi phát hiện điểm không phù hợp nghiêm trọng, bộ phận phụ trách phải lập tức đưa ra biện pháp khắc phục.","zh":"一旦发现严重的不符合项，负责部门便必须立即提出纠正措施。","pinyin":"Yídàn fāxiàn yánzhòng de bù fúhé xiàng, fùzé bùmén biàn bìxū lìjí tíchū jiūzhèng cuòshī."},{"stt":1676,"hsk":"HSK6","topic":"除了……还……","subject":"Audit","vi":"Ngoài việc chuẩn bị hồ sơ, chúng ta còn phải đảm bảo nhân viên có thể giải thích rõ quy trình làm việc.","zh":"除了准备相关文件以外，我们还必须确保员工能够清楚说明工作流程。","pinyin":"Chúle zhǔnbèi xiāngguān wénjiàn yǐwài, wǒmen hái bìxū quèbǎo yuángōng nénggòu qīngchǔ shuōmíng gōngzuò liúchéng."},{"stt":1677,"hsk":"HSK6","topic":"只有……才……","subject":"Audit","vi":"Chỉ khi có đầy đủ bằng chứng thì chúng ta mới có thể chứng minh rằng biện pháp cải tiến đã thực sự có hiệu quả.","zh":"只有具备完整的证据，我们才能证明改善措施确实有效。","pinyin":"Zhǐyǒu jùbèi wánzhěng de zhèngjù, wǒmen cái néng zhèngmíng gǎishàn cuòshī quèshí yǒuxiào."},{"stt":1678,"hsk":"HSK6","topic":"与其……不如……","subject":"Audit","vi":"Thay vì đợi đến audit mới phát hiện vấn đề, tốt hơn là các bộ phận chủ động tự kiểm tra định kỳ.","zh":"与其等到审核时才发现问题，不如各部门主动进行定期自查。","pinyin":"Yǔqí děngdào shěnhé shí cái fāxiàn wèntí, bùrú gè bùmén zhǔdòng jìnxíng dìngqī zìchá."},{"stt":1679,"hsk":"HSK6","topic":"针对……而言","subject":"Audit","vi":"Đối với những điểm không phù hợp nghiêm trọng, việc xác định nguyên nhân gốc là đặc biệt quan trọng.","zh":"针对严重的不符合项而言，找出根本原因尤其重要。","pinyin":"Zhēnduì yánzhòng de bù fúhé xiàng ér yán, zhǎochū gēnběn yuányīn yóuqí zhòngyào."},{"stt":1680,"hsk":"HSK6","topic":"与此同时","subject":"Audit","vi":"Chúng ta đang hoàn thiện hồ sơ khắc phục, đồng thời theo dõi tiến độ thực hiện của từng bộ phận.","zh":"我们正在完善整改资料，与此同时，还要跟进各部门的实施进度。","pinyin":"Wǒmen zhèngzài wánshàn zhěnggǎi zīliào, yǔcǐ tóngshí, hái yào gēnjìn gè bùmén de shíshī jìndù."},{"stt":1681,"hsk":"HSK6","topic":"从而","subject":"Audit","vi":"Công ty cần xây dựng cơ chế kiểm tra nội bộ thường xuyên, từ đó giảm nguy cơ phát sinh các điểm không phù hợp.","zh":"公司需要建立定期内部检查机制，从而降低出现不符合项的风险。","pinyin":"Gōngsī xūyào jiànlì dìngqī nèibù jiǎnchá jīzhì, cóng'ér jiàngdī chūxiàn bù fúhé xiàng de fēngxiǎn."},{"stt":1682,"hsk":"HSK6","topic":"归根结底","subject":"Audit","vi":"Nói cho cùng, mục đích của audit không chỉ là tìm lỗi mà còn là giúp công ty cải thiện hệ thống quản lý.","zh":"归根结底，审核的目的不仅是发现问题，更是帮助公司改善管理体系。","pinyin":"Guīgēnjiédǐ, shěnhé de mùdì bùjǐn shì fāxiàn wèntí, gèng shì bāngzhù gōngsī gǎishàn guǎnlǐ tǐxì."},{"stt":1683,"hsk":"HSK6","topic":"根据……","subject":"Kho","vi":"Dựa trên số liệu kiểm kê thực tế, chúng ta phát hiện số lượng tồn kho trên hệ thống có sự chênh lệch.","zh":"根据实际盘点数据，我们发现系统中的库存数量存在差异。","pinyin":"Gēnjù shíjì pándiǎn shùjù, wǒmen fāxiàn xìtǒng zhōng de kùcún shùliàng cúnzài chāyì."},{"stt":1684,"hsk":"HSK6","topic":"由于……因此……","subject":"Kho","vi":"Do một số nguyên vật liệu chưa được cập nhật kịp thời nên số liệu tồn kho trên hệ thống không chính xác.","zh":"由于部分原材料没有及时更新，因此系统中的库存数据不准确。","pinyin":"Yóuyú bùfèn yuáncáiliào méiyǒu jíshí gēngxīn, yīncǐ xìtǒng zhōng de kùcún shùjù bù zhǔnquè."},{"stt":1685,"hsk":"HSK6","topic":"只要……就……","subject":"Kho","vi":"Chỉ cần phát hiện nguyên vật liệu có vấn đề về chất lượng thì phải lập tức cách ly và đánh dấu rõ ràng.","zh":"只要发现原材料存在质量问题，就必须立即隔离并做好标识。","pinyin":"Zhǐyào fāxiàn yuáncáiliào cúnzài zhìliàng wèntí, jiù bìxū lìjí gélí bìng zuò hǎo biāoshí."},{"stt":1686,"hsk":"HSK6","topic":"以免……","subject":"Kho","vi":"Khi cấp nguyên vật liệu cho chuyền sản xuất cần kiểm tra kỹ mã hàng để tránh cấp nhầm.","zh":"向生产线发放原材料时必须仔细核对料号，以免发错材料。","pinyin":"Xiàng shēngchǎnxiàn fāfàng yuáncáiliào shí bìxū zǐxì héduì liàohào, yǐmiǎn fā cuò cáiliào."},{"stt":1687,"hsk":"HSK6","topic":"越……越……","subject":"Kho","vi":"Lượng tồn kho càng thấp thì bộ phận thu mua càng cần chủ động bổ sung nguyên vật liệu.","zh":"库存数量越低，采购部门就越需要主动补充原材料。","pinyin":"Kùcún shùliàng yuè dī, cǎigòu bùmén jiù yuè xūyào zhǔdòng bǔchōng yuáncáiliào."},{"stt":1688,"hsk":"HSK6","topic":"除非……否则……","subject":"Kho","vi":"Trừ khi bộ phận chất lượng xác nhận đạt, nếu không nguyên vật liệu này không được phép đưa vào sản xuất.","zh":"除非质量部门确认合格，否则这批材料不得投入生产。","pinyin":"Chúfēi zhìliàng bùmén quèrèn hégé, fǒuzé zhè pī cáiliào bùdé tóurù shēngchǎn."},{"stt":1689,"hsk":"HSK6","topic":"除了……以外","subject":"Kho","vi":"Ngoài việc kiểm tra số lượng, nhân viên kho còn phải kiểm tra tình trạng bao bì và nhãn mác.","zh":"除了检查数量以外，仓库人员还需要检查包装和标签的状况。","pinyin":"Chúle jiǎnchá shùliàng yǐwài, cāngkù rényuán hái xūyào jiǎnchá bāozhuāng hé biāoqiān de zhuàngkuàng."},{"stt":1690,"hsk":"HSK6","topic":"在……之前","subject":"Kho","vi":"Trước khi nhập kho, tất cả nguyên vật liệu phải được kiểm tra và xác nhận đầy đủ.","zh":"在入库之前，所有原材料都必须经过检查并完成确认。","pinyin":"Zài rùkù zhīqián, suǒyǒu yuáncáiliào dōu bìxū jīngguò jiǎnchá bìng wánchéng quèrèn."},{"stt":1691,"hsk":"HSK6","topic":"从而","subject":"Kho","vi":"Việc quản lý mã hàng thống nhất sẽ giúp giảm nhầm lẫn khi xuất nhập kho, từ đó nâng cao độ chính xác của dữ liệu.","zh":"统一管理物料编码可以减少收发货时的混乱，从而提高库存数据的准确性。","pinyin":"Tǒngyī guǎnlǐ wùliào biānmǎ kěyǐ jiǎnshǎo shōufāhuò shí de hùnluàn, cóng'ér tígāo kùcún shùjù de zhǔnquèxìng."},{"stt":1692,"hsk":"HSK6","topic":"对于……来说","subject":"Kho","vi":"Đối với những nguyên vật liệu có giá trị cao, việc kiểm soát số lượng và quyền hạn xuất kho càng quan trọng.","zh":"对于价值较高的原材料来说，数量和出库权限的控制更加重要。","pinyin":"Duìyú jiàzhí jiào gāo de yuáncáiliào lái shuō, shùliàng hé chūkù quánxiàn de kòngzhì gèngjiā zhòngyào."},{"stt":1693,"hsk":"HSK6","topic":"您的意思是……吗？","subject":"Giao tiếp công việc","vi":"Ý của anh là tôi cần xác nhận lại số liệu với các bộ phận liên quan trước khi gửi báo cáo phải không?","zh":"您的意思是，我需要先跟相关部门确认数据，然后再发送报告吗？","pinyin":"Nín de yìsi shì, wǒ xūyào xiān gēn xiāngguān bùmén quèrèn shùjù, ránhòu zài fāsòng bàogào ma?"},{"stt":1694,"hsk":"HSK6","topic":"如果……那么……","subject":"Giao tiếp công việc","vi":"Nếu khách hàng yêu cầu giao hàng sớm hơn, vậy chúng ta có cần điều chỉnh lại kế hoạch sản xuất không?","zh":"如果客户要求提前交货，那么我们需要重新调整生产计划吗？","pinyin":"Rúguǒ kèhù yāoqiú tíqián jiāohuò, nàme wǒmen xūyào chóngxīn tiáozhěng shēngchǎn jìhuà ma?"},{"stt":1695,"hsk":"HSK6","topic":"即使……也……","subject":"Giao tiếp công việc","vi":"Cho dù thời gian khá gấp, tôi cũng sẽ cố gắng hoàn thành công việc trước thời hạn anh yêu cầu.","zh":"即使时间比较紧，我也会尽量在您要求的期限之前完成工作。","pinyin":"Jíshǐ shíjiān bǐjiào jǐn, wǒ yě huì jǐnliàng zài nín yāoqiú de qīxiàn zhīqián wánchéng gōngzuò."},{"stt":1696,"hsk":"HSK6","topic":"如果方便的话……","subject":"Giao tiếp công việc","vi":"Nếu anh tiện, tôi muốn nhờ anh kiểm tra giúp bản báo cáo này trước khi tôi gửi cho khách hàng.","zh":"如果您方便的话，我想请您在我发给客户之前帮忙检查一下这份报告。","pinyin":"Rúguǒ nín fāngbiàn de huà, wǒ xiǎng qǐng nín zài wǒ fā gěi kèhù zhīqián bāngmáng jiǎnchá yíxià zhè fèn bàogào."},{"stt":1697,"hsk":"HSK6","topic":"要不……","subject":"Giao tiếp công việc","vi":"Hay là tôi gửi trước bản hiện tại cho anh xem, sau đó tiếp tục chỉnh sửa những phần còn lại?","zh":"要不我先把目前的版本发给您看看，然后再继续修改其他部分？","pinyin":"Yàobù wǒ xiān bǎ mùqián de bǎnběn fā gěi nín kànkan, ránhòu zài jìxù xiūgǎi qítā bùfen?"},{"stt":1698,"hsk":"HSK6","topic":"恐怕……","subject":"Giao tiếp công việc","vi":"E rằng hôm nay tôi không thể hoàn thành toàn bộ báo cáo vì vẫn còn một số số liệu chưa được xác nhận.","zh":"恐怕我今天无法完成整份报告，因为还有一些数据没有确认。","pinyin":"Kǒngpà wǒ jīntiān wúfǎ wánchéng zhěng fèn bàogào, yīnwèi hái yǒu yìxiē shùjù méiyǒu quèrèn."},{"stt":1699,"hsk":"HSK6","topic":"既然……那么……","subject":"Giao tiếp công việc","vi":"Nếu đã xác nhận khách hàng đồng ý với phương án này thì chúng ta có thể bắt đầu triển khai ngay.","zh":"既然已经确认客户同意这个方案，那么我们就可以立即开始执行。","pinyin":"Jìrán yǐjīng quèrèn kèhù tóngyì zhège fāng'àn, nàme wǒmen jiù kěyǐ lìjí kāishǐ zhíxíng."},{"stt":1700,"hsk":"HSK6","topic":"与其……不如……","subject":"Giao tiếp công việc","vi":"Thay vì tiếp tục tranh luận ai chịu trách nhiệm, chúng ta nên tập trung giải quyết vấn đề trước.","zh":"与其继续讨论谁应该负责，不如先集中精力解决问题。","pinyin":"Yǔqí jìxù tǎolùn shuí yīnggāi fùzé, bùrú xiān jízhōng jīnglì jiějué wèntí."},{"stt":1701,"hsk":"HSK6","topic":"我建议……","subject":"Giao tiếp công việc","vi":"Tôi đề nghị trước tiên chúng ta xác nhận nguyên nhân, sau đó mới quyết định phương án xử lý để tránh đưa ra quyết định sai.","zh":"我建议我们先确认原因，然后再决定处理方案，以免作出错误的判断。","pinyin":"Wǒ jiànyì wǒmen xiān quèrèn yuányīn, ránhòu zài juédìng chǔlǐ fāng'àn, yǐmiǎn zuòchū cuòwù de pànduàn."},{"stt":1702,"hsk":"HSK6","topic":"就……而言","subject":"Giao tiếp công việc","vi":"Xét về tiến độ hiện tại, tôi cho rằng chúng ta cần ưu tiên xử lý vấn đề này trước những công việc khác.","zh":"就目前的进度而言，我认为我们需要优先处理这个问题，再安排其他工作。","pinyin":"Jiù mùqián de jìndù ér yán, wǒ rènwéi wǒmen xūyào yōuxiān chǔlǐ zhège wèntí, zài ānpái qítā gōngzuò."},{"stt":1703,"hsk":"HSK6","topic":"根据……","subject":"ERP","vi":"Dựa trên dữ liệu trên hệ thống ERP, hiện tại số lượng tồn kho của nguyên vật liệu này không đủ để đáp ứng kế hoạch sản xuất.","zh":"根据ERP系统中的数据，目前这批原材料的库存数量不足以满足生产计划。","pinyin":"Gēnjù ERP xìtǒng zhōng de shùjù, mùqián zhè pī yuáncáiliào de kùcún shùliàng bùzú yǐ mǎnzú shēngchǎn jìhuà."},{"stt":1704,"hsk":"HSK6","topic":"之所以……是因为……","subject":"ERP","vi":"Sở dĩ đơn hàng này chưa thể tạo trên hệ thống là vì thông tin khách hàng vẫn chưa được cập nhật đầy đủ.","zh":"这张订单之所以还不能在系统中建立，是因为客户信息还没有完整更新。","pinyin":"Zhè zhāng dìngdān zhīsuǒyǐ hái bùnéng zài xìtǒng zhōng jiànlì, shì yīnwèi kèhù xìnxī hái méiyǒu wánzhěng gēngxīn."},{"stt":1705,"hsk":"HSK6","topic":"只有……才……","subject":"ERP","vi":"Chỉ sau khi đơn mua hàng được cấp trên phê duyệt thì bộ phận thu mua mới có thể tiến hành đặt hàng.","zh":"只有采购订单经过上级批准之后，采购部门才能进行订货。","pinyin":"Zhǐyǒu cǎigòu dìngdān jīngguò shàngjí pīzhǔn zhīhòu, cǎigòu bùmén cái néng jìnxíng dìnghuò."},{"stt":1706,"hsk":"HSK6","topic":"一旦……就……","subject":"ERP","vi":"Một khi nhập sai mã nguyên vật liệu trên ERP thì số liệu tồn kho và báo cáo sản xuất đều có thể bị ảnh hưởng.","zh":"一旦在ERP系统中输入错误的物料编码，库存数据和生产报告都可能受到影响。","pinyin":"Yídàn zài ERP xìtǒng zhōng shūrù cuòwù de wùliào biānmǎ, kùcún shùjù hé shēngchǎn bàogào dōu kěnéng shòudào yǐngxiǎng."},{"stt":1707,"hsk":"HSK6","topic":"除了……以外，还……","subject":"ERP","vi":"Ngoài việc nhập số lượng, nhân viên kho còn phải kiểm tra mã hàng và đơn vị tính trên hệ thống.","zh":"除了输入数量以外，仓库人员还必须核对系统中的物料编码和计量单位。","pinyin":"Chúle shūrù shùliàng yǐwài, cāngkù rényuán hái bìxū héduì xìtǒng zhōng de wùliào biānmǎ hé jìliàng dānwèi."},{"stt":1708,"hsk":"HSK6","topic":"即使……也……","subject":"ERP","vi":"Cho dù hàng đã được nhập kho thực tế, nếu chưa cập nhật trên ERP thì số liệu hệ thống vẫn không thay đổi.","zh":"即使货物已经实际入库，如果没有在ERP系统中更新，系统数据也不会发生变化。","pinyin":"Jíshǐ huòwù yǐjīng shíjì rùkù, rúguǒ méiyǒu zài ERP xìtǒng zhōng gēngxīn, xìtǒng shùjù yě bú huì fāshēng biànhuà."},{"stt":1709,"hsk":"HSK6","topic":"只要……就……","subject":"ERP","vi":"Chỉ cần phát hiện số liệu thực tế không khớp với ERP thì phải lập tức kiểm tra nguyên nhân chênh lệch.","zh":"只要发现实际数据与ERP系统不一致，就必须立即检查产生差异的原因。","pinyin":"Zhǐyào fāxiàn shíjì shùjù yǔ ERP xìtǒng bù yízhì, jiù bìxū lìjí jiǎnchá chǎnshēng chāyì de yuányīn."},{"stt":1710,"hsk":"HSK6","topic":"由于……因此……","subject":"ERP","vi":"Do hệ thống ERP chưa đồng bộ dữ liệu nên bộ phận sản xuất chưa thể lấy được kế hoạch mới nhất.","zh":"由于ERP系统的数据还没有同步，因此生产部门暂时无法获取最新的生产计划。","pinyin":"Yóuyú ERP xìtǒng de shùjù hái méiyǒu tóngbù, yīncǐ shēngchǎn bùmén zànshí wúfǎ huòqǔ zuìxīn de shēngchǎn jìhuà."},{"stt":1711,"hsk":"HSK6","topic":"为了……","subject":"ERP","vi":"Để tránh nhập sai dữ liệu, trước khi lưu thông tin cần kiểm tra lại toàn bộ nội dung.","zh":"为了避免数据录入错误，在保存信息之前需要再次检查全部内容。","pinyin":"Wèile bìmiǎn shùjù lùrù cuòwù, zài bǎocún xìnxī zhīqián xūyào zàicì jiǎnchá quánbù nèiróng."},{"stt":1712,"hsk":"HSK6","topic":"以免……","subject":"ERP","vi":"Vui lòng kiểm tra lại số lượng trước khi xác nhận để tránh ảnh hưởng đến số liệu tồn kho.","zh":"请在确认之前再次核对数量，以免影响库存数据。","pinyin":"Qǐng zài quèrèn zhīqián zàicì héduì shùliàng, yǐmiǎn yǐngxiǎng kùcún shùjù."},{"stt":1713,"hsk":"HSK6","topic":"针对……","subject":"ERP","vi":"Đối với lỗi dữ liệu lần này, chúng ta cần kiểm tra lịch sử thao tác để xác định nguyên nhân.","zh":"针对这次的数据异常，我们需要检查操作记录，以确定具体原因。","pinyin":"Zhēnduì zhè cì de shùjù yìcháng, wǒmen xūyào jiǎnchá cāozuò jìlù, yǐ quèdìng jùtǐ yuányīn."},{"stt":1714,"hsk":"HSK6","topic":"无论……都……","subject":"ERP","vi":"Bất kể bộ phận nào thực hiện thao tác, đều phải nhập dữ liệu theo đúng quy định của hệ thống.","zh":"无论哪个部门进行操作，都必须按照系统规定录入数据。","pinyin":"Wúlùn nǎge bùmén jìnxíng cāozuò, dōu bìxū ànzhào xìtǒng guīdìng lùrù shùjù."},{"stt":1715,"hsk":"HSK6","topic":"并非……而是……","subject":"ERP","vi":"Vấn đề lần này không phải do dữ liệu bị mất mà là do người dùng nhập sai mã hàng.","zh":"这次的问题并非数据丢失，而是操作人员输入了错误的物料编码。","pinyin":"Zhè cì de wèntí bìngfēi shùjù diūshī, ér shì cāozuò rényuán shūrù le cuòwù de wùliào biānmǎ."},{"stt":1716,"hsk":"HSK6","topic":"在……基础上","subject":"ERP","vi":"Trên cơ sở dữ liệu hiện có, chúng ta cần điều chỉnh lại kế hoạch mua nguyên vật liệu.","zh":"在现有数据的基础上，我们需要重新调整原材料采购计划。","pinyin":"Zài xiànyǒu shùjù de jīchǔ shàng, wǒmen xūyào chóngxīn tiáozhěng yuáncáiliào cǎigòu jìhuà."},{"stt":1717,"hsk":"HSK6","topic":"从而……","subject":"ERP","vi":"Việc thống nhất mã hàng giữa các bộ phận sẽ giúp giảm sai sót khi nhập liệu, từ đó nâng cao độ chính xác của hệ thống.","zh":"统一各部门的物料编码可以减少录入错误，从而提高系统数据的准确性。","pinyin":"Tǒngyī gè bùmén de wùliào biānmǎ kěyǐ jiǎnshǎo lùrù cuòwù, cóng'ér tígāo xìtǒng shùjù de zhǔnquèxìng."},{"stt":1718,"hsk":"HSK6","topic":"既然……就……","subject":"ERP","vi":"Nếu đã xác nhận số liệu trên ERP chính xác thì chúng ta có thể sử dụng dữ liệu đó để lập báo cáo.","zh":"既然已经确认ERP系统中的数据准确，我们就可以使用这些数据制作报告。","pinyin":"Jìrán yǐjīng quèrèn ERP xìtǒng zhōng de shùjù zhǔnquè, wǒmen jiù kěyǐ shǐyòng zhèxiē shùjù zhìzuò bàogào."},{"stt":1719,"hsk":"HSK6","topic":"与其……不如……","subject":"ERP","vi":"Thay vì sửa trực tiếp dữ liệu mà không tìm nguyên nhân, tốt hơn là kiểm tra lịch sử thao tác trước.","zh":"与其直接修改数据而不查找原因，不如先检查操作记录。","pinyin":"Yǔqí zhíjiē xiūgǎi shùjù ér bù cházhǎo yuányīn, bùrú xiān jiǎnchá cāozuò jìlù."},{"stt":1720,"hsk":"HSK6","topic":"一方面……另一方面……","subject":"ERP","vi":"Một mặt ERP giúp quản lý dữ liệu tập trung, mặt khác nhân viên phải tuân thủ nghiêm ngặt quy trình nhập liệu.","zh":"一方面，ERP可以集中管理数据；另一方面，员工必须严格遵守数据录入流程。","pinyin":"Yī fāngmiàn, ERP kěyǐ jízhōng guǎnlǐ shùjù; lìng yī fāngmiàn, yuángōng bìxū yángé zūnshǒu shùjù lùrù liúchéng."},{"stt":1721,"hsk":"HSK6","topic":"随着……","subject":"ERP","vi":"Cùng với việc số lượng đơn hàng tăng lên, yêu cầu đối với tốc độ xử lý dữ liệu trên ERP cũng ngày càng cao.","zh":"随着订单数量不断增加，对ERP系统数据处理速度的要求也越来越高。","pinyin":"Suízhe dìngdān shùliàng bùduàn zēngjiā, duì ERP xìtǒng shùjù chǔlǐ sùdù de yāoqiú yě yuèláiyuè gāo."},{"stt":1722,"hsk":"HSK6","topic":"就……而言","subject":"ERP","vi":"Xét về khả năng quản lý tổng thể, ERP giúp doanh nghiệp kiểm soát tốt hơn tình hình sản xuất và tồn kho.","zh":"就整体管理能力而言，ERP可以帮助企业更好地掌握生产和库存情况。","pinyin":"Jiù zhěngtǐ guǎnlǐ nénglì ér yán, ERP kěyǐ bāngzhù qǐyè gèng hǎo de zhǎngwò shēngchǎn hé kùcún qíngkuàng."},{"stt":1723,"hsk":"HSK6","topic":"根据……来看","subject":"ERP","vi":"Xét theo dữ liệu ERP hiện tại, lượng nguyên vật liệu còn lại chỉ đủ dùng trong khoảng ba ngày.","zh":"根据目前ERP系统的数据来看，剩余原材料只够使用大约三天。","pinyin":"Gēnjù mùqián ERP xìtǒng de shùjù lái kàn, shèngyú yuáncáiliào zhǐ gòu shǐyòng dàyuē sān tiān."},{"stt":1724,"hsk":"HSK6","topic":"除非……否则……","subject":"ERP","vi":"Trừ khi quản lý mở quyền chỉnh sửa, nếu không nhân viên thông thường không thể tự ý thay đổi dữ liệu quan trọng.","zh":"除非主管开放修改权限，否则普通员工不能擅自更改重要数据。","pinyin":"Chúfēi zhǔguǎn kāifàng xiūgǎi quánxiàn, fǒuzé pǔtōng yuángōng bùnéng shànzì gēnggǎi zhòngyào shùjù."},{"stt":1725,"hsk":"HSK6","topic":"即便……仍然……","subject":"ERP","vi":"Cho dù hệ thống đã tự động tính toán, nhân viên vẫn cần kiểm tra kết quả trước khi xác nhận.","zh":"即便系统已经自动计算，员工仍然需要在确认之前检查结果。","pinyin":"Jíbiàn xìtǒng yǐjīng zìdòng jìsuàn, yuángōng réngrán xūyào zài quèrèn zhīqián jiǎnchá jiéguǒ."},{"stt":1726,"hsk":"HSK6","topic":"不但……反而……","subject":"ERP","vi":"Sau khi nâng cấp hệ thống, tốc độ xử lý không những không nhanh hơn mà ngược lại còn xuất hiện nhiều lỗi hơn.","zh":"系统升级以后，处理速度不但没有加快，反而出现了更多错误。","pinyin":"Xìtǒng shēngjí yǐhòu, chǔlǐ sùdù bùdàn méiyǒu jiākuài, fǎn'ér chūxiàn le gèng duō cuòwù."},{"stt":1727,"hsk":"HSK6","topic":"由……负责","subject":"ERP","vi":"Việc duy trì và cập nhật dữ liệu cơ bản trên hệ thống sẽ do bộ phận IT phụ trách.","zh":"系统基础数据的维护和更新由IT部门负责。","pinyin":"Xìtǒng jīchǔ shùjù de wéihù hé gēngxīn yóu IT bùmén fùzé."},{"stt":1728,"hsk":"HSK6","topic":"交由……处理","subject":"ERP","vi":"Vấn đề này đã được chuyển cho bộ phận IT xử lý vì liên quan đến lỗi hệ thống.","zh":"这个问题已经交由IT部门处理，因为涉及系统故障。","pinyin":"Zhège wèntí yǐjīng jiāo yóu IT bùmén chǔlǐ, yīnwèi shèjí xìtǒng gùzhàng."},{"stt":1729,"hsk":"HSK6","topic":"按照……执行","subject":"ERP","vi":"Tất cả các bộ phận phải thực hiện thao tác trên ERP theo đúng quy trình đã được công ty quy định.","zh":"所有部门都必须按照公司规定的流程执行ERP系统操作。","pinyin":"Suǒyǒu bùmén dōu bìxū ànzhào gōngsī guīdìng de liúchéng zhíxíng ERP xìtǒng cāozuò."},{"stt":1730,"hsk":"HSK6","topic":"确保……","subject":"ERP","vi":"Trước khi hoàn tất giao dịch trên hệ thống, cần đảm bảo tất cả thông tin đã được nhập chính xác.","zh":"在完成系统交易之前，需要确保所有信息都已经准确录入。","pinyin":"Zài wánchéng xìtǒng jiāoyì zhīqián, xūyào quèbǎo suǒyǒu xìnxī dōu yǐjīng zhǔnquè lùrù."},{"stt":1731,"hsk":"HSK6","topic":"核对……是否……","subject":"ERP","vi":"Vui lòng kiểm tra xem số lượng trên phiếu nhập kho có khớp với số lượng trên ERP hay không.","zh":"请核对入库单上的数量是否与ERP系统中的数量一致。","pinyin":"Qǐng héduì rùkù dān shàng de shùliàng shìfǒu yǔ ERP xìtǒng zhōng de shùliàng yízhì."},{"stt":1732,"hsk":"HSK6","topic":"确认……无误","subject":"ERP","vi":"Sau khi xác nhận tất cả thông tin đơn hàng không có sai sót, chúng ta mới có thể tiến hành phê duyệt.","zh":"确认订单的所有信息无误之后，我们才能进行审批。","pinyin":"Quèrèn dìngdān de suǒyǒu xìnxī wúwù zhīhòu, wǒmen cái néng jìnxíng shěnpī."},{"stt":1733,"hsk":"HSK6","topic":"提交……审批","subject":"ERP","vi":"Tôi đã hoàn thành đơn mua hàng và gửi lên hệ thống để quản lý phê duyệt.","zh":"我已经完成采购订单，并提交到系统等待主管审批。","pinyin":"Wǒ yǐjīng wánchéng cǎigòu dìngdān, bìng tíjiāo dào xìtǒng děngdài zhǔguǎn shěnpī."},{"stt":1734,"hsk":"HSK6","topic":"退回……修改","subject":"ERP","vi":"Đơn này đã bị trả lại vì thông tin nhà cung cấp chưa đầy đủ, tôi cần bổ sung rồi gửi lại.","zh":"这份申请因为供应商信息不完整而被退回，我需要补充后重新提交。","pinyin":"Zhè fèn shēnqǐng yīnwèi gōngyìngshāng xìnxī bù wánzhěng ér bèi tuìhuí, wǒ xūyào bǔchōng hòu chóngxīn tíjiāo."},{"stt":1735,"hsk":"HSK6","topic":"尚未……","subject":"ERP","vi":"Đơn mua hàng này vẫn chưa được phê duyệt nên nhà cung cấp chưa thể nhận được đơn chính thức.","zh":"这张采购订单尚未获得批准，因此供应商还无法收到正式订单。","pinyin":"Zhè zhāng cǎigòu dìngdān shàngwèi huòdé pīzhǔn, yīncǐ gōngyìngshāng hái wúfǎ shōudào zhèngshì dìngdān."},{"stt":1736,"hsk":"HSK6","topic":"已经……却……","subject":"ERP","vi":"Đơn hàng đã được tạo trên ERP nhưng vẫn chưa hiển thị trong hệ thống sản xuất.","zh":"订单已经在ERP系统中建立，却还没有显示在生产系统里。","pinyin":"Dìngdān yǐjīng zài ERP xìtǒng zhōng jiànlì, què hái méiyǒu xiǎnshì zài shēngchǎn xìtǒng lǐ."},{"stt":1737,"hsk":"HSK6","topic":"需要……才能……","subject":"ERP","vi":"Cần cập nhật BOM chính xác thì hệ thống mới có thể tính toán nhu cầu nguyên vật liệu.","zh":"需要准确更新BOM，系统才能计算原材料需求。","pinyin":"Xūyào zhǔnquè gēngxīn BOM, xìtǒng cái néng jìsuàn yuáncáiliào xūqiú."},{"stt":1738,"hsk":"HSK6","topic":"根据……自动……","subject":"ERP","vi":"Hệ thống sẽ tự động tính toán nhu cầu nguyên vật liệu dựa trên số lượng sản phẩm cần sản xuất.","zh":"系统会根据计划生产数量自动计算原材料需求。","pinyin":"Xìtǒng huì gēnjù jìhuà shēngchǎn shùliàng zìdòng jìsuàn yuáncáiliào xūqiú."},{"stt":1739,"hsk":"HSK6","topic":"如果发现……应当……","subject":"ERP","vi":"Nếu phát hiện số liệu trên ERP không chính xác, nhân viên không nên tự ý sửa mà cần báo cáo cho người phụ trách.","zh":"如果发现ERP系统中的数据不准确，员工不应擅自修改，而应该向负责人报告。","pinyin":"Rúguǒ fāxiàn ERP xìtǒng zhōng de shùjù bù zhǔnquè, yuángōng bù yīng shànzì xiūgǎi, ér yīnggāi xiàng fùzérén bàogào."},{"stt":1740,"hsk":"HSK6","topic":"以便……","subject":"ERP","vi":"Vui lòng cập nhật trạng thái đơn hàng kịp thời để các bộ phận liên quan có thể theo dõi tiến độ.","zh":"请及时更新订单状态，以便相关部门跟进进度。","pinyin":"Qǐng jíshí gēngxīn dìngdān zhuàngtài, yǐbiàn xiāngguān bùmén gēnjìn jìndù."},{"stt":1741,"hsk":"HSK6","topic":"从……中发现……","subject":"ERP","vi":"Qua việc đối chiếu dữ liệu ERP với số liệu thực tế, chúng tôi phát hiện có sự chênh lệch về tồn kho.","zh":"通过将ERP数据与实际数据进行核对，我们发现库存存在差异。","pinyin":"Tōngguò jiāng ERP shùjù yǔ shíjì shùjù jìnxíng héduì, wǒmen fāxiàn kùcún cúnzài chāyì."},{"stt":1742,"hsk":"HSK6","topic":"进一步……","subject":"ERP","vi":"Chúng ta cần kiểm tra thêm lịch sử chỉnh sửa để xác định chính xác thời điểm dữ liệu bị thay đổi.","zh":"我们需要进一步检查修改记录，以确定数据具体是在什么时候发生变化的。","pinyin":"Wǒmen xūyào jìnyíbù jiǎnchá xiūgǎi jìlù, yǐ quèdìng shùjù jùtǐ shì zài shénme shíhou fāshēng biànhuà de."},{"stt":1743,"hsk":"HSK6","topic":"不仅如此……","subject":"ERP","vi":"ERP không chỉ dùng để quản lý tồn kho; hơn nữa, nó còn liên quan đến mua hàng, sản xuất và tài chính.","zh":"ERP不仅用于库存管理，不仅如此，它还涉及采购、生产和财务等多个环节。","pinyin":"ERP bùjǐn yòngyú kùcún guǎnlǐ, bùjǐn rúcǐ, tā hái shèjí cǎigòu, shēngchǎn hé cáiwù děng duō ge huánjié."},{"stt":1744,"hsk":"HSK6","topic":"换句话说……","subject":"ERP","vi":"Nói cách khác, nếu dữ liệu đầu vào không chính xác thì kết quả mà hệ thống đưa ra cũng sẽ không đáng tin cậy.","zh":"换句话说，如果输入数据不准确，系统最终生成的结果也不会可靠。","pinyin":"Huàn jù huà shuō, rúguǒ shūrù shùjù bù zhǔnquè, xìtǒng zuìzhōng shēngchéng de jiéguǒ yě bú huì kěkào."},{"stt":1745,"hsk":"HSK6","topic":"从长远来看……","subject":"ERP","vi":"Xét về lâu dài, việc chuẩn hóa dữ liệu ERP sẽ giúp công ty giảm đáng kể thời gian xử lý thủ công.","zh":"从长远来看，规范ERP系统的数据管理可以大幅减少公司的人工处理时间。","pinyin":"Cóng chángyuǎn lái kàn, guīfàn ERP xìtǒng de shùjù guǎnlǐ kěyǐ dàfú jiǎnshǎo gōngsī de réngōng chǔlǐ shíjiān."},{"stt":1746,"hsk":"HSK6","topic":"归根结底……","subject":"ERP","vi":"Nói cho cùng, hiệu quả của ERP phụ thuộc rất lớn vào tính chính xác và kịp thời của dữ liệu được nhập vào.","zh":"归根结底，ERP系统的运行效果很大程度上取决于输入数据的准确性和及时性。","pinyin":"Guīgēnjiédǐ, ERP xìtǒng de yùnxíng xiàoguǒ hěn dà chéngdù shàng qǔjué yú shūrù shùjù de zhǔnquèxìng hé jíshíxìng."},{"stt":1747,"hsk":"HSK6","topic":"并不是……就……","subject":"ERP","vi":"Không phải cứ có hệ thống ERP là có thể giải quyết mọi vấn đề quản lý dữ liệu.","zh":"并不是有了ERP系统，就能够解决所有的数据管理问题。","pinyin":"Bìng bú shì yǒu le ERP xìtǒng, jiù nénggòu jiějué suǒyǒu de shùjù guǎnlǐ wèntí."},{"stt":1748,"hsk":"HSK6","topic":"若……则……","subject":"ERP","vi":"Nếu dữ liệu tồn kho thực tế không khớp với hệ thống thì phải tiến hành kiểm kê và điều tra nguyên nhân.","zh":"若实际库存数据与系统数据不一致，则必须进行盘点并调查原因。","pinyin":"Ruò shíjì kùcún shùjù yǔ xìtǒng shùjù bù yízhì, zé bìxū jìnxíng pándiǎn bìng diàochá yuányīn."},{"stt":1749,"hsk":"HSK6","topic":"凡是……都……","subject":"ERP","vi":"Tất cả các giao dịch liên quan đến nhập xuất kho đều phải được ghi nhận đầy đủ trên hệ thống.","zh":"凡是与库存收发有关的交易，都必须完整记录在系统中。","pinyin":"Fánshì yǔ kùcún shōufā yǒuguān de jiāoyì, dōu bìxū wánzhěng jìlù zài xìtǒng zhōng."},{"stt":1750,"hsk":"HSK6","topic":"不论……还是……都……","subject":"ERP","vi":"Bất kể là đơn mua hàng hay đơn bán hàng, tất cả đều phải có mã số rõ ràng trên ERP.","zh":"不论是采购订单还是销售订单，都必须在ERP系统中有明确的编号。","pinyin":"Bùlùn shì cǎigòu dìngdān háishì xiāoshòu dìngdān, dōu bìxū zài ERP xìtǒng zhōng yǒu míngquè de biānhào."},{"stt":1751,"hsk":"HSK6","topic":"有必要……","subject":"ERP","vi":"Để đảm bảo tính chính xác của dữ liệu, việc phân quyền người dùng và kiểm tra lịch sử thao tác là rất cần thiết.","zh":"为了确保数据准确性，有必要对用户权限和操作记录进行严格管理。","pinyin":"Wèile quèbǎo shùjù zhǔnquèxìng, yǒu bìyào duì yònghù quánxiàn hé cāozuò jìlù jìnxíng yángé guǎnlǐ."},{"stt":1752,"hsk":"HSK6","topic":"就目前情况而言……","subject":"ERP","vi":"Xét tình hình hiện tại, trước tiên chúng ta cần xử lý vấn đề dữ liệu trên ERP, sau đó mới có thể tiếp tục các bước tiếp theo.","zh":"就目前情况而言，我们首先需要处理ERP系统中的数据问题，然后才能继续后续工作。","pinyin":"Jiù mùqián qíngkuàng ér yán, wǒmen shǒuxiān xūyào chǔlǐ ERP xìtǒng zhōng de shùjù wèntí, ránhòu cái néng jìxù hòuxù gōngzuò."}];
let filtered = [...RAW_DATA];
const state = { search:'', hsk:'', topic:'', subject:'' };
const PAGE_SIZE = 300;
let renderedCount = 0;

const $ = id => document.getElementById(id);
const tableWrapper = $('tableWrapper');
const statsDisplay = $('statsDisplay');

(function buildFilters() {
    const hskSet = new Set(), topicSet = new Set(), subjectSet = new Set();
    RAW_DATA.forEach(r => { 
        if(r.hsk) hskSet.add(r.hsk); 
        if(r.topic) topicSet.add(r.topic); 
        if(r.subject) subjectSet.add(r.subject); 
    });
    $('hskFilter').innerHTML = '<option value="">Tất cả HSK</option>' + [...hskSet].sort().map(v=>`<option value="${v}">${v}</option>`).join('');
    $('topicFilter').innerHTML = '<option value="">Tất cả chủ điểm</option>' + [...topicSet].sort().map(v=>`<option value="${v}">${v}</option>`).join('');
    $('subjectFilter').innerHTML = '<option value="">Tất cả chủ đề</option>' + [...subjectSet].sort().map(v=>`<option value="${v}">${v}</option>`).join('');
})();

function render(reset) {
    if (reset) renderedCount = 0;
    
    if (!filtered.length) {
        tableWrapper.innerHTML = `<div class="no-data"><i class="fas fa-search"></i>Không tìm thấy câu nào phù hợp.</div>`;
        updateStats();
        return;
    }
    
    if (reset) {
        tableWrapper.innerHTML = '<table id="dataTable"><thead><tr>' +
            '<th>STT</th><th>HSK</th><th>Chủ điểm</th><th>Chủ đề</th>' +
            '<th>Tiếng Việt</th><th>Tiếng Trung</th><th>Pinyin</th>' +
            '<th>Nghe</th><th>Luyện tập</th><th>Check</th>' +
            '</tr></thead><tbody id="dataBody"></tbody></table>';
    }
    
    const tbody = $('dataBody');
    const end = Math.min(renderedCount + PAGE_SIZE, filtered.length);
    let html = '';
    
    for (let i = renderedCount; i < end; i++) {
        const r = filtered[i];
        const encoded = encodeURIComponent(r.zh);
        const audio = r.zh ? `<a href="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=${encoded}" target="_blank" class="audio-btn"><i class="fas fa-volume-up"></i></a>` : '';
        html += `<tr>
            <td>${r.stt}</td>
            <td><span class="hsk-badge">${r.hsk}</span></td>
            <td>${r.topic}</td>
            <td>${r.subject}</td>
            <td>${r.vi}</td>
            <td><strong>${r.zh}</strong></td>
            <td><span class="pinyin">${r.pinyin}</span></td>
            <td style="text-align:center">${audio}</td>
            <td><input type="text" class="practice-input" placeholder="Nhập..." data-answer="${r.zh.replace(/"/g,'&quot;')}" data-stt="${r.stt}" oninput="checkInput(this)"></td>
            <td class="check-cell" data-check-stt="${r.stt}"></td>
        </tr>`;
    }
    
    const oldBtn = tableWrapper.querySelector('.load-more');
    if (oldBtn) oldBtn.remove();
    
    tbody.insertAdjacentHTML('beforeend', html);
    renderedCount = end;
    
    if (renderedCount < filtered.length) {
        const btn = document.createElement('div');
        btn.className = 'load-more';
        btn.textContent = `Xem thêm (${renderedCount}/${filtered.length})`;
        btn.onclick = () => render(false);
        tableWrapper.appendChild(btn);
    }
    
    updateStats();
}

window.checkInput = function(input) {
    const stt = input.dataset.stt;
    const answer = input.dataset.answer;
    const cell = document.querySelector(`[data-check-stt="${stt}"]`);
    const val = input.value.trim();
    if (!val) { cell.innerHTML = ''; return; }
    const norm = s => s.replace(/[。，！？、；：""''（）\s]/g,'');
    if (norm(val) === norm(answer)) {
        cell.innerHTML = '<span class="check-correct">✅ ĐÚNG</span>';
    } else {
        cell.innerHTML = '<span class="check-wrong">❌ SAI</span>';
    }
};

function applyFilter() {
    state.search = $('searchInput').value.trim().toLowerCase();
    state.hsk = $('hskFilter').value;
    state.topic = $('topicFilter').value;
    state.subject = $('subjectFilter').value;
    filtered = RAW_DATA.filter(r => {
        if (state.search) {
            const s = state.search;
            if (!r.vi.toLowerCase().includes(s) && !r.zh.toLowerCase().includes(s) && !r.pinyin.toLowerCase().includes(s)) return false;
        }
        if (state.hsk && r.hsk !== state.hsk) return false;
        if (state.topic && r.topic !== state.topic) return false;
        if (state.subject && r.subject !== state.subject) return false;
        return true;
    });
    render(true);
}

function updateStats() {
    statsDisplay.innerHTML = `<i class="fas fa-book-open"></i> Hiển thị <span>${renderedCount}</span> / ${filtered.length} câu`;
}

$('searchInput').addEventListener('input', applyFilter);
$('hskFilter').addEventListener('change', applyFilter);
$('topicFilter').addEventListener('change', applyFilter);
$('subjectFilter').addEventListener('change', applyFilter);
$('resetBtn').addEventListener('click', () => {
    $('searchInput').value = ''; $('hskFilter').value = '';
    $('topicFilter').value = ''; $('subjectFilter').value = '';
    applyFilter();
});

render(true);
</script>
</body>
</html>
