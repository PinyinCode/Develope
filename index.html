<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinyin AI - Auto Scan Gist</title>
    <style>
        :root {
            --bg-color: #000000; --card-bg: rgba(28, 28, 30, 0.75); --card-solid: #1c1c1e;
            --text-main: #f5f5f7; --text-secondary: #98989f; --accent: #ff2d55;
            --accent-light: rgba(255, 45, 85, 0.15); --blue: #0a84ff; --green: #30d158;
            --border-color: rgba(255, 255, 255, 0.1); --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --radius: 20px; --element-radius: 12px; --fs-cn: 20px; --fs-py: 16px; --fs-vi: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .container { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 14px; }
        .app-header { text-align: center; padding: 6px 0; }
        .app-header h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--text-main); }
        .card {
            background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
            border: 1px solid var(--border-color); transition: all 0.3s ease;
        }
        .card.collapsed { max-height: 0; padding: 0; margin: 0; opacity: 0; border-color: transparent; pointer-events: none; overflow: hidden; }
        label {
            font-size: 11px; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px;
        }
        .row { display: flex; gap: 8px; align-items: center; }
        .row > *:first-child { flex: 1; }
        input[type="text"], input[type="password"], select {
            width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color); border-radius: var(--element-radius);
            color: var(--text-main); font-size: 14px; outline: none; transition: all 0.2s ease;
        }
        select {
            cursor: pointer; appearance: none; -webkit-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2398989f" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat; background-position: right 10px center; padding-right: 32px;
        }
        select option { background-color: var(--card-solid); color: var(--text-main); }
        input:focus, select:focus { background-color: var(--card-solid); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-light); }
        button {
            padding: 12px 16px; border: none; border-radius: var(--element-radius);
            font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.96); opacity: 0.9; }
        .btn-accent { background-color: var(--accent); color: white; }
        .btn-accent.cancel { background-color: var(--text-secondary); }
        .btn-sm { padding: 8px 12px; font-size: 11px; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); color: var(--text-main); }
        .progress-wrap { width: 100%; height: 4px; background: #3a3a3c; border-radius: 2px; overflow: hidden; margin-top: 8px; }
        .progress-bar { height: 100%; background: var(--blue); width: 0; transition: width 0.3s; }
        .player-wrap { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: var(--radius); overflow: hidden; }
        .player-wrap.hidden { display: none; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #subtitle-box {
            background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid var(--border-color);
            padding: 24px 16px; border-radius: var(--radius); min-height: 100px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; text-align: center;
        }
        .cn { font-size: var(--fs-cn); font-weight: 700; }
        .py { font-size: var(--fs-py); color: var(--text-secondary); }
        .vi { font-size: var(--fs-vi); color: var(--accent); border-top: 1px solid var(--border-color); padding-top: 8px; width: 80%; }
        .settings-toggle { cursor: pointer; color: var(--text-secondary); font-size: 11px; text-align: right; user-select: none; }
        #logBox {
            background: var(--card-bg); border-radius: 12px; padding: 12px; height: 100px;
            overflow-y: auto; font-size: 11px; font-family: monospace; color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .log-ok { color: var(--green); } .log-err { color: var(--accent); } .log-info { color: var(--blue); }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div class="container">
    <div class="app-header"><h3>🎬 Pinyin AI</h3></div>

    <!-- URL Input -->
    <div class="card">
        <label>🔗 Link YouTube</label>
        <div class="row">
            <input type="text" id="yt-link" placeholder="Dán link...">
            <button class="btn-accent" id="btn-action" style="width:80px" onclick="handleMainAction()">▶️ TẢI</button>
        </div>
        <div class="progress-wrap"><div class="progress-bar" id="pb"></div></div>
        <p style="font-size:10px;color:var(--text-secondary);margin-top:4px" id="pbText">Sẵn sàng</p>
    </div>

    <!-- Settings Toggle -->
    <div class="settings-toggle" onclick="toggleSettings()">⚙️ Cài đặt GitHub & PC Server ▾</div>
    <div class="card" id="settings-card" style="display:none;">
        <input type="text" id="ghUser" placeholder="GitHub Username" style="margin-bottom:8px">
        <div class="row" style="margin-bottom:8px">
            <input type="text" id="ghRepo" placeholder="Repository">
            <input type="password" id="ghToken" placeholder="Token ghp_...">
        </div>
        <input type="text" id="pcUrl" placeholder="PC Server URL (https://xxxx.trycloudflare.com)">
        <button class="btn-sm" style="width:100%;margin-top:8px;background:var(--blue);color:white" onclick="saveSettings()">💾 LƯU</button>
    </div>

    <!-- Gist Library -->
    <div class="card">
        <label>📚 Kho phụ đề đã lưu</label>
        <div class="row">
            <select id="gist-select" onchange="onGistSelected(this.value)">
                <option value="">-- Đang tải kho... --</option>
            </select>
            <button class="btn-sm" style="width:40px" onclick="loadGistLibrary()">🔄</button>
        </div>
        <p style="font-size:10px;color:var(--text-secondary);margin-top:4px" id="matched-sub-note">Sẵn sàng</p>
    </div>

    <!-- Player -->
    <div class="player-wrap hidden" id="video-wrapper"><div id="player"></div></div>

    <!-- Subtitle -->
    <div id="subtitle-box"><span style="color:var(--text-secondary);font-size:14px">Nhập link và bấm TẢI...</span></div>

    <!-- Log -->
    <div class="card">
        <label>📋 Tiến trình</label>
        <div id="logBox">🟢 Sẵn sàng</div>
    </div>
</div>

<script>
// ===== STATE =====
let player, subtitles=[], syncInterval=null, activeSubIndex=-1;
let isLoadingState=false, processingVid=null, playingVid=null;
let pc_url='', gh_cloud_map={};

// ===== INIT =====
function onYouTubeIframeAPIReady(){ loadSettings(); loadGistLibrary(); }
function loadSettings(){
    document.getElementById('ghUser').value=localStorage.gh_user||'';
    document.getElementById('ghRepo').value=localStorage.gh_repo||'subtitle-ai';
    document.getElementById('ghToken').value=localStorage.gh_token||localStorage.gh_pat_token||'';
    document.getElementById('pcUrl').value=localStorage.pc_url||'';
    pc_url=localStorage.pc_url||'';
    gh_cloud_map=JSON.parse(localStorage.getItem('gh_cloud_map')||'{}');
}
function saveSettings(){
    localStorage.gh_user=document.getElementById('ghUser').value.trim();
    localStorage.gh_repo=document.getElementById('ghRepo').value.trim();
    let tok=document.getElementById('ghToken').value.trim();
    localStorage.gh_token=tok; localStorage.gh_pat_token=tok;
    pc_url=document.getElementById('pcUrl').value.trim(); localStorage.pc_url=pc_url;
    log('Đã lưu ✓','ok');
}
function toggleSettings(){
    const c=document.getElementById('settings-card');
    const b=document.querySelector('.settings-toggle');
    if(c.style.display==='none'){c.style.display='block';b.textContent='⚙️ Cài đặt ▴';}
    else{c.style.display='none';b.textContent='⚙️ Cài đặt ▾';}
}

// ===== LOG =====
function log(m,c=''){
    const t=new Date().toLocaleTimeString('vi-VN');
    document.getElementById('logBox').innerHTML+=`<br><span class="log-${c}">[${t}] ${m}</span>`;
    document.getElementById('logBox').scrollTop=document.getElementById('logBox').scrollHeight;
}
function prog(p,t=''){document.getElementById('pb').style.width=p+'%';if(t)document.getElementById('pbText').innerText=t;}

// ===== GIST LIBRARY =====
async function loadGistLibrary(){
    const select=document.getElementById('gist-select');
    select.innerHTML='<option value="">-- Đang quét... --</option>';
    let token=localStorage.gh_token||localStorage.gh_pat_token;
    let newCloudMap={};
    if(token){
        try{
            let allGists=[];
            for(let page=1;page<=10;page++){
                let res=await fetch(`https://api.github.com/gists?page=${page}&per_page=100`,{headers:{"Authorization":`token ${token}`}});
                if(!res.ok)break;
                let gists=await res.json();
                if(!gists||!gists.length)break;
                allGists=allGists.concat(gists);
            }
            for(let gist of allGists){
                if(gist.files)for(let fn in gist.files){
                    if(fn.endsWith('.vtt')){
                        let vId=fn.replace('.vtt','');
                        if(!newCloudMap[vId]) newCloudMap[vId]={url:gist.files[fn].raw_url,title:(gist.description||'').replace(/^.*Subtitle\s*-\s*/i,'').trim()||`Video ${vId}`};
                    }
                }
            }
            gh_cloud_map=newCloudMap;
            localStorage.setItem('gh_cloud_map',JSON.stringify(gh_cloud_map));
        }catch(e){}
    }
    if(!Object.keys(newCloudMap).length) newCloudMap=gh_cloud_map;
    let items=[];
    for(let vId in newCloudMap){ let e=newCloudMap[vId]; items.push({videoId:vId,rawUrl:e.url,title:e.title}); }
    items.sort((a,b)=>b.videoId.localeCompare(a.videoId));
    select.innerHTML=items.length?`<option value="">-- Chọn (${items.length}) --</option>`:'<option value="">-- Chưa có --</option>';
    items.forEach(i=>{let o=document.createElement('option');o.value=JSON.stringify(i);o.textContent=i.title;select.appendChild(o);});
    document.getElementById('matched-sub-note').innerText=items.length?`${items.length} video`:'Chưa có video';
}

// ===== CHỌN VIDEO TỪ KHO -> LOAD VIDEO + SUB =====
async function onGistSelected(val){
    if(!val||processingVid)return;
    try{
        let item=JSON.parse(val);
        // Load subtitle
        let res=await fetch(item.rawUrl);
        if(res.ok){
            subtitles=parseVTT(await res.text());
            document.getElementById('matched-sub-note').innerText=`📦 ${item.title}`;
            // Load video
            playingVid=item.videoId;
            document.getElementById('yt-link').value=`https://youtu.be/${item.videoId}`;
            showPlayer(item.videoId);
            log(`Phát: ${item.title}`,'ok');
        }
    }catch(e){}
}

// ===== PLAYER =====
function showPlayer(vid){
    document.getElementById('video-wrapper').classList.remove('hidden');
    if(player){player.loadVideoById(vid);startSync();return;}
    player=new YT.Player('player',{height:'100%',width:'100%',videoId:vid,playerVars:{playsinline:1,autoplay:1},events:{onReady:startSync}});
}
function startSync(){if(syncInterval)clearInterval(syncInterval);syncInterval=setInterval(syncSub,200);}
function syncSub(){
    if(!player?.getCurrentTime||!subtitles.length)return;
    const t=player.getCurrentTime(),idx=subtitles.findIndex(s=>t>=s.start&&t<=s.end);
    if(idx!==-1&&idx!==activeSubIndex){activeSubIndex=idx;const s=subtitles[idx];document.getElementById('subtitle-box').innerHTML=`<div class="cn">${s.rawLines[0]}</div><div class="py">${s.rawLines[1]}</div><div class="vi">${s.rawLines[2]}</div>`;}
}

// ===== UTILS =====
function extractVideoID(url){if(!url)return null;const m=url.match(/(?:v=|\/)([\w-]{11})/);return m?m[1]:(url.length===11?url:null);}
function parseVTT(data){const n=data.replace(/\r\n/g,'\n').replace(/\r/g,'\n'),blocks=n.split('\n\n');let s=[];blocks.forEach(b=>{const l=b.split('\n');let t=-1;for(let i=0;i<l.length;i++){if(l[i].includes('-->')){t=i;break}}if(t!==-1){const ts=l[t].split('-->');if(ts.length===2){const st=parseTime(ts[0].trim()),en=parseTime(ts[1].trim());let r=l.slice(t+1).map(x=>x.replace(/<[^>]*>/g,'').trim()).filter(x=>x!=="");while(r.length<3)r.push("");s.push({start:st,end:en,rawLines:r})}}});return s;}
function parseTime(t){t=t.replace(',','.');const p=t.split(':');return p.length<3?0:parseFloat(p[0])*3600+parseFloat(p[1])*60+parseFloat(p[2]);}

// ===== MAIN: TẢI AUDIO + UPLOAD =====
async function handleMainAction(){
    const btn=document.getElementById('btn-action');
    const url=document.getElementById('yt-link').value.trim();
    const vid=extractVideoID(url);
    if(!vid){alert('Nhập link YouTube!');return}

    if(!isLoadingState){
        // Kiểm tra có sub chưa
        let hasSub=gh_cloud_map[vid]||(await checkCloud(vid));
        if(hasSub){
            // CÓ SUB -> PHÁT NGAY
            isLoadingState=true;btn.innerText='Huỷ';btn.classList.add('cancel');
            playingVid=vid; showPlayer(vid);
            document.getElementById('matched-sub-note').innerText='✅ Đang phát';
            resetUI();
        }else{
            // KHÔNG SUB -> PC TẢI
            if(!pc_url){alert('Cấu hình PC Server URL!');return}
            processingVid=vid; isLoadingState=true;
            btn.innerText='⏹ DỪNG';btn.classList.add('cancel');
            document.getElementById('logBox').innerHTML='';
            log(`Bắt đầu xử lý: ${vid}`,'info');
            prog(5,'Đang kiểm tra PC...');
            
            try{
                const pc=pc_url.replace(/\/$/,'');
                // Kiểm tra PC
                const h=await fetch(`${pc}/health`,{signal:AbortSignal.timeout(5000)});
                if(!h.ok)throw new Error('PC offline');
                log('PC online ✓','ok');
                prog(10,'PC đang tải audio...');
                
                // Tải audio
                const blob=await new Promise((resolve,reject)=>{
                    const x=new XMLHttpRequest();
                    x.open('GET',`${pc}/download?url=${encodeURIComponent(`https://youtu.be/${vid}`)}`,true);
                    x.responseType='blob';x.timeout=600000;
                    x.onload=()=>x.status===200?resolve(x.response):reject(new Error(`Lỗi ${x.status}`));
                    x.onerror=()=>reject(new Error('Mất kết nối'));
                    x.ontimeout=()=>reject(new Error('Timeout'));
                    x.upload.onprogress=function(e){
                        if(e.lengthComputable){prog(10+(e.loaded/e.total)*30,`PC tải: ${Math.round(e.loaded/1024)}KB`);}
                    };
                    x.send();
                });
                log(`Tải xong: ${(blob.size/1024/1024).toFixed(1)}MB ✓`,'ok');
                prog(50,'Đang upload GitHub...');
                
                // Upload
                const b64=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(',')[1]);rd.readAsDataURL(blob);});
                const token=localStorage.gh_token||localStorage.gh_pat_token;
                const user=localStorage.gh_user,repo=localStorage.gh_repo;
                if(!token||!user){alert('Cấu hình GitHub!');resetUI();return}
                
                const api=`https://api.github.com/repos/${user}/${repo}/contents/data/audio/${vid}.m4a`;
                const headers={"Authorization":`token ${token}`,"Accept":"application/vnd.github.v3+json"};
                let sha=null;
                try{const c=await fetch(api,{headers});if(c.ok)sha=(await c.json()).sha}catch(e){}
                const body={message:`Audio ${vid}`,content:b64,branch:'main'};if(sha)body.sha=sha;
                
                const r=await fetch(api,{method:'PUT',headers,body:JSON.stringify(body)});
                if(!r.ok)throw new Error((await r.json()).message);
                
                log('Upload GitHub ✓','ok');
                prog(100,'Hoàn tất! Đợi AI xử lý...');
                document.getElementById('matched-sub-note').innerText='⏳ AI đang tạo phụ đề... (3-5 phút)';
                
                // Trigger workflow
                try{await fetch(`https://api.github.com/repos/${user}/${repo}/dispatches`,{method:'POST',headers,body:JSON.stringify({event_type:'process_audio',client_payload:{video_id:vid}})})}catch(e){}
                
                // Auto check sau 3 phút
                setTimeout(async()=>{
                    log(`Kiểm tra phụ đề ${vid}...`,'info');
                    const sr=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/output/${vid}.vtt`,{headers});
                    if(sr.ok){
                        const sd=await sr.json();
                        subtitles=parseVTT(atob(sd.content));
                        gh_cloud_map[vid]={url:sd.download_url,title:`Video ${vid}`};
                        localStorage.setItem('gh_cloud_map',JSON.stringify(gh_cloud_map));
                        loadGistLibrary();
                        document.getElementById('matched-sub-note').innerText='✅ Phụ đề đã sẵn sàng!';
                        log('Phụ đề đã có! ✓','ok');
                        processingVid=null;
                    }else{
                        log('Chưa có, thử lại sau 1 phút...','info');
                        setTimeout(()=>arguments.callee(),60000);
                    }
                },180000);
                
            }catch(e){
                log(`LỖI: ${e.message}`,'err');
                prog(0,'Lỗi');
                document.getElementById('matched-sub-note').innerText='❌ Lỗi';
                processingVid=null;
            }
            resetUI();
        }
    }else{
        resetUI();
        if(player?.stopVideo)player.stopVideo();
    }
}

function resetUI(){isLoadingState=false;const btn=document.getElementById('btn-action');btn.innerText='▶️ TẢI';btn.classList.remove('cancel');}

async function checkCloud(vid){
    if(gh_cloud_map[vid]){
        try{
            let e=gh_cloud_map[vid],u=typeof e==='object'?e.url:e;
            if(u){let r=await fetch(u);if(r.ok){loadSub(await r.text());document.getElementById('matched-sub-note').innerText=`☁️ ${typeof e==='object'?e.title:vid}`;return true;}}
        }catch(e){}
    }
    let token=localStorage.gh_token||localStorage.gh_pat_token;
    if(token){
        try{
            let r=await fetch('https://api.github.com/gists',{headers:{"Authorization":`token ${token}`}});
            if(r.ok){let gists=await r.json();for(let g of gists){let fn=`${vid}.vtt`;if(g.files&&g.files[fn]){let raw=g.files[fn].raw_url,t=(g.description||'').replace(/^.*Subtitle\s*-\s*/i,'').trim()||`Video ${vid}`;gh_cloud_map[vid]={url:raw,title:t};localStorage.setItem('gh_cloud_map',JSON.stringify(gh_cloud_map));let sr=await fetch(raw);if(sr.ok){loadSub(await sr.text());document.getElementById('matched-sub-note').innerText=`🌐 ${t}`;return true;}}}}
        }catch(e){}
    }
    return false;
}

function loadSub(t){subtitles=parseVTT(t);}
</script>
</body>
</html>
