<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinyin AI - Upload & Subtitle</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.75);
            --card-solid: #1c1c1e;
            --text-main: #f5f5f7;
            --text-secondary: #98989f;
            --accent: #ff2d55;
            --accent-light: rgba(255, 45, 85, 0.15);
            --blue: #0a84ff;
            --green: #30d158;
            --yellow: #ffd60a;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --radius: 20px;
            --element-radius: 12px;
            --fs-cn: 35px;
            --fs-py: 16px;
            --fs-vi: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .container { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 14px; }
        .app-header { text-align: center; padding: 6px 0; }
        .app-header h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--text-main); }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        .card.hidden { display: none; }
        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }
        .row { display: flex; gap: 8px; align-items: center; }
        .input-wrap { position: relative; flex: 1; }
        .input-wrap input { width: 100%; padding-right: 36px; }
        .btn-clear-input {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 2;
        }
        .btn-clear-input:hover { color: var(--text-main); }
        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: var(--element-radius);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }
        select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2398989f" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            padding-right: 32px;
        }
        select option { background-color: var(--card-solid); color: var(--text-main); }
        input:focus, select:focus {
            background-color: var(--card-solid);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
        }
        button {
            padding: 12px 16px;
            border: none;
            border-radius: var(--element-radius);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        button:active { transform: scale(0.96); opacity: 0.9; }
        button:disabled { opacity: 0.4; pointer-events: none; }
        .btn-accent { background-color: var(--accent); color: white; }
        .btn-accent.cancel { background-color: var(--text-secondary); }
        .btn-sm {
            padding: 8px 12px;
            font-size: 11px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-sm.active {
            background-color: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }
        .file-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--element-radius);
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }
        .file-upload-area:hover {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .file-upload-area.dragover {
            border-color: var(--blue);
            background: rgba(10, 132, 255, 0.1);
        }
        .file-upload-area input[type="file"] {
            display: none;
        }
        .file-upload-area .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }
        .file-upload-area .text {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .file-upload-area .filename {
            color: var(--text-main);
            font-weight: 600;
            margin-top: 8px;
        }
        .progress-wrap {
            width: 100%;
            height: 4px;
            background: #3a3a3c;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar {
            height: 100%;
            background: var(--blue);
            width: 0;
            transition: width 0.3s;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .progress-info .speed { color: var(--blue); }
        .progress-info .eta { color: var(--yellow); font-size: 10px; }
        .player-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
        }
        .player-wrap.hidden { display: none; }
        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #subtitle-box {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            padding: 24px 16px;
            border-radius: var(--radius);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-align: center;
        }
        .cn { font-size: var(--fs-cn); font-weight: 700; }
        .py { font-size: var(--fs-py); color: var(--text-secondary); }
        .vi {
            font-size: var(--fs-vi);
            color: var(--accent);
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            width: 80%;
        }
        .settings-toggle {
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 11px;
            text-align: right;
            user-select: none;
        }
        #logBox {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            height: 100px;
            overflow-y: auto;
            font-size: 11px;
            font-family: monospace;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .log-ok { color: var(--green); }
        .log-err { color: var(--accent); }
        .log-info { color: var(--blue); }
        .log-progress { color: var(--yellow); }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 6px;
        }
        .setting-row label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: none;
            margin: 0;
        }
        .setting-row span {
            font-size: 11px;
            color: var(--text-main);
            text-align: right;
            min-width: 35px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
            height: 4px;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        .status-badge.uploading { background: var(--yellow); color: black; }
        .status-badge.done { background: var(--green); color: black; }
        .status-badge.error { background: var(--accent); color: white; }
        .status-badge.processing { background: var(--blue); color: white; }
        .badge-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div class="container">
    <div class="app-header"><h3>🎬 Pinyin AI</h3></div>

    <!-- === UPLOAD CARD === -->
    <div class="card" id="upload-card">
        <label>📤 UPLOAD AUDIO LÊN GITHUB</label>
        <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">
            Tải audio từ YouTube bằng y2mate, sau đó upload lên GitHub để AI xử lý
        </p>
        
        <div class="row" style="margin-bottom:10px;">
            <div class="input-wrap" style="flex:1;">
                <input type="text" id="video-id" placeholder="Nhập Video ID (vd: MeiiVrKWSAc)" oninput="onVideoIdInput()">
                <button class="btn-clear-input" id="btn-clear-id" onclick="clearVideoId()">×</button>
            </div>
            <button class="btn-sm" onclick="openY2Mate()" style="background:var(--blue);color:white;padding:10px 16px;">
                🎵 Tải Audio
            </button>
        </div>
        
        <div class="file-upload-area" id="drop-area" onclick="document.getElementById('file-input').click()">
            <span class="icon">📁</span>
            <div class="text">Kéo thả file audio vào đây hoặc click để chọn</div>
            <div class="filename" id="file-name">Chưa có file</div>
            <input type="file" id="file-input" accept=".m4a,.mp3,.webm" onchange="handleFileSelect(this.files[0])">
        </div>
        
        <div class="badge-group" id="file-info"></div>
        
        <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn-accent" id="btn-upload" onclick="uploadToGitHub()" style="flex:1;padding:14px;">
                📤 UPLOAD LÊN GITHUB
            </button>
            <button class="btn-sm" onclick="clearAll()" style="background:rgba(255,0,0,0.2);border-color:var(--accent);color:var(--accent);padding:14px;">
                🗑️ Xóa
            </button>
        </div>
        
        <div class="progress-wrap"><div class="progress-bar" id="pb"></div></div>
        <div class="progress-info">
            <span id="pbText">Sẵn sàng</span>
            <span class="speed" id="pbSpeed">--</span>
            <span class="eta" id="pbEta"></span>
        </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span class="settings-toggle" onclick="toggleSettings()">⚙️ Cài đặt ▾</span>
        <span class="settings-toggle" id="toggle-all-btn" onclick="toggleAllCards()">👁️ Ẩn</span>
    </div>

    <!-- === SETTINGS === -->
    <div class="card" id="settings-card" style="display:none;">
        <label>GitHub Username</label>
        <input type="text" id="ghUser" placeholder="Username" value="PinyinCode" style="margin-bottom:10px">
        <label>Repository</label>
        <input type="text" id="ghRepo" placeholder="Repository" value="subtitle-ai" style="margin-bottom:10px">
        <label>GitHub Token (cần quyền repo)</label>
        <input type="password" id="ghToken" placeholder="Token ghp_..." style="margin-bottom:10px">
        <label>Gist Token (để đọc phụ đề)</label>
        <input type="password" id="gistToken" placeholder="Token ghp_..." style="margin-bottom:10px">
        <button class="btn-sm" style="width:100%;background:var(--blue);color:white;padding:12px" onclick="saveSettings()">💾 LƯU</button>
    </div>

    <!-- === GIST LIST === -->
    <div class="card" id="gist-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <label>📚 Kho phụ đề</label>
            <div style="display:flex;gap:6px;">
                <button class="btn-sm" style="padding:4px 8px;font-size:10px;" onclick="renameCurrentVideo()">✏️</button>
                <button class="btn-sm" style="padding:4px 8px;font-size:10px;color:var(--accent);" onclick="deleteCurrentVideo()">🗑️</button>
            </div>
        </div>
        <div class="row">
            <select id="gist-select" onchange="onGistSelected(this.value)">
                <option value="">-- Chọn phụ đề... --</option>
            </select>
            <button class="btn-sm" style="width:40px" id="btn-reload" onclick="loadGistLibrary(true)">🔄</button>
        </div>
        <p style="font-size:10px;color:var(--text-secondary);margin-top:4px" id="matched-sub-note">Sẵn sàng</p>
    </div>

    <!-- === PLAYER === -->
    <div class="player-wrap hidden" id="video-wrapper"><div id="player"></div></div>

    <div class="card" style="padding:10px 16px" id="timeline-card">
        <div class="row" style="align-items:center;gap:10px">
            <input type="range" id="time-slider" value="0" min="0" max="100" step="0.1" 
                   oninput="onSliderSeek(this.value)" onchange="onSliderChange(this.value)"
                   style="flex:1;accent-color:var(--accent);height:4px;cursor:pointer">
            <span style="font-size:11px;color:var(--text-secondary);min-width:70px;text-align:right" id="time-display">00:00 / 00:00</span>
        </div>
    </div>

    <!-- === CONTROLS === -->
    <div class="card" style="padding:10px 16px">
        <div class="row" style="flex-wrap:wrap;gap:6px">
            <button class="btn-sm" id="btn-play-pause" onclick="togglePlayPause()">⏵ Play</button>
            <button class="btn-sm" onclick="toggleVideoVisibility()">🎥 Video</button>
            <button class="btn-sm" onclick="cyclePlaybackRate()" id="btn-speed">⚡ 1.0x</button>
            <button class="btn-sm" id="btn-loop" onclick="toggleLoop()">🔁 Repeat</button>
            <button class="btn-sm" onclick="toggleSubSettings()">⚙️ Size</button>
            <span style="font-size:11px;color:var(--text-secondary);margin-left:auto" id="status-text">Sẵn sàng</span>
        </div>
        <div id="sub-settings-panel" style="display:none;margin-top:8px">
            <div class="setting-row"><label>Chữ Hán</label><input type="range" min="14" max="36" value="20" oninput="updateFont('cn',this.value)"><span id="val-cn">20px</span></div>
            <div class="setting-row"><label>Pinyin</label><input type="range" min="12" max="28" value="16" oninput="updateFont('py',this.value)"><span id="val-py">16px</span></div>
            <div class="setting-row"><label>Tiếng Việt</label><input type="range" min="10" max="24" value="14" oninput="updateFont('vi',this.value)"><span id="val-vi">14px</span></div>
        </div>
    </div>

    <!-- === SUBTITLE BOX === -->
    <div id="subtitle-box"><span style="color:var(--text-secondary);font-size:14px">Chọn phụ đề + Play, hoặc upload audio mới...</span></div>

    <!-- === LOG === -->
    <div class="card" id="log-card"><label>📋 Tiến trình</label><div id="logBox">🟢 Sẵn sàng</div></div>
</div>

<script>
// ===== STATE =====
let player, subtitles=[], syncInterval=null, activeSubIndex=-1;
let currentGistItem=null;
let isLoopEnabled=false, currentSpeedIndex=2;
const speeds=[0.5,0.75,1.0,1.25,1.5,2.0];
let gh_cloud_map={};
let selectedFile = null;
let uploadInterval = null;
let isUploading = false;

// ===== INIT =====
function onYouTubeIframeAPIReady() {
    loadSettings();
    loadGistLibrary(false);
}

function loadSettings() {
    document.getElementById('ghUser').value = localStorage.gh_user || 'PinyinCode';
    document.getElementById('ghRepo').value = localStorage.gh_repo || 'subtitle-ai';
    document.getElementById('ghToken').value = localStorage.gh_token || '';
    document.getElementById('gistToken').value = localStorage.gist_token || '';
    gh_cloud_map = JSON.parse(localStorage.getItem('gh_cloud_map') || '{}');
}

function saveSettings() {
    localStorage.gh_user = document.getElementById('ghUser').value.trim();
    localStorage.gh_repo = document.getElementById('ghRepo').value.trim();
    localStorage.gh_token = document.getElementById('ghToken').value.trim();
    localStorage.gist_token = document.getElementById('gistToken').value.trim();
    
    // Nếu token thay đổi, xóa cache
    localStorage.removeItem('gh_last_scan');
    localStorage.removeItem('gh_cloud_map');
    gh_cloud_map = {};
    
    log('✅ Đã lưu cấu hình!', 'ok');
    loadGistLibrary(true);
}

function toggleSettings() {
    const c = document.getElementById('settings-card');
    c.style.display = c.style.display === 'none' ? 'block' : 'none';
}

function toggleSubSettings() {
    const p = document.getElementById('sub-settings-panel');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

let allCardsVisible = true;
function toggleAllCards() {
    const btn = document.getElementById('toggle-all-btn');
    const cards = ['upload-card', 'gist-card', 'settings-card', 'log-card'];
    allCardsVisible = !allCardsVisible;
    cards.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('hidden', !allCardsVisible);
    });
    btn.textContent = allCardsVisible ? '👁️ Ẩn tất cả' : '👁️ Hiện tất cả';
}

function updateFont(t, v) {
    document.documentElement.style.setProperty(`--fs-${t}`, v + 'px');
    document.getElementById(`val-${t}`).innerText = v + 'px';
}

function cyclePlaybackRate() {
    currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
    let r = speeds[currentSpeedIndex];
    document.getElementById('btn-speed').innerText = `⚡ ${r}x`;
    if (player?.setPlaybackRate) player.setPlaybackRate(r);
}

function toggleLoop() {
    isLoopEnabled = !isLoopEnabled;
    document.getElementById('btn-loop').classList.toggle('active', isLoopEnabled);
}

// ===== LOG & PROGRESS =====
function log(m, c = '') {
    const t = new Date().toLocaleTimeString('vi-VN');
    const logBox = document.getElementById('logBox');
    logBox.innerHTML += `<br><span class="log-${c}">[${t}] ${m}</span>`;
    logBox.scrollTop = logBox.scrollHeight;
}

function prog(p, text = '', speed = '', eta = '') {
    document.getElementById('pb').style.width = Math.min(p, 100) + '%';
    if (text) document.getElementById('pbText').innerText = text;
    if (speed) document.getElementById('pbSpeed').innerText = speed;
    if (eta) document.getElementById('pbEta').innerText = '⏱ ' + eta;
}

// ===== VIDEO ID =====
function onVideoIdInput() {
    const val = document.getElementById('video-id').value;
    document.getElementById('btn-clear-id').style.display = val ? 'block' : 'none';
}

function clearVideoId() {
    document.getElementById('video-id').value = '';
    document.getElementById('btn-clear-id').style.display = 'none';
}

function openY2Mate() {
    const vid = document.getElementById('video-id').value.trim();
    if (!vid) {
        alert('Vui lòng nhập Video ID!');
        return;
    }
    const url = `https://www.y2mate.com/vi/youtube-mp3?url=https://youtu.be/${vid}`;
    window.open(url, '_blank');
    log(`📥 Đã mở y2mate cho video ${vid}`, 'info');
}

// ===== FILE HANDLING =====
function handleFileSelect(file) {
    if (!file) return;
    selectedFile = file;
    document.getElementById('file-name').textContent = `📄 ${file.name} (${(file.size/1024/1024).toFixed(2)}MB)`;
    document.getElementById('file-name').style.color = 'var(--green)';
    
    // Hiển thị thông tin file
    const info = document.getElementById('file-info');
    info.innerHTML = `
        <span class="status-badge processing">📄 ${file.name}</span>
        <span class="status-badge done">${(file.size/1024/1024).toFixed(2)} MB</span>
    `;
    log(`✅ Đã chọn file: ${file.name} (${(file.size/1024/1024).toFixed(2)}MB)`, 'ok');
    document.getElementById('pbText').textContent = 'Sẵn sàng upload';
}

// Drag and drop
const dropArea = document.getElementById('drop-area');
dropArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropArea.classList.add('dragover');
});
dropArea.addEventListener('dragleave', () => {
    dropArea.classList.remove('dragover');
});
dropArea.addEventListener('drop', (e) => {
    e.preventDefault();
    dropArea.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files[0]);
    }
});

function clearAll() {
    selectedFile = null;
    document.getElementById('file-name').textContent = 'Chưa có file';
    document.getElementById('file-name').style.color = 'var(--text-secondary)';
    document.getElementById('file-info').innerHTML = '';
    document.getElementById('file-input').value = '';
    prog(0, 'Sẵn sàng');
    document.getElementById('status-text').textContent = 'Sẵn sàng';
}

// ===== UPLOAD TO GITHUB =====
async function uploadToGitHub() {
    if (!selectedFile) {
        alert('Vui lòng chọn file audio trước!');
        return;
    }
    
    if (isUploading) return;
    isUploading = true;
    
    const token = localStorage.gh_token || document.getElementById('ghToken').value.trim();
    const user = localStorage.gh_user || document.getElementById('ghUser').value.trim() || 'PinyinCode';
    const repo = localStorage.gh_repo || document.getElementById('ghRepo').value.trim() || 'subtitle-ai';
    
    if (!token) {
        alert('Vui lòng nhập GitHub Token trong phần Cài đặt!');
        isUploading = false;
        return;
    }
    
    const videoId = document.getElementById('video-id').value.trim() || extractVideoID(selectedFile.name);
    if (!videoId) {
        alert('Không thể xác định Video ID. Vui lòng nhập vào ô Video ID.');
        isUploading = false;
        return;
    }
    
    const btn = document.getElementById('btn-upload');
    btn.disabled = true;
    btn.textContent = '⏳ ĐANG UPLOAD...';
    btn.style.opacity = '0.6';
    
    log(`📤 Bắt đầu upload ${selectedFile.name} lên GitHub...`, 'info');
    prog(10, 'Đang đọc file...');
    document.getElementById('status-text').innerHTML = `<span class="status-badge uploading">Uploading</span>`;
    
    try {
        // Đọc file
        const reader = new FileReader();
        const content = await new Promise((resolve) => {
            reader.onload = (e) => resolve(e.target.result.split(',')[1]);
            reader.readAsDataURL(selectedFile);
        });
        
        prog(30, 'Đang upload lên GitHub...');
        
        // Upload lên GitHub
        const path = `data/audio/${videoId}.m4a`;
        const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${path}`;
        
        // Kiểm tra file tồn tại
        let sha = null;
        try {
            const checkRes = await fetch(apiUrl, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (checkRes.ok) {
                const data = await checkRes.json();
                sha = data.sha;
                log(`📝 File đã tồn tại, sẽ ghi đè`, 'info');
            }
        } catch (e) {}
        
        // Upload
        const body = {
            message: `Upload audio ${videoId}`,
            content: content,
            branch: 'main'
        };
        if (sha) body.sha = sha;
        
        const uploadRes = await fetch(apiUrl, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
        
        if (uploadRes.ok) {
            log(`✅ Upload thành công: ${videoId}.m4a`, 'ok');
            prog(80, 'Đang kích hoạt GitHub Actions...');
            
            // Kích hoạt GitHub Actions
            try {
                const dispatchRes = await fetch(`https://api.github.com/repos/${user}/${repo}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'process_audio',
                        client_payload: { video_id: videoId }
                    })
                });
                if (dispatchRes.ok) {
                    log('✅ Đã kích hoạt GitHub Actions!', 'ok');
                } else {
                    log('⚠️ Không thể kích hoạt Actions (có thể đã chạy tự động)', 'info');
                }
            } catch (e) {
                log('⚠️ Lỗi kích hoạt Actions: ' + e.message, 'err');
            }
            
            prog(100, '✅ Hoàn tất!');
            document.getElementById('status-text').innerHTML = `<span class="status-badge done">✅ Done</span>`;
            log('🎉 Audio đã được upload, AI đang xử lý... (3-5 phút)', 'ok');
            
            // Bắt đầu kiểm tra phụ đề sau 10 giây
            setTimeout(() => {
                checkAndLoadGist(videoId);
            }, 10000);
            
            // Tự động tải lại danh sách sau 3 phút
            setTimeout(() => {
                loadGistLibrary(true);
            }, 180000);
            
        } else {
            const err = await uploadRes.json();
            log(`❌ Upload thất bại: ${err.message || uploadRes.status}`, 'err');
            prog(0, 'Thất bại');
            document.getElementById('status-text').innerHTML = `<span class="status-badge error">❌ Error</span>`;
        }
        
    } catch (e) {
        log(`❌ Lỗi: ${e.message}`, 'err');
        prog(0, 'Lỗi');
        document.getElementById('status-text').innerHTML = `<span class="status-badge error">❌ Error</span>`;
    }
    
    btn.disabled = false;
    btn.textContent = '📤 UPLOAD LÊN GITHUB';
    btn.style.opacity = '1';
    isUploading = false;
}

// ===== GIST =====
async function loadGistLibrary(force = false) {
    const select = document.getElementById('gist-select');
    select.innerHTML = '<option value="">-- Scan... --</option>';
    let items = [];
    const token = localStorage.gist_token || document.getElementById('gistToken').value.trim();
    const ghToken = localStorage.gh_token || document.getElementById('ghToken').value.trim();
    const user = localStorage.gh_user || document.getElementById('ghUser').value.trim() || 'PinyinCode';
    
    // Ưu tiên dùng gist_token, nếu không có dùng gh_token
    const finalToken = token || ghToken;
    if (!finalToken) {
        select.innerHTML = '<option value="">-- Cần token --</option>';
        document.getElementById('matched-sub-note').innerText = '⚠️ Thiếu token! Vào Cài đặt nhập token.';
        return;
    }
    
    let lastScan = parseInt(localStorage.getItem('gh_last_scan') || '0');
    let now = Date.now();
    
    if (!force && (now - lastScan) < 300000 && Object.keys(gh_cloud_map).length > 0) {
        for (let vId in gh_cloud_map) {
            let e = gh_cloud_map[vId];
            items.push({ videoId: vId, rawUrl: e.url, title: e.title });
        }
    } else {
        try {
            const res = await fetch('https://api.github.com/gists?per_page=100', {
                headers: { "Authorization": `token ${finalToken}` }
            });
            if (res.ok) {
                const gists = await res.json();
                const newMap = {};
                for (let g of gists) {
                    if (g.files) {
                        for (let fn in g.files) {
                            if (fn.endsWith('.vtt')) {
                                let v = fn.replace('.vtt', '');
                                if (!newMap[v]) {
                                    newMap[v] = {
                                        url: g.files[fn].raw_url,
                                        title: (g.description || '').replace(/^.*Subtitle\s*-\s*/i, '').trim() || `Video ${v}`
                                    };
                                }
                            }
                        }
                    }
                }
                gh_cloud_map = newMap;
                localStorage.setItem('gh_cloud_map', JSON.stringify(newMap));
                localStorage.setItem('gh_last_scan', now);
                for (let vId in newMap) {
                    let e = newMap[vId];
                    items.push({ videoId: vId, rawUrl: e.url, title: e.title });
                }
            } else {
                log('❌ Không thể tải Gist: ' + res.status, 'err');
            }
        } catch (e) {
            log('❌ Lỗi tải Gist: ' + e.message, 'err');
        }
    }
    
    if (!items.length) {
        for (let vId in gh_cloud_map) {
            let e = gh_cloud_map[vId];
            items.push({ videoId: vId, rawUrl: e.url, title: e.title });
        }
    }
    
    items.sort((a, b) => b.videoId.localeCompare(a.videoId));
    select.innerHTML = items.length ? `<option value="">-- Chọn (${items.length}) --</option>` :
        '<option value="">-- Chưa có --</option>';
    items.forEach(i => {
        let o = document.createElement('option');
        o.value = JSON.stringify(i);
        o.textContent = i.title;
        select.appendChild(o);
    });
    document.getElementById('matched-sub-note').innerText = items.length ? `${items.length} video` : 'Chưa có video';
}

function onGistSelected(val) {
    if (!val) { currentGistItem = null; return; }
    try {
        currentGistItem = JSON.parse(val);
        document.getElementById('matched-sub-note').innerText = `📦 ${currentGistItem.title}`;
    } catch (e) { currentGistItem = null; }
}

// ===== CHECK & LOAD GIST =====
async function checkAndLoadGist(vid) {
    log(`🔍 Kiểm tra phụ đề mới cho ${vid}...`, 'info');
    const token = localStorage.gist_token || document.getElementById('gistToken').value.trim();
    const ghToken = localStorage.gh_token || document.getElementById('ghToken').value.trim();
    const finalToken = token || ghToken;
    if (!finalToken) return;
    
    try {
        const res = await fetch('https://api.github.com/gists?per_page=100', {
            headers: { "Authorization": `token ${finalToken}` }
        });
        
        if (res.ok) {
            const gists = await res.json();
            for (let g of gists) {
                if (g.files && g.files[`${vid}.vtt`]) {
                    gh_cloud_map[vid] = {
                        url: g.files[`${vid}.vtt`].raw_url,
                        title: (g.description || '').replace(/^.*Subtitle\s*-\s*/i, '').trim() || `Video ${vid}`
                    };
                    localStorage.setItem('gh_cloud_map', JSON.stringify(gh_cloud_map));
                    await loadGistLibrary(true);
                    document.getElementById('matched-sub-note').innerText = '✅ Phụ đề mới!';
                    log('🎉 Phụ đề đã sẵn sàng!', 'ok');
                    document.getElementById('status-text').innerHTML = `<span class="status-badge done">✅ Done</span>`;
                    return true;
                }
            }
        }
        log('⏳ Chưa thấy phụ đề, thử lại sau...', 'info');
        setTimeout(() => checkAndLoadGist(vid), 30000);
        return false;
    } catch (e) {
        log('Lỗi kiểm tra: ' + e.message, 'err');
        return false;
    }
}

// ===== RENAME & DELETE =====
async function renameCurrentVideo() {
    if (!currentGistItem) { alert('Chọn phụ đề trước!'); return; }
    let nt = prompt('Nhập tên mới:', currentGistItem.title);
    if (!nt || !nt.trim()) return;
    nt = nt.trim();
    
    const token = localStorage.gist_token || document.getElementById('gistToken').value.trim();
    const ghToken = localStorage.gh_token || document.getElementById('ghToken').value.trim();
    const finalToken = token || ghToken;
    if (!finalToken) { alert('Cần Token!'); return; }
    let vid = currentGistItem.videoId;
    
    try {
        let res = await fetch('https://api.github.com/gists?per_page=100', {
            headers: { "Authorization": `token ${finalToken}` }
        });
        if (res.ok) {
            let gists = await res.json();
            for (let g of gists) {
                if (g.files && g.files[`${vid}.vtt`]) {
                    await fetch(`https://api.github.com/gists/${g.id}`, {
                        method: 'PATCH',
                        headers: { "Authorization": `token ${finalToken}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ description: `Pinyin AI Subtitle - ${nt}` })
                    });
                    break;
                }
            }
        }
    } catch (e) {}
    
    gh_cloud_map[vid].title = nt;
    localStorage.setItem('gh_cloud_map', JSON.stringify(gh_cloud_map));
    currentGistItem.title = nt;
    loadGistLibrary(false);
    document.getElementById('matched-sub-note').innerText = `✏️ ${nt}`;
}

async function deleteCurrentVideo() {
    if (!currentGistItem) { alert('Chọn phụ đề trước!'); return; }
    let vid = currentGistItem.videoId, title = currentGistItem.title;
    if (!confirm(`Xóa "${title}"?`)) return;
    
    const token = localStorage.gist_token || document.getElementById('gistToken').value.trim();
    const ghToken = localStorage.gh_token || document.getElementById('ghToken').value.trim();
    const finalToken = token || ghToken;
    if (!finalToken) { alert('Cần Token!'); return; }
    
    try {
        for (let page = 1; page <= 10; page++) {
            let res = await fetch(`https://api.github.com/gists?page=${page}&per_page=100`, {
                headers: { "Authorization": `token ${finalToken}` }
            });
            if (!res.ok) break;
            let gists = await res.json();
            if (!gists || !gists.length) break;
            for (let g of gists) {
                if (g.files && g.files[`${vid}.vtt`]) {
                    await fetch(`https://api.github.com/gists/${g.id}`, {
                        method: 'DELETE',
                        headers: { "Authorization": `token ${finalToken}` }
                    });
                    break;
                }
            }
        }
    } catch (e) {}
    
    delete gh_cloud_map[vid];
    localStorage.setItem('gh_cloud_map', JSON.stringify(gh_cloud_map));
    currentGistItem = null;
    loadGistLibrary(false);
    document.getElementById('subtitle-box').innerHTML = '<span style="color:var(--text-secondary)">Đã xóa</span>';
    document.getElementById('matched-sub-note').innerText = `Đã xóa: ${title}`;
}

// ===== PLAYER FUNCTIONS =====
function loadVideoFromGist(item) {
    log(`🎬 Load: ${item.title}`, 'info');
    fetch(item.rawUrl).then(r => r.text()).then(text => {
        subtitles = parseVTT(text);
        document.getElementById('matched-sub-note').innerText = `📦 ${item.title}`;
        document.getElementById('video-wrapper').classList.remove('hidden');
        
        if (player) {
            player.destroy();
            player = null;
        }
        
        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            videoId: item.videoId,
            playerVars: { playsinline: 1, autoplay: 0, controls: 0, rel: 0, showinfo: 0 },
            events: {
                onReady: (e) => {
                    startSync();
                    e.target.pauseVideo();
                    e.target.seekTo(0, true);
                    updatePlayPauseBtn(false);
                },
                onStateChange: onPlayerStateChange
            }
        });
    });
}

function startSync() {
    if (syncInterval) clearInterval(syncInterval);
    syncInterval = setInterval(syncSub, 200);
}

function syncSub() {
    updateTimeline();
    if (!player?.getCurrentTime || !subtitles.length) return;
    const t = player.getCurrentTime();
    const idx = subtitles.findIndex(s => t >= s.start && t <= s.end);
    if (idx !== -1 && idx !== activeSubIndex) {
        activeSubIndex = idx;
        const s = subtitles[idx];
        document.getElementById('subtitle-box').innerHTML = `
            <div class="cn">${s.rawLines[0]}</div>
            <div class="py">${s.rawLines[1]}</div>
            <div class="vi">${s.rawLines[2]}</div>`;
    }
}

function onPlayerStateChange(e) {
    if (e.data == YT.PlayerState.PLAYING) {
        updatePlayPauseBtn(true);
    } else if (e.data == YT.PlayerState.PAUSED || e.data == YT.PlayerState.ENDED) {
        updatePlayPauseBtn(false);
        if (e.data == YT.PlayerState.ENDED && isLoopEnabled && player) {
            player.seekTo(0, true);
            player.playVideo();
        }
    }
}

function togglePlayPause() {
    if (!currentGistItem) { alert('Chọn phụ đề trước!'); return; }
    if (!player?.getPlayerState) { loadVideoFromGist(currentGistItem); return; }
    if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
    else player.playVideo();
}

function updatePlayPauseBtn(p) {
    const b = document.getElementById('btn-play-pause');
    if (b) b.innerHTML = p ? '⏸ Pause' : '⏵ Play';
}

function toggleVideoVisibility() {
    document.getElementById('video-wrapper').classList.toggle('hidden');
}

// ===== TIMELINE =====
let videoDuration = 0, isSeeking = false;

function formatTime(seconds) {
    if (isNaN(seconds)) return '00:00';
    let m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
    return `${m<10?'0':''}${m}:${s<10?'0':''}${s}`;
}

function onSliderSeek(val) {
    isSeeking = true;
    if (player?.getDuration) {
        videoDuration = player.getDuration();
        document.getElementById('time-display').innerText = `${formatTime((val/100)*videoDuration)} / ${formatTime(videoDuration)}`;
    }
}

function onSliderChange(val) {
    if (player?.seekTo) player.seekTo((val / 100) * player.getDuration(), true);
    setTimeout(() => { isSeeking = false; }, 200);
}

function updateTimeline() {
    if (!player?.getCurrentTime || isSeeking) return;
    let t = player.getCurrentTime(), d = player.getDuration();
    if (d > 0) {
        videoDuration = d;
        document.getElementById('time-slider').value = (t / d) * 100;
        document.getElementById('time-display').innerText = `${formatTime(t)} / ${formatTime(d)}`;
    }
}

// ===== UTILS =====
function extractVideoID(input) {
    if (!input) return null;
    const m = input.match(/(?:v=|\/)([\w-]{11})/);
    return m ? m[1] : (input.length === 11 ? input : null);
}

function parseVTT(d) {
    const n = d.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const b = n.split('\n\n');
    let s = [];
    b.forEach(b => {
        const l = b.split('\n');
        let t = -1;
        for (let i = 0; i < l.length; i++) {
            if (l[i].includes('-->')) { t = i; break; }
        }
        if (t !== -1) {
            const ts = l[t].split('-->');
            if (ts.length === 2) {
                const st = parseTime(ts[0].trim()), en = parseTime(ts[1].trim());
                let r = l.slice(t + 1).map(x => x.replace(/<[^>]*>/g, '').trim()).filter(x => x !== "");
                while (r.length < 3) r.push("");
                s.push({ start: st, end: en, rawLines: r });
            }
        }
    });
    return s;
}

function parseTime(t) {
    t = t.replace(',', '.');
    const p = t.split(':');
    return p.length < 3 ? 0 : parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
}
