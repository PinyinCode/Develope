<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinyin AI - Auto Scan Gist</title>
    <style>
        /* ... giữ nguyên CSS cũ ... */
        .progress-info .eta { color: var(--yellow); font-size: 10px; }
        .restore-banner {
            background: var(--blue); color: white; padding: 10px 16px;
            border-radius: var(--element-radius); margin-bottom: 10px;
            display: none; align-items: center; justify-content: space-between;
            font-size: 13px; font-weight: 500;
        }
        .restore-banner .btn-sm {
            background: rgba(255,255,255,0.2); color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .restore-banner .btn-sm:hover { background: rgba(255,255,255,0.3); }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div class="container">
    <div class="app-header"><h3>🎬 Pinyin AI</h3></div>

    <!-- Restore Banner -->
    <div class="restore-banner" id="restore-banner">
        <span id="restore-message">🔄 Đang khôi phục tiến trình...</span>
        <button class="btn-sm" onclick="restoreProgress()">🔄 Khôi phục</button>
    </div>

    <div class="card" id="input-card">
        <label>🔗 Link YouTube (để tải phụ đề mới)</label>
        <div class="row">
            <div class="input-wrap">
                <input type="text" id="yt-link" placeholder="Dán link YouTube để tải phụ đề..." oninput="onUrlInput()">
                <button class="btn-clear-input" id="btn-clear" onclick="clearUrl()">×</button>
            </div>
            <button class="btn-accent" id="btn-action" style="width:80px" onclick="handleMainAction()">▶️ TẢI</button>
        </div>
        <div class="progress-wrap"><div class="progress-bar" id="pb"></div></div>
        <div class="progress-info">
            <span id="pbText">Sẵn sàng</span>
            <span class="speed" id="pbSpeed">--</span>
            <span class="eta" id="pbEta"></span>
        </div>
    </div>

    <!-- ... Phần còn lại giữ nguyên ... -->
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span class="settings-toggle" onclick="toggleSettings()">⚙️ Cài đặt ▾</span>
        <span class="settings-toggle" id="toggle-all-btn" onclick="toggleAllCards()">👁️ Ẩn</span>
    </div>

    <div class="card" id="settings-card" style="display:none;">
        <label>GitHub Username</label><input type="text" id="ghUser" placeholder="Username" style="margin-bottom:10px">
        <label>Repository</label><input type="text" id="ghRepo" placeholder="Repository" style="margin-bottom:10px">
