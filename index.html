<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Hanyu - Pinyin - Auto Scan Gist Cross-Browser</title>
    <style>
        /* GIỮ NGUYÊN TOÀN BỘ CSS CŨ */
        :root {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.75);
            --card-solid: #1c1c1e;
            --text-main: #f5f5f7;
            --text-secondary: #98989f;
            --accent: #ff2d55;
            --accent-light: rgba(255, 45, 85, 0.15);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --radius: 20px;
            --element-radius: 12px;
            --fs-cn: 20px;
            --fs-py: 16px;
            --fs-vi: 14px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .container { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 16px; }
        .app-header { text-align: center; padding: 6px 0; }
        .app-header h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--text-main); }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            transition: all 0.3s ease;
            max-height: 700px;
            overflow: hidden;
            opacity: 1;
        }
        .card.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; margin-bottom: 0; opacity: 0; border-color: transparent; pointer-events: none; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        .input-group:last-child { margin-bottom: 0; }
        label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .url-row { display: flex; gap: 8px; align-items: center; position: relative; }
        .input-wrapper-flex { position: relative; flex: 1; display: flex; align-items: center; }
        .url-row input[type="text"] { width: 100%; padding-right: 36px; }
        .btn-clear-input { position: absolute; right: 10px; background: none; border: none; color: var(--text-secondary); font-size: 18px; font-weight: bold; cursor: pointer; padding: 0 4px; display: none; z-index: 2; }
        .btn-clear-input:hover { color: var(--text-main); }
        input[type="text"], input[type="password"], select {
            width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color); border-radius: var(--element-radius);
            color: var(--text-main); font-size: 14px; box-sizing: border-box; outline: none; transition: all 0.2s ease;
        }
        select {
            cursor: pointer; appearance: none; -webkit-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2398989f" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat; background-position: right 10px center; padding-right: 32px;
        }
        select option { background-color: var(--card-solid); color: var(--text-main); }
        input:focus, select:focus { background-color: var(--card-solid); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-light); }
        button.btn-action-inline {
            padding: 12px 16px; background-color: var(--accent); color: white; border: none;
            border-radius: var(--element-radius); font-weight: 600; font-size: 13px; cursor: pointer;
            white-space: nowrap; box-shadow: 0 4px 15px var(--accent-light); transition: transform 0.1s, opacity 0.2s;
        }
        button.btn-action-inline:active { transform: scale(0.96); opacity: 0.9; }
        button.btn-action-inline.cancel-state { background-color: var(--text-secondary); box-shadow: none; }
        button.btn-github { background-color: #2ea043; box-shadow: 0 4px 15px rgba(46, 160, 67, 0.3); }
        .file-options-row { display: flex; gap: 8px; align-items: center; }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; flex: 1; }
        .file-upload-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .btn-file { display: block; width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main); text-align: center; border-radius: var(--element-radius); font-weight: 500; font-size: 13px; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .selected-file-box { display: none; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: var(--element-radius); font-size: 13px; color: var(--accent); font-weight: 500; margin-top: 8px; }
        .selected-file-box.show { display: flex; }
        .btn-remove-sub { background: none; border: none; color: var(--text-secondary); font-size: 16px; cursor: pointer; padding: 0 4px; font-weight: bold; }
        .btn-remove-sub:hover { color: var(--accent); }
        .matched-sub-note { font-size: 12px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-container { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .player-container.hidden { display: none; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .timeline-card { background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 14px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
        .timeline-slider-wrapper { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }
        .time-info { font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; min-width: 75px; text-align: right; font-weight: 500; }
        .control-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; border-top: 1px solid var(--border-color); padding-top: 10px; gap: 6px; flex-wrap: wrap; }
        .control-buttons-left { display: flex; gap: 5px; flex-wrap: wrap; }
        .timeline-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color); color: var(--text-main); font-weight: 500; cursor: pointer; padding: 6px 10px; border-radius: 8px; font-size: 11px; }
        .timeline-btn.active { background-color: var(--accent-light); border-color: var(--accent); color: var(--accent); }
        .sub-settings-panel { display: none; flex-direction: column; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .sub-settings-panel.show { display: flex; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .setting-row label { font-size: 11px; color: var(--text-secondary); text-transform: none; }
        .setting-row span { font-size: 11px; color: var(--text-main); text-align: right; }
        #subtitle-box { background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid var(--border-color); padding: 24px 16px; border-radius: var(--radius); box-shadow: var(--shadow); min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; text-align: center; box-sizing: border-box; }
        .sub-line { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; width: 100%; }
        .line-cn .word { font-size: var(--fs-cn); }
        .line-py .word { font-size: var(--fs-py); }
        .karaoke-line .word { display: inline-block; font-weight: 600; color: var(--text-secondary); transition: color 0.15s ease, transform 0.15s ease; }
        .karaoke-line .highlight { color: var(--text-main); transform: scale(1.02); text-shadow: 0 0 20px rgba(255, 45, 85, 0.4); }
        .vietnamese-line { font-size: var(--fs-vi); font-weight: 400; color: var(--accent); opacity: 0.95; border-top: 1px solid var(--border-color); padding-top: 8px; width: 80%; text-align: center; }
        .status { font-size: 11px; color: var(--text-secondary); text-align: right; }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div class="container">
    <div class="app-header"><h3>Pinyin AI - Auto Scan Gist Cross-Browser</h3></div>
    <div class="card" id="input-card">
        <div class="input-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>Link YouTube hoặc Tên Video</label>
                <button type="button" class="timeline-btn" style="padding: 2px 8px; font-size: 10px;" onclick="renameActiveVideo()" title="Sửa tên video đang chạy">✏️ Sửa tên video</button>
            </div>
            <div class="url-row">
                <div class="input-wrapper-flex">
                    <input type="text" id="yt-link" placeholder="Dán link hoặc tên video..." oninput="onUrlInputChanged()">
                    <button type="button" id="btn-clear" class="btn-clear-input" onclick="clearUrlInput()">×</button>
                </div>
                <button id="btn-action" class="btn-action-inline" onclick="handleMainAction()">Tải</button>
            </div>
        </div>
        <div class="input-group" style="margin-top: 10px;">
            <label>Kho phụ đề & liên kết GitHub đã lưu</label>
            <div class="url-row">
                <select id="gist-select" onchange="onGistSelected(this.value)">
                    <option value="">-- Mở kho phụ đề & video đã lưu --</option>
                </select>
                <button type="button" class="timeline-btn" style="padding: 12px 12px; white-space: nowrap;" onclick="loadGistLibrary(false)" title="Làm mới danh sách">🔄</button>
            </div>
        </div>
        <div class="input-group" style="margin-top: 10px;">
            <label>Chọn tệp phụ đề trực tiếp (.vtt)</label>
            <div class="file-options-row">
                <div class="file-upload-wrapper"><div class="btn-file" id="file-label">Chọn tệp .vtt</div><input type="file" id="srt-file" accept=".vtt" onchange="handleFileSelect(event)"></div>
            </div>
            <div class="selected-file-box" id="selected-file-box"><span id="selected-file-name">Chưa chọn tệp</span><button type="button" class="btn-remove-sub" onclick="removeSelectedSub()">×</button></div>
            <div class="file-options-row" style="margin-top: 10px;"><button type="button" class="btn-action-inline btn-github" style="width: 100%;" onclick="syncToGitHub()">☁️ Tạo bản sao & Đẩy lên GitHub Gist</button></div>
            <div class="matched-sub-note" id="matched-sub-note">Trạng thái: Đang chờ tải dữ liệu...</div>
        </div>
    </div>
    <div class="player-container hidden" id="video-wrapper"><div id="player"></div></div>
    <div class="timeline-card">
        <div class="timeline-slider-wrapper"><input type="range" id="time-slider" value="0" min="0" max="100" step="0.1" oninput="onSliderSeek(this.value)" onchange="onSliderChange(this.value)"><span class="time-info" id="time-display">00:00 / 00:00</span></div>
        <div class="control-row">
            <div class="control-buttons-left">
                <button class="timeline-btn" id="btn-play-pause" onclick="togglePlayPause()">⏵ Play</button>
                <button class="timeline-btn" onclick="toggleVideoVisibility()">🎥 Video</button>
                <button class="timeline-btn" onclick="cyclePlaybackRate()" id="btn-speed">⚡ 1.0x</button>
                <button class="timeline-btn" id="btn-loop" onclick="toggleLoop()">🔁 Repeat</button>
                <button class="timeline-btn" onclick="toggleSubSettings()">⚙️ Size</button>
            </div>
            <span class="status" id="status-text">Sẵn sàng</span>
        </div>
        <div class="sub-settings-panel" id="sub-settings-panel">
            <div class="setting-row"><label>Chữ Hán (Line 1)</label><input type="range" min="14" max="36" value="20" oninput="updateSubFontSize('cn', this.value)"><span id="val-cn">20px</span></div>
            <div class="setting-row"><label>Phiên âm (Line 2)</label><input type="range" min="12" max="28" value="16" oninput="updateSubFontSize('py', this.value)"><span id="val-py">16px</span></div>
            <div class="setting-row"><label>Tiếng Việt (Line 3)</label><input type="range" min="10" max="24" value="14" oninput="updateSubFontSize('vi', this.value)"><span id="val-vi">14px</span></div>
        </div>
    </div>
    <div id="subtitle-box"><span style="color: var(--text-secondary); font-size: 14px;">Lời bài hát sẽ hiển thị tại đây...</span></div>
</div>

<script>
// ===== GIỮ NGUYÊN TẤT CẢ BIẾN CŨ =====
let player;
let subtitles = [];
let syncInterval = null;
let activeSubIndex = -1;
let selectedSubFile = null; 
let isSeeking = false;
let videoDuration = 0;
let isLoadingState = false;
let isLoopEnabled = false;
const speeds = [0.5, 0.75, 1.0, 1.25, 1.5, 2.0];
let currentSpeedIndex = 2;
let lastProcessedVideoId = "";

// ===== THÊM BIẾN MỚI CHO TÍNH NĂNG TẢI AUDIO =====
let pc_url = '';
let gh_cloud_map = {};

// ===== KHỞI TẠO =====
function onYouTubeIframeAPIReady() {
    document.getElementById('status-text').innerText = "Hệ thống sẵn sàng";
    // Load settings
    pc_url = localStorage.getItem('pc_url') || '';
    gh_cloud_map = JSON.parse(localStorage.getItem('gh_cloud_map') || '{}');
    loadGistLibrary(true); 
}

// ===== GIỮ NGUYÊN HÀM loadGistLibrary (CHỈ THÊM ĐỒNG BỘ XÓA) =====
async function loadGistLibrary(silent = false) {
    const select = document.getElementById('gist-select');
    select.innerHTML = '<option value="">-- Đang quét kho phụ đề... --</option>';
    
    let items = [];
    let cloudMap = JSON.parse(localStorage.getItem('gh_cloud_map') || "{}");
    let newCloudMap = {};
    
    for (let vId in cloudMap) {
        let entry = cloudMap[vId];
        if (typeof entry === 'object' && entry !== null) {
            items.push({ videoId: vId, rawUrl: entry.url, title: entry.title });
        } else {
            items.push({ videoId: vId, rawUrl: entry, title: `Video ID: ${vId}` });
        }
    }

    let token = localStorage.getItem('gh_pat_token');
    
    if (!token && !silent) {
        token = prompt("Lần đầu sử dụng hoặc chưa kết nối GitHub.\nVui lòng nhập GitHub Personal Access Token (PAT) của bạn để tải dữ liệu:");
        if (token !== null && token.trim() !== "") {
            token = token.trim();
            localStorage.setItem('gh_pat_token', token);
        } else {
            token = null;
        }
    }

    if (token) {
        try {
            let page = 1;
            let allGists = [];
            while (true) {
                let res = await fetch(`https://api.github.com/gists?page=${page}&per_page=100`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (!res.ok) break;
                let gists = await res.json();
                if (!gists || gists.length === 0) break;
                allGists = allGists.concat(gists);
                page++;
                if (page > 10) break;
            }
            
            for (let gist of allGists) {
                if (gist.files) {
                    for (let filename in gist.files) {
                        if (filename.endsWith('.vtt')) {
                            let vId = filename.replace('.vtt', '');
                            let rawUrl = gist.files[filename].raw_url;
                            let cleanTitle = (gist.description || `Video ID: ${vId}`).replace(/^Pinyin AI Subtitle\s*-\s*/i, '').trim();
                            if (cleanTitle.includes("YouTube ID:") || cleanTitle.startsWith("Video ID:") || !cleanTitle) {
                                cleanTitle = `Video Podcast (${vId})`;
                            }
                            if (!items.some(i => i.videoId === vId)) {
                                items.push({ videoId: vId, rawUrl: rawUrl, title: cleanTitle });
                            }
                            newCloudMap[vId] = { url: rawUrl, title: cleanTitle };
                        }
                    }
                }
            }
            gh_cloud_map = newCloudMap;
            localStorage.setItem('gh_cloud_map', JSON.stringify(newCloudMap));
        } catch(e) {
            console.error("Lỗi khi quét Gist:", e);
        }
    }

    if (Object.keys(newCloudMap).length === 0) {
        newCloudMap = cloudMap;
    }

    select.innerHTML = '<option value="">-- Mở kho phụ đề & video đã lưu --</option>';
    if (items.length === 0) {
        select.innerHTML = '<option value="">-- Chưa có video/sub nào được lưu --</option>';
        if (!silent) document.getElementById('matched-sub-note').innerText = "⚠️ Chưa tìm thấy sub/video nào trong kho.";
    } else {
        items.sort((a, b) => b.videoId.localeCompare(a.videoId));
        items.forEach(item => {
            let opt = document.createElement('option');
            opt.value = JSON.stringify(item);
            opt.textContent = `🎬 ${item.title}`;
            select.appendChild(opt);
        });
        let deletedCount = Object.keys(cloudMap).length - Object.keys(newCloudMap).length;
        let msg = `✅ Đã cập nhật ${items.length} video trong kho!`;
        if (deletedCount > 0) msg += ` (Đã xóa ${deletedCount})`;
        if (!silent) document.getElementById('matched-sub-note').innerText = msg;
    }
}

// ===== GIỮ NGUYÊN TẤT CẢ HÀM CŨ =====
function renameActiveVideo() {
    const inputVal = document.getElementById('yt-link').value.trim();
    let videoId = extractVideoID(inputVal);
    if (!videoId) { alert("Chưa có video nào đang được chọn hoặc chạy!"); return; }
    let cloudMap = JSON.parse(localStorage.getItem('gh_cloud_map') || "{}");
    let currentTitle = videoId;
    if (cloudMap[videoId] && typeof cloudMap[videoId] === 'object' && cloudMap[videoId].title) { currentTitle = cloudMap[videoId].title; }
    let newTitle = prompt("Nhập tên mới cho video đang chạy:", currentTitle);
    if (newTitle !== null && newTitle.trim() !== "") {
        newTitle = newTitle.trim();
        if (!cloudMap[videoId]) { cloudMap[videoId] = { url: "", title: newTitle }; }
        else if (typeof cloudMap[videoId] === 'object') { cloudMap[videoId].title = newTitle; }
        else { cloudMap[videoId] = { url: cloudMap[videoId], title: newTitle }; }
        localStorage.setItem('gh_cloud_map', JSON.stringify(cloudMap));
        loadGistLibrary(true);
        document.getElementById('matched-sub-note').innerText = `✏️ Đã cập nhật tên video thành: ${newTitle}`;
    }
}

async function onGistSelected(valueStr) {
    if (!valueStr) return;
    try {
        let item = JSON.parse(valueStr);
        let videoId = item.videoId;
        let ytInput = document.getElementById('yt-link');
        ytInput.value = `https://www.youtube.com/watch?v=${videoId}`;
        document.getElementById('btn-clear').style.display = 'block';
        lastProcessedVideoId = videoId;
        document.getElementById('status-text').innerText = "Đang nạp phụ đề từ kho...";
        let res = await fetch(item.rawUrl);
        if (res.ok) {
            let textContent = await res.text();
            loadSubTextContent(textContent, `${videoId}.vtt`);
            document.getElementById('matched-sub-note').innerText = `📦 Đã chọn từ kho: ${item.title}`;
            handleMainAction();
        } else { alert("Không thể tải file phụ đề từ GitHub!"); }
    } catch(e) { console.error("Lỗi chọn item Gist:", e); }
}

async function evaluateSubtitlePriority(videoId) {
    if (selectedSubFile) { document.getElementById('matched-sub-note').innerText = `🎯 Đang dùng phụ đề chọn thủ công: ${selectedSubFile.name}`; return true; }
    if (videoId) { let loadedCloud = await checkAndLoadFromCloud(videoId); if (loadedCloud) return true; }
    return false; // KHÔNG HIỆN CẢNH BÁO NỮA - Để handleMainAction xử lý
}

async function onUrlInputChanged() {
    const val = document.getElementById('yt-link').value;
    document.getElementById('btn-clear').style.display = val.length > 0 ? 'block' : 'none';
    let videoId = extractVideoID(val);
    if (videoId !== lastProcessedVideoId) {
        lastProcessedVideoId = videoId;
        selectedSubFile = null; 
        document.getElementById('selected-file-box').classList.remove('show');
        document.getElementById('file-label').innerText = "Chọn tệp .vtt";
        subtitles = [];
        if (videoId) { await evaluateSubtitlePriority(videoId); }
    }
}

function clearUrlInput() {
    const input = document.getElementById('yt-link'); input.value = '';
    document.getElementById('btn-clear').style.display = 'none'; document.getElementById('gist-select').value = "";
    lastProcessedVideoId = ""; selectedSubFile = null; subtitles = [];
    document.getElementById('selected-file-box').classList.remove('show');
    document.getElementById('file-label').innerText = "Chọn tệp .vtt";
    document.getElementById('matched-sub-note').innerText = "Trạng thái: Đang chờ tải dữ liệu...";
    input.focus();
}

function toggleSubSettings() { document.getElementById('sub-settings-panel').classList.toggle('show'); }
function updateSubFontSize(type, val) { document.documentElement.style.setProperty(`--fs-${type}`, val + 'px'); document.getElementById(`val-${type}`).innerText = val + 'px'; }
function cyclePlaybackRate() { currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length; let newRate = speeds[currentSpeedIndex]; document.getElementById('btn-speed').innerText = `⚡ ${newRate}x`; if (player && typeof player.setPlaybackRate === 'function') { player.setPlaybackRate(newRate); } }
function toggleLoop() { isLoopEnabled = !isLoopEnabled; const btnLoop = document.getElementById('btn-loop'); if (isLoopEnabled) btnLoop.classList.add('active'); else btnLoop.classList.remove('active'); }
function extractVideoID(url) { if (!url) return null; const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/; const match = url.match(regExp); return (match && match[2].length === 11) ? match[2] : (url.length === 11 ? url : null); }
function loadSubTextContent(textContent, nameSource) { subtitles = parseSRT(textContent); document.getElementById('status-text').innerText = `Đã nạp sub thành công`; }
function handleFileSelect(event) {
    const file = event.target.files[0]; if (!file) return;
    if (!file.name.toLowerCase().endsWith('.vtt')) { alert("Vui lòng chọn tệp có định dạng .vtt"); return; }
    selectedSubFile = file; document.getElementById('file-label').innerText = "Đã chọn tệp";
    document.getElementById('selected-file-name').innerText = file.name; document.getElementById('selected-file-box').classList.add('show');
    let reader = new FileReader();
    reader.onload = function(e) { loadSubTextContent(e.target.result, file.name); document.getElementById('matched-sub-note').innerText = `🎯 Đang ưu tiên dùng phụ đề chọn thủ công: ${file.name}`; };
    reader.readAsText(file, 'UTF-8');
}
async function removeSelectedSub() { selectedSubFile = null; document.getElementById('selected-file-box').classList.remove('show'); document.getElementById('file-label').innerText = "Chọn tệp .vtt"; document.getElementById('srt-file').value = ""; let videoId = extractVideoID(document.getElementById('yt-link').value); await evaluateSubtitlePriority(videoId); }

async function syncToGitHub() {
    const inputVal = document.getElementById('yt-link').value.trim();
    const videoId = extractVideoID(inputVal);
    if (!videoId) { alert("Vui lòng nhập Link YouTube hợp lệ!"); return; }
    if (!selectedSubFile) { alert("Vui lòng chọn một tệp phụ đề thủ công trước!"); return; }
    let subContent = await selectedSubFile.text();
    let defaultName = selectedSubFile.name.replace(/\.[^/.]+$/, "");
    let videoTitle = prompt("Nhập tiêu đề:", defaultName);
    if (!videoTitle || videoTitle.trim() === "") videoTitle = defaultName;
    let token = localStorage.getItem('gh_pat_token');
    if (!token) { token = prompt("Nhập GitHub Token:"); if (token) { localStorage.setItem('gh_pat_token', token.trim()); } else { return; } }
    let payloadData = { description: `Pinyin AI Subtitle - ${videoTitle}`, public: true, files: { [`${videoId}.vtt`]: { content: subContent } } };
    document.getElementById('status-text').innerText = "Đang đẩy lên GitHub Gist...";
    try {
        let headers = { "Content-Type": "application/json" };
        let activeToken = localStorage.getItem('gh_pat_token');
        if (activeToken) { headers["Authorization"] = `token ${activeToken.trim()}`; }
        let response = await fetch("https://api.github.com/gists", { method: "POST", headers: headers, body: JSON.stringify(payloadData) });
        if (!response.ok) { if(response.status === 401) { localStorage.removeItem('gh_pat_token'); } throw new Error("Lỗi " + response.status); }
        let result = await response.json();
        let cloudMap = JSON.parse(localStorage.getItem('gh_cloud_map') || "{}");
        cloudMap[videoId] = { url: result.files[`${videoId}.vtt`].raw_url, title: videoTitle };
        localStorage.setItem('gh_cloud_map', JSON.stringify(cloudMap));
        alert(`✅ Đã đẩy lên Gist: ${videoTitle}`);
        document.getElementById('status-text').innerText = "Đã đồng bộ!";
        loadGistLibrary(true);
    } catch (err) { alert("❌ " + err.message); }
}

async function checkAndLoadFromCloud(videoId) {
    let cloudMap = JSON.parse(localStorage.getItem('gh_cloud_map') || "{}");
    if (cloudMap[videoId]) {
        try {
            let entry = cloudMap[videoId];
            let targetUrl = (typeof entry === 'object' && entry !== null) ? entry.url : entry;
            if (targetUrl) {
                let res = await fetch(targetUrl);
                if (res.ok) { loadSubTextContent(await res.text(), `${videoId}.vtt`); document.getElementById('matched-sub-note').innerText = `☁️ ${typeof entry === 'object' ? entry.title : videoId}`; return true; }
            }
        } catch(e) {}
    }
    let token = localStorage.getItem('gh_pat_token');
    if (token) {
        try {
            let res = await fetch("https://api.github.com/gists", { headers: { "Authorization": `token ${token.trim()}` } });
            if (res.ok) {
                let gists = await res.json();
                for (let gist of gists) {
                    let targetFileName = `${videoId}.vtt`;
                    if (gist.files && gist.files[targetFileName]) {
                        let rawUrl = gist.files[targetFileName].raw_url;
                        let cleanTitle = (gist.description || `Video ID: ${videoId}`).replace(/^Pinyin AI Subtitle\s*-\s*/i, '').trim();
                        cloudMap[videoId] = { url: rawUrl, title: cleanTitle };
                        localStorage.setItem('gh_cloud_map', JSON.stringify(cloudMap));
                        let subRes = await fetch(rawUrl);
                        if (subRes.ok) { loadSubTextContent(await subRes.text(), targetFileName); document.getElementById('matched-sub-note').innerText = `🌐 ${cleanTitle}`; return true; }
                    }
                }
            }
        } catch(e) {}
    }
    return false;
}

// ===== SỬA handleMainAction: CÓ SUB -> PHÁT, KHÔNG CÓ -> GỌI PC TẢI =====
async function handleMainAction() {
    const btn = document.getElementById('btn-action');
    if (!isLoadingState) {
        const inputVal = document.getElementById('yt-link').value.trim();
        let videoId = extractVideoID(inputVal);
        if (!videoId) { alert("Vui lòng nhập Link YouTube hợp lệ!"); return; }

        let hasSubReady = await evaluateSubtitlePriority(videoId);
        
        if (hasSubReady) {
            // === LOGIC CŨ: CÓ SUB THÌ PHÁT VIDEO ===
            isLoadingState = true;
            btn.innerText = "Huỷ";
            btn.classList.add('cancel-state');
            if (!player) {
                player = new YT.Player('player', {
                    height: '100%', width: '100%', videoId: videoId,
                    playerVars: { 'playsinline': 1, 'autoplay': 1 },
                    events: {
                        'onReady': (event) => { event.target.playVideo(); event.target.setPlaybackRate(speeds[currentSpeedIndex]); startSubtitleSync(); resetToLoadState(); updatePlayPauseButtonState(true); },
                        'onStateChange': onPlayerStateChange
                    }
                });
            } else {
                player.loadVideoById(videoId);
                player.setPlaybackRate(speeds[currentSpeedIndex]);
                startSubtitleSync();
                resetToLoadState();
                updatePlayPauseButtonState(true);
            }
        } else {
            // === MỚI: KHÔNG CÓ SUB -> TẢI AUDIO QUA PC ===
            pc_url = localStorage.getItem('pc_url') || '';
            if (!pc_url) { alert("⚠️ Chưa có phụ đề! Vui lòng cấu hình PC Server URL trong phần Cài đặt."); return; }
            
            isLoadingState = true;
            btn.innerText = "⏹ DỪNG";
            btn.classList.add('cancel-state');
            document.getElementById('status-text').innerText = "Đang tải audio...";
            document.getElementById('matched-sub-note').innerText = "⏳ Đang tải audio từ PC...";
            
            try {
                const pc = pc_url.replace(/\/$/, '');
                // Kiểm tra PC
                const h = await fetch(`${pc}/health`, { signal: AbortSignal.timeout(5000) });
                if (!h.ok) throw new Error('PC offline');
                
                document.getElementById('status-text').innerText = "PC đang tải...";
                // Tải audio
                const ytUrl = `https://youtu.be/${videoId}`;
                const blob = await new Promise((resolve, reject) => {
                    const x = new XMLHttpRequest();
                    x.open('GET', `${pc}/download?url=${encodeURIComponent(ytUrl)}`, true);
                    x.responseType = 'blob'; x.timeout = 600000;
                    x.onload = () => x.status === 200 ? resolve(x.response) : reject(new Error(`Lỗi ${x.status}`));
                    x.onerror = () => reject(new Error('Mất kết nối'));
                    x.ontimeout = () => reject(new Error('Timeout'));
                    x.send();
                });
                
                document.getElementById('status-text').innerText = "Đang upload GitHub...";
                // Upload lên GitHub
                const b64 = await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result.split(',')[1]); rd.readAsDataURL(blob); });
                const token = localStorage.getItem('gh_pat_token');
                const user = localStorage.getItem('gh_user') || '';
                const repo = localStorage.getItem('gh_repo') || 'subtitle-ai';
                
                if (!token || !user) { alert("Cấu hình GitHub thiếu!"); resetToLoadState(); return; }
                
                const api = `https://api.github.com/repos/${user}/${repo}/contents/data/audio/${videoId}.m4a`;
                const headers = { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json" };
                
                let sha = null;
                try { const c = await fetch(api, { headers }); if (c.ok) sha = (await c.json()).sha; } catch(e) {}
                const body = { message: `Audio ${videoId}`, content: b64, branch: 'main' };
                if (sha) body.sha = sha;
                
                const r = await fetch(api, { method: 'PUT', headers, body: JSON.stringify(body) });
                if (!r.ok) throw new Error((await r.json()).message);
                
                document.getElementById('status-text').innerText = "Đã upload!";
                document.getElementById('matched-sub-note').innerText = "⏳ AI đang xử lý... (3-5 phút)";
                
                // Trigger workflow
                try { await fetch(`https://api.github.com/repos/${user}/${repo}/dispatches`, { method: 'POST', headers, body: JSON.stringify({ event_type: 'process_audio', client_payload: { video_id: videoId } }) }); } catch(e) {}
                
                // Tự động kiểm tra sau 3 phút
                setTimeout(async () => {
                    const subApi = `https://api.github.com/repos/${user}/${repo}/contents/output/${videoId}.vtt`;
                    const sr = await fetch(subApi, { headers });
                    if (sr.ok) {
                        const sd = await sr.json();
                        const text = atob(sd.content);
                        subtitles = parseSRT(text);
                        let cloudMap = JSON.parse(localStorage.getItem('gh_cloud_map') || '{}');
                        cloudMap[videoId] = { url: sd.download_url, title: `Video ${videoId}` };
                        localStorage.setItem('gh_cloud_map', JSON.stringify(cloudMap));
                        loadGistLibrary(true);
                        document.getElementById('status-text').innerText = "Phụ đề đã sẵn sàng!";
                        document.getElementById('matched-sub-note').innerText = "✅ Phụ đề đã có! Bấm Tải để phát";
                    }
                }, 180000);
                
            } catch(e) {
                document.getElementById('status-text').innerText = "Lỗi!";
                document.getElementById('matched-sub-note').innerText = "❌ " + e.message;
                alert("Lỗi: " + e.message);
            }
            resetToLoadState();
        }
    } else {
        resetToLoadState();
        if (player && typeof player.stopVideo === 'function') player.stopVideo();
    }
}

function resetToLoadState() { isLoadingState = false; const btn = document.getElementById('btn-action'); btn.innerText = "Tải"; btn.classList.remove('cancel-state'); }

// ===== GIỮ NGUYÊN TẤT CẢ HÀM PLAYER CŨ =====
function onPlayerStateChange(event) {
    const inputCard = document.getElementById('input-card');
    if (event.data == YT.PlayerState.PLAYING) { updatePlayPauseButtonState(true); inputCard.classList.add('collapsed'); }
    else if (event.data == YT.PlayerState.PAUSED) { updatePlayPauseButtonState(false); inputCard.classList.remove('collapsed'); }
    else if (event.data == YT.PlayerState.ENDED) { updatePlayPauseButtonState(false); inputCard.classList.remove('collapsed'); if (subtitles.length > 0) displaySubtitleBlock(subtitles[subtitles.length - 1], true); if (isLoopEnabled && player) { player.seekTo(0, true); player.playVideo(); } }
}
function togglePlayPause() { if (!player || typeof player.getPlayerState !== 'function') return; if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo(); }
function updatePlayPauseButtonState(isPlaying) { const btnPlay = document.getElementById('btn-play-pause'); if (btnPlay) btnPlay.innerHTML = isPlaying ? "⏸ Pause" : "⏵ Play"; }
function toggleVideoVisibility() { document.getElementById('video-wrapper').classList.toggle('hidden'); }
function formatTime(seconds) { let m = Math.floor(seconds / 60); let s = Math.floor(seconds % 60); return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`; }
function onSliderSeek(val) { isSeeking = true; if (player && typeof player.getDuration === 'function') { videoDuration = player.getDuration(); let targetTime = (val / 100) * videoDuration; document.getElementById('time-display').innerText = `${formatTime(targetTime)} / ${formatTime(videoDuration)}`; } }
function onSliderChange(val) { if (player && typeof player.seekTo === 'function') { player.seekTo((val / 100) * player.getDuration(), true); } isSeeking = false; }
function smartTokenize(line) { let trimmed = line.trim(); return trimmed.includes(' ') ? trimmed.split(/\s+/) : Array.from(trimmed); }
function parseSRT(data) { const normalized = data.replace(/\r\n/g, '\n').replace(/\r/g, '\n'); const blocks = normalized.split('\n\n'); let subs = []; blocks.forEach(block => { const lines = block.split('\n'); let timeLineIdx = -1; for (let i = 0; i < lines.length; i++) { if (lines[i].includes('-->')) { timeLineIdx = i; break; } } if (timeLineIdx !== -1) { const times = lines[timeLineIdx].split('-->'); if (times.length === 2) { const start = parseTime(times[0].trim()); const end = parseTime(times[1].trim()); let rawLines = lines.slice(timeLineIdx + 1).map(l => l.replace(/<[^>]*>/g, '').trim()).filter(l => l !== ""); while(rawLines.length < 3) rawLines.push(""); subs.push({ start, end, rawLines }); } } }); return subs; }
function parseTime(tStr) { tStr = tStr.replace(',', '.'); const parts = tStr.split(':'); return parts.length < 3 ? 0 : parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]); }
function displaySubtitleBlock(sub, isFullHighlight = false) { const subBox = document.getElementById('subtitle-box'); let tokensLine1 = smartTokenize(sub.rawLines[0]); let tokensLine2 = smartTokenize(sub.rawLines[1]); let vietnameseText = sub.rawLines[2]; let html = '<div class="sub-line karaoke-line line-cn">'; tokensLine1.forEach(tok => { html += `<span class="${isFullHighlight ? ' word highlight' : ' word'}">${tok}&nbsp;</span>`; }); html += '</div><div class="sub-line karaoke-line line-py">'; tokensLine2.forEach(tok => { html += `<span class="${isFullHighlight ? ' word highlight' : ' word'}">${tok}&nbsp;</span>`; }); html += '</div>'; if (vietnameseText) html += `<div class="vietnamese-line">${vietnameseText}</div>`; subBox.innerHTML = html; }
function startSubtitleSync() { if (syncInterval) clearInterval(syncInterval); const subBox = document.getElementById('subtitle-box'); syncInterval = setInterval(() => { if (player && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') { try { let currentTime = player.getCurrentTime(); videoDuration = player.getDuration(); if (videoDuration > 0 && !isSeeking) { let sliderVal = (currentTime / videoDuration) * 100; document.getElementById('time-slider').value = sliderVal; document.getElementById('time-display').innerText = `${formatTime(currentTime)} / ${formatTime(videoDuration)}`; } let subIndex = subtitles.findIndex(sub => currentTime >= sub.start && currentTime <= sub.end); if (subIndex !== -1) { let sub = subtitles[subIndex]; if (activeSubIndex !== subIndex) { activeSubIndex = subIndex; displaySubtitleBlock(sub, false); } let duration = sub.end - sub.start; let elapsed = currentTime - sub.start; let progress = duration > 0 ? Math.min(Math.max(elapsed / duration, 0), 1) : 1; subBox.querySelectorAll('.karaoke-line').forEach(lineEl => { let wordElements = lineEl.querySelectorAll('.word'); let highlightCount = Math.floor(progress * wordElements.length); wordElements.forEach((el, wIdx) => { if (wIdx < highlightCount) el.classList.add('highlight'); else el.classList.remove('highlight'); }); }); } else { if (player.getPlayerState() !== YT.PlayerState.ENDED) { activeSubIndex = -1; subBox.innerHTML = '<span style="color: var(--text-secondary); font-size: 14px;">Đang đợi lời bài hát...</span>'; } } } catch(e) {} } }, 100); }
</script>
