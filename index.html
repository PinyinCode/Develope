 <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinyin AI - Auto Scan Gist</title>
    <style>
        :root {
            --bg-color: #000000; --card-bg: rgba(28, 28, 30, 0.75); --card-solid: #1c1c1e;
            --text-main: #f5f5f7; --text-secondary: #98989f; --accent: #ff2d55;
            --accent-light: rgba(255, 45, 85, 0.15); --blue: #0a84ff; --green: #30d158;
            --border-color: rgba(255, 255, 255, 0.1); --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --radius: 20px; --element-radius: 12px; --fs-cn: 35px; --fs-py: 16px; --fs-vi: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .container { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 14px; }
        .app-header { text-align: center; padding: 6px 0; }
        .app-header h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--text-main); }
        .card {
            background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
            border: 1px solid var(--border-color); transition: all 0.3s ease;
        }
        .card.hidden { display: none; }
        label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
        .row { display: flex; gap: 8px; align-items: center; }
        .input-wrap { position: relative; flex: 1; }
        .input-wrap input { width: 100%; padding-right: 36px; }
        .btn-clear-input {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-secondary);
            font-size: 18px; font-weight: bold; cursor: pointer; display: none; z-index: 2;
        }
        .btn-clear-input:hover { color: var(--text-main); }
        input[type="text"], input[type="password"], select {
            width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color); border-radius: var(--element-radius);
            color: var(--text-main); font-size: 14px; outline: none; transition: all 0.2s ease;
        }
        select {
            cursor: pointer; appearance: none; -webkit-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2398989f" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat; background-position: right 10px center; padding-right: 32px;
        }
        select option { background-color: var(--card-solid); color: var(--text-main); }
        input:focus, select:focus { background-color: var(--card-solid); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-light); }
        button { padding: 12px 16px; border: none; border-radius: var(--element-radius); font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        button:active { transform: scale(0.96); opacity: 0.9; }
        button:disabled { opacity: 0.4; pointer-events: none; }
        .btn-accent { background-color: var(--accent); color: white; }
        .btn-accent.cancel { background-color: var(--text-secondary); }
        .btn-sm { padding: 8px 12px; font-size: 11px; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-sm.active { background-color: var(--accent-light); border-color: var(--accent); color: var(--accent); }
        .progress-wrap { width: 100%; height: 4px; background: #3a3a3c; border-radius: 2px; overflow: hidden; margin-top: 8px; }
        .progress-bar { height: 100%; background: var(--blue); width: 0; transition: width 0.3s; }
        .player-wrap { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: var(--radius); overflow: hidden; }
        .player-wrap.hidden { display: none; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #subtitle-box {
            background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid var(--border-color);
            padding: 24px 16px; border-radius: var(--radius); min-height: 100px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; text-align: center;
        }
        .cn { font-size: var(--fs-cn); font-weight: 700; } .py { font-size: var(--fs-py); color: var(--text-secondary); }
        .vi { font-size: var(--fs-vi); color: var(--accent); border-top: 1px solid var(--border-color); padding-top: 8px; width: 80%; }
        .settings-toggle { cursor: pointer; color: var(--text-secondary); font-size: 11px; text-align: right; user-select: none; }
        #logBox { background: var(--card-bg); border-radius: 12px; padding: 12px; height: 100px; overflow-y: auto; font-size: 11px; font-family: monospace; color: var(--text-secondary); border: 1px solid var(--border-color); }
        .log-ok { color: var(--green); } .log-err { color: var(--accent); } .log-info { color: var(--blue); }
        .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
        .setting-row label { font-size: 11px; color: var(--text-secondary); text-transform: none; margin: 0; }
        .setting-row span { font-size: 11px; color: var(--text-main); text-align: right; min-width: 35px; }
        input[type="range"] { flex: 1; accent-color: var(--accent); height: 4px; }
        .context-menu {
    position: fixed;
    background: var(--card-solid);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 8px;
    z-index: 999;
    display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.context-menu button {
    display: block;
    width: 100%;
    padding: 10px 16px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
}
.context-menu button:active { background: rgba(255,45,85,0.15); }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div class="container">
    <div class="app-header"><h3>🎬 Pinyin AI</h3></div>

    <div class="card" id="input-card">
        <label>🔗 Link YouTube (để tải phụ đề mới)</label>
        <div class="row">
            <div class="input-wrap">
                <input type="text" id="yt-link" placeholder="Dán link YouTube để tải phụ đề..." oninput="onUrlInput()">
                <button class="btn-clear-input" id="btn-clear" onclick="clearUrl()">×</button>
            </div>
            <button class="btn-accent" id="btn-action" style="width:80px" onclick="handleMainAction()">▶️ TẢI</button>
        </div>
        <div class="progress-wrap"><div class="progress-bar" id="pb"></div></div>
        <p style="font-size:10px;color:var(--text-secondary);margin-top:4px" id="pbText">Sẵn sàng</p>
        </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
    <span class="settings-toggle" onclick="toggleSettings()">⚙️ Cài đặt ▾</span>
    <span class="settings-toggle" id="toggle-all-btn" onclick="toggleAllCards()">👁️ Ẩn</span>
</div>
    <div class="card" id="settings-card" style="display:none;">
        <label>GitHub Username</label><input type="text" id="ghUser" placeholder="Username" style="margin-bottom:10px">
        <label>Repository</label><input type="text" id="ghRepo" placeholder="Repository" style="margin-bottom:10px">
        <label>GitHub Token (cần quyền gist)</label><input type="password" id="ghToken" placeholder="Token ghp_..." style="margin-bottom:10px">
        <label>PC Server URL</label><input type="text" id="pcUrl" placeholder="https://xxxx.trycloudflare.com" style="margin-bottom:10px">
        <button class="btn-sm" style="width:100%;background:var(--blue);color:white;padding:12px" onclick="saveSettings()">💾 LƯU</button>
    </div>

    <div class="card" id="gist-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
    <label>📚 Kho phụ đề</label>
    <div style="display:flex;gap:6px;">
        <button class="btn-sm" style="padding:4px 8px;font-size:10px;" onclick="renameCurrentVideo()">✏️</button>
        <button class="btn-sm" style="padding:4px 8px;font-size:10px;color:var(--accent);" onclick="deleteCurrentVideo()">🗑️</button>
    </div>
</div>
        <div class="row">
            <select id="gist-select" onchange="onGistSelected(this.value)">
                <option value="">-- Chọn phụ đề... --</option>
            </select>
            <button class="btn-sm" style="width:40px" id="btn-reload" onclick="handleReload()">🔄</button>
        </div>
        <p style="font-size:10px;color:var(--text-secondary);margin-top:4px" id="matched-sub-note">Sẵn sàng</p>
        </div>

    <div class="player-wrap hidden" id="video-wrapper"><div id="player"></div></div>
    <!-- Player -->
<div class="player-wrap hidden" id="video-wrapper"><div id="player"></div></div>

<!-- Timeline -->
<div class="card" style="padding:10px 16px" id="timeline-card">
    <div class="row" style="align-items:center;gap:10px">
        <input type="range" id="time-slider" value="0" min="0" max="100" step="0.1" 
               oninput="onSliderSeek(this.value)" onchange="onSliderChange(this.value)"
               style="flex:1;accent-color:var(--accent);height:4px;cursor:pointer">
        <span style="font-size:11px;color:var(--text-secondary);min-width:70px;text-align:right" id="time-display">00:00 / 00:00</span>
    </div>
</div>
    <div class="card" style="padding:10px 16px">
        <div class="row" style="flex-wrap:wrap;gap:6px">
            <button class="btn-sm" id="btn-play-pause" onclick="togglePlayPause()">⏵ Play</button>
            <button class="btn-sm" onclick="toggleVideoVisibility()">🎥 Video</button>
            <button class="btn-sm" onclick="cyclePlaybackRate()" id="btn-speed">⚡ 1.0x</button>
            <button class="btn-sm" id="btn-loop" onclick="toggleLoop()">🔁 Repeat</button>
            <button class="btn-sm" onclick="toggleSubSettings()">⚙️ Size</button>
            <span style="font-size:11px;color:var(--text-secondary);margin-left:auto" id="status-text">Sẵn sàng</span>
        </div>
        <div id="sub-settings-panel" style="display:none;margin-top:8px">
            <div class="setting-row"><label>Chữ Hán</label><input type="range" min="14" max="36" value="20" oninput="updateFont('cn',this.value)"><span id="val-cn">20px</span></div>
            <div class="setting-row"><label>Pinyin</label><input type="range" min="12" max="28" value="16" oninput="updateFont('py',this.value)"><span id="val-py">16px</span></div>
            <div class="setting-row"><label>Tiếng Việt</label><input type="range" min="10" max="24" value="14" oninput="updateFont('vi',this.value)"><span id="val-vi">14px</span></div>
        </div>
    </div>

    <div id="subtitle-box"><span style="color:var(--text-secondary);font-size:14px">Chọn phụ đề + Play, hoặc nhập link mới để tải...</span></div>

    <div class="card" id="log-card"><label>📋 Tiến trình</label><div id="logBox">🟢 Sẵn sàng</div></div>
</div>

<script>
// ===== STATE =====
let player, subtitles=[], syncInterval=null, activeSubIndex=-1;
let isLoadingState=false, processingVid=null;
let currentGistItem=null;
let isLoopEnabled=false, currentSpeedIndex=2;
const speeds=[0.5,0.75,1.0,1.25,1.5,2.0];
let pc_url='', gh_cloud_map={};
let reloadTimer=null;
let progressInterval=null; // THÊM DÒNG NÀY
// ===== INIT =====
function onYouTubeIframeAPIReady(){ loadSettings(); loadGistLibrary(false); }
function loadSettings(){
    document.getElementById('ghUser').value=localStorage.gh_user||'';
    document.getElementById('ghRepo').value=localStorage.gh_repo||'subtitle-ai';
    document.getElementById('ghToken').value=localStorage.gh_token||localStorage.gh_pat_token||'';
    document.getElementById('pcUrl').value=localStorage.pc_url||'';
    pc_url=localStorage.pc_url||'';
    gh_cloud_map=JSON.parse(localStorage.getItem('gh_cloud_map')||'{}');
}
function saveSettings(){
    let oldToken = localStorage.gh_token || localStorage.gh_pat_token || '';
    let newToken = document.getElementById('ghToken').value.trim();
    
    // Nếu token thay đổi -> XÓA TOÀN BỘ CACHE
    if (newToken && newToken !== oldToken) {
        log('Phát hiện token mới, đang xóa cache...', 'info');
        localStorage.removeItem('gh_last_scan');
        localStorage.removeItem('gh_cloud_map');
        gh_cloud_map = {};
        log('Đã xóa cache cũ ✓', 'ok');
    }
    
    localStorage.gh_user = document.getElementById('ghUser').value.trim();
    localStorage.gh_repo = document.getElementById('ghRepo').value.trim();
    localStorage.gh_token = newToken;
    localStorage.gh_pat_token = newToken;
    pc_url = document.getElementById('pcUrl').value.trim();
    localStorage.pc_url = pc_url;
    
    log('Da luu ✓','ok');
    loadGistLibrary(true);
}
function toggleSettings(){
    const c=document.getElementById('settings-card');const b=document.querySelector('.settings-toggle');
    c.style.display=c.style.display==='none'?'block':'none';
    b.textContent=c.style.display==='none'?'⚙️ Cai dat ▾':'⚙️ Cai dat ▴';
}
function toggleSubSettings(){const p=document.getElementById('sub-settings-panel');p.style.display=p.style.display==='none'?'block':'none';}

let allCardsVisible = true;
function toggleAllCards() {
    const btn = document.getElementById('toggle-all-btn');
    const cards = ['input-card', 'gist-card', 'settings-card', 'log-card'];
    
    allCardsVisible = !allCardsVisible;
    
    cards.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('hidden', !allCardsVisible);
    });
    
    // Đảm bảo nút luôn hiện
    btn.classList.remove('hidden');
    btn.textContent = allCardsVisible ? '👁️ Ẩn tất cả' : '👁️ Hiện tất cả';
}
    function updateFont(t,v){document.documentElement.style.setProperty(`--fs-${t}`,v+'px');document.getElementById(`val-${t}`).innerText=v+'px';}
function cyclePlaybackRate(){currentSpeedIndex=(currentSpeedIndex+1)%speeds.length;let r=speeds[currentSpeedIndex];document.getElementById('btn-speed').innerText=`⚡ ${r}x`;if(player?.setPlaybackRate)player.setPlaybackRate(r);}
function toggleLoop(){isLoopEnabled=!isLoopEnabled;document.getElementById('btn-loop').classList.toggle('active',isLoopEnabled);}

// ===== LOG =====
function log(m,c=''){const t=new Date().toLocaleTimeString('vi-VN');document.getElementById('logBox').innerHTML+=`<br><span class="log-${c}">[${t}] ${m}</span>`;document.getElementById('logBox').scrollTop=document.getElementById('logBox').scrollHeight;}
function prog(p,t=''){document.getElementById('pb').style.width=p+'%';if(t)document.getElementById('pbText').innerText=t;}

// ===== URL =====
function onUrlInput(){document.getElementById('btn-clear').style.display=document.getElementById('yt-link').value?'block':'none';}
function clearUrl(){document.getElementById('yt-link').value='';document.getElementById('btn-clear').style.display='none';}

// ===== GIST =====
async function loadGistLibrary(force=false){
    const select=document.getElementById('gist-select');
    select.innerHTML='<option value="">-- Scan... --</option>';
    let items=[], token=localStorage.gh_token||localStorage.gh_pat_token;
    let lastScan=parseInt(localStorage.getItem('gh_last_scan')||'0'), now=Date.now();
    if(!force&&(now-lastScan)<300000&&Object.keys(gh_cloud_map).length>0){
        for(let vId in gh_cloud_map){let e=gh_cloud_map[vId];items.push({videoId:vId,rawUrl:e.url,title:e.title});}
    }else if(token){
        try{
            let res=await fetch('https://api.github.com/gists?per_page=100',{headers:{"Authorization":`token ${token}`}});
            if(res.ok){let gists=await res.json();let newMap={};for(let g of gists){if(g.files)for(let fn in g.files){if(fn.endsWith('.vtt')){let v=fn.replace('.vtt','');if(!newMap[v])newMap[v]={url:g.files[fn].raw_url,title:(g.description||'').replace(/^.*Subtitle\s*-\s*/i,'').trim()||`Video ${v}`};}}}gh_cloud_map=newMap;localStorage.setItem('gh_cloud_map',JSON.stringify(newMap));localStorage.setItem('gh_last_scan',now);for(let vId in newMap){let e=newMap[vId];items.push({videoId:vId,rawUrl:e.url,title:e.title});}}
        }catch(e){}
    }
    if(!items.length)for(let vId in gh_cloud_map){let e=gh_cloud_map[vId];items.push({videoId:vId,rawUrl:e.url,title:e.title});}
    items.sort((a,b)=>b.videoId.localeCompare(a.videoId));
    select.innerHTML=items.length?`<option value="">-- Select (${items.length}) --</option>`:'<option value="">-- Chua co --</option>';
    items.forEach(i=>{let o=document.createElement('option');o.value=JSON.stringify(i);o.textContent=i.title;select.appendChild(o);});
    document.getElementById('matched-sub-note').innerText=items.length?`${items.length} video`:'Chua co video';
}

// ===== RELOAD: 1 LẦN -> LOAD VIDEO, 2 LẦN -> LOAD KHO =====
function handleReload(){
    if(currentGistItem){
        // Nếu đang chọn phụ đề -> load video tương ứng
        if(reloadTimer){
            // Double click -> load lại kho
            clearTimeout(reloadTimer);
            reloadTimer=null;
            log('Double click - Load lai kho','info');
            loadGistLibrary(true);
        }else{
            // Single click -> load video
            loadVideoFromGist(currentGistItem);
            // Đặt timer để bắt double click
            reloadTimer=setTimeout(()=>{reloadTimer=null;},500);
        }
    }else{
        // Không chọn phụ đề -> load kho
        loadGistLibrary(true);
    }
}

async function loadVideoFromGist(item) {
    log(`Load: ${item.title}`, 'info');
    let res = await fetch(item.rawUrl);
    if (res.ok) {
        subtitles = parseVTT(await res.text());
        document.getElementById('matched-sub-note').innerText = `📦 ${item.title}`;
        document.getElementById('video-wrapper').classList.remove('hidden');
        
        if (player) {
            // Hủy player cũ, tạo mới để tránh tự động play
            player.destroy();
            player = null;
        }
        
        // Tạo player mới với autoplay=0
        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            videoId: item.videoId,
            playerVars: {
                playsinline: 1,
                autoplay: 0,        // KHÔNG tự động play
                controls: 0,        // Ẩn controls YouTube
                rel: 0,             // Không gợi ý video liên quan
                showinfo: 0         // Không hiện thông tin
            },
            events: {
                onReady: (e) => {
                    startSync();
                    // PAUSE NGAY LẬP TỨC
                    e.target.pauseVideo();
                    e.target.seekTo(0, true);
                    updatePlayPauseBtn(false);
                },
                onStateChange: onPlayerStateChange
            }
        });
    }
}
async function renameCurrentVideo() {
    if (!currentGistItem) { alert('Chọn phụ đề trong kho trước!'); return; }
    
    let cur = currentGistItem.title;
    let nt = prompt('Nhập tên mới:', cur);
    if (!nt || !nt.trim()) return;
    nt = nt.trim();
    
    let token = localStorage.gh_token || localStorage.gh_pat_token;
    if (!token) { alert('Cần cấu hình GitHub Token!'); return; }
    
    let vid = currentGistItem.videoId;
    
    // Cập nhật lên Gist
    try {
        let gistId = null;
        let res = await fetch('https://api.github.com/gists?per_page=100', {
            headers: { "Authorization": `token ${token}` }
        });
        if (res.ok) {
            let gists = await res.json();
            for (let g of gists) {
                if (g.files && g.files[`${vid}.vtt`]) {
                    gistId = g.id;
                    break;
                }
            }
        }
        
        if (gistId) {
            await fetch(`https://api.github.com/gists/${gistId}`, {
                method: 'PATCH',
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    description: `Pinyin AI Subtitle - ${nt}`
                })
            });
        }
    } catch (e) {
        log('Lỗi cập nhật Gist: ' + e.message, 'err');
    }
    
    // Cập nhật local
    gh_cloud_map[vid].title = nt;
    localStorage.setItem('gh_cloud_map', JSON.stringify(gh_cloud_map));
    currentGistItem.title = nt;
    loadGistLibrary(false);
    document.getElementById('matched-sub-note').innerText = `✏️ ${nt}`;
    log(`Đã đổi tên: ${nt}`, 'ok');
}
async function deleteCurrentVideo() {
    if (!currentGistItem) { alert('Chọn phụ đề trong kho trước!'); return; }
    
    let vid = currentGistItem.videoId;
    let title = currentGistItem.title;
    
    if (!confirm(`Xóa "${title}"?\n\nFile .vtt sẽ bị xóa vĩnh viễn khỏi Gist!`)) return;
    
    let token = localStorage.gh_token || localStorage.gh_pat_token;
    if (!token) { alert('Cần cấu hình GitHub Token!'); return; }
    
    try {
        // Tìm Gist ID - QUÉT NHIỀU TRANG
        let gistId = null;
        for (let page = 1; page <= 10; page++) {
            let res = await fetch(`https://api.github.com/gists?page=${page}&per_page=100`, {
                headers: { "Authorization": `token ${token}` }
            });
            if (!res.ok) break;
            let gists = await res.json();
            if (!gists || gists.length === 0) break;
            
            for (let g of gists) {
                if (g.files && g.files[`${vid}.vtt`]) {
                    gistId = g.id;
                    break;
                }
            }
            if (gistId) break;
        }
        
        if (gistId) {
            console.log('Đang xóa Gist ID:', gistId);
            let delRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                method: 'DELETE',
                headers: { "Authorization": `token ${token}` }
            });
            if (delRes.status === 204 || delRes.ok) {
                log(`Đã xóa Gist #${gistId}: ${vid}`, 'ok');
            } else {
                console.log('Lỗi xóa Gist:', delRes.status);
                throw new Error('Không thể xóa Gist (status: ' + delRes.status + ')');
            }
        } else {

async function deleteGist() {
    if (!currentGistItem) return;
    let vid = currentGistItem.videoId;
    let token = localStorage.gh_token || localStorage.gh_pat_token;
    if (!token) { alert('Cần cấu hình GitHub Token!'); return; }
    if (!confirm(`Xóa vĩnh viễn "${currentGistItem.title}"?`)) return;
    
    try {
        let gistId = null;
        let res = await fetch('https://api.github.com/gists?per_page=100', {
            headers: { "Authorization": `token ${token}` }
        });
        if (res.ok) {
            let gists = await res.json();
            for (let g of gists) {
                if (g.files && g.files[`${vid}.vtt`]) { gistId = g.id; break; }
            }
        }
        if (gistId) {
            await fetch(`https://api.github.com/gists/${gistId}`, {
                method: 'DELETE', headers: { "Authorization": `token ${token}` }
            });
            log(`Đã xóa Gist: ${vid}`, 'ok');
        }
    } catch (e) { log('Lỗi: ' + e.message, 'err'); }
    
    delete gh_cloud_map[vid];
    localStorage.setItem('gh_cloud_map', JSON.stringify(gh_cloud_map));
    currentGistItem = null;
    document.getElementById('matched-sub-note').innerText = 'Đã xóa';
    document.getElementById('subtitle-box').innerHTML = '<span style="color:var(--text-secondary)">Đã xóa</span>';
    loadGistLibrary(false);
    document.getElementById('context-menu').style.display = 'none';
}

function startSync(){if(syncInterval)clearInterval(syncInterval);syncInterval=setInterval(syncSub,200);}
function syncSub(){updateTimeline();if(!player?.getCurrentTime||!subtitles.length)return;const t=player.getCurrentTime(),idx=subtitles.findIndex(s=>t>=s.start&&t<=s.end);if(idx!==-1&&idx!==activeSubIndex){activeSubIndex=idx;const s=subtitles[idx];document.getElementById('subtitle-box').innerHTML=`<div class="cn">${s.rawLines[0]}</div><div class="py">${s.rawLines[1]}</div><div class="vi">${s.rawLines[2]}</div>`;}}
function onPlayerStateChange(e) {
    if (e.data == YT.PlayerState.PLAYING) {
        updatePlayPauseBtn(true);
        // CHỈ ẨN KHI NÚT ẨN/HIỆN ĐÃ ĐƯỢC BẤM
        if (!allCardsVisible) {
            document.getElementById('input-card').classList.add('hidden');
            document.getElementById('gist-card').classList.add('hidden');
            document.getElementById('log-card').classList.add('hidden');
        }
    } else if (e.data == YT.PlayerState.PAUSED || e.data == YT.PlayerState.ENDED) {
        updatePlayPauseBtn(false);
        if (!allCardsVisible) {
            document.getElementById('input-card').classList.remove('hidden');
            document.getElementById('gist-card').classList.remove('hidden');
            document.getElementById('log-card').classList.remove('hidden');
        }
        if (e.data == YT.PlayerState.ENDED && isLoopEnabled && player) {
            player.seekTo(0, true); player.playVideo();
        }
    }
}
// ===== TIMELINE =====
let videoDuration = 0;
let isSeeking = false;

function formatTime(seconds) {
    if (isNaN(seconds)) return '00:00';
    let m = Math.floor(seconds / 60);
    let s = Math.floor(seconds % 60);
    return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
}

function onSliderSeek(val) {
    isSeeking = true;
    if (player && typeof player.getDuration === 'function') {
        videoDuration = player.getDuration();
        let targetTime = (val / 100) * videoDuration;
        document.getElementById('time-display').innerText = `${formatTime(targetTime)} / ${formatTime(videoDuration)}`;
    }
}

function onSliderChange(val) {
    if (player && typeof player.seekTo === 'function') {
        player.seekTo((val / 100) * player.getDuration(), true);
    }
    setTimeout(() => { isSeeking = false; }, 200);
}

// Cập nhật timeline trong syncSub
function updateTimeline() {
    if (!player || typeof player.getCurrentTime !== 'function') return;
    if (isSeeking) return;
    let currentTime = player.getCurrentTime();
    let duration = player.getDuration();
    if (duration > 0) {
        videoDuration = duration;
        document.getElementById('time-slider').value = (currentTime / duration) * 100;
        document.getElementById('time-display').innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
    }
}
    // ===== PLAY =====
function playSelectedGist() {
    if (!currentGistItem) { alert('Chọn phụ đề trong kho!'); return; }
    let item = currentGistItem;
    fetch(item.rawUrl).then(r => r.text()).then(text => {
        subtitles = parseVTT(text);
        document.getElementById('matched-sub-note').innerText = `📦 ${item.title}`;
        document.getElementById('video-wrapper').classList.remove('hidden');
        if (player) { player.destroy(); player = null; }
        player = new YT.Player('player', {
            height: '100%', width: '100%',
            videoId: item.videoId,
            playerVars: { playsinline: 1, autoplay: 0 },
            events: {
                onReady: (e) => {
                    startSync();
                    e.target.pauseVideo();
                    e.target.seekTo(0, true);
                    updatePlayPauseBtn(false);
                },
                onStateChange: onPlayerStateChange
            }
        });
    }).catch(e => log('Lỗi: ' + e.message, 'err'));
}

// ===== TOGGLE PLAY/PAUSE =====
function togglePlayPause() {
    if (!player || typeof player.getPlayerState !== 'function') {
        playSelectedGist();
        return;
    }
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
    } else {
        player.playVideo();
    }
}
function updatePlayPauseBtn(p){const b=document.getElementById('btn-play-pause');if(b)b.innerHTML=p?'⏸ Pause':'⏵ Play';}

// ===== UTILS =====
function extractVideoID(url){if(!url)return null;const m=url.match(/(?:v=|\/)([\w-]{11})/);return m?m[1]:(url.length===11?url:null);}
function parseVTT(d){const n=d.replace(/\r\n/g,'\n').replace(/\r/g,'\n'),b=n.split('\n\n');let s=[];b.forEach(b=>{const l=b.split('\n');let t=-1;for(let i=0;i<l.length;i++){if(l[i].includes('-->')){t=i;break}}if(t!==-1){const ts=l[t].split('-->');if(ts.length===2){const st=parseTime(ts[0].trim()),en=parseTime(ts[1].trim());let r=l.slice(t+1).map(x=>x.replace(/<[^>]*>/g,'').trim()).filter(x=>x!=="");while(r.length<3)r.push("");s.push({start:st,end:en,rawLines:r})}}});return s;}
function parseTime(t){t=t.replace(',','.');const p=t.split(':');return p.length<3?0:parseFloat(p[0])*3600+parseFloat(p[1])*60+parseFloat(p[2]);}

async function fetchProgress(vid) {
    if (!pc_url || !vid) return;
    
    const pc = pc_url.replace(/\/$/, '');
    
    try {
        let res = await fetch(`${pc}/progress?id=${vid}`);
        if (res.ok) {
            let data = await res.json();
            
            if (data.status === 'downloading') {
                let downloaded = (data.downloaded / 1024 / 1024).toFixed(1);
                let total = (data.total / 1024 / 1024).toFixed(1);
                prog(data.percent, `⬇️ Tải: ${data.percent}% - ${downloaded}/${total}MB - ${data.speed}`);
                
            } else if (data.status === 'uploading') {
                let upPct = data.upload_percent || 0;
                prog(upPct, `📤 Upload: ${upPct}% - ${data.speed}`);
                
            } else if (data.status === 'done') {
                prog(100, '✅ Hoàn tất! Đợi AI xử lý...');
                if (progressInterval) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
            } else if (data.status === 'error') {
                prog(0, `❌ Lỗi: ${data.message}`);
                if (progressInterval) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
            } else if (data.status === 'cancelled') {
                prog(0, '🚫 Đã hủy');
                if (progressInterval) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
            }
        }
    } catch (e) {}
}
