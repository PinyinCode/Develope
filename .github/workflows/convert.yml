name: Convert Excel to HTML

on:
  push:
    paths:
      - 'data/input.xlsx'
      - 'scripts/convert.py'
      - 'scripts/config_loader.py'
      - 'scripts/data_reader.py'
      - 'scripts/ui_template.py'
      - 'scripts/social_template.py'
      - 'scripts/accounts_template.py'
      - 'scripts/renewal_template.py'
      - 'scripts/config.json'
      - '.github/workflows/convert.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Run convert script
        run: python scripts/convert.py

      - name: Commit & push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --quiet && git diff --staged --quiet; then
            echo "Không có thay đổi"
          else
            git commit -m "🤖 Auto convert Excel → HTML ($(date -u +%Y-%m-%d %H:%M:%S UTC))"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: convert
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
