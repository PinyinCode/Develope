name: Convert Excel to HTML

on:
  push:
    paths:
      - 'data/input.xlsx'
      - 'scripts/convert.py'
      - '.github/workflows/convert.yml'
  workflow_dispatch:

# ✅ Cần thiết để deploy Pages
permissions:
  contents: write
  pages: write
  id-token: write

# ✅ Chỉ cho phép 1 deployment chạy cùng lúc
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ===== JOB 1: Chuyển Excel → HTML rồi commit =====
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Run convert script
        run: python scripts/convert.py

      - name: Commit & push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --quiet && git diff --staged --quiet; then
            echo "Không có thay đổi để commit"
          else
            git commit -m "🤖 Auto convert Excel → HTML"
            git push
          fi

      # ✅ Upload artifact để job deploy dùng
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # ===== JOB 2: Deploy lên GitHub Pages =====
  deploy:
    needs: convert
    runs-on: ubuntu-latest
    # ✅ QUAN TRỌNG: Khai báo environment để fix lỗi "Missing environment"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
