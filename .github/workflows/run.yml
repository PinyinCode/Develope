name: YouTube AI Subtitle to Gist

on:
  workflow_dispatch:
    inputs:
        youtube_url:
          description: 'Dán đường dẫn YouTube vào đây'
          required: true
          type: string

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install yt-dlp openai-whisper

      - name: Run Subtitle Script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          YT_URL: ${{ inputs.youtube_url }}
        run: |
          python -c '
          import os, json, urllib.request, whisper
          from yt_dlp import YoutubeDL

          url = os.environ["YT_URL"]
          github_token = os.environ["GITHUB_TOKEN"]

          print("Đang tải âm thanh từ YouTube...")
          ydl_opts = {
              "format": "bestaudio/best",
              "outtmpl": "temp_audio.mp3",
              "postprocessors": [{"key": "FFmpegExtractAudio", "preferredcodec": "mp3", "preferredquality": "192"}]
          }
          with YoutubeDL(ydl_opts) as ydl:
              info_dict = ydl.extract_info(url, download=False)
              video_id = info_dict.get("id", "unknown_video")
              video_title = info_dict.get("title", "subtitle")
              ydl.download([url])

          print("AI Whisper đang nhận diện giọng nói...")
          model = whisper.load_model("base")
          result = model.transcribe("temp_audio.mp3")

          content_lines = ["WEBVTT\n\n"]
          for segment in result.get("segments", []):
              start, end = segment["start"], segment["end"]
              text = segment["text"].strip()
              
              def fmt(s):
                  h, m, sec = int(s // 3600), int((s % 3600) // 60), int(s % 60)
                  ms = int((s - int(s)) * 1000)
                  return f"{h:02d}:{m:02d}:{sec:02d}.{ms:03d}"
                  
              content_lines.append(f"{fmt(start)} --> {fmt(end)}\n{text}\n\n")

          file_content = "".join(content_lines)
          target_filename = f"{video_id}.vtt"
          
          print("Đang đẩy lên GitHub Gist...")
          payload = {
              "description": f"AI Subtitle - {video_title} ({video_id})",
              "public": True,
              "files": {target_filename: {"content": file_content}}
          }

          req = urllib.request.Request("https://api.github.com/gists", method="POST")
          req.add_header("Authorization", f"token {github_token}")
          req.add_header("Content-Type", "application/json")

          try:
              data = json.dumps(payload).encode("utf-8")
              response = urllib.request.urlopen(req, data=data)
              res_data = json.loads(response.read().decode("utf-8"))
              raw_url = res_data["files"][target_filename]["raw_url"]
              print(f"THÀNH CÔNG! Link Raw Gist của bạn: {raw_url}")
          except Exception as e:
              print(f"Lỗi: {e}")

          if os.path.exists("temp_audio.mp3"):
              os.remove("temp_audio.mp3")
          '
