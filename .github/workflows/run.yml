name: YouTube AI Subtitle to Gist

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "Dán đường dẫn YouTube"
        required: true
        type: string

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U yt-dlp
          python -m pip install -U openai-whisper

      - name: Create Cookies
        env:
          YT_COOKIES_CONTENT: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES_CONTENT" ]; then
            echo "$YT_COOKIES_CONTENT" > cookies.txt
          fi

      - name: Run Script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          YT_URL: ${{ inputs.youtube_url }}
        run: |
          python <<'PYTHON'

          import os
          import json
          import urllib.request
          import whisper

          from yt_dlp import YoutubeDL

          url = os.environ["YT_URL"]
          github_token = os.environ["GITHUB_TOKEN"]

          print("===== Download Audio =====")

          ydl_opts = {
              "format": "bestaudio/best",
              "outtmpl": "temp_audio.%(ext)s",
              "noplaylist": True,
              "quiet": False,
              "retries": 10,
              "fragment_retries": 10,
              "extractor_args": {
                  "youtube": {
                      "player_client": ["android", "web"]
                  }
              },
              "postprocessors": [{
                  "key": "FFmpegExtractAudio",
                  "preferredcodec": "mp3",
                  "preferredquality": "192",
              }],
          }

          if os.path.exists("cookies.txt"):
              ydl_opts["cookiefile"] = "cookies.txt"

          with YoutubeDL(ydl_opts) as ydl:

              info = ydl.extract_info(url, download=False)

              video_id = info.get("id", "unknown")
              video_title = info.get("title", "subtitle")

              print("Video:", video_title)
              print("ID:", video_id)

              ydl.download([url])

          audio_file = "temp_audio.mp3"

          if not os.path.exists(audio_file):
              raise Exception("Không tìm thấy file MP3 sau khi tải.")

          print("===== Load Whisper =====")

          model = whisper.load_model("base")

          result = model.transcribe(audio_file)

          def fmt(seconds):
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = int(seconds % 60)
              ms = int((seconds - int(seconds)) * 1000)
              return f"{h:02d}:{m:02d}:{s:02d}.{ms:03d}"

          lines = ["WEBVTT\n\n"]

          for seg in result["segments"]:
              lines.append(
                  f"{fmt(seg['start'])} --> {fmt(seg['end'])}\n"
                  f"{seg['text'].strip()}\n\n"
              )

          subtitle = "".join(lines)

          filename = f"{video_id}.vtt"

          print("===== Upload Gist =====")

          payload = {
              "description": f"{video_title} ({video_id})",
              "public": True,
              "files": {
                  filename: {
                      "content": subtitle
                  }
              }
          }

          req = urllib.request.Request(
              "https://api.github.com/gists",
              method="POST"
          )

          req.add_header("Authorization", f"token {github_token}")
          req.add_header("Content-Type", "application/json")

          data = json.dumps(payload).encode()

          with urllib.request.urlopen(req, data=data) as resp:
              res = json.loads(resp.read().decode())

          raw = res["files"][filename]["raw_url"]

          print("")
          print("===================================")
          print("SUCCESS")
          print(raw)
          print("===================================")

          for f in [
              "temp_audio.mp3",
              "cookies.txt"
          ]:
              if os.path.exists(f):
                  os.remove(f)

          PYTHON
