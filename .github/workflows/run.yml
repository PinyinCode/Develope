name: YouTube Subtitle to Gist

on:
  workflow_dispatch:
    inputs:
        youtube_url:
          description: 'Dán đường dẫn YouTube vào đây'
          required: true
          type: string

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade yt-dlp pypinyin googletrans==4.0.0-rc1

      - name: Create Cookies File
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            echo "✅ Đã tạo cookies.txt"
          else
            echo "⚠️ KHÔNG CÓ COOKIES - SẼ BỊ LỖI XÁC THỰC!"
            echo "Hãy thêm secret YT_COOKIES vào repository"
          fi

      - name: Extract and Format Subtitles
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          YT_URL: ${{ inputs.youtube_url }}
        run: |
          python -c '
          import os, json, urllib.request, re, html, sys
          from yt_dlp import YoutubeDL
          from pypinyin import pinyin, Style
          from googletrans import Translator

          url = os.environ["YT_URL"]
          github_token = os.environ["GITHUB_TOKEN"]

          # Kiểm tra cookies
          if not os.path.exists("cookies.txt"):
              print("❌ KHÔNG TÌM THẤY COOKIES!")
              print("Vui lòng:")
              print("1. Cài extension Get cookies.txt LOCALLY cho Chrome")
              print("2. Đăng nhập YouTube trên Chrome")
              print("3. Export cookies.txt")
              print("4. Vào GitHub repo -> Settings -> Secrets -> Actions")
              print("5. Thêm secret YT_COOKIES với nội dung file cookies.txt")
              sys.exit(1)

          print("📺 Đang lấy phụ đề từ YouTube...")
          
          # Tải phụ đề với cookies
          ydl_opts = {
              "writesubtitles": True,
              "writeautomaticsub": True,
              "subtitleslangs": ["zh-TW", "zh-Hant", "zh", "zh-CN", "zh-Hans"],
              "subtitlesformat": "vtt",
              "skip_download": True,
              "outtmpl": "subtitle.%(ext)s",
              "cookiefile": "cookies.txt",
              "quiet": False,
          }

          try:
              with YoutubeDL(ydl_opts) as ydl:
                  info_dict = ydl.extract_info(url, download=False)
                  video_id = info_dict.get("id", "unknown_video")
                  video_title = info_dict.get("title", "subtitle")
                  
                  # Kiểm tra phụ đề có sẵn
                  subtitles = info_dict.get("subtitles", {})
                  auto_subtitles = info_dict.get("automatic_captions", {})
                  
                  print(f"📹 Video: {video_title} ({video_id})")
                  print(f"📝 Phụ đề có sẵn: {list(subtitles.keys())}")
                  print(f"🤖 Phụ đề tự động: {list(auto_subtitles.keys())}")
                  
                  # Chọn ngôn ngữ phụ đề
                  available_langs = list(subtitles.keys()) + list(auto_subtitles.keys())
                  if not available_langs:
                      print("❌ Video này không có phụ đề!")
                      sys.exit(1)
                  
                  # Ưu tiên phụ đề thủ công
                  if subtitles:
                      ydl_opts["subtitleslangs"] = [list(subtitles.keys())[0]]
                  else:
                      ydl_opts["subtitleslangs"] = [list(auto_subtitles.keys())[0]]
                  
                  ydl.download([url])
                  
          except Exception as e:
              print(f"❌ Lỗi khi tải phụ đề: {e}")
              print("Có thể cookies đã hết hạn, hãy cập nhật lại!")
              sys.exit(1)

          # Đọc file VTT gốc
          vtt_file = None
          for file in os.listdir("."):
              if file.endswith(".vtt"):
                  vtt_file = file
                  break

          if not vtt_file:
              print("❌ Không tìm thấy file phụ đề!")
              sys.exit(1)

          with open(vtt_file, "r", encoding="utf-8") as f:
              content = f.read()

          print("🔧 Đang biên soạn lại phụ đề...")

          # Parse VTT
          lines = content.split("\n")
          segments = []
          i = 0
          
          # Bỏ qua header WEBVTT
          while i < len(lines) and (lines[i].startswith("WEBVTT") or lines[i].startswith("Kind:") or lines[i].strip() == ""):
              i += 1
          
          while i < len(lines):
              # Tìm timestamp
              timestamp_match = re.match(r"(\d{2}:\d{2}:\d{2}\.\d{3}) --> (\d{2}:\d{2}:\d{2}\.\d{3})", lines[i])
              if timestamp_match:
                  start_time = timestamp_match.group(1)
                  end_time = timestamp_match.group(2)
                  i += 1
                  
                  # Đọc text
                  texts = []
                  while i < len(lines) and lines[i].strip() != "":
                      text = lines[i].strip()
                      if text and not text.startswith("WEBVTT") and not text.startswith("Kind:"):
                          # Xóa HTML tags nếu có
                          text = re.sub(r"<[^>]+>", "", text)
                          text = html.unescape(text)
                          if text:
                              texts.append(text)
                      i += 1
                  
                  if texts:
                      combined_text = " ".join(texts)
                      segments.append({
                          "start": start_time,
                          "end": end_time,
                          "text": combined_text
                      })
              else:
                  i += 1

          print(f"📝 Tìm thấy {len(segments)} đoạn phụ đề")

          # Tạo phiên âm và dịch
          translator = Translator()
          
          output_lines = ["WEBVTT\n", "Kind: captions\n", "Language: zh-TW\n\n"]
          
          for idx, seg in enumerate(segments):
              text = seg["text"]
              
              # Tạo phiên âm pinyin
              try:
                  pinyin_list = pinyin(text, style=Style.TONE)
                  pinyin_text = " ".join([p[0] for p in pinyin_list])
              except:
                  pinyin_text = text
              
              # Dịch sang tiếng Việt
              try:
                  translation = translator.translate(text, src="zh-TW", dest="vi").text
              except:
                  translation = "[Không thể dịch]"
              
              # Format output
              output_lines.append(f"{seg['start']} --> {seg['end']}\n")
              output_lines.append(f"{text}\n")
              output_lines.append(f"{pinyin_text}\n")
              output_lines.append(f"{translation}\n\n")
              
              if idx % 5 == 0:  # In tiến độ mỗi 5 đoạn
                  print(f"✅ Đã xử lý {idx+1}/{len(segments)} đoạn...")

          # Gộp thành nội dung hoàn chỉnh
          final_content = "".join(output_lines)
          target_filename = f"{video_id}_zh_vi.vtt"

          print("📤 Đang đẩy lên GitHub Gist...")
          payload = {
              "description": f"YouTube Subtitle - {video_title} ({video_id})",
              "public": True,
              "files": {target_filename: {"content": final_content}}
          }

          req = urllib.request.Request("https://api.github.com/gists", method="POST")
          req.add_header("Authorization", f"token {github_token}")
          req.add_header("Content-Type", "application/json")
          req.add_header("Accept", "application/vnd.github.v3+json")

          try:
              data = json.dumps(payload).encode("utf-8")
              response = urllib.request.urlopen(req, data=data)
              res_data = json.loads(response.read().decode("utf-8"))
              raw_url = res_data["files"][target_filename]["raw_url"]
              print(f"✅ THÀNH CÔNG!")
              print(f"🔗 Link Raw Gist: {raw_url}")
              print(f"📝 Video: {video_title}")
              print(f"📊 Tổng số đoạn: {len(segments)}")
          except Exception as e:
              print(f"❌ Lỗi khi tạo Gist: {e}")

          # Dọn dẹp
          for file in os.listdir("."):
              if file.endswith(".vtt") or file == "cookies.txt":
                  os.remove(file)
          '
