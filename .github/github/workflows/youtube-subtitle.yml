name: YouTube Subtitle to Gist

on:
  workflow_dispatch:
    inputs:
        youtube_url:
          description: 'Dán đường dẫn YouTube vào đây'
          required: true
          type: string

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade yt-dlp pypinyin googletrans==4.0.0-rc1

      - name: Create Cookies File
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            echo "✅ Cookies đã được tạo"
          else
            echo "❌ Không tìm thấy YT_COOKIES trong secrets"
            exit 1
          fi

      - name: Download and Process Subtitles
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          YT_URL: ${{ inputs.youtube_url }}
        run: |
          python3 << 'EOF'
          import os, sys, json, re, html, urllib.request
          from yt_dlp import YoutubeDL
          from pypinyin import pinyin, Style
          from googletrans import Translator

          YT_URL = os.environ["YT_URL"]
          GH_TOKEN = os.environ["GITHUB_TOKEN"]
          COOKIE_FILE = "cookies.txt"

          print("=" * 50)
          print("BẮT ĐẦU XỬ LÝ PHỤ ĐỀ YOUTUBE")
          print("=" * 50)

          if not os.path.exists(COOKIE_FILE):
              print("❌ KHÔNG TÌM THẤY FILE COOKIES!")
              sys.exit(1)

          print("\n📺 Bước 1: Lấy phụ đề từ YouTube...")
          
          ydl_opts = {
              'skip_download': True,
              'writesubtitles': True,
              'writeautomaticsub': True,
              'subtitleslangs': ['zh-TW', 'zh-Hant', 'zh', 'zh-CN', 'zh-Hans', 'en'],
              'subtitlesformat': 'vtt',
              'outtmpl': 'subtitle',
              'cookiefile': COOKIE_FILE,
          }

          try:
              with YoutubeDL(ydl_opts) as ydl:
                  info = ydl.extract_info(YT_URL, download=False)
                  video_id = info.get('id', 'unknown')
                  video_title = info.get('title', 'No Title')
                  
                  subs = info.get('subtitles', {})
                  auto_subs = info.get('automatic_captions', {})
                  
                  print(f"📹 Video: {video_title}")
                  print(f"🆔 ID: {video_id}")
                  print(f"📝 Sub thủ công: {list(subs.keys()) if subs else 'Không có'}")
                  print(f"🤖 Sub tự động: {list(auto_subs.keys()) if auto_subs else 'Không có'}")
                  
                  target_lang = None
                  for lang in ['zh-TW', 'zh-Hant', 'zh', 'zh-CN', 'zh-Hans']:
                      if lang in subs:
                          target_lang = lang
                          break
                      if lang in auto_subs:
                          target_lang = lang
                          break
                  
                  if not target_lang:
                      if 'en' in subs or 'en' in auto_subs:
                          target_lang = 'en'
                  
                  if not target_lang:
                      print("❌ Video không có phụ đề phù hợp!")
                      sys.exit(1)
                  
                  print(f"🎯 Sử dụng phụ đề: {target_lang}")
                  
                  ydl_opts['subtitleslangs'] = [target_lang]
                  with YoutubeDL(ydl_opts) as ydl2:
                      ydl2.download([YT_URL])
                      
          except Exception as e:
              print(f"❌ Lỗi tải phụ đề: {str(e)}")
              sys.exit(1)

          print("\n📄 Bước 2: Đọc file phụ đề...")
          
          vtt_files = [f for f in os.listdir('.') if f.endswith('.vtt')]
          
          if not vtt_files:
              print("❌ Không tìm thấy file .vtt!")
              print("Files hiện có:", os.listdir('.'))
              sys.exit(1)
          
          vtt_file = vtt_files[0]
          print(f"📁 File: {vtt_file}")
          
          with open(vtt_file, 'r', encoding='utf-8') as f:
              raw_content = f.read()

          print("\n🔧 Bước 3: Phân tích phụ đề...")
          
          segments = []
          lines = raw_content.split('\n')
          i = 0
          
          while i < len(lines):
              line = lines[i].strip()
              if not line or 'WEBVTT' in line or 'Kind:' in line:
                  i += 1
              else:
                  break
          
          while i < len(lines):
              line = lines[i].strip()
              
              match = re.match(r'(\d{2}:\d{2}:\d{2}\.\d{3}) --> (\d{2}:\d{2}:\d{2}\.\d{3})', line)
              if match:
                  start = match.group(1)
                  end = match.group(2)
                  i += 1
                  
                  texts = []
                  while i < len(lines) and lines[i].strip():
                      text = lines[i].strip()
                      text = re.sub(r'<[^>]+>', '', text)
                      text = html.unescape(text)
                      if text and not text.startswith('WEBVTT') and not text.startswith('Kind:'):
                          texts.append(text)
                      i += 1
                  
                  if texts:
                      segments.append({
                          'start': start,
                          'end': end,
                          'text': ' '.join(texts)
                      })
              else:
                  i += 1
          
          print(f"✅ Tìm thấy {len(segments)} đoạn phụ đề")
          
          if not segments:
              print("❌ Không có đoạn phụ đề nào!")
              sys.exit(1)

          print("\n🌐 Bước 4: Thêm phiên âm và dịch...")
          
          translator = Translator()
          result = ['WEBVTT\n', 'Kind: captions\n', 'Language: zh-TW\n\n']
          
          for idx, seg in enumerate(segments):
              text = seg['text']
              
              try:
                  has_chinese = bool(re.search(r'[\u4e00-\u9fff]', text))
                  if has_chinese:
                      py = pinyin(text, style=Style.TONE)
                      pinyin_text = ' '.join([p[0] for p in py])
                  else:
                      pinyin_text = text
              except:
                  pinyin_text = text
              
              try:
                  has_chinese = bool(re.search(r'[\u4e00-\u9fff]', text))
                  if has_chinese:
                      vi_text = translator.translate(text, src='zh-cn', dest='vi').text
                  else:
                      vi_text = translator.translate(text, dest='vi').text
              except:
                  vi_text = '[Không thể dịch]'
              
              result.append(f"{seg['start']} --> {seg['end']}\n")
              result.append(f"{text}\n")
              result.append(f"{pinyin_text}\n")
              result.append(f"{vi_text}\n\n")
              
              if (idx + 1) % 10 == 0:
                  print(f"⏳ {idx+1}/{len(segments)} đoạn...")

          final_content = ''.join(result)
          gist_filename = f"{video_id}_subtitle.vtt"

          print("\n📤 Bước 5: Đẩy lên GitHub Gist...")
          
          payload = {
              'description': f'📺 {video_title} ({video_id})',
              'public': True,
              'files': {
                  gist_filename: {
                      'content': final_content
                  }
              }
          }

          req = urllib.request.Request(
              'https://api.github.com/gists',
              method='POST',
              headers={
                  'Authorization': f'token {GH_TOKEN}',
                  'Content-Type': 'application/json',
                  'Accept': 'application/vnd.github.v3+json'
              }
          )

          try:
              response = urllib.request.urlopen(req, data=json.dumps(payload).encode())
              gist_data = json.loads(response.read().decode())
              raw_url = gist_data['files'][gist_filename]['raw_url']
              
              print("\n" + "=" * 50)
              print("✅ HOÀN THÀNH!")
              print("=" * 50)
              print(f"📹 Video: {video_title}")
              print(f"🔗 Gist: {raw_url}")
              print(f"📊 Số đoạn: {len(segments)}")
              print("=" * 50)
          except Exception as e:
              print(f"❌ Lỗi tạo Gist: {e}")
              sys.exit(1)

          print("\n🧹 Dọn dẹp files tạm...")
          for f in os.listdir('.'):
              if f.endswith('.vtt') or f == COOKIE_FILE:
                  try:
                      os.remove(f)
                  except:
                      pass
          print("✅ Xong!")
          EOF
