name: YouTube AI Subtitle to Gist

on:
  workflow_dispatch:
    inputs:
        youtube_url:
          description: 'Dán đường dẫn YouTube vào đây'
          required: true
          type: string

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade yt-dlp pypinyin googletrans==4.0.0-rc1

      - name: Create Cookies File
        env:
          YT_COOKIES_CONTENT: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES_CONTENT" ]; then
            echo "$YT_COOKIES_CONTENT" > cookies.txt
            echo "Đã tạo cookies.txt"
          else
            echo "KHÔNG CÓ COOKIES!"
            exit 1
          fi

      - name: Run Subtitle Script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          YT_URL: ${{ inputs.youtube_url }}
        run: |
          python3 << 'EOF'
          import os, sys, json, re, html, urllib.request
          from yt_dlp import YoutubeDL
          from pypinyin import pinyin, Style
          from googletrans import Translator

          url = os.environ["YT_URL"]
          github_token = os.environ["GITHUB_TOKEN"]

          print("Dang lay phu de tu YouTube...")
          
          ydl_opts = {
              "skip_download": True,
              "writesubtitles": True,
              "writeautomaticsub": True,
              "subtitleslangs": ["zh-TW", "zh-Hant", "zh", "zh-CN", "zh-Hans", "en", "vi"],
              "subtitlesformat": "vtt",
              "outtmpl": "subtitle",
              "cookiefile": "cookies.txt",
          }

          with YoutubeDL(ydl_opts) as ydl:
              info_dict = ydl.extract_info(url, download=False)
              video_id = info_dict.get("id", "unknown_video")
              video_title = info_dict.get("title", "subtitle")
              
              subs = info_dict.get("subtitles", {})
              auto_subs = info_dict.get("automatic_captions", {})
              
              print(f"Video: {video_title}")
              print(f"ID: {video_id}")
              
              target_lang = None
              for lang in ["zh-TW", "zh-Hant", "zh", "zh-CN", "zh-Hans"]:
                  if lang in subs:
                      target_lang = lang
                      break
                  if lang in auto_subs:
                      target_lang = lang
                      break
              
              if not target_lang:
                  for lang in ["en", "vi"]:
                      if lang in subs or lang in auto_subs:
                          target_lang = lang
                          break
              
              if not target_lang:
                  print("Video khong co phu de!")
                  sys.exit(1)
              
              print(f"Ngon ngu: {target_lang}")
              
              ydl_opts["subtitleslangs"] = [target_lang]
              with YoutubeDL(ydl_opts) as ydl2:
                  ydl2.download([url])

          vtt_files = [f for f in os.listdir(".") if f.endswith(".vtt")]
          if not vtt_files:
              print("Khong tim thay file phu de!")
              sys.exit(1)
          
          vtt_file = vtt_files[0]
          
          with open(vtt_file, "r", encoding="utf-8") as f:
              content = f.read()

          print("Dang bien soan phu de...")

          segments = []
          lines = content.split("\n")
          i = 0
          
          while i < len(lines):
              line = lines[i].strip()
              if not line or "WEBVTT" in line or "Kind:" in line:
                  i += 1
              else:
                  break
          
          while i < len(lines):
              line = lines[i].strip()
              
              match = re.match(r"(\d{2}:\d{2}:\d{2}\.\d{3}) --> (\d{2}:\d{2}:\d{2}\.\d{3})", line)
              if match:
                  start_time = match.group(1)
                  end_time = match.group(2)
                  i += 1
                  
                  texts = []
                  while i < len(lines) and lines[i].strip():
                      text = lines[i].strip()
                      text = re.sub(r"<[^>]+>", "", text)
                      text = html.unescape(text)
                      if text:
                          texts.append(text)
                      i += 1
                  
                  if texts:
                      segments.append({
                          "start": start_time,
                          "end": end_time,
                          "text": " ".join(texts)
                      })
              else:
                  i += 1

          print(f"Tim thay {len(segments)} doan phu de")

          if len(segments) == 0:
              print("Khong parse duoc phu de!")
              sys.exit(1)

          print("Dang dich...")
          translator = Translator()
          
          content_lines = ["WEBVTT\n\n"]
          
          for idx, seg in enumerate(segments):
              text = seg["text"]
              
              try:
                  if re.search(r'[\u4e00-\u9fff]', text):
                      py_list = pinyin(text, style=Style.TONE)
                      pinyin_text = " ".join([p[0] for p in py_list])
                  else:
                      pinyin_text = text
              except:
                  pinyin_text = text
              
              try:
                  if re.search(r'[\u4e00-\u9fff]', text):
                      translation = translator.translate(text, src="zh-cn", dest="vi").text
                  else:
                      translation = translator.translate(text, dest="vi").text
              except:
                  translation = text
              
              content_lines.append(f"{seg['start']} --> {seg['end']}\n")
              content_lines.append(f"{text}\n")
              content_lines.append(f"{pinyin_text}\n")
              content_lines.append(f"{translation}\n\n")
              
              if (idx + 1) % 10 == 0:
                  print(f"Dang xu ly {idx+1}/{len(segments)}...")

          file_content = "".join(content_lines)
          target_filename = f"{video_id}.vtt"
          
          print("Dang day len GitHub Gist...")
          payload = {
              "description": f"AI Subtitle - {video_title} ({video_id})",
              "public": True,
              "files": {target_filename: {"content": file_content}}
          }

          req = urllib.request.Request("https://api.github.com/gists", method="POST")
          req.add_header("Authorization", f"token {github_token}")
          req.add_header("Content-Type", "application/json")

          try:
              data = json.dumps(payload).encode("utf-8")
              response = urllib.request.urlopen(req, data=data)
              res_data = json.loads(response.read().decode("utf-8"))
              raw_url = res_data["files"][target_filename]["raw_url"]
              print(f"THANH CONG!")
              print(f"Link: {raw_url}")
          except Exception as e:
              print(f"Loi: {e}")

          if os.path.exists(vtt_file):
              os.remove(vtt_file)
          if os.path.exists("cookies.txt"):
              os.remove("cookies.txt")
          EOF
