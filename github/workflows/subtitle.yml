name: YouTube Subtitle to Gist

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'Dán link YouTube vào đây'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install packages
        run: pip install yt-dlp pypinyin googletrans==4.0.0-rc1
      
      - name: Setup cookies
        env:
          COOKIES: ${{ secrets.YT_COOKIES }}
        run: echo "$COOKIES" > cookies.txt
      
      - name: Get subtitles
        env:
          TOKEN: ${{ secrets.GH_PAT }}
          URL: ${{ github.event.inputs.youtube_url }}
        run: |
          python3 << 'EOF'
          import os, sys, json, re, html, urllib.request
          from yt_dlp import YoutubeDL
          from pypinyin import pinyin, Style
          from googletrans import Translator

          url = os.environ["URL"]
          token = os.environ["TOKEN"]

          print("Downloading...")
          
          opts = {
              'skip_download': True,
              'writesubtitles': True,
              'writeautomaticsub': True,
              'subtitleslangs': ['zh-TW', 'zh-Hant', 'zh', 'zh-CN', 'zh-Hans', 'en'],
              'subtitlesformat': 'vtt',
              'outtmpl': 'sub',
              'cookiefile': 'cookies.txt',
          }
          
          with YoutubeDL(opts) as yt:
              info = yt.extract_info(url, download=False)
              vid = info['id']
              title = info['title']
              subs = info.get('subtitles', {})
              auto = info.get('automatic_captions', {})
              
              lang = None
              for l in ['zh-TW', 'zh-Hant', 'zh', 'zh-CN', 'zh-Hans', 'en']:
                  if l in subs or l in auto:
                      lang = l
                      break
              
              print(f"Video: {title}")
              print(f"Lang: {lang}")
              
              opts['subtitleslangs'] = [lang]
              with YoutubeDL(opts) as yt2:
                  yt2.download([url])
          
          vtt = [f for f in os.listdir('.') if f.endswith('.vtt')][0]
          with open(vtt) as f:
              raw = f.read()
          
          segs = []
          lines = raw.split('\n')
          i = 0
          while i < len(lines):
              l = lines[i].strip()
              if not l or 'WEBVTT' in l or 'Kind:' in l:
                  i += 1
                  continue
              m = re.match(r'(\d{2}:\d{2}:\d{2}\.\d{3}) --> (\d{2}:\d{2}:\d{2}\.\d{3})', l)
              if m:
                  s, e = m.group(1), m.group(2)
                  i += 1
                  txt = []
                  while i < len(lines) and lines[i].strip():
                      t = re.sub(r'<[^>]+>', '', lines[i].strip())
                      t = html.unescape(t)
                      if t:
                          txt.append(t)
                      i += 1
                  if txt:
                      segs.append({'s': s, 'e': e, 't': ' '.join(txt)})
              else:
                  i += 1
          
          print(f"Segments: {len(segs)}")
          
          tr = Translator()
          out = ['WEBVTT\n\n']
          
          for idx, seg in enumerate(segs):
              txt = seg['t']
              
              try:
                  if re.search(r'[\u4e00-\u9fff]', txt):
                      py = ' '.join([p[0] for p in pinyin(txt, style=Style.TONE)])
                  else:
                      py = txt
              except:
                  py = txt
              
              try:
                  if re.search(r'[\u4e00-\u9fff]', txt):
                      vi = tr.translate(txt, src='zh-cn', dest='vi').text
                  else:
                      vi = tr.translate(txt, dest='vi').text
              except:
                  vi = txt
              
              out.append(f"{seg['s']} --> {seg['e']}\n{txt}\n{py}\n{vi}\n\n")
          
          final = ''.join(out)
          
          payload = {
              'description': title,
              'public': True,
              'files': {f'{vid}.vtt': {'content': final}}
          }
          
          req = urllib.request.Request(
              'https://api.github.com/gists',
              method='POST',
              data=json.dumps(payload).encode(),
              headers={
                  'Authorization': f'token {token}',
                  'Content-Type': 'application/json'
              }
          )
          
          resp = urllib.request.urlopen(req)
          gist = json.loads(resp.read().decode())
          link = gist['files'][f'{vid}.vtt']['raw_url']
          
          print(f"\n✅ DONE!")
          print(f"📎 {link}")
          
          for f in os.listdir('.'):
              if f.endswith('.vtt') or f == 'cookies.txt':
                  os.remove(f)
          EOF
