<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 YouTube Background Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #1c1c1e;
            border-radius: 20px;
            padding: 20px 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .header .logo {
            font-size: 28px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .header .badge {
            margin-left: auto;
            font-size: 10px;
            color: #0a84ff;
            background: rgba(10, 132, 255, 0.15);
            padding: 4px 12px;
            border-radius: 12px;
            border: 0.5px solid rgba(10, 132, 255, 0.15);
        }

        .input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            -webkit-appearance: none;
        }

        .input-area input::placeholder {
            color: #636366;
        }

        .input-area input:focus {
            border-color: #0a84ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
        }

        .input-area .btn-add {
            padding: 12px 18px;
            background: #0a84ff;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            touch-action: manipulation;
        }

        .input-area .btn-add:active {
            transform: scale(0.95);
            background: #007aff;
        }

        .input-hint {
            font-size: 11px;
            color: #636366;
            margin-bottom: 14px;
            line-height: 1.5;
            padding: 0 4px;
        }

        .input-hint .highlight {
            color: #0a84ff;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .playlist-header .title {
            font-size: 13px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .playlist-header .count {
            font-size: 12px;
            color: #636366;
        }

        .playlist {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 14px;
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .playlist::-webkit-scrollbar {
            width: 3px;
        }
        .playlist::-webkit-scrollbar-track {
            background: transparent;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: #2c2c2e;
            border-radius: 2px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            margin-bottom: 6px;
            border: 0.5px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s;
            cursor: pointer;
            touch-action: manipulation;
        }

        .playlist-item:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
        }

        .playlist-item.active {
            background: rgba(10, 132, 255, 0.15);
            border-color: rgba(10, 132, 255, 0.3);
        }

        .playlist-item .index {
            font-size: 12px;
            color: #636366;
            min-width: 24px;
            text-align: center;
            font-weight: 500;
        }

        .playlist-item .info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item .info .title {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item .info .sub {
            font-size: 11px;
            color: #636366;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item .status {
            font-size: 14px;
            min-width: 20px;
            text-align: center;
        }

        .playlist-item .btn-remove {
            background: none;
            border: none;
            color: #636366;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s;
            font-family: inherit;
            line-height: 1;
            touch-action: manipulation;
        }

        .playlist-item .btn-remove:active {
            color: #ff3b30;
            transform: scale(0.9);
        }

        .empty-playlist {
            text-align: center;
            color: #636366;
            font-size: 13px;
            padding: 30px 0;
            line-height: 1.8;
        }

        .empty-playlist .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            border: 0.5px solid rgba(255, 255, 255, 0.06);
        }

        .controls .btn-play {
            min-width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            color: #000000;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            flex-shrink: 0;
            touch-action: manipulation;
        }

        .controls .btn-play:active {
            transform: scale(0.92);
        }

        .controls .btn-play.paused {
            background: #2c2c2e;
            color: #ffffff;
        }

        .controls .info {
            flex: 1;
            min-width: 0;
        }

        .controls .info .current-title {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls .info .current-sub {
            font-size: 11px;
            color: #636366;
        }

        .controls .btn-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .controls .btn-group button {
            background: none;
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            color: #8e8e93;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.03);
            touch-action: manipulation;
        }

        .controls .btn-group button:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.08);
        }

        .controls .btn-group button.active {
            background: rgba(10, 132, 255, 0.15);
            border-color: rgba(10, 132, 255, 0.3);
            color: #0a84ff;
        }

        .progress-area {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-area input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: #2c2c2e;
            border-radius: 2px;
            outline: none;
            accent-color: #0a84ff;
            cursor: pointer;
            touch-action: none;
        }

        .progress-area input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #0a84ff;
            cursor: pointer;
            border: 2px solid #000000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .progress-area input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #0a84ff;
            cursor: pointer;
            border: 2px solid #000000;
        }

        .progress-area .time {
            font-size: 11px;
            color: #636366;
            min-width: 44px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .bg-indicator {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: #0a84ff;
            background: rgba(10, 132, 255, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
            border: 0.5px solid rgba(10, 132, 255, 0.15);
            margin-top: 8px;
            justify-content: center;
        }

        .bg-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #0a84ff;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .bg-indicator.show {
            display: flex;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1c1c1e;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 13px;
            color: #ffffff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* YouTube iframe ẩn */
        #youtube-player {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 400px) {
            .container {
                padding: 16px 14px;
                border-radius: 16px;
            }
            .input-area .btn-add {
                padding: 12px 14px;
                font-size: 13px;
            }
            .controls .btn-play {
                min-width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .playlist {
                max-height: 200px;
            }
        }

        @media (max-width: 360px) {
            .controls .btn-group button {
                font-size: 12px;
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="logo">🎵</span>
        <h1>YouTube Player</h1>
        <span class="badge">Nền</span>
    </div>

    <div class="input-area">
        <input type="text" id="url-input" placeholder="URL hoặc Video ID..." spellcheck="false" autocomplete="off">
        <button class="btn-add" onclick="addVideo()">Thêm</button>
    </div>
    <div class="input-hint">
        💡 Hỗ trợ: URL YouTube, Video ID, <span class="highlight">Playlist</span>
    </div>

    <div class="playlist-header">
        <span class="title">📋 Danh sách</span>
        <span class="count" id="playlist-count">0 video</span>
    </div>

    <div class="playlist" id="playlist">
        <div class="empty-playlist">
            <span class="icon">🎧</span>
            Chưa có video nào<br>
            <span style="font-size:12px;">Thêm URL YouTube để bắt đầu</span>
        </div>
    </div>

    <div class="bg-indicator show" id="bg-indicator">
        <span class="dot"></span>
        🎧 Phát nền (chạy khi chuyển tab/thu nhỏ)
    </div>

    <div class="controls">
        <button class="btn-play paused" id="btn-play" onclick="togglePlay()">▶</button>

        <div class="info">
            <div class="current-title" id="current-title">Chưa có video</div>
            <div class="current-sub" id="current-sub">Thêm video để phát</div>
        </div>

        <div class="btn-group">
            <button onclick="toggleLoop()" id="btn-loop" title="Lặp lại">🔁</button>
            <button onclick="toggleShuffle()" id="btn-shuffle" title="Phát ngẫu nhiên">🔀</button>
            <button onclick="toggleBackgroundMode()" id="btn-bg" title="Chế độ nền" class="active">🎧</button>
        </div>
    </div>

    <div class="progress-area">
        <span class="time" id="current-time">00:00</span>
        <input type="range" id="progress-slider" value="0" min="0" max="100" step="0.1"
               oninput="onSeek(this.value)" onchange="onSeekEnd(this.value)">
        <span class="time" id="total-time">00:00</span>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- YouTube iframe ẩn -->
<div id="youtube-player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // ============================================================
    // STATE
    // ============================================================
    let player = null;
    let playerReady = false;
    let playlist = [];
    let currentIndex = -1;
    let isPlaying = false;
    let isLoop = false;
    let isShuffle = false;
    let isBackgroundMode = true;
    let isSeeking = false;
    let syncInterval = null;

    // ============================================================
    // STORAGE
    // ============================================================
    function savePlaylist() {
        try {
            localStorage.setItem('yt_bg_player', JSON.stringify(playlist));
        } catch (e) {}
    }

    function loadPlaylist() {
        try {
            const data = localStorage.getItem('yt_bg_player');
            if (data) {
                playlist = JSON.parse(data);
                return true;
            }
        } catch (e) {}
        return false;
    }

    // ============================================================
    // TOAST
    // ============================================================
    let toastTimeout = null;

    function showToast(msg, duration = 2000) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => el.classList.remove('show'), duration);
    }

    // ============================================================
    // EXTRACT VIDEO ID
    // ============================================================
    function extractVideoId(input) {
        input = input.trim();
        if (!input) return null;
        if (input.match(/^[a-zA-Z0-9_-]{11}$/)) return { type: 'video', id: input };

        const patterns = [
            /youtu\.be\/([a-zA-Z0-9_-]{11})/,
            /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
            /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
            /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
            /[?&]v=([a-zA-Z0-9_-]{11})/
        ];

        for (const p of patterns) {
            const m = input.match(p);
            if (m) return { type: 'video', id: m[1] };
        }
        return null;
    }

    // ============================================================
    // FETCH VIDEO INFO
    // ============================================================
    async function fetchVideoInfo(videoId) {
        try {
            const r = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
            if (r.ok) {
                const d = await r.json();
                return { title: d.title || videoId, author: d.author_name || '' };
            }
        } catch (e) {}
        return { title: videoId, author: '' };
    }

    // ============================================================
    // ADD VIDEO
    // ============================================================
    async function addVideo() {
        const input = document.getElementById('url-input');
        const val = input.value.trim();
        if (!val) { showToast('⚠️ Nhập URL hoặc Video ID', 2000); return; }

        const result = extractVideoId(val);
        if (!result) { showToast('❌ Không tìm thấy Video ID', 2000); return; }

        if (playlist.some(item => item.id === result.id)) {
            showToast('⚠️ Video đã có', 2000);
            input.value = '';
            return;
        }

        const info = await fetchVideoInfo(result.id);
        playlist.push({ id: result.id, title: info.title, author: info.author });
        renderPlaylist();
        savePlaylist();
        input.value = '';

        if (currentIndex === -1) {
            currentIndex = playlist.length - 1;
            loadVideo(currentIndex);
        }
        showToast(`✅ ${info.title}`, 2000);
    }

    // ============================================================
    // RENDER PLAYLIST
    // ============================================================
    function renderPlaylist() {
        const container = document.getElementById('playlist');
        const count = document.getElementById('playlist-count');

        if (playlist.length === 0) {
            container.innerHTML = `
                <div class="empty-playlist">
                    <span class="icon">🎧</span>
                    Chưa có video nào<br>
                    <span style="font-size:12px;">Thêm URL YouTube để bắt đầu</span>
                </div>
            `;
            count.textContent = '0 video';
            return;
        }

        count.textContent = `${playlist.length} video`;
        let html = '';
        playlist.forEach((item, index) => {
            const active = index === currentIndex;
            const playing = active && isPlaying;
            html += `
                <div class="playlist-item ${active ? 'active' : ''}" onclick="playVideo(${index})">
                    <span class="index">${index + 1}</span>
                    <div class="info">
                        <div class="title">${escapeHtml(item.title || item.id)}</div>
                        <div class="sub">${escapeHtml(item.author || 'YouTube')}</div>
                    </div>
                    <span class="status">${playing ? '▶️' : ''}</span>
                    <button class="btn-remove" onclick="event.stopPropagation(); removeVideo(${index})">✕</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    // ============================================================
    // PLAY VIDEO - DÙNG YOUTUBE IFRAME
    // ============================================================
    function playVideo(index) {
        if (index < 0 || index >= playlist.length) return;
        if (index === currentIndex && playerReady) {
            togglePlay();
            return;
        }
        currentIndex = index;
        loadVideo(index);
    }

    function loadVideo(index) {
        if (index < 0 || index >= playlist.length) return;

        const video = playlist[index];
        document.getElementById('current-title').textContent = video.title || video.id;
        document.getElementById('current-sub').textContent = video.author || 'YouTube';

        if (playerReady && player) {
            player.loadVideoById(video.id);
            player.playVideo();
            isPlaying = true;
            updatePlayButton();
        } else {
            createPlayer(video.id);
        }

        renderPlaylist();
        showToast(`▶️ ${video.title || video.id}`, 1500);
    }

    // ============================================================
    // CREATE YOUTUBE PLAYER (ẨN)
    // ============================================================
    function createPlayer(videoId) {
        if (player) {
            try { player.destroy(); } catch(e) {}
            player = null;
            playerReady = false;
        }

        const container = document.getElementById('youtube-player');
        container.innerHTML = '';

        player = new YT.Player('youtube-player', {
            height: '1',
            width: '1',
            videoId: videoId,
            playerVars: {
                playsinline: 1,
                autoplay: 1,
                controls: 0,
                rel: 0,
                showinfo: 0,
                modestbranding: 1,
                origin: window.location.origin
            },
            events: {
                onReady: onPlayerReady,
                onStateChange: onPlayerStateChange,
                onError: onPlayerError
            }
        });
    }

    function onPlayerReady(e) {
        playerReady = true;
        isPlaying = true;
        updatePlayButton();
        startSync();

        const video = playlist[currentIndex];
        if (video) {
            document.getElementById('current-title').textContent = video.title || video.id;
            document.getElementById('current-sub').textContent = video.author || 'YouTube';
        }

        // Hiển thị indicator nền
        if (isBackgroundMode) {
            document.getElementById('bg-indicator').classList.add('show');
        }

        setTimeout(updateProgress, 500);
        showToast('▶️ Đang phát', 1000);
    }

    function onPlayerStateChange(e) {
        const state = e.data;

        if (state === YT.PlayerState.PLAYING) {
            isPlaying = true;
            updatePlayButton();
            updateProgress();
            if (isBackgroundMode) {
                document.getElementById('bg-indicator').classList.add('show');
            }
        } else if (state === YT.PlayerState.PAUSED) {
            isPlaying = false;
            updatePlayButton();
        } else if (state === YT.PlayerState.ENDED) {
            isPlaying = false;
            updatePlayButton();
            // Phát video tiếp theo
            setTimeout(nextVideo, 500);
        } else if (state === YT.PlayerState.BUFFERING) {
            // Đang tải
        }
    }

    function onPlayerError(e) {
        console.error('Player error:', e);
        showToast('❌ Lỗi phát video', 2000);
        setTimeout(nextVideo, 3000);
    }

    // ============================================================
    // 🎯 XỬ LÝ PHÁT NỀN - QUAN TRỌNG
    // ============================================================
    // Khi chuyển tab hoặc thu nhỏ trình duyệt
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            // Tab bị ẩn (chuyển tab hoặc thu nhỏ)
            if (isBackgroundMode && isPlaying && playerReady && player) {
                // YouTube iframe sẽ tự động tiếp tục phát
                // Nhưng để an toàn, chúng ta kiểm tra và phát lại nếu cần
                try {
                    const state = player.getPlayerState();
                    if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.ENDED) {
                        player.playVideo();
                        isPlaying = true;
                        updatePlayButton();
                    }
                } catch(e) {}
            }
        } else {
            // Tab được hiển thị lại
            if (isBackgroundMode && isPlaying && playerReady && player) {
                try {
                    const state = player.getPlayerState();
                    if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.ENDED) {
                        player.playVideo();
                        isPlaying = true;
                        updatePlayButton();
                    }
                } catch(e) {}
            }
        }
    });

    // ============================================================
    // CONTROLS
    // ============================================================
    function togglePlay() {
        if (!playerReady || !player) {
            if (playlist.length > 0) {
                if (currentIndex === -1) currentIndex = 0;
                loadVideo(currentIndex);
            } else {
                showToast('⚠️ Chưa có video', 2000);
            }
            return;
        }

        if (isPlaying) {
            player.pauseVideo();
            isPlaying = false;
        } else {
            player.playVideo();
            isPlaying = true;
        }
        updatePlayButton();
    }

    function updatePlayButton() {
        const btn = document.getElementById('btn-play');
        if (isPlaying) {
            btn.innerHTML = '⏸';
            btn.className = 'btn-play';
        } else {
            btn.innerHTML = '▶';
            btn.className = 'btn-play paused';
        }
    }

    function nextVideo() {
        if (playlist.length === 0) return;

        if (isLoop && playerReady && player) {
            player.seekTo(0, true);
            player.playVideo();
            isPlaying = true;
            updatePlayButton();
            return;
        }

        let next;
        if (isShuffle) {
            do {
                next = Math.floor(Math.random() * playlist.length);
            } while (next === currentIndex && playlist.length > 1);
        } else {
            next = (currentIndex + 1) % playlist.length;
        }

        currentIndex = next;
        loadVideo(currentIndex);
    }

    function toggleLoop() {
        isLoop = !isLoop;
        document.getElementById('btn-loop').classList.toggle('active', isLoop);
        showToast(isLoop ? '🔁 Lặp: BẬT' : '🔁 Lặp: TẮT', 1000);
        localStorage.setItem('bg_loop', isLoop);
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        document.getElementById('btn-shuffle').classList.toggle('active', isShuffle);
        showToast(isShuffle ? '🔀 Ngẫu nhiên: BẬT' : '🔀 Ngẫu nhiên: TẮT', 1000);
        localStorage.setItem('bg_shuffle', isShuffle);
    }

    function toggleBackgroundMode() {
        isBackgroundMode = !isBackgroundMode;
        const btn = document.getElementById('btn-bg');
        const indicator = document.getElementById('bg-indicator');

        if (isBackgroundMode) {
            btn.classList.add('active');
            if (isPlaying) indicator.classList.add('show');
            showToast('🎧 Nền: BẬT', 1500);
            // Nếu đang phát, đảm bảo tiếp tục
            if (isPlaying && playerReady && player) {
                try { player.playVideo(); } catch(e) {}
            }
        } else {
            btn.classList.remove('active');
            indicator.classList.remove('show');
            showToast('🎧 Nền: TẮT', 1500);
        }
        localStorage.setItem('bg_background', isBackgroundMode);
    }

    function removeVideo(index) {
        if (playlist.length === 0) return;
        const removed = playlist[index];
        playlist.splice(index, 1);

        if (currentIndex === index) {
            if (playerReady && player) {
                player.stopVideo();
                isPlaying = false;
                updatePlayButton();
                document.getElementById('bg-indicator').classList.remove('show');
            }
            if (playlist.length > 0) {
                currentIndex = Math.min(index, playlist.length - 1);
                loadVideo(currentIndex);
            } else {
                currentIndex = -1;
                document.getElementById('current-title').textContent = 'Chưa có video';
                document.getElementById('current-sub').textContent = 'Thêm video để phát';
                document.getElementById('current-time').textContent = '00:00';
                document.getElementById('total-time').textContent = '00:00';
                document.getElementById('progress-slider').value = 0;
            }
        } else if (currentIndex > index) {
            currentIndex--;
        }

        renderPlaylist();
        savePlaylist();
        showToast(`🗑️ ${removed.title || removed.id}`, 1500);
    }

    // ============================================================
    // PROGRESS
    // ============================================================
    function startSync() {
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(updateProgress, 200);
    }

    function updateProgress() {
        if (!playerReady || !player || isSeeking) return;
        try {
            const current = player.getCurrentTime();
            const total = player.getDuration();
            if (total > 0 && current >= 0) {
                document.getElementById('current-time').textContent = formatTime(current);
                document.getElementById('total-time').textContent = formatTime(total);
                document.getElementById('progress-slider').value = (current / total) * 100;
            }
        } catch(e) {}
    }

    function onSeek(value) {
        isSeeking = true;
        if (playerReady && player) {
            const total = player.getDuration();
            if (total > 0) {
                const time = (value / 100) * total;
                document.getElementById('current-time').textContent = formatTime(time);
            }
        }
    }

    function onSeekEnd(value) {
        if (playerReady && player) {
            const total = player.getDuration();
            if (total > 0) {
                player.seekTo((value / 100) * total, true);
            }
        }
        setTimeout(() => { isSeeking = false; }, 300);
    }

    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return '00:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if (e.key === 'n' || e.key === 'N') nextVideo();
        if (e.key === 'l' || e.key === 'L') toggleLoop();
        if (e.key === 's' || e.key === 'S') toggleShuffle();
    });

    document.getElementById('url-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addVideo(); }
    });

    // ============================================================
    // INIT
    // ============================================================
    function init() {
        if (loadPlaylist()) {
            renderPlaylist();
            if (playlist.length > 0) {
                currentIndex = 0;
                setTimeout(() => { loadVideo(0); }, 500);
            }
        }

        if (localStorage.getItem('bg_loop') === 'true') {
            isLoop = true;
            document.getElementById('btn-loop').classList.add('active');
        }

        if (localStorage.getItem('bg_shuffle') === 'true') {
            isShuffle = true;
            document.getElementById('btn-shuffle').classList.add('active');
        }

        if (localStorage.getItem('bg_background') === 'false') {
            isBackgroundMode = false;
            document.getElementById('btn-bg').classList.remove('active');
            document.getElementById('bg-indicator').classList.remove('show');
        } else {
            isBackgroundMode = true;
            document.getElementById('btn-bg').classList.add('active');
            document.getElementById('bg-indicator').classList.add('show');
        }
    }

    // ============================================================
    // YOUTUBE IFrame API READY
    // ============================================================
    function onYouTubeIframeAPIReady() {
        init();
    }

    // Fallback
    setTimeout(() => {
        if (typeof YT === 'undefined' || !YT.Player) {
            const script = document.createElement('script');
            script.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(script);
        }
    }, 3000);

    // Khởi tạo nếu API đã load
    if (typeof YT !== 'undefined' && YT.Player) {
        init();
    }
</script>

</body>
</html>
