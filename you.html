<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎵 YouTube Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #1c1c1e;
            border-radius: 20px;
            padding: 20px 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .header .logo {
            font-size: 28px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .header .badge {
            margin-left: auto;
            font-size: 10px;
            color: #0a84ff;
            background: rgba(10, 132, 255, 0.15);
            padding: 4px 12px;
            border-radius: 12px;
            border: 0.5px solid rgba(10, 132, 255, 0.15);
        }

        /* ===== INPUT ===== */
        .input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            -webkit-appearance: none;
        }

        .input-area input::placeholder {
            color: #636366;
        }

        .input-area input:focus {
            border-color: #0a84ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
        }

        .input-area .btn-add {
            padding: 12px 18px;
            background: #0a84ff;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .input-area .btn-add:active {
            transform: scale(0.95);
            background: #007aff;
        }

        .input-hint {
            font-size: 11px;
            color: #636366;
            margin-bottom: 14px;
            line-height: 1.5;
            padding: 0 4px;
        }

        .input-hint .highlight {
            color: #0a84ff;
        }

        /* ===== PLAYLIST ===== */
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .playlist-header .title {
            font-size: 13px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .playlist-header .count {
            font-size: 12px;
            color: #636366;
        }

        .playlist {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 14px;
            padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .playlist::-webkit-scrollbar {
            width: 3px;
        }

        .playlist::-webkit-scrollbar-track {
            background: transparent;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: #2c2c2e;
            border-radius: 2px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            margin-bottom: 6px;
            border: 0.5px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .playlist-item:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
        }

        .playlist-item.active {
            background: rgba(10, 132, 255, 0.15);
            border-color: rgba(10, 132, 255, 0.3);
        }

        .playlist-item .index {
            font-size: 12px;
            color: #636366;
            min-width: 24px;
            text-align: center;
            font-weight: 500;
        }

        .playlist-item .info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item .info .title {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item .info .sub {
            font-size: 11px;
            color: #636366;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item .status {
            font-size: 14px;
            min-width: 20px;
            text-align: center;
        }

        .playlist-item .btn-remove {
            background: none;
            border: none;
            color: #636366;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s;
            font-family: inherit;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .playlist-item .btn-remove:active {
            color: #ff3b30;
            transform: scale(0.9);
        }

        .empty-playlist {
            text-align: center;
            color: #636366;
            font-size: 13px;
            padding: 30px 0;
            line-height: 1.8;
        }

        .empty-playlist .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            border: 0.5px solid rgba(255, 255, 255, 0.06);
        }

        .controls .btn-play {
            min-width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            color: #000000;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .controls .btn-play:active {
            transform: scale(0.92);
        }

        .controls .btn-play.paused {
            background: #2c2c2e;
            color: #ffffff;
        }

        .controls .info {
            flex: 1;
            min-width: 0;
        }

        .controls .info .current-title {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls .info .current-sub {
            font-size: 11px;
            color: #636366;
        }

        .controls .btn-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .controls .btn-group button {
            background: none;
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            color: #8e8e93;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.03);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .controls .btn-group button:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.08);
        }

        .controls .btn-group button.active {
            background: rgba(10, 132, 255, 0.15);
            border-color: rgba(10, 132, 255, 0.3);
            color: #0a84ff;
        }

        /* ===== PROGRESS ===== */
        .progress-area {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-area input[type="range"] {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: #2c2c2e;
            border-radius: 2px;
            outline: none;
            accent-color: #0a84ff;
            cursor: pointer;
            touch-action: none;
        }

        .progress-area input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #0a84ff;
            cursor: pointer;
            border: 2px solid #000000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .progress-area input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #0a84ff;
            cursor: pointer;
            border: 2px solid #000000;
        }

        .progress-area .time {
            font-size: 11px;
            color: #636366;
            min-width: 44px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1c1c1e;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 13px;
            color: #ffffff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================================ */
        /* 🎵 CHROME BACKGROUND PLAYER - DÙNG AUDIO ELEMENT */
        /* ============================================================ */
        .audio-player-wrapper {
            display: none;
        }

        /* Thông báo Chrome background */
        .chrome-bg-notice {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(255, 149, 0, 0.12);
            border: 0.5px solid rgba(255, 149, 0, 0.2);
            border-radius: 10px;
            padding: 10px 14px;
            margin-top: 8px;
            font-size: 12px;
            color: #ff9500;
        }

        .chrome-bg-notice.show {
            display: flex;
        }

        .chrome-bg-notice .icon {
            font-size: 18px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 400px) {
            .container {
                padding: 16px 14px;
                border-radius: 16px;
            }

            .input-area .btn-add {
                padding: 12px 14px;
                font-size: 13px;
            }

            .controls .btn-play {
                min-width: 42px;
                height: 42px;
                font-size: 18px;
            }

            .playlist {
                max-height: 200px;
            }
        }

        @media (max-width: 360px) {
            .controls .btn-group button {
                font-size: 12px;
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <span class="logo">🎵</span>
        <h1>YouTube Music</h1>
        <span class="badge">Chrome</span>
    </div>

    <!-- Input -->
    <div class="input-area">
        <input type="text" id="url-input" placeholder="URL hoặc Video ID..." spellcheck="false" autocomplete="off">
        <button class="btn-add" onclick="addVideo()">Thêm</button>
    </div>
    <div class="input-hint">
        💡 Hỗ trợ: URL YouTube, Video ID, <span class="highlight">Playlist</span>
        <span style="float:right;">🔊 Phát nền Chrome</span>
    </div>

    <!-- Playlist Header -->
    <div class="playlist-header">
        <span class="title">📋 Danh sách</span>
        <span class="count" id="playlist-count">0 video</span>
    </div>

    <!-- Playlist -->
    <div class="playlist" id="playlist">
        <div class="empty-playlist">
            <span class="icon">🎧</span>
            Chưa có video nào<br>
            <span style="font-size:12px;">Thêm URL YouTube để bắt đầu</span>
        </div>
    </div>

    <!-- Chrome Background Notice -->
    <div class="chrome-bg-notice" id="chrome-bg-notice">
        <span class="icon">🔊</span>
        <span>Đang phát ở chế độ nền (thoát Chrome vẫn nghe)</span>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn-play paused" id="btn-play" onclick="togglePlay()">▶</button>

        <div class="info">
            <div class="current-title" id="current-title">Chưa có video</div>
            <div class="current-sub" id="current-sub">Thêm video để phát</div>
        </div>

        <div class="btn-group">
            <button onclick="toggleLoop()" id="btn-loop" title="Lặp lại">🔁</button>
            <button onclick="toggleShuffle()" id="btn-shuffle" title="Phát ngẫu nhiên">🔀</button>
            <button onclick="toggleBackgroundMode()" id="btn-bg" title="Chế độ nền" class="active">🎧</button>
        </div>
    </div>

    <!-- Progress -->
    <div class="progress-area">
        <span class="time" id="current-time">00:00</span>
        <input type="range" id="progress-slider" value="0" min="0" max="100" step="0.1"
               oninput="onSeek(this.value)" onchange="onSeekEnd(this.value)">
        <span class="time" id="total-time">00:00</span>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ========================================================== -->
<!-- 🎵 CHROME BACKGROUND PLAYER - DÙNG AUDIO ELEMENT           -->
<!-- ========================================================== -->
<div class="audio-player-wrapper">
    <audio id="bg-audio" controls></audio>
</div>

<script>
    // ============================================================
    // 🎵 CHROME BACKGROUND PLAYER - SỬ DỤNG AUDIO ELEMENT
    // ============================================================
    // Giải pháp: Sử dụng audio element thay vì iframe
    // Lấy stream audio từ YouTube thông qua proxy

    // ============================================================
    // STATE
    // ============================================================
    let audioElement = null;
    let currentAudioUrl = null;
    let playlist = [];
    let currentIndex = -1;
    let isPlaying = false;
    let isLoop = false;
    let isShuffle = false;
    let isBackgroundMode = true;
    let isSeeking = false;
    let syncInterval = null;

    // ============================================================
    // STORAGE
    // ============================================================
    function savePlaylist() {
        try {
            localStorage.setItem('chrome_player_playlist', JSON.stringify(playlist));
        } catch (e) {}
    }

    function loadPlaylist() {
        try {
            const data = localStorage.getItem('chrome_player_playlist');
            if (data) {
                playlist = JSON.parse(data);
                return true;
            }
        } catch (e) {}
        return false;
    }

    // ============================================================
    // TOAST
    // ============================================================
    let toastTimeout = null;

    function showToast(message, duration = 2000) {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            el.classList.remove('show');
        }, duration);
    }

    // ============================================================
    // EXTRACT VIDEO ID
    // ============================================================
    function extractVideoId(input) {
        input = input.trim();
        if (!input) return null;

        if (input.match(/^[a-zA-Z0-9_-]{11}$/)) {
            return { type: 'video', id: input };
        }

        const playlistMatch = input.match(/[&?]list=([a-zA-Z0-9_-]+)/);
        if (playlistMatch) {
            return { type: 'playlist', id: playlistMatch[1] };
        }

        const patterns = [
            /youtu\.be\/([a-zA-Z0-9_-]{11})/,
            /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
            /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
            /youtube\.com\/v\/([a-zA-Z0-9_-]{11})/,
            /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
            /[?&]v=([a-zA-Z0-9_-]{11})/
        ];

        for (const pattern of patterns) {
            const match = input.match(pattern);
            if (match) {
                return { type: 'video', id: match[1] };
            }
        }

        return null;
    }

    // ============================================================
    // FETCH VIDEO INFO & AUDIO URL
    // ============================================================
    async function fetchVideoInfo(videoId) {
        try {
            // Sử dụng YouTube oembed để lấy thông tin
            const response = await fetch(
                `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`
            );
            if (response.ok) {
                const data = await response.json();
                return {
                    title: data.title || videoId,
                    author: data.author_name || '',
                    thumbnail: data.thumbnail_url || ''
                };
            }
        } catch (e) {}

        try {
            const response = await fetch(
                `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`
            );
            if (response.ok) {
                const data = await response.json();
                return {
                    title: data.title || videoId,
                    author: data.author_name || '',
                    thumbnail: data.thumbnail_url || ''
                };
            }
        } catch (e) {}

        return { title: videoId, author: '', thumbnail: '' };
    }

    // ============================================================
    // 🎵 LẤY AUDIO URL TỪ YOUTUBE (DÙNG PROXY)
    // ============================================================
    async function getAudioUrl(videoId) {
        // Sử dụng dịch vụ miễn phí để lấy audio stream
        // Các option:
        // 1. ytmp3.cc proxy
        // 2. youtube-mp3 converter
        // 3. invidious instances

        try {
            // Sử dụng Invidious API (free, không cần key)
            const instances = [
                'https://invidious.io/api/v1/videos/',
                'https://yewtu.be/api/v1/videos/',
                'https://invidious.snopyta.org/api/v1/videos/'
            ];

            for (const instance of instances) {
                try {
                    const response = await fetch(`${instance}${videoId}?fields=formatStreams`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.formatStreams) {
                            // Tìm audio stream
                            const audioStream = data.formatStreams.find(
                                stream => stream.type && stream.type.startsWith('audio/')
                            );
                            if (audioStream && audioStream.url) {
                                return audioStream.url;
                            }
                        }
                    }
                } catch (e) {}
            }
        } catch (e) {}

        // Fallback: sử dụng ytmp3 service
        try {
            const response = await fetch(`https://api.vevioz.com/api/button/mp3/${videoId}`);
            if (response.ok) {
                const data = await response.json();
                if (data && data.download && data.download.url) {
                    return data.download.url;
                }
            }
        } catch (e) {}

        // Nếu không lấy được audio, dùng YouTube embed (không phát nền được)
        return null;
    }

    // ============================================================
    // ADD VIDEO
    // ============================================================
    async function addVideo() {
        const input = document.getElementById('url-input');
        const value = input.value.trim();

        if (!value) {
            showToast('⚠️ Vui lòng nhập URL hoặc Video ID', 2000);
            return;
        }

        const result = extractVideoId(value);

        if (!result) {
            showToast('❌ Không tìm thấy Video ID', 2000);
            return;
        }

        if (result.type === 'playlist') {
            showToast('⚠️ Vui lòng nhập từng video trong playlist', 3000);
            input.value = '';
            return;
        }

        const videoId = result.id;

        if (playlist.some(item => item.id === videoId)) {
            showToast('⚠️ Video đã có trong danh sách', 2000);
            input.value = '';
            return;
        }

        const info = await fetchVideoInfo(videoId);

        playlist.push({
            id: videoId,
            title: info.title,
            author: info.author
        });

        renderPlaylist();
        savePlaylist();
        input.value = '';

        if (currentIndex === -1) {
            currentIndex = playlist.length - 1;
            loadVideo(currentIndex);
        }

        showToast(`✅ Đã thêm: ${info.title}`, 2000);
    }

    // ============================================================
    // RENDER PLAYLIST
    // ============================================================
    function renderPlaylist() {
        const container = document.getElementById('playlist');
        const count = document.getElementById('playlist-count');

        if (playlist.length === 0) {
            container.innerHTML = `
                <div class="empty-playlist">
                    <span class="icon">🎧</span>
                    Chưa có video nào<br>
                    <span style="font-size:12px;">Thêm URL YouTube để bắt đầu</span>
                </div>
            `;
            count.textContent = '0 video';
            return;
        }

        count.textContent = `${playlist.length} video`;

        let html = '';
        playlist.forEach((item, index) => {
            const isActive = index === currentIndex;
            const isPlayingNow = isActive && isPlaying;
            html += `
                <div class="playlist-item ${isActive ? 'active' : ''}" onclick="playVideo(${index})">
                    <span class="index">${index + 1}</span>
                    <div class="info">
                        <div class="title">${escapeHtml(item.title || item.id)}</div>
                        <div class="sub">${escapeHtml(item.author || 'YouTube')}</div>
                    </div>
                    <span class="status">${isPlayingNow ? '▶️' : ''}</span>
                    <button class="btn-remove" onclick="event.stopPropagation(); removeVideo(${index})">✕</button>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============================================================
    // 🎵 PLAY VIDEO - DÙNG AUDIO ELEMENT
    // ============================================================
    async function playVideo(index) {
        if (index < 0 || index >= playlist.length) return;

        if (index === currentIndex && audioElement && !audioElement.paused) {
            togglePlay();
            return;
        }

        currentIndex = index;
        await loadVideo(index);
    }

    async function loadVideo(index) {
        if (index < 0 || index >= playlist.length) return;

        const video = playlist[index];
        const titleEl = document.getElementById('current-title');
        const subEl = document.getElementById('current-sub');

        titleEl.textContent = video.title || video.id;
        subEl.textContent = video.author || 'YouTube';

        showToast(`⏳ Đang tải: ${video.title || video.id}`, 2000);

        // Lấy audio URL
        const audioUrl = await getAudioUrl(video.id);

        if (!audioUrl) {
            showToast('❌ Không thể lấy audio, thử lại sau', 3000);
            // Thử phát video tiếp theo
            setTimeout(() => nextVideo(), 2000);
            return;
        }

        // Tạo audio element
        if (!audioElement) {
            audioElement = document.getElementById('bg-audio');
            if (!audioElement) {
                audioElement = document.createElement('audio');
                audioElement.id = 'bg-audio';
                document.body.appendChild(audioElement);
            }
        }

        // Cài đặt audio
        audioElement.src = audioUrl;
        audioElement.crossOrigin = 'anonymous';

        // Lắng nghe sự kiện
        audioElement.onloadedmetadata = function() {
            document.getElementById('total-time').textContent = formatTime(audioElement.duration);
            if (isBackgroundMode) {
                // Bật chế độ nền cho Chrome
                audioElement.play();
                isPlaying = true;
                updatePlayButton();
                showToast(`▶️ ${video.title || video.id}`, 1500);
                // Hiển thị thông báo Chrome background
                document.getElementById('chrome-bg-notice').classList.add('show');
            }
            startSync();
        };

        audioElement.onplay = function() {
            isPlaying = true;
            updatePlayButton();
            if (isBackgroundMode) {
                document.getElementById('chrome-bg-notice').classList.add('show');
            }
        };

        audioElement.onpause = function() {
            isPlaying = false;
            updatePlayButton();
        };

        audioElement.onended = function() {
            isPlaying = false;
            updatePlayButton();
            nextVideo();
        };

        audioElement.onerror = function(e) {
            console.error('Audio error:', e);
            showToast('❌ Lỗi phát audio', 2000);
            setTimeout(() => nextVideo(), 3000);
        };

        // Bắt đầu phát
        try {
            await audioElement.play();
            isPlaying = true;
            updatePlayButton();
            currentAudioUrl = audioUrl;
            renderPlaylist();
            showToast(`▶️ ${video.title || video.id}`, 1500);
            if (isBackgroundMode) {
                document.getElementById('chrome-bg-notice').classList.add('show');
            }
        } catch (e) {
            console.error('Play error:', e);
            showToast('❌ Lỗi phát audio: ' + e.message, 3000);
            isPlaying = false;
            updatePlayButton();
        }
    }

    // ============================================================
    // CONTROLS
    // ============================================================
    function togglePlay() {
        if (!audioElement) {
            if (playlist.length > 0) {
                if (currentIndex === -1) currentIndex = 0;
                loadVideo(currentIndex);
            } else {
                showToast('⚠️ Chưa có video trong danh sách', 2000);
            }
            return;
        }

        if (isPlaying) {
            audioElement.pause();
            isPlaying = false;
        } else {
            audioElement.play();
            isPlaying = true;
        }
        updatePlayButton();
    }

    function updatePlayButton() {
        const btn = document.getElementById('btn-play');
        if (isPlaying) {
            btn.innerHTML = '⏸';
            btn.className = 'btn-play';
        } else {
            btn.innerHTML = '▶';
            btn.className = 'btn-play paused';
        }
    }

    function nextVideo() {
        if (playlist.length === 0) return;

        if (isLoop && audioElement) {
            audioElement.currentTime = 0;
            audioElement.play();
            isPlaying = true;
            updatePlayButton();
            return;
        }

        let nextIndex;
        if (isShuffle) {
            do {
                nextIndex = Math.floor(Math.random() * playlist.length);
            } while (nextIndex === currentIndex && playlist.length > 1);
        } else {
            nextIndex = (currentIndex + 1) % playlist.length;
        }

        currentIndex = nextIndex;
        loadVideo(currentIndex);
    }

    function toggleLoop() {
        isLoop = !isLoop;
        document.getElementById('btn-loop').classList.toggle('active', isLoop);
        showToast(isLoop ? '🔁 Lặp: BẬT' : '🔁 Lặp: TẮT', 1000);
        localStorage.setItem('chrome_player_loop', isLoop);
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        document.getElementById('btn-shuffle').classList.toggle('active', isShuffle);
        showToast(isShuffle ? '🔀 Ngẫu nhiên: BẬT' : '🔀 Ngẫu nhiên: TẮT', 1000);
        localStorage.setItem('chrome_player_shuffle', isShuffle);
    }

    function toggleBackgroundMode() {
        isBackgroundMode = !isBackgroundMode;
        const btn = document.getElementById('btn-bg');
        const notice = document.getElementById('chrome-bg-notice');

        if (isBackgroundMode) {
            btn.classList.add('active');
            if (isPlaying) {
                notice.classList.add('show');
            }
            showToast('🎧 Chế độ nền: BẬT', 1500);
            // Nếu đang phát, tiếp tục phát
            if (audioElement && isPlaying) {
                audioElement.play();
            }
        } else {
            btn.classList.remove('active');
            notice.classList.remove('show');
            showToast('🎧 Chế độ nền: TẮT', 1500);
        }
        localStorage.setItem('chrome_player_background', isBackgroundMode);
    }

    function removeVideo(index) {
        if (playlist.length === 0) return;

        const removed = playlist[index];
        playlist.splice(index, 1);

        if (currentIndex === index) {
            if (audioElement) {
                audioElement.pause();
                audioElement.src = '';
                isPlaying = false;
                updatePlayButton();
                document.getElementById('chrome-bg-notice').classList.remove('show');
            }
            if (playlist.length > 0) {
                currentIndex = Math.min(index, playlist.length - 1);
                loadVideo(currentIndex);
            } else {
                currentIndex = -1;
                document.getElementById('current-title').textContent = 'Chưa có video';
                document.getElementById('current-sub').textContent = 'Thêm video để phát';
                document.getElementById('current-time').textContent = '00:00';
                document.getElementById('total-time').textContent = '00:00';
                document.getElementById('progress-slider').value = 0;
            }
        } else if (currentIndex > index) {
            currentIndex--;
        }

        renderPlaylist();
        savePlaylist();
        showToast(`🗑️ Đã xóa: ${removed.title || removed.id}`, 1500);
    }

    // ============================================================
    // PROGRESS
    // ============================================================
    function startSync() {
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(updateProgress, 200);
    }

    function updateProgress() {
        if (!audioElement || isSeeking) return;

        try {
            const current = audioElement.currentTime;
            const total = audioElement.duration;

            if (total > 0 && current >= 0) {
                document.getElementById('current-time').textContent = formatTime(current);
                document.getElementById('total-time').textContent = formatTime(total);
                document.getElementById('progress-slider').value = (current / total) * 100;
            }
        } catch (e) {}
    }

    function onSeek(value) {
        isSeeking = true;
        if (audioElement) {
            const total = audioElement.duration;
            if (total > 0) {
                const time = (value / 100) * total;
                document.getElementById('current-time').textContent = formatTime(time);
            }
        }
    }

    function onSeekEnd(value) {
        if (audioElement) {
            const total = audioElement.duration;
            if (total > 0) {
                const time = (value / 100) * total;
                audioElement.currentTime = time;
            }
        }
        setTimeout(() => { isSeeking = false; }, 300);
    }

    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return '00:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
        }
        if (e.key === 'n' || e.key === 'N') {
            nextVideo();
        }
        if (e.key === 'l' || e.key === 'L') {
            toggleLoop();
        }
        if (e.key === 's' || e.key === 'S') {
            toggleShuffle();
        }
    });

    // ============================================================
    // ENTER KEY
    // ============================================================
    document.getElementById('url-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addVideo();
        }
    });

    // ============================================================
    // CHROME BACKGROUND - KEEP ALIVE
    // ============================================================
    // Khi chuyển tab, Chrome vẫn giữ audio element chạy
    // Không cần làm gì thêm, audio element tự động phát nền

    // ============================================================
    // INIT
    // ============================================================
    function init() {
        if (loadPlaylist()) {
            renderPlaylist();
            if (playlist.length > 0) {
                currentIndex = 0;
                setTimeout(() => {
                    loadVideo(0);
                }, 500);
            }
        }

        const savedLoop = localStorage.getItem('chrome_player_loop');
        if (savedLoop === 'true') {
            isLoop = true;
            document.getElementById('btn-loop').classList.add('active');
        }

        const savedShuffle = localStorage.getItem('chrome_player_shuffle');
        if (savedShuffle === 'true') {
            isShuffle = true;
            document.getElementById('btn-shuffle').classList.add('active');
        }

        const savedBg = localStorage.getItem('chrome_player_background');
        if (savedBg === 'false') {
            isBackgroundMode = false;
            document.getElementById('btn-bg').classList.remove('active');
            document.getElementById('chrome-bg-notice').classList.remove('show');
        } else {
            isBackgroundMode = true;
            document.getElementById('btn-bg').classList.add('active');
        }

        // Tạo audio element
        if (!audioElement) {
            audioElement = document.getElementById('bg-audio');
            if (!audioElement) {
                audioElement = document.createElement('audio');
                audioElement.id = 'bg-audio';
                audioElement.style.display = 'none';
                document.body.appendChild(audioElement);
            }
        }
    }

    // Khởi tạo khi trang load
    document.addEventListener('DOMContentLoaded', init);

    // ============================================================
    // XỬ LÝ CHROME BACKGROUND
    // ============================================================
    // Chrome trên mobile: audio element vẫn phát khi chuyển tab
    // Chỉ cần đảm bảo audio element tồn tại và đang phát

    // Nếu bị tạm dừng, tự động phát lại
    document.addEventListener('visibilitychange', function() {
        if (document.hidden && isBackgroundMode && isPlaying && audioElement) {
            // Chrome sẽ tiếp tục phát, không cần làm gì
            // Nếu bị tạm dừng, phát lại
            setTimeout(() => {
                if (audioElement && audioElement.paused && isPlaying && isBackgroundMode) {
                    audioElement.play().catch(() => {});
                }
            }, 500);
        }
    });
</script>
