<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo GitHub Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 1s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        
        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .status p {
            color: #555;
            font-size: 1.1rem;
        }
        
        .status .highlight {
            color: #764ba2;
            font-weight: bold;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        
        .feature-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        
        .feature-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        
        .feature-item .icon {
            font-size: 30px;
            display: block;
            margin-bottom: 10px;
        }
        
        .feature-item .label {
            color: #333;
            font-weight: 600;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.4);
        }
        
        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.9rem;
        }
        
        .footer a {
            color: #764ba2;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        #clickCount {
            font-weight: bold;
            color: #764ba2;
            font-size: 1.2rem;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>GitHub Pages Demo</h1>
        <p class="subtitle">Trang web chạy thành công!</p>
        
        <div class="status">
            <p>✅ <span class="highlight">Đã triển khai</span> thành công trên GitHub Pages</p>
            <p style="margin-top: 10px; font-size: 0.95rem;">
                📅 Ngày: <span id="currentDate"></span>
            </p>
        </div>
        
        <div class="features">
            <div class="feature-item">
                <span class="icon">📱</span>
                <span class="label">Responsive</span>
            </div>
            <div class="feature-item">
                <span class="icon">⚡</span>
                <span class="label">Nhanh & Nhẹ</span>
            </div>
            <div class="feature-item">
                <span class="icon">🎨</span>
                <span class="label">Đẹp & Hiện đại</span>
            </div>
        </div>
        
        <button class="btn" onclick="handleClick()">👆 Nhấn vào đây</button>
        <p style="margin-top: 15px; color: #666;">
            Số lần nhấn: <span id="clickCount">0</span>
        </p>
        
        <div class="footer">
            <p>
                <a href="#" onclick="resetCounter(); return false;">Đặt lại</a> · 
                Xây dựng với ❤️ bằng HTML, CSS & JavaScript
            </p>
            <p style="margin-top: 5px;">
                <span id="year"></span> · Demo cho GitHub Pages
            </p>
        </div>
    </div>
    
    <script>
        // Hiển thị ngày hiện tại
        const date = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').textContent = date.toLocaleDateString('vi-VN', options);
        document.getElementById('year').textContent = date.getFullYear();
        
        // Counter với localStorage
        let count = localStorage.getItem('clickCount') ? parseInt(localStorage.getItem('clickCount')) : 0;
        document.getElementById('clickCount').textContent = count;
        
        function handleClick() {
            count++;
            document.getElementById('clickCount').textContent = count;
            localStorage.setItem('clickCount', count);
            
            // Hiệu ứng phản hồi
            const btn = document.querySelector('.btn');
            btn.textContent = '✅ Đã nhấn!';
            btn.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                btn.textContent = '👆 Nhấn vào đây';
                btn.style.transform = 'scale(1)';
            }, 500);
        }
        
        function resetCounter() {
            if (confirm('Bạn có muốn đặt lại số lần nhấn?')) {
                count = 0;
                document.getElementById('clickCount').textContent = count;
                localStorage.setItem('clickCount', count);
            }
        }
        
        // Console message
        console.log('🚀 GitHub Pages Demo đã chạy thành công!');
        console.log('📝 Số lần nhấn hiện tại:', count);
    </script>
</body>
</html>
